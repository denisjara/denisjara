<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrataciones Públicas Perú</title>
<meta name="description" content="Dashboard de estudio de la Ley N.° 32069, Ley General de Contrataciones Públicas, y su Reglamento (D.S. 009-2025-EF), con explicaciones, ejemplos, casos prácticos, preguntas, reforzamiento, calculadoras y recursos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef2f9; --border:#dde3ee;
  --text:#1b2333; --muted:#5d6880; --primary:#c8102e; --primary-soft:#fde8eb;
  --accent:#1f5fbf; --accent-soft:#e5eefc; --ok:#1e8e5a; --ok-soft:#e3f5ec;
  --warn:#b7791f; --warn-soft:#fff4dd; --bad:#c53030; --bad-soft:#fde7e7;
  --shadow:0 2px 10px rgba(20,30,60,.07); --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --surface:#171e2d; --surface-2:#1f2839; --border:#2c374c;
    --text:#e6ebf5; --muted:#9aa6bd; --primary:#ff5a6e; --primary-soft:#3a1d25;
    --accent:#6ea8ff; --accent-soft:#1c2b47; --ok:#4cc38a; --ok-soft:#173326;
    --warn:#f0b54a; --warn-soft:#3a2e14; --bad:#ff6b6b; --bad-soft:#3a1c1c;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#171e2d; --surface-2:#1f2839; --border:#2c374c;
  --text:#e6ebf5; --muted:#9aa6bd; --primary:#ff5a6e; --primary-soft:#3a1d25;
  --accent:#6ea8ff; --accent-soft:#1c2b47; --ok:#4cc38a; --ok-soft:#173326;
  --warn:#f0b54a; --warn-soft:#3a2e14; --bad:#ff6b6b; --bad-soft:#3a1c1c;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15.5px}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:290px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px;transition:transform .25s}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.brand .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#8a0b20);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.brand h1{font-size:15px;margin:0;line-height:1.25}
.brand small{color:var(--muted);font-size:12px}
.search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:14px;margin-bottom:10px}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 6px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--text);font-size:14px;margin-bottom:2px}
.nav a:hover{background:var(--surface-2)}
.nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav a .num{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.nav a.active .num{background:var(--primary);color:#fff}
.nav a .done{margin-left:auto;color:var(--ok);font-size:13px}
/* Main */
.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:14px}
.menu-btn{display:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:6px 10px;font-size:18px;cursor:pointer}
.progress-wrap{flex:1;max-width:420px}
.progress-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:3px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));width:0;transition:width .5s}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 11px;cursor:pointer;font:inherit;font-size:13px}
.content{max-width:1080px;margin:0 auto;padding:26px 24px 80px}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#7d0a1d 60%,#3d0710 100%);color:#fff;border-radius:20px;padding:28px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h2{margin:0 0 6px;font-size:26px;line-height:1.2}
.hero p{margin:0;opacity:.92;max-width:720px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:4px 11px;border-radius:99px;font-size:12.5px}
.module-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.module-head .badge{background:var(--primary);color:#fff;border-radius:12px;min-width:48px;height:48px;display:grid;place-items:center;font-weight:800;font-size:18px}
.module-head h2{margin:0;font-size:24px;line-height:1.25}
.module-head .ref{color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px;border-bottom:1px solid var(--border);padding-bottom:8px}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 13px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;font-weight:500}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px}
.card h4{margin:12px 0 6px;font-size:15px}
.card p{margin:6px 0}
.card ul,.card ol{margin:6px 0;padding-left:20px}
.card li{margin:3px 0}
.kpi{text-align:left}
.kpi .v{font-size:24px;font-weight:800;color:var(--primary);line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.box{border-radius:12px;padding:14px 16px;margin:12px 0;border-left:5px solid}
.box.ej{background:var(--accent-soft);border-color:var(--accent)}
.box.caso{background:var(--warn-soft);border-color:var(--warn)}
.box.ok{background:var(--ok-soft);border-color:var(--ok)}
.box.alerta{background:var(--bad-soft);border-color:var(--bad)}
.box .t{font-weight:700;margin-bottom:4px;display:block}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--border);padding:9px 8px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:700}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
details{border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--surface)}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:6px}
/* Quiz */
.q{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:10px 12px;border-radius:10px;margin:6px 0;cursor:pointer;font:inherit;font-size:14.5px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{display:none;margin-top:8px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.fb.show{display:block}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
.btn{border:none;background:var(--primary);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;font-size:14px}
.btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
/* Flashcards */
.flash{perspective:900px;height:180px;cursor:pointer}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--border);font-size:14.5px;overflow:auto}
.flash .front{background:var(--surface);font-weight:600}
.flash .back{background:var(--accent-soft);transform:rotateY(180deg)}
.flash .front::after{content:"toca para voltear ↻";position:absolute;bottom:8px;font-size:11px;color:var(--muted);font-weight:400}
/* Links */
.res{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;transition:transform .15s,border-color .15s}
.res:hover{transform:translateY(-2px);border-color:var(--accent)}
.res .ic{font-size:22px;line-height:1}
.res b{display:block;font-size:14.5px}
.res span{font-size:12.5px;color:var(--muted)}
/* Animations */
.flow{display:flex;align-items:stretch;gap:0;position:relative;margin:10px 0}
.flow .ph{flex:1;background:var(--surface-2);border:1px solid var(--border);padding:14px;border-radius:12px;text-align:center;position:relative;z-index:1;transition:all .4s}
.flow .ph.on{background:var(--primary);color:#fff;transform:translateY(-4px);box-shadow:0 8px 20px rgba(200,16,46,.3)}
.flow .arrow{width:34px;display:grid;place-items:center;color:var(--muted);font-size:20px}
.flow .ph b{display:block;font-size:15px}
.flow .ph small{font-size:12px;opacity:.85}
.steps{position:relative;padding-left:26px;margin:8px 0}
.steps::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:3px;background:var(--border);border-radius:3px}
.step{position:relative;margin:10px 0;padding:10px 14px;background:var(--surface-2);border-radius:10px;border:1px solid var(--border);opacity:.45;transition:all .35s}
.step::before{content:"";position:absolute;left:-23px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--border);border:3px solid var(--surface)}
.step.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.step.on::before{background:var(--accent)}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,95,191,.35)}50%{box-shadow:0 0 0 8px rgba(31,95,191,0)}}
.meter{height:22px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative;border:1px solid var(--border)}
.meter>div{height:100%;transition:width .5s,background .5s}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--muted)}
input.in,select.in{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:14.5px}
.result{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--border);font-size:14.5px}
.result .big{font-size:22px;font-weight:800;color:var(--primary)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px}
.overlay{display:none}
@media (max-width:900px){
  .sidebar{position:fixed;z-index:50;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .menu-btn{display:block}
  .content{padding:18px 16px 70px}
  .topbar{padding:10px 16px}
  .flow{flex-direction:column}
  .flow .arrow{width:auto;height:26px;transform:rotate(90deg)}
  .hero{padding:20px}
  .hero h2{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">LCP</div>
      <div><h1>Ley General de Contrataciones Públicas</h1><small>Ley N.° 32069 · D.S. 009-2025-EF</small></div>
    </div>
    <input class="search" id="search" placeholder="🔎 Buscar tema (ej. penalidad, JPRD)…">
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
      <div class="progress-wrap">
        <div class="progress-label"><span>Tu avance</span><span id="progTxt">0%</span></div>
        <div class="progress"><div id="progBar"></div></div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Cambiar tema">🌓 Tema</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* =========================================================
   DATOS CLAVE 2026
   ========================================================= */
const UIT = 5500; // D.S. 301-2025-EF
const soles = n => "S/ " + Number(n).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);

const LINKS = {
  ley: "https://leyes.congreso.gob.pe/Documentos/2021_2026/ADLP/Texto_Consolidado/32069-TXM.pdf",
  oeceCol: "https://www.gob.pe/institucion/oece/colecciones/45029-ley-n-32069-ley-general-de-contrataciones-publicas-y-su-reglamento",
  oece: "https://www.gob.pe/oece",
  peruCompras: "https://www.gob.pe/perucompras",
  catalogos: "https://www.catalogos.perucompras.gob.pe/",
  seace: "https://prod2.seace.gob.pe/seacebus-uiwd-pub/buscadorPublico/buscadorPublico.xhtml",
  rnp: "https://www.rnp.gob.pe/",
  peruano: "https://diariooficial.elperuano.pe/",
  mef: "https://www.gob.pe/mef",
  cgr: "https://www.gob.pe/contraloria",
  minjus: "https://www.gob.pe/minjus"
};

/* =========================================================
   MÓDULOS
   ========================================================= */
const MODULES = [
/* ---------------------------------------------------- 1 */
{
 id:"m1", num:"1", group:"Título I", title:"Disposiciones generales: objeto, ámbito y principios",
 ref:"Arts. 1 al 8 de la Ley N.° 32069",
 explain:`
 <div class="grid g2">
  <div class="card"><h3>🎯 Objeto y finalidad</h3>
   <p>La Ley establece el marco para que el Estado <b>compre bienes, contrate servicios y ejecute obras</b> de forma <b>eficiente, oportuna y transparente</b>, maximizando el <b>valor por dinero</b> de los recursos públicos.</p>
   <p>En palabras simples: <i>que el Estado compre bien, rápido y sin corrupción, pensando en el ciudadano</i>.</p>
  </div>
  <div class="card"><h3>🗺️ Ámbito de aplicación (Art. 3)</h3>
   <p>Se aplica a toda contratación de bienes, servicios y obras <b>siempre que la entidad pague con fondos públicos</b>. Incluye ministerios, gobiernos regionales y locales, organismos públicos, universidades públicas, empresas del Estado, programas, proyectos, Fuerzas Armadas, PNP, etc.</p>
   <p><b>Los contratos menores (≤ 8 UIT) también se rigen por esta ley.</b></p>
  </div>
 </div>
 <div class="card" style="margin-top:14px"><h3>⚖️ Los 15 principios rectores (Art. 5)</h3>
  <p>Sirven para <b>interpretar</b> la ley, <b>llenar vacíos</b> y como <b>parámetro de actuación</b> de todos los actores.</p>
  <div class="table-wrap"><table>
   <tr><th>Principio</th><th>¿Qué significa en la práctica?</th></tr>
   <tr><td><b>a) Legalidad</b></td><td>Actuar según la Constitución, la Ley y dentro de las facultades atribuidas.</td></tr>
   <tr><td><b>b) Eficacia y eficiencia</b></td><td>Priorizar el fin público sobre formalidades no esenciales.</td></tr>
   <tr><td><b>c) Valor por dinero</b></td><td>No comprar solo lo más barato: considerar calidad, sostenibilidad, costos y plazos.</td></tr>
   <tr><td><b>d) Integridad</b></td><td>Honestidad, veracidad; evitar y denunciar prácticas corruptas.</td></tr>
   <tr><td><b>e) Presunción de veracidad</b></td><td>Se presume que los documentos presentados son verdaderos (admite prueba en contrario).</td></tr>
   <tr><td><b>f) Causalidad</b></td><td>Responde quien realiza la conducta; nadie es sancionado por hecho ajeno.</td></tr>
   <tr><td><b>g) Publicidad</b></td><td>Difundir los procesos para promover concurrencia y facilitar el control.</td></tr>
   <tr><td><b>h) Libertad de concurrencia</b></td><td>Libre acceso de proveedores; evitar exigencias innecesarias.</td></tr>
   <tr><td><b>i) Transparencia y facilidad de uso</b></td><td>Reglas claras; plataformas sencillas y accesibles.</td></tr>
   <tr><td><b>j) Competencia</b></td><td>Condiciones de competencia efectiva; prohibidas las prácticas restrictivas.</td></tr>
   <tr><td><b>k) Igualdad de trato</b></td><td>Mismas oportunidades; sin privilegios ni discriminación.</td></tr>
   <tr><td><b>l) Equidad y colaboración</b></td><td>Equilibrio entre derechos y obligaciones; colaborar para lograr la finalidad.</td></tr>
   <tr><td><b>m) Sostenibilidad</b></td><td>Considerar aspectos económicos, sociales y ambientales.</td></tr>
   <tr><td><b>n) Innovación</b></td><td>Promover soluciones nuevas o la mejora de las existentes.</td></tr>
   <tr><td><b>o) Vigencia tecnológica</b></td><td>Adquirir con calidad y modernidad; prever repotenciación.</td></tr>
  </table></div>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>🧭 Los 5 enfoques (Art. 6)</h3>
   <ol><li><b>Integridad</b> – pactos de integridad, gestión de conflictos de intereses.</li>
   <li><b>Gestión por resultados</b> – vincular el gasto con resultados medibles.</li>
   <li><b>Gestión de riesgos</b> – identificar, analizar y tratar riesgos en todas las fases.</li>
   <li><b>Gobernanza</b> – gestión ordenada, transparente y articulada.</li>
   <li><b>Profesionalización</b> – capacitación y certificación de compradores públicos (OECE + DGA).</li></ol>
  </div>
  <div class="card"><h3>🚫 Supuestos excluidos (Art. 7)</h3>
   <p>No se aplica la ley (pero <b>sí sus principios</b>) a, entre otros:</p>
   <ul><li>Servicios financieros/bancarios (salvo seguros y arrendamiento financiero).</li>
   <li>Servicio Exterior fuera del país; notarios bajo el monto del reglamento.</li>
   <li>Servicios de árbitros, conciliadores, peritos, adjudicadores (JPRD).</li>
   <li>Contrataciones con financiamiento de organismos internacionales con reglas propias.</li>
   <li>Convenios entre entidades sin fines de lucro (solo costos).</li>
   <li>Servicios públicos cuando hay un solo proveedor posible.</li>
   <li>Proveedores no domiciliados (supuestos tasados), Gobierno a Gobierno, regímenes especiales.</li></ul>
   <p>Aun excluidos, deben <b>publicar información en la Pladicop</b> (Art. 7.3).</p>
  </div>
 </div>`,
 examples:`
 <div class="box ej"><span class="t">📌 Ejemplo – Valor por dinero</span>
 Una municipalidad compra laptops. La oferta A cuesta S/ 2,500 c/u con 1 año de garantía; la B, S/ 2,800 con 3 años de garantía y menor consumo eléctrico. Aplicando <b>valor por dinero</b>, la entidad puede diseñar factores de evaluación que premien garantía y eficiencia: el menor precio <b>no es el único criterio</b>.</div>
 <div class="box ej"><span class="t">📌 Ejemplo – Libertad de concurrencia</span>
 Las bases exigen "experiencia mínima de 15 años y oficina en Miraflores" para un servicio de limpieza de S/ 120,000. Son exigencias <b>desproporcionadas</b> que restringen la participación: vulneran libertad de concurrencia y competencia.</div>
 <div class="box ej"><span class="t">📌 Ejemplo – Presunción de veracidad</span>
 El postor presenta una constancia de experiencia. La entidad la acepta como cierta, pero en la <b>verificación posterior</b> puede comprobar su autenticidad. Si es falsa → nulidad + denuncia ante el Tribunal.</div>
 <div class="box caso"><span class="t">🧩 Caso práctico</span>
 <p>El Gobierno Regional X firma un convenio con una universidad pública para que esta le elabore estudios cobrando únicamente los costos, sin utilidad, con informe técnico y legal previo.</p>

 ref:"Arts. 9 al 33",
 explain:`
 <div class="grid g3">
  <div class="card"><h3>🏦 DGA – MEF</h3><p><b>Ente rector</b> del Sistema Nacional de Abastecimiento; máxima autoridad técnico-normativa (D. Leg. 1439). Aprueba bases estándar, listados (p. ej. comparación de precios) y reconoce contratos estandarizados.</p></div>
  <div class="card"><h3>🛡️ OECE</h3><p><b>Organismo Especializado para las Contrataciones Públicas Eficientes</b> (sucesor del OSCE). Adscrito al MEF. Supervisa, brinda asistencia técnica, absuelve consultas, administra la <b>Pladicop</b> y el <b>RNP</b>, el registro de instituciones arbitrales y el banco de laudos.</p></div>
  <div class="card"><h3>⚖️ Tribunal de Contrataciones Públicas</h3><p>Órgano del OECE. Resuelve <b>apelaciones</b> (cuantía &gt; 50 UIT) y <b>sanciona</b> a proveedores (multa e inhabilitación).</p></div>
  <div class="card"><h3>🛒 Perú Compras</h3><p>Central de Compras Públicas: <b>acuerdos marco y catálogos electrónicos</b>, fichas técnicas (subasta inversa), compras corporativas obligatorias y centralizadas, incluso en emergencias.</p></div>
  <div class="card"><h3>🏢 Entidades contratantes</h3><p>Quienes compran. Internamente intervienen el titular, la autoridad de gestión administrativa, el área usuaria, el área técnica estratégica, la DEC y los compradores públicos.</p></div>
  <div class="card"><h3>👷 Proveedores</h3><p>Personas naturales, jurídicas, consorcios, nacionales o extranjeros. Deben tener <b>RNP vigente</b>, no estar impedidos y suscribir el <b>pacto de integridad</b>.</p></div>
 </div>
 <div class="card" style="margin-top:14px"><h3>👥 Roles dentro de la entidad (Art. 25)</h3>
  <div class="table-wrap"><table>
   <tr><th>Actor</th><th>Función principal</th><th>Ejemplo</th></tr>
   <tr><td><b>Titular de la entidad</b></td><td>Máxima autoridad ejecutiva; facultades reservadas (p. ej. adicionales de obra &gt;15%).</td><td>Ministro, Gobernador, Alcalde</td></tr>
   <tr><td><b>Autoridad de la gestión administrativa (AGA)</b></td><td>Aprueba, autoriza y supervisa los procesos; aprueba modificaciones, nulidades de oficio, contrataciones directas.</td><td>Secretaría General (ministerio), Gerencia Municipal, Gerencia General Regional</td></tr>
   <tr><td><b>Área usuaria</b></td><td>Formula el requerimiento, verifica el cumplimiento y da la <b>conformidad</b>.</td><td>Unidad de Logística pide útiles; Hospital pide insumos</td></tr>
   <tr><td><b>Área técnica estratégica</b></td><td>Formula requerimientos de otras áreas por su especialidad.</td><td>Oficina de TI formula todos los requerimientos de software</td></tr>
   <tr><td><b>Dependencia encargada de las contrataciones (DEC)</b></td><td>Prepara la estrategia, conduce el proceso desde el requerimiento hasta su culminación.</td><td>Oficina de Abastecimiento</td></tr>
   <tr><td><b>Compradores públicos</b></td><td>Servidores de la DEC (certificados por el OECE) que organizan, elaboran documentos, conducen el proceso y hacen seguimiento.</td><td>"Oficial de compra"</td></tr>
  </table></div>
  <p>El titular y la AGA pueden <b>delegar</b> facultades por resolución, salvo excepciones (Art. 25.2). Hay facultades <b>indelegables</b> (p. ej. autorizar suscribir pese a vicios, aprobar contratación directa por AGA).</p>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>📇 RNP y Ficha Única del Proveedor (FUP)</h3>
   <ul><li>Inscripción en el RNP con <b>vigencia indeterminada</b>, sujeta a actualización (si no actualiza → suspensión temporal).</li>
   <li>La <b>FUP</b> consolida información del proveedor: impedimentos, contratos, procedimientos, penalidades, sanciones.</li>
   <li>Las entidades <b>no pueden exigir</b> documentos que ya constan en la FUP.</li>
   <li>Herramientas de <b>medición de desempeño</b> e incentivos a proveedores mejor calificados (reputación).</li></ul>
  </div>
  <div class="card"><h3>⛔ Impedimentos (Arts. 30-33)</h3>
   <p>Se agrupan en 4 tipos:</p>
   <ol><li><b>Personales</b> (1.A–1.G): altos funcionarios, servidores con influencia en el proceso, etc.</li>
   <li><b>Por parentesco</b> (2.A–2.E): cónyuges, convivientes y parientes de los impedidos.</li>
   <li><b>Personas jurídicas / representación</b> (3.A–3.G): empresas donde participan impedidos.</li>
   <li><b>Por sanciones o registros</b> (4.A–4.E): inhabilitados, condenados, etc.</li></ol>
   <p>Unos se verifican en la <b>FUP</b>, otros los verifica la <b>DEC</b> antes de contratar y otros se acreditan con <b>declaración jurada</b>.</p>
  </div>
 </div>`,

 El área de Mantenimiento pidió el servicio de pintado del local. Terminado el servicio, <b>Mantenimiento (área usuaria)</b> verifica que se cumplió con los términos de referencia y emite la conformidad; recién entonces corre el plazo de pago.</div>

 Las bases piden "copia del RUC, ficha RNP y constancia de no estar inhabilitado". Si esa información está en la FUP, la entidad <b>no debe exigirla</b> (Art. 31.4).</div>
 <div class="box caso"><span class="t">🧩 Caso práctico – Impedimento por parentesco</span>

{
 id:"m3", num:"3", group:"Título III", title:"Modalidades y herramientas de contratación eficiente",
 ref:"Arts. 34 al 44",
 explain:`
 <div class="grid g3">
  <div class="card"><h3>🧾 Contratos menores (Art. 34)</h3><p>Montos <b>iguales o inferiores a 8 UIT</b> (2026: <b>${soles(8*UIT)}</b>). No requieren procedimiento de selección, pero se rigen por la ley, se publican en la Pladicop y los supervisa el OECE.</p></div>
  <div class="card"><h3>🤝 Compra por encargo (Art. 35)</h3><p>Una entidad encarga a otra entidad u <b>organismo internacional</b> (vía convenio) las fases de actuaciones preparatorias o selección.</p></div>
  <div class="card"><h3>🏬 Compra centralizada (Art. 36)</h3><p>Por importancia estratégica o complejidad, se encarga a <b>Perú Compras</b> u otra entidad <b>todas las fases</b>, hasta el pago, incluso la distribución.</p></div>
  <div class="card"><h3>👥 Compra corporativa (Art. 37)</h3><p>Dos o más entidades <b>consolidan</b> necesidades comunes para mejores condiciones. Puede ser facultativa u obligatoria (esta última a cargo de Perú Compras).</p></div>
  <div class="card"><h3>💡 Compra pública de innovación (Art. 38)</h3><p>Para soluciones que <b>no existen en el mercado</b> o requieren I+D. El requerimiento puede definirse solo por objetivos o funcionalidades.</p></div>
  <div class="card"><h3>📚 Acuerdos marco (Art. 39)</h3><p>Proceso en etapas: primero se seleccionan proveedores/condiciones; luego las entidades compran a través de <b>catálogos electrónicos</b>.</p></div>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>🚨 Contrataciones por emergencia (Art. 40)</h3>
   <p>Son situaciones de emergencia:</p>
   <ol type="a"><li>Emergencias o desastres del SINAGERD.</li><li>Emergencias sanitarias declaradas por el MINSA.</li><li>Emergencias fitosanitarias/zoosanitarias (SENASA).</li><li>Riesgo para la seguridad, defensa u orden público (físico o digital).</li><li>Riesgo estructural o de ruina de infraestructura pública.</li></ol>
   <p><b>Prevención:</b> procedimientos competitivos con estrategias para emergencias. <b>Ocurrencia o inminencia:</b> contratación directa (Art. 55.1.b) o con no domiciliados. <b>Rehabilitación:</b> no competitivo dentro de <b>1 año</b>; luego, competitivo.</p>
  </div>
  <div class="card"><h3>💻 Herramientas facilitadoras</h3>
   <ul><li><b>Pladicop</b> (Art. 41): Plataforma Digital para las Contrataciones Públicas; integra SEACE, RNP y demás. Registro <b>obligatorio</b> de todas las fases. Los actos se entienden <b>notificados el mismo día de su publicación</b>.</li>
   <li><b>Estandarización de requerimientos</b> (Art. 42): fichas técnicas y requerimientos estandarizados.</li>
   <li><b>Catálogos electrónicos de acuerdos marco</b> (Art. 43).</li>
   <li><b>Mecanismos diferenciados de adquisición – MDA</b> (Art. 44): tecnologías sanitarias para enfermedades raras, huérfanas, oncológicas y de alto costo.</li></ul>
  </div>
 </div>`,
 examples:`
 <div class="box ej"><span class="t">📌 Ejemplo – Contrato menor</span>
 Una UGEL necesita reparar 3 puertas por S/ 9,800. Como no supera 8 UIT (${soles(8*UIT)}), es un <b>contrato menor</b>: no hay procedimiento de selección, pero debe registrar la información en la Pladicop y el proveedor debe tener RNP.</div>
 <div class="box ej"><span class="t">📌 Ejemplo – Catálogo electrónico</span>
 Un hospital necesita papel bond y tóner. Están en los <b>catálogos electrónicos de Perú Compras</b>: genera la orden directamente en la plataforma, sin convocar un procedimiento. Comprar por catálogo <b>no es fraccionamiento</b> (Art. 50.2.b).</div>
 <div class="box ej"><span class="t">📌 Ejemplo – Compra corporativa</span>
 Cinco ministerios necesitan el servicio de seguros vehiculares. En lugar de cinco procesos, consolidan la demanda en una <b>compra corporativa</b> y obtienen menores primas por volumen.</div>
 <div class="box caso"><span class="t">🧩 Caso práctico – Emergencia</span>
 <p>Un huaico destruye un puente vehicular en la sierra. El Gobierno Regional necesita restablecer el tránsito.</p>
 <ol><li>Es una emergencia del SINAGERD (Art. 40.1.a).</li><li>Puede <b>contratar directamente</b> la instalación de un puente modular (Art. 55.1.b), regularizando luego la documentación según el reglamento.</li><li>La <b>rehabilitación</b> del puente puede ir por vía no competitiva solo <b>dentro del año</b> desde la emergencia.</li><li>La <b>reconstrucción definitiva</b> pasado ese plazo debe hacerse con procedimiento competitivo.</li></ol></div>`,

{
 id:"m4", num:"4", group:"Título IV · Cap. I", title:"Actuaciones preparatorias",
 ref:"Arts. 45 al 52",
 explain:`
 <div class="card"><h3>🔄 Las 3 fases del proceso de contratación (Art. 45)</h3>
  <div class="flow" id="flowAnim">
   <div class="ph"><b>1. Actuaciones preparatorias</b><small>Requerimiento · mercado · estrategia · expediente</small></div><div class="arrow">➜</div>
   <div class="ph"><b>2. Selección</b><small>Convocatoria → buena pro → contrato</small></div><div class="arrow">➜</div>
   <div class="ph"><b>3. Ejecución contractual</b><small>Prestación · conformidad · pago · liquidación</small></div>
  </div>
  <button class="btn sec" onclick="playFlow()">▶ Animar fases</button>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>📝 El requerimiento (Art. 46)</h3>
   <p>Da <b>inicio</b> al proceso, en el marco de la <b>PMBSO</b> (Programación Multianual de Bienes, Servicios y Obras). Lo formula el área usuaria con la DEC.</p>
   <ul><li><b>Bienes</b> → Especificaciones técnicas (EETT).</li>
   <li><b>Servicios</b> → Términos de referencia (TdR).</li>
   <li><b>Obras</b> → Expediente técnico u objetivos funcionales (según sistema de entrega).</li></ul>
   <p>Debe ser <b>claro, objetivo</b>, preferentemente por <b>desempeño y funcionalidad</b>, sin direccionar a un proveedor. En obras, uso de <b>BIM</b> (Plan BIM Perú).</p>
  </div>
  <div class="card"><h3>📊 Interacción con el mercado y cuantía (Arts. 47-48)</h3>
   <p>La entidad indaga el mercado para: verificar <b>oferta y competencia</b>, perfeccionar el requerimiento, <b>estimar el presupuesto</b> y elegir el procedimiento idóneo (incluye reuniones y talleres con proveedores).</p>
   <p>La <b>cuantía</b> se determina conforme a la PMBSO y sirve para asignar recursos y definir el procedimiento.</p>
  </div>
  <div class="card"><h3>♟️ Estrategia de contratación (Art. 49)</h3>
   <p>Análisis integral elaborado por la DEC. Contiene: tipo de procedimiento, modalidad de pago, verificación de estandarización, <b>perfil y asignación de riesgos</b>.</p>
   <p>En obras complejas: análisis del <b>sistema de entrega</b>, uso de contratos estandarizados internacionales (NEC, FIDIC), BIM e incentivos.</p>
  </div>
  <div class="card"><h3>✂️ Prohibición de fraccionamiento (Art. 50)</h3>
   <p>Prohibido dividir la contratación (en varios procedimientos o contratos menores) para:</p>
   <ul><li>Evitar el procedimiento que corresponde a la <b>necesidad anual</b>.</li><li>Evadir la ley o los acuerdos comerciales.</li></ul>
   <p><b>No es fraccionamiento:</b> falta de recursos o necesidad imprevisible adicional; compras por catálogo; otros justificados en el reglamento.</p>
  </div>
  <div class="card"><h3>📁 Expediente de contratación (Art. 51)</h3><p>Contiene todo lo actuado <b>desde el requerimiento hasta el cumplimiento total</b> del contrato, incluidas apelaciones y controversias.</p></div>
  <div class="card"><h3>🧑‍⚖️ Evaluadores (Art. 52)</h3><p>Conducen los procedimientos competitivos: <b>oficial de compra</b> (comprador público de la DEC), <b>comité</b> o <b>jurado</b>. Comités y jurados incluyen <b>expertos</b> en el objeto. No pueden alterar el expediente, salvo factores de evaluación y excepciones.</p></div>
 </div>`,
 examples:`
 <div class="box ej"><span class="t">📌 Ejemplo – Requerimiento por desempeño</span>

 <div class="box alerta"><span class="t">⚠️ Ejemplo – Fraccionamiento</span>
 Una entidad necesita en el año uniformes por S/ 300,000. Para evitar la licitación, emite 7 órdenes de S/ 42,800 (contratos menores) a lo largo del año. Es <b>fraccionamiento prohibido</b>: debió convocar el procedimiento que correspondía a la necesidad anual. Genera responsabilidad funcional.</div>

{
 id:"m5", num:"5", group:"Título IV · Cap. II", title:"Selección: procedimientos competitivos y no competitivos",
 ref:"Arts. 53 al 57 · Reglamento (arts. 60-102)",
 explain:`
 <div class="card"><h3>🏁 Procedimientos competitivos (Art. 54)</h3>
  <ul><li><b>Licitación pública</b> → bienes y obras.</li><li><b>Concurso público</b> → servicios (incluye consultorías).</li></ul>
  <p>El reglamento regula sus <b>modalidades abreviadas</b> (licitación pública abreviada, concurso público abreviado) y <b>diferenciadas</b>: <b>subasta inversa electrónica</b>, <b>comparación de precios</b>, compra pública de innovación, selección de evaluadores expertos, gerentes de proyectos, proyectos arquitectónicos, etc.</p>
 </div>
 <div class="card" style="margin-top:14px"><h3>💰 Topes 2026 (Ley de Presupuesto 2026 · UIT = ${soles(UIT)})</h3>
  <div class="table-wrap"><table>
   <tr><th>Objeto</th><th>Procedimiento</th><th>Cuantía</th></tr>
   <tr><td rowspan="4"><b>Bienes</b></td><td>Licitación pública</td><td>≥ S/ 485,000</td></tr>
   <tr><td>Licitación pública abreviada</td><td>&gt; S/ 44,000 y &lt; S/ 485,000</td></tr>
   <tr><td>Subasta inversa electrónica (bien común con ficha técnica)</td><td>&gt; S/ 44,000</td></tr>
   <tr><td>Comparación de precios</td><td>&gt; S/ 44,000 y ≤ S/ 100,000</td></tr>
   <tr><td rowspan="4"><b>Servicios</b></td><td>Concurso público (servicios y consultoría)</td><td>≥ S/ 485,000</td></tr>
   <tr><td>Concurso público abreviado</td><td>&gt; S/ 44,000 y &lt; S/ 485,000</td></tr>
   <tr><td>Subasta inversa electrónica (servicio común)</td><td>&gt; S/ 44,000</td></tr>
   <tr><td>Comparación de precios</td><td>&gt; S/ 44,000 y ≤ S/ 100,000</td></tr>
   <tr><td rowspan="2"><b>Obras</b></td><td>Licitación pública</td><td>≥ S/ 5'000,000 (desde S/ 79'000,000 aplican reglas para obras de mayor envergadura)</td></tr>
   <tr><td>Licitación pública abreviada</td><td>&gt; S/ 44,000 y &lt; S/ 5'000,000</td></tr>
   <tr><td><b>Todos</b></td><td>Contrato menor</td><td>≤ 8 UIT = ${soles(8*UIT)}</td></tr>
  </table></div>
  <p style="font-size:13px;color:var(--muted)">Montos referenciales difundidos para 2026 según la Ley de Presupuesto del Sector Público 2026; verifica siempre la norma presupuestal vigente al convocar.</p>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>🪜 Etapas típicas de una licitación / concurso</h3>
   <div class="steps" id="stepsAnim">
    <div class="step"><b>1. Convocatoria</b> en la Pladicop (bases estándar).</div>
    <div class="step"><b>2. Registro de participantes</b>: lista abierta, abierta con invitación o cerrada.</div>
    <div class="step"><b>3. Consultas y observaciones</b>: plazo ≥ 7 días hábiles (abreviadas ≥ 3). Posible <b>elevación del pliego al OECE</b>.</div>
    <div class="step"><b>4. Integración de bases</b> (reglas definitivas).</div>
    <div class="step"><b>5. Precalificación</b> (solo en algunos procedimientos, p. ej. bienes especializados u obras complejas).</div>
    <div class="step"><b>6. Presentación y evaluación de ofertas</b> técnicas y económicas.</div>
    <div class="step"><b>7. Otorgamiento de la buena pro</b> (publicado en la Pladicop).</div>
    <div class="step"><b>8. Consentimiento</b>: al día siguiente de vencido el plazo de apelación (con una sola oferta: el mismo día).</div>
    <div class="step"><b>9. Verificación posterior</b> (10 días hábiles) y <b>perfeccionamiento del contrato</b>.</div>
   </div>
   <button class="btn sec" onclick="playSteps()">▶ Ver paso a paso</button>
  </div>
  <div class="card"><h3>⚡ Subasta inversa y comparación de precios</h3>
   <h4>Subasta inversa electrónica</h4>
   <ul><li>Bienes y servicios <b>comunes con ficha técnica</b> (Perú Compras).</li><li>No hay evaluación técnica; <b>lances en línea</b>; gana el <b>menor precio</b>.</li><li>Calificación posterior hasta tener al menos 3 postores válidos; si solo participa 1 postor → <b>desierto</b>.</li></ul>
   <h4>Comparación de precios</h4>
   <ul><li>Bienes/servicios de entrega inmediata (≤ 5 días hábiles) o del listado de la DGA, hasta S/ 100,000.</li><li>Se invita a <b>mínimo 3 proveedores</b>; se necesitan al menos <b>2 ofertas</b> válidas; gana el menor monto (empate → sorteo).</li></ul>
  </div>
 </div>
 <div class="card" style="margin-top:14px"><h3>🎯 Contratación directa – procedimiento no competitivo (Art. 55)</h3>
  <div class="grid g2">
   <ol type="a">
    <li>Con <b>otra entidad</b> (más eficiente; no empresa del Estado habitual).</li>
    <li><b>Emergencia</b> (ocurrencia o inminencia).</li>
    <li><b>Desabastecimiento</b> que afecte el funcionamiento.</li>
    <li><b>Proveedor único</b> o con derechos exclusivos.</li>
    <li>Servicios <b>personalísimos</b> de personas naturales.</li>
    <li><b>Publicidad estatal</b> en medios de comunicación.</li>
    <li>Bienes y servicios para <b>I+D+i</b> (entidades del Sinacti certificadas).</li>
   </ol>
   <ol type="a" start="8">
    <li>Adquisición o <b>arrendamiento de inmuebles</b> privados.</li>
    <li><b>Defensa legal</b> de funcionarios y exfuncionarios.</li>
    <li>Asesoría para la <b>defensa de la entidad</b> en arbitrajes o procesos judiciales.</li>
    <li><b>Saldo de contrato</b> resuelto o nulo (por impedimento o documentación falsa) derivado de procedimiento competitivo.</li>
    <li><b>Capacitación</b> con instituciones especializadas (bajo umbrales de acuerdos comerciales).</li>
    <li>Contrataciones <b>secretas</b> de FF.AA., PNP y SINA (decreto supremo + opinión previa de la Contraloría).</li>
   </ol>
  </div>
  <p>Las aprueba la <b>AGA</b> (indelegable) o el <b>titular</b>, según el reglamento. <b>No son impugnables</b> mediante apelación (Art. 72.3).</p>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>🕳️ Desierto (Art. 56)</h3><p>Cuando <b>no se valida ninguna oferta</b>. El reglamento define el procedimiento a usar luego (p. ej. una subasta inversa desierta se reconvoca igual, o como licitación/concurso abreviado si hay riesgo de nuevo desierto).</p></div>
  <div class="card"><h3>❌ Cancelación (Art. 57)</h3><p>En cualquier momento <b>antes de la buena pro</b> por: fuerza mayor o caso fortuito, desaparición de la necesidad, o reasignación del presupuesto a emergencias declaradas. Se notifica por resolución en la Pladicop. La entidad no incurre en responsabilidad frente a los postores.</p></div>
 </div>`,
 examples:`

{
 id:"m6", num:"6", group:"Título IV · Cap. III", title:"Ejecución contractual: contrato, garantías, adicionales, pagos y penalidades",
 ref:"Arts. 58 al 69 · Reglamento (arts. 103-122)",
 explain:`
 <div class="grid g2">
  <div class="card"><h3>📜 El contrato (Arts. 58-60)</h3>
   <p>Acuerdo entre entidad y proveedor con obligaciones recíprocas. En obras se usan <b>sistemas de entrega</b> (p. ej. solo construcción; diseño y construcción), que pueden permitir construir en paralelo al diseño.</p>
   <p>Si el proveedor tiene <b>multas impagas</b>, se incorpora cláusula de compromiso de pago vía retención. En obras: <b>liquidaciones parciales</b>.</p>
   <p><b>Contratos estandarizados internacionales</b> (NEC, FIDIC, etc.) reconocidos por la DGA, con control simultáneo y posterior de la Contraloría.</p>
   <h4>Cláusulas obligatorias (Art. 60)</h4>
   <ol><li>Garantías</li><li>Anticorrupción y antisoborno</li><li>Solución de controversias</li><li>Resolución por incumplimiento</li><li>Gestión de riesgos</li></ol>
  </div>
  <div class="card"><h3>🔐 Garantías (Art. 61 · Regl. art. 113-118)</h3>
   <ul><li><b>Fiel cumplimiento:</b> <b>10%</b> del monto del contrato original, vigente hasta la conformidad (bienes/servicios) o el consentimiento de la liquidación (obras).</li>
   <li><b>Prestaciones accesorias:</b> 10% del monto de esas prestaciones.</li>
   <li><b>Adelantos:</b> por el monto del adelanto.</li></ul>
   <h4>Mecanismos</h4>
   <ul><li><b>Fideicomiso</b> (adelanto y fiel cumplimiento).</li><li><b>Carta fianza financiera</b>.</li><li><b>Contrato de seguro</b> (póliza de caución).</li><li><b>Retención de pago</b> (fiel cumplimiento): contratos ≤ S/ 480,000 en bienes y servicios y ≤ S/ 5'000,000 en obras; las <b>MYPE</b> pueden usarla siempre.</li></ul>
   <p>Deben ser <b>incondicionales, solidarias, irrevocables y de realización automática</b>; el emisor honra en máximo <b>3 días hábiles</b>.</p>
  </div>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>➕ Modificaciones y adicionales (Arts. 63-64)</h3>
   <p>Supuestos: adicionales, reducciones, ampliaciones de plazo, hecho sobreviniente no imputable, otros del reglamento. No deben romper el <b>equilibrio económico-financiero</b>.</p>
   <div class="table-wrap"><table>
    <tr><th>Tipo</th><th>Límite</th><th>Quién aprueba</th></tr>
    <tr><td>Bienes, servicios y consultorías de obra</td><td>Hasta <b>25%</b> (adicional o reducción)</td><td>AGA</td></tr>
    <tr><td>Obras (solo construcción)</td><td>Hasta <b>15%</b> (neto de deductivos)</td><td>AGA</td></tr>
    <tr><td>Obras</td><td>&gt; 15% hasta <b>30%</b></td><td>Titular (con recursos)</td></tr>
    <tr><td>Obras</td><td>&gt; 30% hasta <b>50%</b></td><td>Titular, <b>previa autorización de la Contraloría</b> (15 días hábiles; apelación 30)</td></tr>
    <tr><td>Contratos estandarizados internacionales</td><td>Máx. 50% del presupuesto de obra</td><td>Según el contrato</td></tr>
   </table></div>
   <p>Adicionales por deficiencias del expediente técnico → se informa al Tribunal y a la Contraloría.</p>
  </div>
  <div class="card"><h3>💵 Adelantos y pagos (Arts. 66-67)</h3>
   <ul><li>Adelantos: <b>directo</b>; para materiales, insumos, equipamiento y mobiliario; otros. Los directos no exceden en conjunto el <b>30%</b> del contrato original.</li>
   <li><b>Pago:</b> máximo <b>10 días hábiles</b> después de la conformidad, prorrogable <b>5 días hábiles</b> con justificación.</li>
   <li>Demora injustificada = <b>falta grave</b> de la AGA; la entidad paga <b>intereses legales</b>.</li>
   <li>Pago por consumo; pago al inicio si es condición de mercado; MYPE: <b>factura negociable</b> (hasta 180 días).</li>
   <li>El contratista puede <b>ceder su derecho de pago</b>; la cesión de posición contractual solo en casos del reglamento.</li></ul>
  </div>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>⏱️ Penalidades (Regl. arts. 119-120)</h3>
   <p><b>Penalidad por mora</b> (automática, por cada día de atraso):</p>
   <div class="box ok" style="font-size:17px;text-align:center"><b>Penalidad diaria = 0.10 × Monto ÷ (F × Plazo en días)</b></div>
   <ul><li>Bienes y servicios: <b>F = 0.40</b></li><li>Obras: ≤60 días F=0.40 · 61–120 días F=0.25 · &gt;120 días F=0.15</li><li>Consultorías de obra: ≤60 días F=0.40 · &gt;60 días F=0.25</li></ul>
   <p>También <b>otras penalidades</b> objetivas y razonables previstas en las bases. La suma de penalidades no puede exceder el <b>10% del monto vigente</b> del contrato o ítem; alcanzado el tope, la entidad puede <b>resolver el contrato</b>.</p>
  </div>
  <div class="card"><h3>🛑 Resolución del contrato (Art. 68)</h3>
   <p>Cualquiera de las partes puede resolver (total o parcialmente) por:</p>
   <ol type="a"><li>Caso fortuito o fuerza mayor.</li><li>Incumplimiento atribuible.</li><li>Hecho sobreviniente no imputable.</li><li>Incumplimiento de la cláusula anticorrupción.</li><li>Documentación falsa o inexacta en la ejecución.</li><li>Condición de terminación anticipada.</li></ol>
   <p>Si es imputable → indemnización de daños. En casos de corrupción de funcionarios no se paga resarcimiento al contratista.</p>
   <p><b>Procedimiento por incumplimiento (Regl. art. 122):</b> requerir por escrito el cumplimiento en un plazo de <b>10% a 15%</b> del plazo del contrato (3 días si el contrato dura menos de 30 días; 15 días en obras de más de 60 días), bajo apercibimiento de resolver. <b>No se requiere apercibimiento</b> si se llegó al tope de penalidad o el incumplimiento es irreversible.</p>
   <h4>Responsabilidad por vicios ocultos (Art. 69)</h4>
   <ul><li>Obras: <b>no menos de 7 años</b>.</li><li>Bienes y servicios: <b>no menos de 1 año</b>.</li><li>Expediente técnico: <b>no menos de 3 años</b> desde la conformidad de obra.</li><li>Supervisión: igual al plazo del contratista de obra.</li></ul>
  </div>
 </div>
 <div class="card" style="margin-top:14px"><h3>👁️ Supervisión (Art. 62)</h3><p>El contrato de supervisión debe durar al menos hasta la recepción de la obra o conclusión del servicio. Mientras se contrata, puede designarse un <b>inspector de obra</b>. Supervisor e inspector responden administrativa, civil y penalmente.</p></div>`,
 examples:`
 <div class="box ej"><span class="t">📌 Ejemplo – Penalidad por mora</span>
 Contrato de bienes por <b>S/ 120,000</b>, plazo <b>30 días</b>, el proveedor entrega con <b>5 días</b> de atraso.<br>
 Penalidad diaria = 0.10 × 120,000 ÷ (0.40 × 30) = 12,000 ÷ 12 = <b>S/ 1,000 por día</b>.<br>
 Total: 5 × 1,000 = <b>S/ 5,000</b> (tope 10% = S/ 12,000, no superado).</div>
 <div class="box ej"><span class="t">📌 Ejemplo – Garantía de fiel cumplimiento</span>

 <div class="box ej"><span class="t">📌 Ejemplo – Adicional de obra</span>

 <li>Si el proveedor no somete la resolución a controversia dentro del plazo de caducidad, esta queda <b>consentida</b>.</li></ol></div>`,

 id:"m7", num:"7", group:"Título IV · Subcap. II", title:"Nulidad del procedimiento y del contrato",
 ref:"Arts. 70 y 71",
 explain:`
 <div class="grid g2">
  <div class="card"><h3>📛 Nulidad de actos del procedimiento (Art. 70)</h3>
   <p><b>Causales:</b></p>
   <ol type="a"><li>Dictados por órgano incompetente.</li><li>Contravienen normas legales.</li><li>Contienen un imposible jurídico.</li><li>Prescinden de normas esenciales del procedimiento.</li><li>Prescinden de la forma prescrita (solo si es insubsanable).</li></ol>
   <p><b>¿Quién la declara?</b></p>
   <ul><li><b>Tribunal</b>: solo al resolver apelaciones; indica a qué etapa se retrotrae.</li>
   <li><b>AGA de oficio</b>: hasta la buena pro. <b>Después</b> de la buena pro, solo por (1) <b>vicio trascendente</b> que afecte la finalidad o (2) <b>adjudicatario impedido</b>.</li>
   <li><b>Jefe de Perú Compras</b>: en procedimientos de catálogos electrónicos.</li></ul>
   <p>Ante otros vicios, la AGA puede autorizar suscribir el contrato con informes técnico-legales y <b>análisis costo-beneficio</b> (indelegable).</p>
  </div>
  <div class="card"><h3>📕 Nulidad del contrato (Art. 71)</h3>
   <p>Después de perfeccionado, la AGA puede declararla cuando:</p>
   <ol type="a"><li>Se suscribió con proveedor <b>impedido</b>.</li><li>Hubo <b>documentación falsa, adulterada o inexacta</b> que sustentó la buena pro (previo descargo).</li><li>Se suscribió <b>pese a una apelación en trámite</b>.</li><li>Se prescindió del procedimiento competitivo, no se cumplieron las condiciones de la contratación directa o se <b>simuló un supuesto excluido</b>.</li><li>Sentencia firme que acredita <b>pagos indebidos, dádivas o comisiones</b>.</li></ol>
   <p>Aun con vicio, la AGA puede autorizar <b>continuar la ejecución</b> con análisis costo-beneficio (indelegable). Siempre se inicia el <b>deslinde de responsabilidades</b>.</p>
  </div>
 </div>`,
 examples:`
 <div class="box ej"><span class="t">📌 Ejemplo – Nulidad de oficio antes de la buena pro</span>
 Durante la evaluación, la DEC advierte que las bases integradas aplicaron un factor de evaluación prohibido. La AGA declara la nulidad de oficio y retrotrae el procedimiento a la etapa de convocatoria.</div>
 <div class="box ej"><span class="t">📌 Ejemplo – Después de la buena pro</span>
 Tras otorgada la buena pro, se detecta un error formal menor en la publicación de un acta que no afecta el resultado. No es vicio trascendente: la AGA puede <b>autorizar la suscripción</b> del contrato con informes técnico y legal.</div>
 <div class="box caso"><span class="t">🧩 Caso práctico – Documento falso</span>
 <p>Seis meses después de firmado un contrato de obra, la entidad verifica que el certificado de experiencia del residente era <b>falso</b> y fue decisivo para obtener la buena pro.</p>
 <ol><li>La AGA otorga plazo de descargo y declara la <b>nulidad del contrato</b> (Art. 71.1.b).</li>
 <li>Puede contratar directamente el <b>saldo de obra</b> (Art. 55.1.k) para no paralizarla.</li>
 <li>Comunica al <b>Tribunal</b>: infracción del Art. 87.1.m (documento falso) → inhabilitación de <b>24 a 60 meses</b>.</li>
 <li>Denuncia penal y deslinde de responsabilidades de quienes no verificaron.</li></ol></div>`,
 quiz:[
  {q:"La AGA puede declarar de oficio la nulidad del procedimiento sin restricción:",o:["Hasta la firma del contrato","Hasta el otorgamiento de la buena pro","Durante toda la ejecución","Nunca"],a:1,e:"Art. 70.2.b; después de la buena pro solo por vicio trascendente o adjudicatario impedido."},
  {q:"¿Es causal de nulidad del contrato haberlo suscrito con apelación en trámite?",o:["Sí","No","Solo en obras","Solo si lo pide el postor"],a:0,e:"Art. 71.1.c."},
  {q:"El Tribunal declara la nulidad del procedimiento:",o:["De oficio en cualquier momento","Solo al conocer un recurso de apelación","A pedido del OECE","Solo en contratos menores"],a:1,e:"Art. 70.2.a."},
  {q:"Continuar la ejecución pese a un vicio de nulidad requiere:",o:["Nada","Informes técnico y legal con análisis costo-beneficio de la AGA (indelegable)","Opinión del Tribunal","Acuerdo del contratista"],a:1,e:"Art. 71.3."}

{
 id:"m8", num:"8", group:"Título V", title:"Solución de controversias: apelación, JPRD, conciliación y arbitraje",
 ref:"Arts. 72 al 86 · Reglamento (arts. 303 y ss.)",
 explain:`
 <div class="card"><h3>🧭 Dos momentos, dos vías</h3>
  <div class="grid g2">
   <div class="box ej" style="margin:0"><span class="t">ANTES del contrato</span><b>Recurso de apelación</b> (única vía para discrepancias en el procedimiento de selección y catálogos).</div>
   <div class="box caso" style="margin:0"><span class="t">DESDE el perfeccionamiento</span><b>JPRD · Conciliación · Arbitraje</b> (y otros de contratos estandarizados).</div>
  </div>
 </div>
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>📮 Recurso de apelación (Arts. 72-75)</h3>
   <ul><li><b>Cuándo:</b> después de la buena pro, de la declaratoria de desierto o de los resultados de catálogos.</li>
   <li><b>Plazo (Regl. 304):</b> <b>8 días hábiles</b> (licitación y concurso públicos); <b>5 días hábiles</b> (abreviadas, comparación de precios, selección de expertos y subasta inversa salvo que su cuantía sea de LP/CP).</li>
   <li><b>Quién resuelve:</b> <b>Tribunal</b> si la cuantía supera <b>50 UIT</b> (2026: ${soles(50*UIT)}) y en catálogos; en los demás casos, la <b>AGA</b> de la entidad.</li>
   <li><b>Garantía:</b> según el texto consolidado vigente de la Ley, hasta el <b>0.5%</b> de la cuantía, con tope de <b>50 UIT</b> (MYPE: <b>25 UIT</b>).</li>
   <li><b>Efecto:</b> <b>suspende</b> el procedimiento; lo resuelto agota la vía administrativa. Silencio → denegatoria ficta (contencioso-administrativo).</li>
   <li><b>No apelables:</b> contrataciones no competitivas (directas) y actuaciones que fije el reglamento.</li></ul>
  </div>
  <div class="card"><h3>🧑‍🔧 Junta de Prevención y Resolución de Disputas – JPRD (Arts. 79-80)</h3>
   <ul><li>Para contratos de <b>obras y suministro</b> (según reglamento).</li>
   <li>Absuelve consultas y <b>resuelve controversias técnicas y contractuales</b> mediante <b>decisiones obligatorias</b> de inmediato cumplimiento.</li>
   <li>No conoce validez, nulidad o eficacia del contrato.</li>
   <li>Plazo de caducidad para someter: <b>20 días hábiles</b> desde que se comunica el desacuerdo.</li>
   <li>Si nadie expresa desacuerdo en 20 días hábiles (o no se inicia arbitraje a tiempo), la decisión adquiere <b>mérito ejecutivo</b>.</li>
   <li>Si el contrato la prevé, es <b>presupuesto de arbitrabilidad</b>.</li></ul>
  </div>
  <div class="card"><h3>🤝 Conciliación (Arts. 81-82)</h3>
   <ul><li>Pactable en el contrato, <b>previa al arbitraje</b>; obligatoria en <b>contratos menores</b>.</li>
   <li>Materias: resolución, ampliación de plazo, recepción y conformidad, valorizaciones/metrados, liquidación, obligaciones de ejecución.</li>
   <li><b>La nulidad del contrato NO es conciliable.</b></li>
   <li>Ante centro acreditado por el MINJUSDH. La decisión de conciliar es de la <b>AGA</b>, con informe costo-beneficio.</li></ul>
  </div>
  <div class="card"><h3>⚖️ Arbitraje (Arts. 83-84)</h3>
   <ul><li>Resuelve controversias sobre validez, nulidad, interpretación, ejecución, terminación o eficacia.</li>
   <li><b>De derecho</b>, en español; <b>institucional</b> (institución registrada en el OECE). <b>Ad hoc solo si la controversia ≤ 10 UIT.</b></li>
   <li>Árbitro único (por defecto) o tribunal de 3.</li>
   <li><b>Plazo de caducidad: 30 días hábiles</b> (desde la notificación del acto o la entrega del bien, entregable o la obra, con excepciones). Catálogos: 10 días hábiles.</li>
   <li>Laudo <b>inapelable, definitivo y obligatorio</b>; solo cabe <b>recurso de anulación</b> (la entidad requiere autorización del titular con costo-beneficio). Laudos son de acceso público.</li></ul>
  </div>
 </div>
 <div class="card" style="margin-top:14px"><h3>🛡️ Medidas cautelares y contracautela (Arts. 85-86)</h3>
  <ul><li>Antes del tribunal arbitral: juez comercial (o civil) del domicilio de la entidad.</li>
  <li>Siempre con <b>traslado previo</b> a la contraparte.</li>
  <li><b>No proceden</b> cautelares que paralicen obras de salud, educación, vías, saneamiento y conservación vial.</li>
  <li><b>Contracautela:</b> caución juratoria para contratos de hasta <b>200 UIT</b> y para MYPE; en los demás casos, <b>carta fianza</b>, no menor a la garantía de fiel cumplimiento cuando se discute validez, resolución o eficacia.</li></ul>
 </div>
 <div class="box alerta"><span class="t">⚠️ No arbitrables</span>Pretensiones de enriquecimiento sin causa o indemnizaciones derivadas de adicionales <b>no aprobados por la Contraloría</b> → Poder Judicial (Art. 76.3). Los adicionales aprobados por la entidad <b>sí</b> pueden ir a JPRD o arbitraje.</div>`,
 examples:`
 <div class="box ej"><span class="t">📌 Ejemplo – ¿Tribunal o entidad?</span>
 Licitación pública abreviada de bienes por S/ 250,000. 50 UIT en 2026 = ${soles(50*UIT)}. Como S/ 250,000 no supera ese monto, la apelación la resuelve la <b>AGA de la entidad</b>. Si fuera S/ 300,000 → <b>Tribunal</b>.</div>
 <div class="box ej"><span class="t">📌 Ejemplo – Plazo de apelación</span>
 Buena pro de un concurso público notificada el lunes 2. El plazo de 8 días hábiles vence el miércoles 11 (sin feriados). En un concurso público abreviado serían 5 días hábiles → vence el lunes 9.</div>
 <div class="box caso"><span class="t">🧩 Caso práctico – Ampliación de plazo denegada</span>
 <p>Un contratista de obra solicita ampliación de plazo por lluvias extraordinarias y la entidad la deniega. El contrato tiene JPRD.</p>
 <ol><li>El contratista comunica su desacuerdo y somete la controversia a la <b>JPRD dentro de 20 días hábiles</b>.</li>
 <li>La JPRD decide a favor del contratista: la decisión es <b>obligatoria</b> y la entidad debe cumplirla de inmediato.</li>
 <li>Si la entidad discrepa, debe comunicarlo en 20 días hábiles e iniciar <b>arbitraje institucional</b> dentro del plazo de caducidad; si no lo hace, la decisión adquiere <b>mérito ejecutivo</b>.</li>
 <li>Para solicitar una medida cautelar, el contratista debe ofrecer contracautela (carta fianza si el contrato supera 200 UIT y no es MYPE).</li></ol></div>`,

  {q:"Antes del perfeccionamiento del contrato, las discrepancias se resuelven mediante:",o:["Arbitraje","Conciliación","Recurso de apelación","JPRD"],a:2,e:"Art. 72.1."},
  {q:"El Tribunal resuelve la apelación cuando la cuantía es superior a:",o:["8 UIT","50 UIT","100 UIT","200 UIT"],a:1,e:`Art. 74.1.a: más de 50 UIT (2026: ${soles(50*UIT)}).`},
  {q:"El plazo para apelar en una licitación pública es:",o:["3 días hábiles","5 días hábiles","8 días hábiles","15 días hábiles"],a:2,e:"Reglamento art. 304.1; en abreviadas, 5 días hábiles."},

{
 id:"m9", num:"9", group:"Título VI", title:"Infracciones y sanciones",
 ref:"Arts. 87 al 100",
 explain:`
 <div class="card"><h3>🚩 Infracciones de participantes, postores, proveedores y subcontratistas (Art. 87)</h3>
  <div class="table-wrap"><table>

function renderNav(filter=""){

function updateProgress(){
  const total=MODULES.length; let done=0;
  MODULES.forEach(m=>{const p=progress[m.id];if(p&&p.score/p.total>=0.7)done++});

  document.getElementById("progBar").style.width=pct+"%";

}

  `<button class="btn sec" onclick="retry('${key}')">↺ Reintentar</button>`;
}
let QBANK={}; MODULES.forEach(m=>QBANK[m.id]=m.quiz);
function answer(key,i,j){
  const q=QBANK[key][i]; const box=document.getElementById(`q-${key}-${i}`);
  const btns=box.querySelectorAll(".opt"); if(btns[0].disabled) return;
  btns.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("correct");if(k===j&&j!==q.a)b.classList.add("wrong")});
  const ok=j===q.a; const fb=document.getElementById(`fb-${key}-${i}`);
  fb.innerHTML=(ok?"✅ <b>¡Correcto!</b> ":"❌ <b>Incorrecto.</b> ")+q.e; fb.classList.add("show");
  const st=quizState[key]; st.answered++; if(ok) st.correct++;
  const sc=document.getElementById("score-"+key);
  if(st.answered===st.total){
    const pct=Math.round(st.correct/st.total*100);
    sc.innerHTML=`<span class="tag" style="font-size:14px">Resultado: ${st.correct}/${st.total} (${pct}%)</span> ${pct>=70?'<span class="tag" style="background:var(--ok-soft);color:var(--ok)">✔ Aprobado</span>':'<span class="tag" style="background:var(--bad-soft);color:var(--bad)">Repasa y vuelve a intentar</span>'}`;
    if(st.save){const prev=progress[key]; if(!prev||st.correct>=prev.score){progress[key]={score:st.correct,total:st.total};store.set("progress",progress)} updateProgress(); renderNav(document.getElementById("search").value);}
    if(key==="exam") examFinish(st);
  } else sc.querySelector(".tag").textContent=`${st.answered} / ${st.total} respondidas`;
}
function retry(key){ if(key==="exam"){go("exam");return} showTab(key,"quiz"); }

  return (TF[m.id]||[]).map((t,i)=>`<div class="q"><div class="qt">${t[0]}</div><button class="opt" style="display:inline-block;width:auto;margin-right:8px" onclick="tf(this,${t[1]},true,'${m.id}',${i})">Verdadero</button><button class="opt" style="display:inline-block;width:auto" onclick="tf(this,${t[1]},false,'${m.id}',${i})">Falso</button><div class="fb"></div></div>`).join("");
}
function tf(btn,ans,pick,id,i){
  const box=btn.parentElement; const bs=box.querySelectorAll(".opt"); if(bs[0].disabled) return;
  bs.forEach(b=>b.disabled=true); btn.classList.add(ans===pick?"correct":"wrong");
  const fb=box.querySelector(".fb"); fb.innerHTML=(ans===pick?"✅ Correcto. ":"❌ Incorrecto. ")+`Es <b>${ans?"verdadero":"falso"}</b>: `+TF[id][i][2]; fb.classList.add("show");
}

function initTools(){
  const ids=["tObj","tMonto","tFicha","tCat","pTipo","pMonto","pPlazo","pAtraso","aMonto","aProc","aMype","dTipo","dOrig","dAd","dDed","gMonto","gObj","gMype","mMonto","mMype"];
  ids.forEach(i=>{const el=document.getElementById(i); if(el){el.addEventListener("input",calcAll);el.addEventListener("change",calcAll)}});
  calcAll();
}
const val=id=>parseFloat(document.getElementById(id).value)||0;
const sel=id=>document.getElementById(id).value;
function calcAll(){
  // Selector
  const obj=sel("tObj"),mt=val("tMonto"),ficha=sel("tFicha")==="s",cat=sel("tCat")==="s"; let r="";
  const MEN=8*UIT;
  if(cat && obj!=="o") r=`<div class="big">Catálogo electrónico</div>Compra directamente en los catálogos de Perú Compras (no es fraccionamiento).`;
  else if(mt<=MEN) r=`<div class="big">Contrato menor</div>No requiere procedimiento de selección (≤ 8 UIT = ${soles(MEN)}). Publica en la Pladicop; el proveedor necesita RNP.`;
  else if(obj==="o"){ r = mt>=5000000?`<div class="big">Licitación pública (obras)</div>${mt>=79000000?"Obra de mayor envergadura (≥ S/ 79 millones): aplican reglas diferenciadas del reglamento.":"Cuantía ≥ S/ 5 millones."}`:`<div class="big">Licitación pública abreviada (obras)</div>Cuantía mayor a 8 UIT y menor a S/ 5 millones.`; }
  else if(ficha) r=`<div class="big">Subasta inversa electrónica</div>Bien/servicio común con ficha técnica: lances en línea, gana el menor precio.`;
  else {
    const n=obj==="b"?"Licitación pública":"Concurso público";
    r = mt>=485000?`<div class="big">${n}</div>Cuantía ≥ S/ 485,000.`:`<div class="big">${n} abreviad${obj==="b"?"a":"o"}</div>Cuantía entre S/ 44,000 y S/ 485,000.${mt<=100000?" <br>Si el bien/servicio es de entrega inmediata o está en el listado de la DGA, también puedes usar <b>comparación de precios</b> (≤ S/ 100,000).":""}`;
  }
  r+=`<br><small style="color:var(--muted)">Siempre revisa si procede un supuesto de contratación directa (Art. 55) o un supuesto excluido (Art. 7).</small>`;
  document.getElementById("tRes").innerHTML=r;
  // Penalidad
  const tp=sel("pTipo"),M=val("pMonto"),P=Math.max(1,val("pPlazo")),A=val("pAtraso");
  let F=0.40; if(tp==="o")F=P<=60?0.40:(P<=120?0.25:0.15); if(tp==="c")F=P<=60?0.40:0.25;
  const diaria=0.10*M/(F*P), tope=0.10*M, total=Math.min(diaria*A,tope), diasTope=Math.ceil(tope/diaria);
  document.getElementById("pRes").innerHTML=`F = <b>${F}</b><br>Penalidad diaria = 0.10 × ${soles(M)} ÷ (${F} × ${P}) = <b>${soles(diaria)}</b><br><div class="big">${soles(total)}</div>Penalidad aplicable por ${A} día(s) (tope 10% = ${soles(tope)}).<br>${diaria*A>=tope?'<b style="color:var(--bad)">⚠ Se alcanzó el tope: la entidad puede resolver el contrato.</b>':`El tope se alcanzaría al día <b>${diasTope}</b> de atraso.`}`;
  // Apelación
  const am=val("aMonto"),ap=sel("aProc"),mype=sel("aMype")==="s";
  const trib=am>50*UIT; let plazo= ap==="lp"?8:(ap==="sie"?(am>=485000?8:5):5);
  const gar=Math.min(am*0.005,(mype?25:50)*UIT);
  document.getElementById("aRes").innerHTML=`<div class="big">${trib?"Tribunal de Contrataciones Públicas":"Autoridad de la gestión administrativa de la entidad"}</div>${trib?"La cuantía supera":"La cuantía no supera"} 50 UIT (${soles(50*UIT)}).<br>Plazo para apelar: <b>${plazo} días hábiles</b> desde la notificación de la buena pro.<br>Garantía (texto consolidado de la Ley, hasta 0.5%, tope ${mype?25:50} UIT): <b>hasta ${soles(gar)}</b>.<br><small style="color:var(--muted)">Confirma el porcentaje vigente en la Ley y el Reglamento al momento de apelar.</small>`;
  // Adicionales
  const dt=sel("dTipo"),O=val("dOrig")||1,AD=val("dAd"),DD=dt==="o"?val("dDed"):0;
  const pct=(AD-DD)/O*100; let color="var(--ok)",msg="";
  if(dt==="bs"){ msg=pct<=25?"✅ Dentro del 25%: lo aprueba la AGA si es indispensable para la finalidad.":"⛔ Supera el 25%: no procede como adicional; evalúa una nueva contratación."; color=pct<=25?"var(--ok)":"var(--bad)"; }
  else { if(pct<=15){msg="✅ Hasta 15%: aprueba la AGA.";color="var(--ok)"} else if(pct<=30){msg="🟡 Más de 15% hasta 30%: aprueba el Titular, con recursos disponibles.";color="var(--warn)"} else if(pct<=50){msg="🟠 Más de 30% hasta 50%: Titular con autorización previa de la Contraloría.";color="#e07a1f"} else {msg="⛔ Supera el 50%: no procede.";color="var(--bad)"} }
  document.getElementById("dBar").style.width=Math.min(100,Math.max(0,pct*2))+"%"; document.getElementById("dBar").style.background=color;
  document.getElementById("dPct").textContent=pct.toFixed(2)+"% del contrato";
  document.getElementById("dRes").innerHTML=`Incidencia neta: <b>${soles(AD-DD)}</b> (${pct.toFixed(2)}%)<br>${msg}`;
  // Garantía
  const gm=val("gMonto"),go_=sel("gObj"),gmy=sel("gMype")==="s"; const lim=go_==="o"?5000000:480000;
  document.getElementById("gRes").innerHTML=`<div class="big">${soles(gm*0.10)}</div>Garantía de fiel cumplimiento (10%).<br>Retención de pago: ${gmy?"<b>✅ procede</b> (MYPE).":(gm<=lim?`<b>✅ procede</b> (cuantía ≤ ${soles(lim)}).`:`<b>❌ no procede</b> (supera ${soles(lim)}); usar carta fianza, póliza de caución o fideicomiso.`)}`;
  // Multa
  const mm=val("mMonto"),mmy=sel("mMype")==="s"; let txt;
  if(mm<=0){ txt=`<div class="big">${mmy?"1 a 8 UIT":"1 a 15 UIT"}</div>= ${soles(UIT)} a ${soles((mmy?8:15)*UIT)} (monto no determinable).`; }
  else { const mn=Math.max(UIT,mm*0.03), mx=Math.max(UIT,mm*(mmy?0.08:0.10)); txt=`<div class="big">${soles(mn)} – ${soles(mx)}</div>Entre 3% y ${mmy?"8% (MYPE)":"10%"}, nunca menos de 1 UIT.<br>Con pronto pago (hasta 30% de descuento) el mínimo podría bajar a ${soles(mn*0.7)}.`; }
  document.getElementById("mRes").innerHTML=txt;
}

/* ---------- Animaciones ---------- */
let flowTimer;
function playFlow(){
  const phs=document.querySelectorAll("#flowAnim .ph"); if(!phs.length) return; clearInterval(flowTimer); let i=0;
  phs.forEach(p=>p.classList.remove("on"));
  flowTimer=setInterval(()=>{phs.forEach(p=>p.classList.remove("on")); if(i<phs.length){phs[i].classList.add("on");i++} else {clearInterval(flowTimer); phs.forEach(p=>p.classList.add("on")); setTimeout(()=>phs.forEach(p=>p.classList.remove("on")),900)}},900);
}
let stepTimer;
function playSteps(){
  const st=document.querySelectorAll("#stepsAnim .step"); if(!st.length) return; clearInterval(stepTimer); let i=0;
  st.forEach(s=>s.classList.remove("on","pulse"));
  stepTimer=setInterval(()=>{ if(i>0) st[i-1].classList.remove("pulse"); if(i<st.length){st[i].classList.add("on","pulse");i++} else {clearInterval(stepTimer); st[st.length-1].classList.remove("pulse")} },850);
}
