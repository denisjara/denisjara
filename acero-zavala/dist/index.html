ángulo L3×3×3/8 (A36, ȳ = 0.884 in) se suelda a una plancha de 1/2 in y transmite Pu = 120 kips con electrodo E70XX. Elija el tamaño de filete, calcule φRn por pulgada (aporte y metal base) y diseñe una soldadura balanceada.","Dos planchas traslapadas de 8 in × 3/8 in (A36) transmiten Pu = 90 kips. Diseñe cordones longitudinales iguales de filete y dibuje el símbolo de soldadura correspondiente.","Una viga de 18 in de peralte transmite Mu = 1800 kip·in y Vu = 40 kips a una columna. Calcule la fuerza en las planchas de ala y la longitud de dos cordones longitudinales de 5/16 in (E70XX, planchas de 1/2 in A36) para tomarla.","Diseñe una unión traslapada con pernos A325-N de 3/4 in (agujeros estándar de 13/16 in) para Pu = 60 kips en planchas de 8 in × 1/2 in. Verifique el ancho mínimo, el número de pernos y las distancias al borde.","Para un perno A325 de 5/8 in, compare φRn a corte con la rosca incluida y excluida, y la resistencia a tracción φRn = 0.75·Fnt·Ab."],"avisos":["El profesor evalúa la participación en clase: todos empiezan con 20 y se descuentan puntos a quien no responde cuando se le pregunta.","Se pasó lista dos veces porque unos 10 alumnos se desconectaron a mitad de la clase.","Se usaron la tabla de perfiles del AISC (pestaña de ángulos simples) y el Capítulo J de la norma.","El detalle de la unión viga-columna se desarrollará con más profundidad en el capítulo de pórticos."],"notas_transcripcion":["La transcripción dice '1700 kips'. Por los cálculos (5.4·2·15.74 ≈ 170), la carga es 170 kips.","'250 por 2 por 5 16' se interpretó como el ángulo L2½×2×5/16 y '2.30' como 2½.","El profesor dice 'te van a soldar 16 centímetros', pero los cálculos están en pulgadas: son 16 in.","En la soldadura balanceada, el centroide de 0.55 in corresponde a x̄ ≈ 0.558 in del L2½×2×5/16. Las longitudes resultantes (7 in y 24.5 in) se registran tal como se calcularon en clase.","En el ejemplo de pernos, el profesor dice 'no estoy excluyendo' pero usa 68 ksi, que corresponde a la rosca excluida (X). Con la rosca incluida sería 54 ksi y φRn ≈ 7.95 kips. El resultado de 4 pernos se mantiene.","'Guacha' es la arandela, 'requintar' es pretensar y 'ojo chino' es un agujero ranurado.","El cálculo de ancho mínimo del ejemplo de pernos sigue el procedimiento de clase (suma de bordes, diámetros y separación), que es conservador respecto a 2·Le + s.","La fecha no se menciona. Por la secuencia, es una sesión entre el 26 de abril y el 3 de mayo de 2021 (en la playlist original está duplicada como clase 10)."],"corto":"Soldadura y pernos","video":"https://www.youtube.com/watch?v=tNfFtJLqFbs","duracion_min":107,"estado":"ok"},"09":{"titulo":"Introducción al diseño de vigas: compacidad, estados límite en flexión, Cb y pandeo lateral torsional","fecha":"lunes 3 de mayo de 2021","resumen":"La clase abre el capítulo de flexión (vigas). Se explica el comportamiento momento-rotación de una sección de acero: régimen elástico (ley de Hooke, M = S·σ), primera fluencia (My = Fy·Sx), plastificación parcial y momento plástico (Mp = Fy·Zx), con la formación de la rótula plástica. Con esa curva se interpretan los límites λp y λr de la Tabla B4.1b para clasificar las alas y el alma como compactas, no compactas o esbeltas. Se presenta el ensayo de flexión con cargas en los tercios, que da una zona central de flexión pura y es la base de las fórmulas de la norma. Se enumeran los cuatro estados límite en flexión y los requisitos de corte y deflexión (L/300 por carga viva), junto con la Tabla F1.1 para saber qué estados revisar. Se predimensiona un W12×58 para una viga con 60 kips al centro, se explica el factor Cb y la longitud no arriostrada Lb, y se presentan rts, Lp, Lr y las tres zonas del pandeo lateral torsional, con su aplicación en una hoja de cálculo.","objetivos":["Al terminar, el estudiante podrá describir la curva momento-rotación de una sección de acero e identificar My, la plastificación parcial y Mp.","Al terminar, el estudiante podrá clasificar las alas y el alma de un perfil en flexión como compactos, no compactos o esbeltos con la Tabla B4.1b.","Al terminar, el estudiante podrá enumerar los estados límite en flexión y usar la Tabla F1.1 para elegir cuáles revisar.","Al terminar, el estudiante podrá predimensionar una viga por fluencia (Zx requerido) y verificar φMn = 0.90·Fy·Zx.","Al terminar, el estudiante podrá definir la longitud no arriostrada Lb y calcular el factor de gradiente de momento Cb.","Al terminar, el estudiante podrá calcular Lp, Lr y rts y determinar en qué zona del pandeo lateral torsional se encuentra una viga."],"temas":[{"titulo":"Comportamiento en flexión: curva momento-rotación, My, Mp y rótula plástica","contenido":"Cuando una viga simplemente apoyada se carga, sus extremos giran y las secciones rotan: una parte queda comprimida y otra traccionada, con un ángulo θ. Las deformaciones medidas con sensores, divididas entre la longitud de referencia, dan la deformación unitaria. Mientras rige la ley de Hooke (σ = E·ε), el esfuerzo máximo se obtiene con el módulo de sección elástico S = I/(d/2), y el momento es M = σ·S. Ese es el tramo elástico de la curva momento-rotación (punto verde en la lámina del profesor). Si la carga aumenta, llega un momento en que la fibra extrema alcanza Fy. Es el último punto de validez de la ley de Hooke y define el momento de primera fluencia, My = Fy·Sx. Más allá, el comportamiento es inelástico: la fluencia avanza desde las fibras extremas hacia el interior, 'carcomiendo' la zona elástica, y se tiene un momento de plastificación intermedia M″ con una rotación θ″. Cuando toda la sección (compresión y tracción) ha fluido, se alcanza el momento plástico Mp = Fy·Zx, donde Zx es el módulo plástico (momento estático de las áreas respecto del eje neutro plástico). Según el profesor, el factor de forma Zx/Sx está típicamente entre 1.10 y 1.30. Mp es lo máximo que resiste una sección de acero. Al alcanzarlo se forma la rótula plástica y empieza la caída de resistencia, es decir, el colapso.","formulas":[{"nombre":"Ley de Hooke","expresion":"σ = E·ε","variables":"E = 29000 ksi; ε: deformación unitaria"},{"nombre":"Módulo de sección elástico","expresion":"Sx = Ix/(d/2)","variables":"Ix: inercia (in⁴); d: peralte (in)"},{"nombre":"Momento de primera fluencia","expresion":"My = Fy·Sx","variables":"Fy: fluencia (ksi)"},{"nombre":"Momento plástico","expresion":"Mp = Fy·Zx ; Zx = Σ Ai·|yi|","variables":"Zx: módulo plástico (in³); yi: distancia del centroide de cada área al eje neutro plástico"},{"nombre":"Factor de forma","expresion":"f = Zx/Sx ≈ 1.10 a 1.30","variables":"adimensional (≈ 1.10-1.15 en perfiles I sobre el eje fuerte)"}],"referencias_norma":["AISC 360-16 Sección F2.1 (fluencia, Mn = Mp = Fy·Zx)"]},{"titulo":"Clasificación por compacidad en flexión: Tabla B4.1b","contenido":"En compresión se usó la Tabla B4.1a. En flexión se usa la Tabla B4.1b, de relaciones ancho-espesor para elementos comprimidos de miembros sujetos a flexión. La flexión siempre comprime una parte del perfil, que puede pandear localmente. Hay dos límites. Si λ ≤ λp, el elemento es compacto: la sección desarrolla toda la curva hasta Mp y su colapso es dúctil. Si λp < λ ≤ λr, es no compacto: alcanza la fluencia pero no llega a Mp y se queda en un punto intermedio. Si λ > λr, es esbelto: falla en el rango elástico 'sin avisar', por pandeo local, sin las grandes deformaciones que anuncian la falla en una sección dúctil. Para aplicar la tabla se discretiza la sección. En un canal, por ejemplo, las alas tienen λf = b/tf y el alma λw = h/tw. Los casos 10 a 14 corresponden a elementos no rigidizados (alas) y el resto a rigidizados (almas, platabandas). Para alas de perfiles I laminados, λp = 0.38·√(E/Fy) y λr = 1.0·√(E/Fy). Para el alma en flexión, λp = 3.76·√(E/Fy) y λr = 5.70·√(E/Fy). En perfiles soldados (armados), el λr del ala usa kc: λr = 0.95·√(kc·E/FL). El profesor aclara que en el Perú se usan sobre todo perfiles soldados, porque hay pocos laminados, y por eso su hoja calcula los límites de perfiles soldados.","formulas":[{"nombre":"Ala de perfil I laminado (caso 10)","expresion":"λ = bf/(2·tf) ; λp = 0.38·√(E/Fy) ; λr = 1.0·√(E/Fy)","variables":"bf, tf: ancho y espesor del ala"},{"nombre":"Ala de perfil I soldado (caso 11)","expresion":"λp = 0.38·√(E/Fy) ; λr = 0.95·√(kc·E/FL)","variables":"kc = 4/√(h/tw) entre 0.35 y 0.76; FL ≈ 0.7·Fy"},{"nombre":"Alma en flexión de perfil I doblemente simétrico (caso 15)","expresion":"λ = h/tw ; λp = 3.76·√(E/Fy) ; λr = 5.70·√(E/Fy)","variables":"h: altura libre del alma; tw: espesor del alma"}],"referencias_norma":["AISC 360-16 Tabla B4.1b","AISC 360-16 Sección B4.1"]},{"titulo":"Ensayo de flexión con cargas en los tercios y videos de laboratorio","contenido":"El control de calidad de vigas se hace con el ensayo normalizado ASTM que el profesor llama 'de tres puntos'. Una gata aplica la carga sobre una viga de reparto muy rígida que, mediante rodillos, la transmite a la viga ensayada en los tercios de la luz. El diagrama de corte resultante es nulo en el tercio central y el de momento es constante allí, es decir, hay flexión pura. Por eso todas las fórmulas de las normas se basan en esta condición. Con sensores en el centro y en los apoyos se mide la deformación y el giro, y se construyen las curvas momento-curvatura y carga-deflexión (P-δ). El profesor explica que ASTM (que él llama American Society of Testing Machinery; en realidad es American Society for Testing and Materials) rige los protocolos de ensayo a nivel mundial. En el Perú, INDECOPI tiene a cargo la normalización e INACAL certifica los laboratorios, sobre la base de la ASTM. Se muestra un video de un ensayo a escala natural de una losa colaborante en el CISMID: la deformación casi no se nota al principio, luego la viga fluye y se deforma mucho, avisando la falla, hasta terminar en forma de 'carita feliz'. También pueden hacerse ensayos con especímenes pequeños en una máquina universal. Un segundo video muestra un canal simplemente apoyado con carga al centro y ciclos de desplazamiento creciente: el perfil sale de su plano y se tuerce por la compresión. Es el pandeo lateral torsional. El perfil queda torcido de forma permanente, aunque sigue tomando carga.","formulas":[],"referencias_norma":["ASTM (ensayos de flexión con cargas en los tercios)","INDECOPI / INACAL (normalización y acreditación en el Perú)"]},{"titulo":"Estados límite en flexión, corte, deflexión y Tabla F1.1","contenido":"Una viga tiene cuatro estados límite en flexión: (1) fluencia, Mn = Mp; (2) pandeo lateral torsional, en el que el perfil se sale de su plano y se tuerce; (3) pandeo local del ala comprimida, que se ondula; (4) fluencia del ala en tracción, que aplica a ciertas secciones. Se calcula un momento nominal para cada estado y la resistencia de la viga es el menor. Además hay que revisar el corte, Vu ≤ φv·Vn con Vn = 0.6·Fy·Aw·Cv (el profesor anticipa φ = 0.9; el tema se verá luego), y la deflexión por carga viva, que según el profesor debe ser como máximo L/300 para que no sea perceptible a simple vista. La Tabla F1.1 del Capítulo F funciona como un 'recetario'. Para perfiles I o canales con ala y alma compactas, solo se revisan fluencia y pandeo lateral torsional (Sección F2). Con alma compacta y ala no compacta o esbelta, se revisan pandeo lateral torsional y pandeo local del ala (F3). Con alma no compacta o esbelta y cualquier ala, se revisan los cuatro estados (F4/F5). Hay además secciones para flexión en el eje débil, tubos rectangulares y circulares, secciones T, ángulos dobles, ángulos simples, barras sólidas y secciones asimétricas, en las que hay que revisar todos los estados límite aplicables.","formulas":[{"nombre":"Resistencia a flexión","expresion":"Mu ≤ φb·Mn ; φb = 0.90 ; Mn = mín(Mn,fluencia ; Mn,PLT ; Mn,PLA ; Mn,TFY)","variables":"PLT: pandeo lateral torsional; PLA: pandeo local del ala; TFY: fluencia del ala en tracción"},{"nombre":"Resistencia a corte (anticipo)","expresion":"Vu ≤ φv·Vn ; Vn = 0.6·Fy·Aw·Cv1","variables":"Aw = d·tw; Cv1: coeficiente de corte del alma"},{"nombre":"Deflexión por carga viva (criterio de clase)","expresion":"ΔL ≤ L/300","variables":"L: luz de la viga"}],"referencias_norma":["AISC 360-16 Tabla F1.1 (User Note)","AISC 360-16 Secciones F2 a F5","AISC 360-16 Cap. G (corte)","AISC 360-16 Cap. L (serviciabilidad)"]},{"titulo":"Predimensionamiento por fluencia de una viga: ejemplo W12×58","contenido":"Rara vez el primer perfil propuesto funciona, igual que en compresión: hay que iterar. Ejemplo: viga simplemente apoyada con una carga última de 60 kips al centro y luz de 160 in. Cada reacción es de 30 kips y el momento máximo es Mu = 30·80 = 2400 kip·in. Por fluencia, Mu ≤ 0.90·Fy·Zx, así que Zx,req = 2400/(0.9·36) = 74.1 in³. En la tabla de perfiles W (ordenada por peso), en la columna Zx, se buscan perfiles con más de 74 in³, como W12×53, W12×58 o W12×65, y se toma uno un poco por encima: W12×58, con Zx = 86.4 in³. La tabla ya trae bf/2tf = 7.82 y h/tw = 27.0. Con Fy = 36 ksi, λp,ala = 0.38·√(29000/36) ≈ 10.8 y λp,alma = 3.76·√(29000/36) ≈ 107. Como 7.82 < 10.8 y 27.0 < 107, la sección es compacta, y por la Tabla F1.1 solo hay que revisar fluencia y pandeo lateral torsional. Fluencia: φMn = 0.90·36·86.4 ≈ 2799 kip·in ≥ 2400 kip·in, que cumple. Falta revisar el pandeo lateral torsional, que depende de Lb y Cb.","formulas":[{"nombre":"Módulo plástico requerido","expresion":"Zx,req = Mu/(φb·Fy)","variables":"Mu en kip·in; Fy en ksi; Zx en in³"},{"nombre":"Momento máximo, viga simple con carga al centro","expresion":"Mu = Pu·L/4","variables":"Pu: carga puntual; L: luz"}],"referencias_norma":["AISC 360-16 Sección F2.1","AISC Steel Construction Manual, Tabla 1-1 (perfiles W)"]},{"titulo":"Longitud no arriostrada Lb y factor de gradiente de momento Cb","contenido":"Las fórmulas de la norma vienen de ensayos con momento uniforme (flexión pura). En una estructura real el diagrama de momentos varía, por ejemplo con momentos negativos en los extremos y positivo al centro. El factor Cb corrige ese gradiente. Punto que según el profesor suele confundir a los alumnos: Cb no se calcula sobre la luz de la viga sino sobre la longitud no arriostrada Lb, la distancia entre puntos donde el ala comprimida está impedida de desplazarse lateralmente o de girar. En un techo con vigas en los ejes A, B y C, las viguetas y un sistema de arriostres en diagonal forman puntos de arriostre. Si se arriostra a la mitad, Lb = L/2, y si se arriostra en los tercios, Lb = L/3. La lógica es simple: para que la viga no se salga de su plano, 'se la apuntala'. Las viguetas solas no bastan; deben trabajar con los arriostres. Cada tramo no arriostrado tiene su propio Cb, pero normalmente se calcula en el tramo con el mayor momento. Cb = 12.5·Mmáx/(2.5·Mmáx + 3·MA + 4·MB + 3·MC), con valores absolutos: Mmáx es el máximo del tramo y MA, MB y MC son los momentos a 1/4, 1/2 y 3/4 del tramo Lb. Un alumno pidió repetir la explicación y el profesor la dibujó: una viga con viguetas y arriostres en sus puntos medios, que impiden que la sección rote fuera del plano, de modo que Lb = L/2.","formulas":[{"nombre":"Factor de gradiente de momento","expresion":"Cb = 12.5·Mmáx/(2.5·Mmáx + 3·MA + 4·MB + 3·MC)","variables":"Mmáx: momento máximo absoluto en Lb; MA, MB, MC: momentos absolutos a Lb/4, Lb/2 y 3Lb/4"}],"referencias_norma":["AISC 360-16 Sección F1, ecuación F1-1","AISC 360-16 Apéndice 6 (arriostramiento de vigas)"]},{"titulo":"Pandeo lateral torsional: rts, Lp, Lr y las tres zonas","contenido":"La parte del perfil que tiende a salirse del plano es el ala comprimida con alrededor de un tercio del alma comprimida. Su radio de giro efectivo es rts, que puede aproximarse con una fórmula que combina el área del alma (h·tw) y la del ala (bf·tf). Lp es la longitud no arriostrada hasta la cual la viga alcanza el momento plástico: Lp = 1.76·ry·√(E/Fy). Lr es la longitud a partir de la cual el pandeo es elástico (corresponde a 0.7·Fy·Sx). Depende de rts, E, Fy, J (aprox. Σ b·t³/3), Sx, ho (distancia entre centroides de las alas) y c (1.0 para perfiles I doblemente simétricos; para canales tiene su propia fórmula). Zonas: (1) si Lb ≤ Lp, no se aplica el pandeo lateral torsional y Mn = Mp; (2) si Lp < Lb ≤ Lr, pandeo inelástico con interpolación lineal entre Mp y 0.7·Fy·Sx, amplificada por Cb y limitada a Mp; (3) si Lb > Lr, pandeo elástico con Mn = Fcr·Sx ≤ Mp, donde Fcr depende de Cb, Lb/rts, J·c/(Sx·ho). El profesor aplica todo en su hoja Excel al W12×58 (bf = 10.0 in, tf = 0.64 in, d = 12.2 in, tw = 0.36 in). Obtiene λf = 7.8 < 10.8 y, con h = d − 2·tf, λw ≈ 30 < 106-110 (compacto con límites de perfil soldado o laminado). El Z calculado a mano es ≈ 83 in³, un poco menor que el de la tabla (86.4) porque no incluye los filetes de la unión ala-alma, y da Mp ≈ 2989 kip·in; con S calculado a mano, My ≈ 2702 kip·in. Con arriostres en los tercios, Lb = 160/3 = 53.3 in, y se evalúa Cb en el tramo central (momentos en x = 66.7, 80 y 93.3 in). Lp = 1.76·ry·√(E/Fy) ≈ 126 in > Lb = 53.3 in, así que se está en la zona 1, no rige el pandeo lateral torsional y Mn = Mp. Queda pendiente verificar la deflexión.","formulas":[{"nombre":"Radio de giro efectivo (aproximación)","expresion":"rts = bf/√(12·(1 + (1/6)·(h·tw)/(bf·tf)))","variables":"bf, tf: ala; h, tw: alma"},{"nombre":"Longitud límite plástica","expresion":"Lp = 1.76·ry·√(E/Fy)","variables":"ry: radio de giro respecto al eje débil"},{"nombre":"Longitud límite inelástica","expresion":"Lr = 1.95·rts·(E/(0.7·Fy))·√( J·c/(Sx·ho) + √( (J·c/(Sx·ho))² + 6.76·(0.7·Fy/E)² ) )","variables":"J: constante torsional; c = 1 (perfil I doblemente simétrico); ho: distancia entre centroides de alas; Sx: módulo elástico"},{"nombre":"Zona 2 (inelástica)","expresion":"Mn = Cb·[Mp − (Mp − 0.7·Fy·Sx)·(Lb − Lp)/(Lr − Lp)] ≤ Mp","variables":"Lp < Lb ≤ Lr"},{"nombre":"Zona 3 (elástica)","expresion":"Mn = Fcr·Sx ≤ Mp ; Fcr = (Cb·π²·E/(Lb/rts)²)·√(1 + 0.078·(J·c/(Sx·ho))·(Lb/rts)²)","variables":"Lb > Lr"},{"nombre":"Constante torsional aproximada","expresion":"J ≈ Σ b·t³/3","variables":"b, t de cada plancha"}],"referencias_norma":["AISC 360-16 Sección F2.2, ecuaciones F2-2 a F2-8"]}],"ejemplos":[{"titulo":"Predimensionamiento y verificación por fluencia de una viga simple","enunciado":"Viga simplemente apoyada de 160 in de luz con una carga última puntual Pu = 60 kips al centro. Acero A36 (Fy = 36 ksi, E = 29000 ksi). Seleccionar un perfil W y verificar compacidad y fluencia.","pasos":["Reacciones: 30 kips cada una. Mu = 30·80 = 2400 kip·in.","Zx,req = 2400/(0.9·36) = 74.1 in³.","De la tabla: W12×58 con Zx = 86.4 in³, bf/2tf = 7.82, h/tw = 27.0.","λp,ala = 0.38·√(29000/36) = 10.8 > 7.82: ala compacta.","λp,alma = 3.76·√(29000/36) = 107 > 27.0: alma compacta. Perfil compacto: se revisan fluencia y pandeo lateral torsional (Tabla F1.1).","φMn = 0.9·36·86.4 = 2799 kip·in ≥ 2400 kip·in: cumple por fluencia."],"resultado":"W12×58 compacto con φMn = 2799 kip·in > Mu = 2400 kip·in. Falta revisar el pandeo lateral torsional y la deflexión."},{"titulo":"Cb y pandeo lateral torsional del W12×58 arriostrado en los tercios","enunciado":"Para la viga anterior, arriostrada lateralmente en los tercios (Lb = 53.3 in), calcular Cb en el tramo central y determinar la zona de pandeo lateral torsional (ry ≈ 2.51 in).","pasos":["Tramo central entre x = 53.3 y 106.7 in. Puntos a 1/4, 1/2 y 3/4: x = 66.7, 80 y 93.3 in.","Con la carga puntual: MA = 30·66.7 = 2000, MB = 2400 = Mmáx, MC = 2000 kip·in.","Cb = 12.5·2400/(2.5·2400 + 3·2000 + 4·2400 + 3·2000) = 30000/27600 ≈ 1.09.","(En clase la hoja usó una carga repartida equivalente de 60 kips en 160 in, con MA = MC ≈ 1166.7 y MB = Mmáx = 1200 kip·in, y Cb ≈ 1.01.)","Lp = 1.76·2.51·√(29000/36) ≈ 125-126 in.","Lb = 53.3 in < Lp: zona 1, no rige el pandeo lateral torsional y Mn = Mp."],"resultado":"Lb < Lp, así que Mn = Mp (≈ 2989 kip·in con el Z de la hoja, 3110 kip·in con el Z de tabla). La viga cumple en flexión. Tarea: verificar la deflexión."}],"conceptos_clave":[{"termino":"Momento de primera fluencia (My)","definicion":"Momento con el que la fibra extrema alcanza Fy. My = Fy·Sx, límite del comportamiento elástico."},{"termino":"Momento plástico (Mp)","definicion":"Momento con toda la sección en fluencia. Mp = Fy·Zx. Es la máxima resistencia de la sección y en él se forma la rótula plástica."},{"termino":"Sección compacta","definicion":"Sección cuyos elementos tienen λ ≤ λp: puede desarrollar Mp con capacidad de rotación."},{"termino":"Sección no compacta","definicion":"Sección con λp < λ ≤ λr: fluye parcialmente pero no llega a Mp."},{"termino":"Sección esbelta","definicion":"Sección con λ > λr: falla por pandeo local en el rango elástico, sin aviso."},{"termino":"Pandeo lateral torsional","definicion":"Estado límite en el que la viga, por la compresión del ala, se desplaza lateralmente y se tuerce fuera de su plano."},{"termino":"Longitud no arriostrada (Lb)","definicion":"Distancia entre puntos que impiden el desplazamiento lateral del ala comprimida o el giro de la sección. Sobre ella se calcula Cb."},{"termino":"Factor Cb","definicion":"Coeficiente de gradiente de momento que ajusta la resistencia al pandeo lateral torsional cuando el momento no es uniforme en Lb."},{"termino":"Lp y Lr","definicion":"Longitudes límite: hasta Lp la viga alcanza Mp; entre Lp y Lr el pandeo es inelástico; más allá de Lr es elástico."},{"termino":"rts","definicion":"Radio de giro efectivo del ala comprimida con parte del alma, usado en Lr y en Fcr del pandeo lateral torsional."},{"termino":"Ensayo con cargas en los tercios","definicion":"Ensayo de vigas con cargas en los tercios de la luz, que produce flexión pura en el tercio central y es la base de las fórmulas de la norma."}],"preguntas":[{"pregunta":"¿Qué representa My = Fy·Sx en la curva momento-rotación?","opciones":["El momento plástico","El último punto de comportamiento elástico, cuando fluye la fibra extrema","El momento de pandeo lateral torsional","El momento de colapso"],"correcta":1,"explicacion":"Es el momento de primera fluencia; a partir de ahí el comportamiento es inelástico."},{"pregunta":"Según la clase, el cociente Zx/Sx (factor de forma) suele estar entre:","opciones":["0.80 y 0.95","1.10 y 1.30","1.50 y 2.00","2.00 y 3.00"],"correcta":1,"explicacion":"El profesor indica que el módulo plástico es 1.10 a 1.30 veces el elástico."},{"pregunta":"Un ala tiene λp < λ ≤ λr según la Tabla B4.1b. ¿Cómo se clasifica?","opciones":["Compacta","Esbelta","No compacta","Rigidizada"],"correcta":2,"explicacion":"Entre λp y λr el elemento es no compacto."},{"pregunta":"λp para el ala de un perfil I laminado en flexión con Fy = 36 ksi es aproximadamente:","opciones":["10.8","15.8","28.4","106.7"],"correcta":0,"explicacion":"0.38·√(29000/36) = 0.38·28.4 ≈ 10.8."},{"pregunta":"¿Por qué los ensayos de vigas cargan en los tercios de la luz?","opciones":["Para maximizar el corte","Para tener flexión pura (corte nulo y momento constante) en el tercio central","Para provocar pandeo local","Para simular una carga repartida exacta"],"correcta":1,"explicacion":"En el tercio central no hay corte y el momento es constante, que es la condición de las fórmulas de la norma."},{"pregunta":"Según la Tabla F1.1, para un perfil I con ala y alma compactas, ¿qué estados límite se revisan?","opciones":["Los cuatro estados límite","Solo pandeo local del ala","Fluencia y pandeo lateral torsional","Fluencia del ala en tracción y pandeo local del alma"],"correcta":2,"explicacion":"Es el caso F2: solo fluencia y pandeo lateral torsional."},{"pregunta":"Una viga simple de 160 in con 60 kips al centro (A36) requiere un Zx mínimo de:","opciones":["66.7 in³","74.1 in³","86.4 in³","83.3 in³"],"correcta":1,"explicacion":"Mu = 2400 kip·in y Zx = 2400/(0.9·36) = 74.1 in³."},{"pregunta":"El factor Cb se evalúa sobre:","opciones":["La luz total de la viga","La longitud no arriostrada Lb","La longitud del voladizo","La distancia entre puntos de inflexión"],"correcta":1,"explicacion":"Cb se calcula con los momentos dentro del tramo no arriostrado Lb."},{"pregunta":"Un tramo Lb tiene Mmáx = MB = 2400 y MA = MC = 2000 kip·in. ¿Cuánto vale Cb?","opciones":["1.00","1.09","1.14","1.32"],"correcta":1,"explicacion":"Cb = 12.5·2400/(2.5·2400 + 3·2000 + 4·2400 + 3·2000) = 30000/27600 ≈ 1.09."},{"pregunta":"Si Lb ≤ Lp en una viga compacta, ¿cuál es Mn?","opciones":["Mn = 0.7·Fy·Sx","Mn = Fcr·Sx","Mn = Mp = Fy·Zx","Mn = Cb·My"],"correcta":2,"explicacion":"En la zona 1 no rige el pandeo lateral torsional y la viga alcanza el momento plástico."},{"pregunta":"Lp = 1.76·ry·√(E/Fy) usa ry, que es:","opciones":["El radio de giro respecto del eje fuerte","El radio de giro respecto del eje débil","El radio de giro efectivo rts","El radio de giro polar"],"correcta":1,"explicacion":"Lp depende del radio de giro respecto del eje débil (y)."},{"pregunta":"Límite de deflexión por carga viva indicado en clase:","opciones":["L/180","L/240","L/300","L/500"],"correcta":2,"explicacion":"El profesor indicó L/300 como criterio general para que la deflexión no sea perceptible."}],"ejercicios_propuestos":["Verifique la deflexión por carga viva de la viga W12×58 del ejemplo (L = 160 in, Ix = 475 in⁴), suponiendo que 25 kips de la carga al centro son carga viva de servicio, con el límite L/300 (tarea dejada en clase).","Una viga simple de 24 ft con carga última repartida wu = 2.5 kip/ft (A36) se arriostra solo en los apoyos. Predimensione un perfil W por fluencia, clasifique su compacidad, calcule Cb, Lp y Lr y determine φMn.","Calcule Cb para un tramo no arriostrado con momentos en los extremos de −800 y +400 kip·in y variación lineal (evalúe MA, MB y MC).","Para un perfil soldado con alas de 10 in × 1/2 in y alma de 16 in × 5/16 in (Fy = 36 ksi), clasifique ala y alma con la Tabla B4.1b (incluya kc) e indique qué estados límite exige la Tabla F1.1.","Calcule rts, Lp y Lr de un W16×40 (A36) y determine en qué zona de pandeo lateral torsional está con Lb = 10 ft y con Lb = 25 ft."],"avisos":["Tarea: verificar la deflexión de la viga W12×58 del ejemplo y presentarla el miércoles.","Se usa la hoja Excel de propiedades de secciones armadas (presentada en la clase anterior), ampliada con λp, λr, Cb, Lp y Lr. Se recomienda que cada alumno haga la suya.","Se mostraron videos de un ensayo de losa colaborante en el CISMID y de pandeo lateral torsional de un canal.","Se pasó lista (5 ausentes de 37). El profesor recomendó cuidarse del COVID-19."],"notas_transcripcion":["La fecha sale de 'hoy es tres del cinco' y de la mención al 'día miércoles' siguiente: lunes 3 de mayo de 2021.","'Tabla BA' y 'tabla B' son las Tablas B4.1a y B4.1b. 'CV/cuad' es Cb y 'LV' es Lb. En el corte, 'Cb' es el coeficiente Cv.","Para el alma el profesor dijo '1.76 ... 95'. Lo correcto para el alma en flexión es λp = 3.76·√(E/Fy) ≈ 107. La conclusión (compacta) no cambia.","La hoja muestra Z ≈ 83 in³ calculado a mano frente a 86.4 de la tabla (no incluye los filetes de la unión ala-alma). El 'valor 107' mencionado para la tabla no coincide con el W12×58 y se omitió.","Para calcular Cb, la hoja usó una carga repartida 'equivalente' de 60 kips en 160 in (Mmáx = 1200 kip·in), distinta de la carga puntual del enunciado (Mmáx = 2400 kip·in). Se presentan ambos valores de Cb.","El profesor dijo φ = 0.9 para el corte. El AISC 360-16 usa φv = 1.0 para almas de perfiles I laminados con h/tw ≤ 2.24·√(E/Fy) y 0.9 en los demás casos.","ASTM se presentó como 'American Society of Testing Machinery'; su nombre correcto es American Society for Testing and Materials. 'Sismit' es el CISMID-UNI.","Como límite de deflexión el profesor dio L/300. El AISC (Comentario del Cap. L) suele citar L/360 para carga viva en pisos."],"corto":"Flexión y pandeo lateral","video":"https://www.youtube.com/watch?v=-iyz-gbe4D8","duracion_min":99,"estado":"ok"},"10":{"corto":"Duplicado de la 08","video":"https://www.youtube.com/watch?v=OkH9EP1W18k","duracion_min":107,"titulo":"Video duplicado de la clase 08","estado_txt":"Video duplicado","estado_det":"Este video es idéntico al de la clase 08 (misma grabación y duración de 1 h 47 min). Estudia la clase 08.","estado":"pendiente","temas":[]},"11":{"corto":"Duplicado de la 09","video":"https://www.youtube.com/watch?v=ROvDhNOTAiY","duracion_min":99,"titulo":"Video duplicado de la clase 09","estado_txt":"Video duplicado","estado_det":"Este video es idéntico al de la clase 09 (misma grabación del 3 de mayo de 2021). Estudia la clase 09.","estado":"pendiente","temas":[]},"12":{"titulo":"Diseño por corte (Cv, kv, atiesadores) y diseño completo de una viga compacta soldada desde cero","fecha":"miércoles 5 de mayo de 2021","resumen":"La clase arranca con el diseño por corte según el Capítulo G de AISC 360-16. El profesor presenta la resistencia φVn = φ·0.6·Fy·Aw·Cv, con Aw = h·tw porque el corte lo toma el alma. Distingue dos casos. El caso A son los perfiles laminados en caliente con h/tw ≤ 2.24√(E/Fy), donde φ = 1.0 y Cv = 1. El caso B es todo lo demás (secciones soldadas incluidas): φ = 0.9 y Cv se calcula a partir del coeficiente de pandeo kv, que depende de si hay atiesadores transversales. Explica el límite 2.46√(E/Fy) para decidir si hacen falta atiesadores y la fórmula kv = 5 + 5/(a/h)², válida si a/h ≤ 3. También diferencia Cv1 (alma sin acción de campo de tensión) de Cv2 (con flujo de corte o campo de tensión), y deja este último para más adelante. En la segunda parte dimensiona desde cero una viga soldada compacta simplemente apoyada de 315 in (unos 8 m) con wu = 0.05 kip/in. Para eso usa reglas de predimensionamiento del peralte según la luz, los límites de compacidad de la Tabla B4.1b y el par de fuerzas C = T = Mu/d. Obtiene una sección de 14 in de peralte, alas de 6.5 × 5/16 in y alma de 3/16 in. Luego la verifica por corte, por flexión (fluencia y pandeo lateral-torsional con Cb calculado en una hoja Excel) y por deflexión (L/300).","objetivos":["Al terminar, el estudiante podrá calcular la resistencia nominal y de diseño al corte de vigas I laminadas y soldadas según el Capítulo G de AISC 360-16.","Al terminar, el estudiante podrá determinar kv y Cv1 para almas con y sin atiesadores transversales, y decidir cuándo los atiesadores son necesarios.","Al terminar, el estudiante podrá predimensionar el peralte de una viga a partir de su luz y dimensionar alma y alas de una sección soldada compacta usando los límites de la Tabla B4.1b y la demanda Mu.","Al terminar, el estudiante podrá verificar completamente una viga compacta: compacidad, corte, fluencia, pandeo lateral-torsional y deflexión por servicio."],"temas":[{"titulo":"Resistencia al corte de vigas I: expresión general y casos","contenido":"El profesor recuerda que en una viga I el cortante lo resiste prácticamente solo el alma, de modo que el área de corte es Aw = h·tw, donde h es la altura libre del alma y tw su espesor (en AISC 360-16 para perfiles I laminados se usa Aw = d·tw; el profesor trabajó con h·tw). La resistencia nominal es Vn = 0.6·Fy·Aw·Cv, donde 0.6·Fy representa la fluencia por corte del acero y Cv es un coeficiente de reducción por pandeo del alma. El factor de resistencia φ depende del caso. En el caso A, perfiles laminados en caliente con h/tw ≤ 2.24√(E/Fy), se toma φv = 1.0 (y Ω = 1.50 en ASD) y Cv = 1. En el caso B, cualquier otro perfil, en particular toda sección armada o soldada, se toma φv = 0.90 (Ω = 1.67) y Cv debe calcularse. El profesor insiste en que una viga soldada cae siempre en el caso B, y que por eso hay que revisar la esbeltez del alma h/tw y la presencia de atiesadores. Comenta también que en la práctica el corte rara vez controla el diseño de vigas con cargas repartidas, aunque hay que tener cuidado con las cargas puntuales.","formulas":[{"nombre":"Resistencia de diseño al corte (LRFD)","expresion":"φv·Vn = φv·0.6·Fy·Aw·Cv1","variables":"Fy: esfuerzo de fluencia (ksi); Aw: área del alma = h·tw (in²); Cv1: coeficiente de pandeo por corte del alma; φv = 1.0 (caso A) o 0.90 (caso B)"},{"nombre":"Límite para el caso A (laminados)","expresion":"h/tw ≤ 2.24·√(E/Fy) → φv = 1.0 y Cv1 = 1.0","variables":"h: altura libre del alma; tw: espesor del alma; E = 29000 ksi"}],"referencias_norma":["AISC 360-16 Cap. G, sección G2.1 (ecuación G2-1)","AISC 360-16 G1 (φv = 0.90, Ωv = 1.67)","AISC 360-16 G2.1(a) (φv = 1.00, Ωv = 1.50 para perfiles I laminados con h/tw ≤ 2.24√(E/Fy))"]},{"titulo":"Atiesadores transversales de alma y coeficiente kv","contenido":"Los atiesadores de alma son planchas soldadas perpendiculares al alma, solas o en pares, y repartidas a lo largo de la viga con un espaciamiento modular a. El profesor aclara que no aumentan la resistencia del material: lo que hacen es restringir el pandeo del alma y, con ello, elevar el esfuerzo de corte que el alma puede alcanzar. El criterio de la norma es este: si h/tw ≤ 2.46√(E/Fy), los atiesadores no son necesarios (se pueden poner o no). Si h/tw supera ese valor, el profesor indica que hay que colocarlos (estrictamente, la norma pide atiesadores cuando la resistencia sin ellos no alcanza). El coeficiente de pandeo por corte del panel de alma, kv, vale 5.34 para almas sin atiesadores. Con atiesadores vale kv = 5 + 5/(a/h)², siempre que a/h ≤ 3. Si a/h > 3, kv vuelve a 5.34, porque atiesadores tan espaciados ya no aportan nada. Ante la pregunta de un alumno sobre cómo elegir a, el profesor recomienda empezar con a = h (lo que da kv = 10) e ir aumentando según la demanda, manteniendo a entre h y 3h.","formulas":[{"nombre":"Límite sin atiesadores","expresion":"h/tw ≤ 2.46·√(E/Fy) → no se requieren atiesadores transversales","variables":"E: módulo de elasticidad (29000 ksi); Fy en ksi"},{"nombre":"kv sin atiesadores","expresion":"kv = 5.34","variables":"Coeficiente de pandeo por corte de la placa del alma"},{"nombre":"kv con atiesadores","expresion":"kv = 5 + 5/(a/h)²  (si a/h ≤ 3; si a/h > 3, kv = 5.34)","variables":"a: distancia libre entre atiesadores transversales (in); h: altura libre del alma (in)"}],"referencias_norma":["AISC 360-16 G2.1(b) (ecuación G2-5 para kv)","AISC 360-16 G2.3 (atiesadores transversales, límite 2.46√(E/Fy))"]},{"titulo":"Coeficiente Cv1 y diferencia con Cv2 (campo de tensión)","contenido":"En el caso B, Cv1 se obtiene comparando la esbeltez del alma con el umbral 1.10√(kv·E/Fy). Si h/tw ≤ 1.10√(kv·E/Fy), el alma fluye por corte antes de pandearse y Cv1 = 1. Si h/tw supera ese umbral, Cv1 = 1.10√(kv·E/Fy)/(h/tw), es decir, el cociente entre el umbral y la esbeltez real. El profesor distingue dos coeficientes. Cv1 se usa cuando no se considera acción de campo de tensión (él lo llama sin flujo de corte, alma sin pandeo posterior). Cv2 se usa cuando se aprovecha la resistencia poscrítica del alma pandeada mediante el campo de tensión diagonal (con flujo de corte). Usar o no el campo de tensión es decisión del diseñador y corresponde a almas muy peraltadas con atiesadores. En esta parte del curso, dedicada a vigas compactas, solo se trabajará con Cv1. Cv2 y los requisitos adicionales de los atiesadores se verán más adelante.","formulas":[{"nombre":"Cv1 – fluencia del alma","expresion":"si h/tw ≤ 1.10·√(kv·E/Fy) → Cv1 = 1.0","variables":"kv: coeficiente de pandeo por corte; E, Fy en ksi"},{"nombre":"Cv1 – pandeo del alma","expresion":"si h/tw > 1.10·√(kv·E/Fy) → Cv1 = 1.10·√(kv·E/Fy) / (h/tw)","variables":"h/tw: esbeltez del alma"}],"referencias_norma":["AISC 360-16 G2.1(b) ecuaciones G2-3 y G2-4","AISC 360-16 G2.2 (acción de campo de tensión, Cv2)"]},{"titulo":"Predimensionamiento del peralte de vigas según la luz","contenido":"Para empezar el diseño de una viga sin usar tablas, el profesor propone estimar el peralte total d a partir de la luz L. Las reglas que dio son: d ≈ L/24 para luces hasta unos 10 m, d ≈ L/14 para luces entre unos 11 y 19 m, y d ≈ L/11 para luces de 20 m o más. El valor obtenido se pasa a pulgadas y se redondea a un número práctico, de ingeniería. En el ejemplo, L = 315 in ≈ 8 m da d ≈ 8/24 = 0.333 m ≈ 13.1 in, y se adopta d = 14 in. El profesor subraya que esto es solo un punto de partida para tantear. A partir de ahí se combinan los límites de compacidad (para fijar los espesores) con la demanda de momento (para fijar el área de las alas).","formulas":[{"nombre":"Peralte aproximado (criterio del profesor)","expresion":"d ≈ L/24 (L ≤ 10 m); d ≈ L/14 (11–19 m); d ≈ L/11 (L ≥ 20 m)","variables":"d: peralte total de la viga; L: luz de la viga"}],"referencias_norma":[]},{"titulo":"Dimensionamiento de una sección soldada compacta usando compacidad y demanda","contenido":"Con d fijado, el espesor del alma se obtiene imponiendo compacidad. Para el alma de una sección I en flexión (Tabla B4.1b, caso 15) el límite es λpw = 3.76√(E/Fy) = 106.7 para A36. Tomando h ≈ 0.95·d = 13.3 in, se necesita tw ≥ 13.3/106.7 ≈ 0.12 in, y se adopta tw = 3/16 in (0.1875 in). Para las alas el profesor usa la demanda. Mu se resiste con un par de fuerzas C = T separadas aproximadamente por d, así que C ≈ Mu/d = 620.2/14 ≈ 44.3 kip. Si el ala está en fluencia, C = bf·tf·Fy. Un primer tanteo con tf = 3/16 (todo con la misma plancha) da bf ≥ 6.56 in y se adopta bf = 6.5 in, pero entonces bf/2tf = 17.3 supera λpf = 0.38√(E/Fy) = 10.78 y el ala resulta no compacta. En el segundo tanteo se mantiene bf = 6.5 y se despeja tf ≥ 6.5/(2·10.78) = 0.30 in. Como no existe plancha de 0.30 in, se usa 5/16 in (0.3125 in). La sección propuesta es d = 14 in, alas de 6.5 × 5/16 in y alma de 3/16 in, todo sin usar tablas de perfiles, que es como se dimensionan las secciones soldadas.","formulas":[{"nombre":"Compacidad del ala (I, flexión)","expresion":"λf = bf/(2·tf) ≤ λpf = 0.38·√(E/Fy)","variables":"bf: ancho del ala; tf: espesor del ala"},{"nombre":"Compacidad del alma (I doblemente simétrica)","expresion":"λw = h/tw ≤ λpw = 3.76·√(E/Fy)","variables":"h: altura libre del alma; tw: espesor del alma"},{"nombre":"Fuerza en el ala por par interno","expresion":"C = T ≈ Mu/d;  C = bf·tf·Fy","variables":"Mu: momento último (kip·in); d: peralte (in)"}],"referencias_norma":["AISC 360-16 Tabla B4.1b, casos 10/11 (alas) y 15 (almas)"]},{"titulo":"Verificación por flexión de la viga compacta: fluencia y pandeo lateral-torsional","contenido":"Con la sección propuesta se recalcula la compacidad. Para el ala, λf = 6.5/(2·0.3125) = 10.4 ≤ 10.78, compacta. Para el alma, h = 14 − 2·(5/16) = 13.375 in y λw = 13.375/0.1875 = 71.3 ≤ 106.7, compacta. La sección es compacta, así que aplica F2 y se revisan fluencia y pandeo lateral-torsional. El módulo plástico se calcula con la tabla de áreas de la hoja Excel: Zx = 36.19 in³, Mp = 36 × 36.19 = 1302.8 kip·in y φMn = 0.9 × 1302.8 = 1172.6 kip·in. Para el pandeo lateral-torsional la viga está arriostrada a los tercios, Lb = 105 in. Cb se obtiene en la hoja con los momentos a 1/4, 1/2 y 3/4 del tramo central: Cb ≈ 1.014. La hoja da Lp = 1.76·ry·√(E/Fy) = 73.7 in y Lr = 199.8 in. Como Lp < Lb < Lr, se usa la zona 2 (ecuación F2-2), limitada a Mp, y resulta Mn = 1198.95 kip·in, con φMn = 1079.1 kip·in. Se toma el menor de los dos estados límite: φMn = 1079.1 kip·in ≥ Mu = 620.2 kip·in, cumple. El profesor recuerda que una viga está diseñada solo cuando se han revisado corte, flexión y deflexión.","formulas":[{"nombre":"Fluencia (F2.1)","expresion":"Mn = Mp = Fy·Zx;  φb = 0.90","variables":"Zx: módulo plástico (in³)"},{"nombre":"Pandeo lateral-torsional inelástico (F2-2)","expresion":"Mn = Cb·[Mp − (Mp − 0.7·Fy·Sx)·(Lb − Lp)/(Lr − Lp)] ≤ Mp","variables":"Cb: factor de gradiente de momento; Sx: módulo elástico; Lb: longitud no arriostrada; Lp, Lr: longitudes límite"},{"nombre":"Longitud Lp","expresion":"Lp = 1.76·ry·√(E/Fy)","variables":"ry: radio de giro respecto al eje débil"},{"nombre":"Factor Cb (F1-1)","expresion":"Cb = 12.5·Mmax / (2.5·Mmax + 3·MA + 4·MB + 3·MC)","variables":"Mmax: momento máximo absoluto en el tramo no arriostrado; MA, MB, MC: momentos absolutos a 1/4, 1/2 y 3/4 del tramo"}],"referencias_norma":["AISC 360-16 F2.1 (ecuación F2-1)","AISC 360-16 F2.2 (ecuaciones F2-2, F2-5, F2-6)","AISC 360-16 F1 (ecuación F1-1, Cb)"]},{"titulo":"Verificación por corte y deflexión del ejemplo","contenido":"Para el corte, la viga es soldada, así que cae en el caso B (φv = 0.9). Primero se compara h/tw = 71.3 con 2.46√(E/Fy) = 69.8. Como lo supera ligeramente, el profesor decide colocar atiesadores con a = h, con lo que kv = 5 + 5/1² = 10. El umbral 1.10√(10 × 29000/36) = 98.7 es mayor que 71.3, por lo que Cv1 = 1. La resistencia es φVn = 0.9 × 0.6 × 36 × (13.375 × 0.1875) × 1 = 48.75 kip, muy superior a Vu = wL/2 = 0.05 × 315/2 = 7.875 kip. La deflexión de servicio se calcula en la hoja con Δ = 5·w·L⁴/(384·E·I), usando la carga de servicio y el momento de inercia de la sección. Se compara con el límite L/300 = 315/300 = 1.05 in y cumple. Con esto la viga queda verificada por corte, flexión y deflexión. El profesor concluye que los alumnos ya pueden diseñar una viga compacta desde la nada, con criterio y leyendo la norma.","formulas":[{"nombre":"Cortante y momento de viga simplemente apoyada con carga uniforme","expresion":"Vu = wu·L/2;  Mu = wu·L²/8","variables":"wu: carga última repartida (kip/in); L: luz (in)"},{"nombre":"Deflexión máxima por servicio","expresion":"Δ = 5·w·L⁴/(384·E·I) ≤ L/300","variables":"w: carga de servicio (kip/in); I: momento de inercia (in⁴); E = 29000 ksi"}],"referencias_norma":["AISC 360-16 G2.1","AISC 360-16 Capítulo L (estados límite de servicio, deflexiones)"]}],"ejemplos":[{"titulo":"Dimensionamiento desde cero de una viga soldada compacta","enunciado":"Viga simplemente apoyada de acero A36 (Fy = 36 ksi, E = 29000 ksi), luz L = 315 in (≈ 8 m), carga última repartida wu = 0.05 kip/in, arriostrada lateralmente a los tercios. Dimensionar una sección I soldada compacta.","pasos":["Demanda: Vu = 0.05 × 315/2 = 7.875 kip; Mu = 0.05 × 315²/8 = 620.2 kip·in.","Peralte: L ≈ 8 m < 10 m → d ≈ L/24 = 0.333 m ≈ 13.1 in → se adopta d = 14 in.","Alma: λpw = 3.76√(29000/36) = 3.76 × 28.38 = 106.7; con h ≈ 0.95 × 14 = 13.3 in, tw ≥ 13.3/106.7 ≈ 0.12 in → tw = 3/16 in = 0.1875 in.","Ala por demanda: C ≈ Mu/d = 620.2/14 = 44.3 kip; con tf = 3/16: bf ≥ 44.3/(36 × 0.1875) = 6.56 in → bf = 6.5 in.","Compacidad del ala con tf = 3/16: 6.5/(2 × 0.1875) = 17.3 > λpf = 0.38 × 28.38 = 10.78 → no compacta; se rechaza.","Segundo tanteo: tf ≥ 6.5/(2 × 10.78) = 0.30 in → plancha comercial 5/16 in = 0.3125 in.","Sección propuesta: d = 14 in; alas 6.5 × 5/16 in; alma 13.375 × 3/16 in."],"resultado":"Sección soldada I: d = 14 in, bf = 6.5 in, tf = 5/16 in, tw = 3/16 in (h = 13.375 in)."},{"titulo":"Verificación completa de la viga soldada propuesta","enunciado":"Verificar la sección del ejemplo anterior (A36, L = 315 in, wu = 0.05 kip/in, Lb = 105 in) por compacidad, corte, flexión y deflexión.","pasos":["Compacidad: λf = 6.5/(2 × 0.3125) = 10.4 ≤ 10.78 (ala compacta); λw = 13.375/0.1875 = 71.3 ≤ 106.7 (alma compacta) → sección compacta.","Corte: soldada → caso B, φv = 0.9. h/tw = 71.3 > 2.46 × 28.38 = 69.8 → se colocan atiesadores con a = h → kv = 5 + 5/1² = 10.","Umbral: 1.10√(10 × 29000/36) = 98.7 ≥ 71.3 → Cv1 = 1.","φVn = 0.9 × 0.6 × 36 × (13.375 × 0.1875) × 1 = 48.75 kip ≥ Vu = 7.875 kip → cumple.","Fluencia: Zx = 36.19 in³ (hoja Excel) → Mp = 36 × 36.19 = 1302.8 kip·in; φMn = 0.9 × 1302.8 = 1172.6 kip·in.","LTB: Lb = 315/3 = 105 in; Lp = 73.7 in; Lr = 199.8 in; Cb ≈ 1.014 → zona 2 → Mn = 1198.95 kip·in ≤ Mp; φMn = 1079.1 kip·in.","Gobierna LTB: φMn = 1079.1 kip·in ≥ Mu = 620.2 kip·in → cumple.","Deflexión: Δ = 5wL⁴/(384EI) con la carga de servicio, comparada con L/300 = 1.05 in → cumple."],"resultado":"La viga cumple: φVn = 48.75 kip > 7.875 kip; φMn = 1079.1 kip·in (LTB) > 620.2 kip·in; deflexión de servicio < L/300 = 1.05 in."}],"conceptos_clave":[{"termino":"Área del alma (Aw)","definicion":"Área que resiste el corte en un perfil I, tomada como h·tw (AISC usa d·tw para laminados)."},{"termino":"Cv1","definicion":"Coeficiente de pandeo por corte del alma sin acción de campo de tensión. Vale 1 si el alma fluye antes de pandearse; si no, es la razón entre 1.10√(kvE/Fy) y h/tw."},{"termino":"Cv2 / campo de tensión","definicion":"Coeficiente asociado a la resistencia poscrítica de almas pandeadas que, gracias a los atiesadores, desarrollan un flujo diagonal de tensiones."},{"termino":"kv","definicion":"Coeficiente de pandeo por corte de la placa del alma: 5.34 sin atiesadores, o 5 + 5/(a/h)² con atiesadores a ≤ 3h."},{"termino":"Atiesador transversal de alma","definicion":"Plancha soldada perpendicular al alma que restringe su pandeo. No aumenta la resistencia del material, pero sí el corte que el alma puede alcanzar."},{"termino":"Sección soldada (armada)","definicion":"Perfil formado por planchas soldadas. Para corte cae siempre en el caso B (φv = 0.9 y Cv1 por calcular)."},{"termino":"Predimensionamiento por luz","definicion":"Estimación inicial del peralte (L/24, L/14 o L/11 según la luz) para empezar a tantear una sección."}],"preguntas":[{"pregunta":"Según AISC 360-16, ¿en qué caso se puede tomar φv = 1.0 y Cv1 = 1.0 para corte en una viga I?","opciones":["En cualquier sección soldada con h/tw ≤ 2.46√(E/Fy)","En perfiles I laminados en caliente con h/tw ≤ 2.24√(E/Fy)","En toda viga con atiesadores a ≤ 3h","Solo cuando kv = 5.34"],"correcta":1,"explicacion":"La sección G2.1(a) limita φv = 1.0 y Cv1 = 1 a almas de perfiles I laminados con h/tw ≤ 2.24√(E/Fy)."},{"pregunta":"¿Qué valor toma kv en un alma sin atiesadores transversales?","opciones":["10","5.0","5.34","4.0"],"correcta":2,"explicacion":"Sin atiesadores, o con a/h > 3, kv = 5.34."},{"pregunta":"Si se colocan atiesadores con a = h, ¿cuánto vale kv?","opciones":["5.34","10","7.5","6.25"],"correcta":1,"explicacion":"kv = 5 + 5/(a/h)² = 5 + 5/1 = 10."},{"pregunta":"¿Qué ocurre con kv si la separación de atiesadores es a > 3h?","opciones":["Se duplica","Se calcula con 5 + 5/(a/h)²","Vale 5.34, porque los atiesadores no aportan","Se toma igual a 10"],"correcta":2,"explicacion":"La fórmula con atiesadores solo vale para a/h ≤ 3. Más allá, el panel se comporta como no atiesado."},{"pregunta":"En el ejemplo, h/tw = 71.3 y el umbral 1.10√(kvE/Fy) con kv = 10 es 98.7. ¿Cuánto vale Cv1?","opciones":["0.72","1.38","0.90","1.0"],"correcta":3,"explicacion":"Como h/tw ≤ 1.10√(kvE/Fy), el alma fluye por corte y Cv1 = 1."},{"pregunta":"Según el criterio dado en clase, ¿qué peralte inicial corresponde a una viga de 8 m de luz?","opciones":["Aproximadamente L/24 ≈ 0.33 m","Aproximadamente L/11 ≈ 0.73 m","Aproximadamente L/14 ≈ 0.57 m","Aproximadamente L/40 ≈ 0.20 m"],"correcta":0,"explicacion":"Para luces de hasta unos 10 m el profesor propone d ≈ L/24."},{"pregunta":"Para A36, ¿cuál es el límite λpf de compacidad del ala de una sección I en flexión?","opciones":["16.0","24.1","10.8","106.7"],"correcta":2,"explicacion":"λpf = 0.38√(29000/36) = 0.38 × 28.38 ≈ 10.8."},{"pregunta":"¿Por qué se rechazó el ala de 6.5 × 3/16 in en el ejemplo?","opciones":["Porque no resistía el corte","Porque bf/2tf = 17.3 > λpf y el ala resultaba no compacta","Porque su área era insuficiente para C = 44.3 kip","Porque superaba la deflexión admisible"],"correcta":1,"explicacion":"El objetivo era una sección compacta, y la esbeltez 17.3 superaba el límite 10.78."},{"pregunta":"Si Lp < Lb ≤ Lr en una sección compacta, ¿qué expresión se usa para Mn por LTB?","opciones":["Mn = Fcr·Sx con Fcr elástico","Mn = Mp sin importar Cb","Mn = Cb[Mp − (Mp − 0.7FySx)(Lb − Lp)/(Lr − Lp)] ≤ Mp","Mn = 0.9·E·kc·Sx/λ²"],"correcta":2,"explicacion":"Es la zona inelástica del pandeo lateral-torsional, ecuación F2-2."},{"pregunta":"¿Qué tres verificaciones exige el profesor para dar una viga por diseñada?","opciones":["Corte, flexión y deflexión","Tracción, compresión y torsión","Fluencia, fractura y bloque de corte","Solo flexión y deflexión"],"correcta":0,"explicacion":"La viga solo está diseñada cuando cumple corte, flexión (todos sus estados límite) y deflexión por servicio."},{"pregunta":"¿Qué función cumplen los atiesadores transversales de alma según el profesor?","opciones":["Aumentan el Fy del alma","Restringen el pandeo del alma sin aumentar la resistencia del material","Sustituyen la verificación por flexión","Reducen el peso de la viga"],"correcta":1,"explicacion":"Previenen el pandeo del alma y así permiten alcanzar mayores esfuerzos de corte, pero no cambian la resistencia del acero."}],"ejercicios_propuestos":["Calcule φVn de una viga soldada A36 con h = 20 in y tw = 1/4 in, sin atiesadores. Repita el cálculo con atiesadores a = 30 in y compare los valores de Cv1.","Dimensione una viga soldada compacta de acero A572 Gr. 50 (Fy = 50 ksi), simplemente apoyada, de 7 m de luz, con wu = 0.08 kip/in. Use d ≈ L/24 y los límites de compacidad para A572 Gr. 50.","Para la viga de la clase (d = 14 in, alas de 6.5 × 5/16 in, alma de 3/16 in), calcule Ix y la deflexión con una carga de servicio de 0.035 kip/in, y compárela con L/300 y L/360.","Un perfil W laminado tiene h/tw = 55 y Fy = 50 ksi. Determine si aplica φv = 1.0 y Cv1 = 1 según G2.1(a).","Determine la separación máxima de atiesadores con la que un alma de h = 40 in y tw = 5/16 in (A36) alcanza Cv1 = 1."],"avisos":["Al día siguiente (jueves 6 de mayo de 2021) hay práctica calificada, con materia hasta vigas compactas.","Se usa una hoja Excel elaborada en clase para calcular Zx, ry, Lp, Lr, Cb (diagramas de corte y momento) y la deflexión. El profesor la comparte con los alumnos.","El profesor recomienda leer siempre la norma AISC 360 (Capítulos F y G, Tabla B4.1b).","Ese día hubo 10 a 12 ausentes; el profesor expresó su preocupación por posibles casos de COVID."],"notas_transcripcion":["La transcripción dice 'cb' o 'CV' para el coeficiente de corte; se interpretó como Cv (Cv1/Cv2). 'KB' se interpretó como kv.","'flujo de corte' se interpretó como acción de campo de tensión (tension field action), que corresponde a Cv2.","La carga se transcribió como 'punto cero cinco Kip por pulgada' = wu = 0.05 kip/in, lo que es coherente con Vu = 7.875 kip y Mu = 620.2 kip·in. La carga de servicio no se entiende en el audio.","Al principio el profesor confunde 1.31 con 1.10 en el umbral de Cv1 y luego se corrige a 1.10√(kvE/Fy).","Sobre la separación recomendada, se oye 'entre H y H'; se interpretó como a entre h y 3h, coherente con el límite a/h ≤ 3.","Nota técnica: con kv = 5.34 (sin atiesadores) el umbral es 1.10√(5.34 × 805.6) = 72.1 > 71.3, así que Cv1 = 1 también sin atiesadores. Según G2.3 los atiesadores no serían obligatorios, porque la resistencia sin ellos es suficiente. El profesor optó por ponerlos aplicando el criterio de 2.46√(E/Fy).","En la hoja Excel el profesor llama a esta sesión 'clase 10', por la numeración propia de su archivo. El Cb se oye como '1014' y luego como '1.1'; se adoptó Cb ≈ 1.014.","El límite L/300 se oye como 'cinco pulgada'; 315/300 = 1.05 in."],"corto":"Corte y viga soldada","video":"https://www.youtube.com/watch?v=06ZiRHTIa5c","duracion_min":101,"estado":"ok"},"13":{"titulo":"Pandeo local del ala comprimida (F3) e introducción a vigas I con alma no compacta (F4)","fecha":"lunes 10 de mayo de 2021","resumen":"El profesor repasa el procedimiento de diseño a flexión: proponer una sección, clasificar alas y alma con la Tabla B4.1b (incluidos los límites sísmicos para pórticos ordinarios, intermedios y especiales) y revisar los estados límite que correspondan, además de corte y deflexión. Introduce el pandeo local del ala comprimida (FLB) de la sección F3, que aplica a perfiles I de alma compacta con alas no compactas o esbeltas. Muestra un video de laboratorio donde se ve el ondulado local del ala, y explica que el fenómeno aparece típicamente en zonas de momento negativo, como sobre apoyos con volados. Presenta la ecuación de interpolación lineal para ala no compacta y la ecuación elástica 0.9·E·kc·Sx/λ² para ala esbelta, con kc = 4/√(h/tw) entre 0.35 y 0.76. Resuelve con hoja Excel una viga con volado (Lb = 60 in, Cb = 1.3 y 1.96) y una viga simplemente apoyada de 180 in arriostrada a los tercios. En la segunda revisa corte, deflexión, LTB y FLB, y muestra cómo cambia la resistencia al variar el ancho del ala. Finalmente plantea una viga de techo de acero A572 Gr. 50 que soporta máquinas reciprocantes (impacto 50%), cuya sección resulta con ala y alma no compactas. Con ella introduce la sección F4: aw, rt, Sxc, Myc, Rpc y las nuevas Lp y Lr.","objetivos":["Al terminar, el estudiante podrá identificar cuándo aplica el estado límite de pandeo local del ala comprimida según la clasificación de la sección.","Al terminar, el estudiante podrá calcular Mn por FLB para alas no compactas y esbeltas, incluido el coeficiente kc de secciones armadas.","Al terminar, el estudiante podrá elegir el Cb que corresponde al tramo no arriostrado donde está el momento máximo, en vigas con momentos positivos y negativos.","Al terminar, el estudiante podrá incorporar cargas de máquinas con impacto y predimensionar una viga de techo de gran luz.","Al terminar, el estudiante podrá reconocer una sección F4 (alma no compacta) y calcular aw, rt, Sxc, Myc y Rpc."],"temas":[{"titulo":"Repaso: clasificación de la sección y estados límite en flexión","contenido":"Diseñar una viga por flexión implica verificarla por corte, por flexión y por deflexión. Si falta alguna de las tres, el diseño no está completo. El proceso empieza proponiendo una sección y clasificando sus elementos con la Tabla B4.1b. Las alas son elementos no atiesados, con un borde libre. Las almas son elementos atiesados, con ambos bordes rigidizados. Cada elemento se clasifica como compacto, no compacto o esbelto, y con eso se clasifica el perfil. El profesor recuerda que, si la viga forma parte de un sistema sismorresistente, hay que respetar además los límites más exigentes de la norma sísmica: los pórticos ordinarios cumplen la Tabla B4.1b, mientras que los intermedios y especiales deben cumplir los límites de ductilidad moderada y alta. De la tabla resumen del Capítulo F (Tabla User Note F1.1) se deduce el caso. Con ala y alma compactas (F2) se revisan solo fluencia y LTB. Con alma compacta y ala no compacta o esbelta (F3) se suma el pandeo local del ala comprimida. Recuerda también que Cb se calcula con los momentos a 1/4, 1/2 y 3/4 de cada tramo no arriostrado.","formulas":[{"nombre":"Condición de diseño (LRFD)","expresion":"Mu ≤ φb·Mn;  φb = 0.90","variables":"Mn: menor resistencia nominal entre los estados límite aplicables"}],"referencias_norma":["AISC 360-16 Tabla B4.1b","AISC 360-16 Tabla User Note F1.1","AISC 341-16 Tabla D1.1 (límites para miembros de ductilidad moderada y alta)"]},{"titulo":"Fenómeno del pandeo local del ala comprimida y zonas de momento negativo","contenido":"El profesor proyecta un video de un ensayo de flexión en tres puntos sobre un perfil tipo W8. La viga apoya en rodillos, tiene una celda de carga al centro, sensores de deflexión y topes. Al crecer la carga, el ala comprimida de la zona central empieza a ondularse localmente: es el pandeo local del ala comprimida. El fenómeno se da cuando el ala comprimida es demasiado esbelta para su nivel de compresión. Puede gobernar en zonas de momento negativo. Por ejemplo, en una viga con volado el momento negativo sobre el apoyo deja la compresión en el ala inferior y, según la longitud del volado, puede superar al momento positivo. Si el perfil propuesto tiene alas no compactas o esbeltas, esta compresión puede controlar el diseño por encima de la fluencia o del LTB. El profesor advierte que este tipo de falla depende mucho de las condiciones locales.","formulas":[],"referencias_norma":["AISC 360-16 F3"]},{"titulo":"FLB con ala no compacta y ala esbelta (F3.2)","contenido":"Para ala no compacta (λpf < λ ≤ λrf), la resistencia se obtiene por interpolación lineal entre Mp y 0.7·Fy·Sx, usando relaciones de esbeltez en vez de longitudes. La fórmula es análoga a la zona 2 del LTB. Para ala esbelta (λ > λrf) la resistencia es elástica: Mn = 0.9·E·kc·Sx/λ². Aquí λ = bf/(2tf), y kc es el coeficiente de pandeo de placa de secciones armadas, kc = 4/√(h/tw), acotado entre 0.35 y 0.76. Para perfiles laminados se usan λrf = 1.0√(E/Fy) y la fórmula esbelta con kc implícito (0.69E/Fy·Sx/λ² para F3). Para perfiles soldados, el límite no compacto/esbelto del ala depende de kc: λrf = 0.95√(kc·E/FL), con FL = 0.7·Fy en secciones doblemente simétricas. El profesor muestra en la hoja Excel que, al ensanchar el ala de 6 in a 10.8 in, sigue siendo no compacta pero Mn baja. Con 12 in pasa a esbelta y hay que cambiar a la fórmula elástica (Mn ≈ 452). Con 16 in, λ ≈ 42.7 y la resistencia cae aún más. Su conclusión es que ensanchar el ala no conviene si la vuelve esbelta.","formulas":[{"nombre":"FLB ala no compacta (F3-1)","expresion":"Mn = Mp − (Mp − 0.7·Fy·Sx)·(λ − λpf)/(λrf − λpf)","variables":"λ = bf/(2tf); λpf, λrf: límites compacto y no compacto del ala (Tabla B4.1b)"},{"nombre":"FLB ala esbelta (F3-2)","expresion":"Mn = 0.9·E·kc·Sx/λ²","variables":"kc: coeficiente de pandeo de placa; Sx: módulo elástico (in³)"},{"nombre":"Coeficiente kc","expresion":"kc = 4/√(h/tw),  0.35 ≤ kc ≤ 0.76","variables":"h/tw: esbeltez del alma"},{"nombre":"Límite λr del ala en secciones armadas","expresion":"λrf = 0.95·√(kc·E/FL), FL = 0.7·Fy","variables":"FL: esfuerzo nominal de flexión del ala comprimida al iniciarse el pandeo inelástico"}],"referencias_norma":["AISC 360-16 F3.2 (ecuaciones F3-1 y F3-2)","AISC 360-16 Tabla B4.1b caso 11 (alas de secciones armadas) y nota [a] (kc)"]},{"titulo":"Elección del Cb en vigas con tramos de momento positivo y negativo","contenido":"En la viga con volado (luz entre apoyos de 180 in, volado de 60 in y arriostres cada 60 in), el profesor calcula Cb en cada tramo no arriostrado. En el tramo central da 1.3. En los volados se toma Cb = 1. En el tramo junto al apoyo, donde el diagrama pasa de positivo a negativo, Cb sube a 1.96, porque el gradiente de momento es grande: positivo a 1/4, casi nulo a 1/2 y negativo a 3/4, con el máximo en el extremo negativo. Un alumno pregunta qué Cb usar. El profesor responde que lo correcto es evaluar cada tramo no arriostrado con su propio Cb y su propio momento. Lo que no se debe hacer es tomar el mayor Cb, sino usar el Cb del tramo donde está el momento máximo que se verifica. En una memoria de cálculo recomienda presentar todos los tramos, para que nadie pueda objetar que se omitió el que resultaba crítico.","formulas":[{"nombre":"Factor de gradiente de momento","expresion":"Cb = 12.5·Mmax / (2.5·Mmax + 3·MA + 4·MB + 3·MC)","variables":"Momentos en valor absoluto dentro del tramo no arriostrado"}],"referencias_norma":["AISC 360-16 F1 (ecuación F1-1)","AISC 360-16 Comentario F1 (Cb = 1.0 en volados sin arriostre en el extremo)"]},{"titulo":"Viga simplemente apoyada con ala no compacta: corte, deflexión, LTB y FLB en Excel","contenido":"El segundo ejemplo es una viga simplemente apoyada de 180 in, arriostrada a los tercios (Lb = 60 in), con Mu máximo ≈ 275.4 kip·in al centro y reacciones de 6.12 kip. La sección soldada tiene alas de 6 × 3/16 in (λf = 16), alma con h = 15 in y tw = 3/16 in (h/tw = 80). Corte: sin atiesadores, kv = 5.34, y el umbral 1.10√(kvE/Fy) = 72.15 es menor que 80, así que Cv1 = 72.15/80 ≈ 0.90. Resulta Vn = 0.6 × 36 × 15 × 0.1875 × 0.90 ≈ 54 kip y φVn ≈ 49 kip, frente a Vu ≈ 6 kip. Deflexión: Δ = 5wL⁴/(384EI) ≈ 0.23 in ≤ L/300 = 0.60 in. LTB: Lb = 60 in apenas supera Lp ≈ 57 in. La ecuación da Mn ≈ 1025, mayor que Mp, así que se limita a Mp. FLB: ala no compacta (10.79 < 16 < 21.55) y Mn ≈ 802 kip·in. Gobierna el FLB: φMn = 0.9 × 802 ≈ 722 kip·in ≥ 275 kip·in. El profesor arma la hoja con celdas que comparan demanda y resistencia y devuelven OK o CAMBIA.","formulas":[{"nombre":"Deflexión máxima (simplemente apoyada)","expresion":"Δ = 5·w·L⁴/(384·E·I) ≤ Δlím","variables":"w: carga de servicio; Δlím ≈ L/300"},{"nombre":"Resistencia nominal final","expresion":"Mn = mín(Mn,fluencia; Mn,LTB; Mn,FLB)","variables":"Se elige el menor de los estados límite aplicables"}],"referencias_norma":["AISC 360-16 F3","AISC 360-16 G2.1"]},{"titulo":"Cargas de máquinas reciprocantes e impacto; predimensionamiento de viga de techo A572 Gr. 50","contenido":"El tercer problema es la planta de un techo con vigas en los ejes 1, 2, 3 y A, B, C. Se diseña la viga del eje B, sobre la que se apoyan máquinas reciprocantes de 5 t cada una. La máquina se considera carga viva, porque puede retirarse para repararla. Al vibrar, golpea la estructura, y se aplica un impacto del 50%: PL = 1.5 × 5 = 7.5 t ≈ 16.5 kip, convirtiendo t × 1000 × 2.2/1000. Como cada máquina queda centrada entre dos vigas, el eje recibe la mitad, 8.25 kip. Se suma una carga viva de mantenimiento de 100 kg/m² sobre el ancho tributario, y como carga muerta el peso propio del perfil más una plancha de 1/2 in que sirve de apoyo a las máquinas. El acero es A572 Gr. 50 (Fy = 50 ksi, Fu = 65 ksi, √(E/Fy) = 24.08), lo que cambia todos los límites que dependen de √(E/Fy). Luz de 680 in ≈ 17 m, así que d ≈ L/14 ≈ 1.2 m ≈ 48 in. El ancho del ala se estima en unos 16 in y se usa tf = tw = 1/2 in. Resulta λf = 16 (no compacta) y h/tw = 47/0.5 = 94, mayor que λpw = 3.76√(E/Fy) ≈ 90.5 y menor que λrw = 5.70√(E/Fy) ≈ 137: alma no compacta. Con kc = 4/√94 ≈ 0.41, la sección queda en la sección F4 de la norma.","formulas":[{"nombre":"Carga viva con impacto","expresion":"PL,diseño = (1 + I)·PL = 1.5·PL (máquina reciprocante, I = 50%)","variables":"PL: peso de la máquina; I: factor de impacto"},{"nombre":"Conversión de unidades usada","expresion":"kip = t × 1000 × 2.2/1000","variables":"1 t = 1000 kg ≈ 2200 lb = 2.2 kip"}],"referencias_norma":["ASCE 7 / Norma E.020 (impacto en apoyos de maquinaria reciprocante: 50%)","ASTM A572 Gr. 50"]},{"titulo":"Sección F4: vigas I con alma no compacta (Rpc, Myc, rt, aw)","contenido":"Cuando el alma es no compacta ya no se usan directamente Mp ni rts. Las propiedades se refieren a la fibra extrema comprimida: el eje xc pasa por el borde comprimido y el eje xt por el borde traccionado. Con ellos se obtienen Sxc = Ix/yc y Sxt = Ix/yt, que son distintos en secciones monosimétricas, con alas diferentes (el profesor las llama híbridas). En ese caso, para la compacidad del alma se usa el caso 16 de la Tabla B4.1b en lugar del 15, porque el eje neutro se desplaza hacia el ala mayor. Se define aw = hc·tw/(bfc·tfc), la relación entre el área del alma comprimida y el área del ala comprimida, y con ella el radio de giro efectivo rt. La fluencia del ala comprimida se evalúa con Myc = Fy·Sxc multiplicado por el factor de plastificación del alma Rpc. Si h/tw ≤ λpw, Rpc = Mp/Myc. Si no, se interpola linealmente y nunca se supera Mp/Myc. Se exige además Iyc/Iy > 0.23. Para el LTB se usan Lp = 1.1·rt·√(E/Fy) y una nueva expresión de Lr en función de FL, J, Sxc y ho. En el ejemplo A572 Gr. 50, con Lb = 340 in (arriostre a mitad de los 680 in), aw ≈ 2.94, rt ≈ 3.82 in y Lp = 1.1 × 3.82 × 24.08 ≈ 101 in. La clase terminó mientras se calculaba Lr.","formulas":[{"nombre":"Relación de áreas","expresion":"aw = hc·tw/(bfc·tfc)","variables":"hc: doble de la distancia del centroide a la cara interior del ala comprimida; bfc, tfc: ancho y espesor del ala comprimida"},{"nombre":"Radio de giro efectivo (F4-11)","expresion":"rt = bfc / √[12·(1 + aw/6)]","variables":"bfc: ancho del ala comprimida"},{"nombre":"Fluencia del ala comprimida (F4-1)","expresion":"Mn = Rpc·Myc = Rpc·Fy·Sxc","variables":"Sxc: módulo elástico referido al ala comprimida"},{"nombre":"Factor de plastificación del alma (F4-9b)","expresion":"Rpc = [Mp/Myc − (Mp/Myc − 1)·(λ − λpw)/(λrw − λpw)] ≤ Mp/Myc  (si λ > λpw);  Rpc = Mp/Myc si λ ≤ λpw","variables":"λ = hc/tw; Mp = Fy·Zx ≤ 1.6·Fy·Sx"},{"nombre":"Longitudes límite F4","expresion":"Lp = 1.1·rt·√(E/Fy);  Lr = 1.95·rt·(E/FL)·√{ J/(Sxc·ho) + √[ (J/(Sxc·ho))² + 6.76·(FL/E)² ] }","variables":"J: constante torsional; ho: distancia entre centroides de alas; FL = 0.7Fy (si Sxt/Sxc ≥ 0.7)"}],"referencias_norma":["AISC 360-16 F4 (ecuaciones F4-1, F4-7, F4-8, F4-9, F4-11)","AISC 360-16 Tabla B4.1b caso 16 (almas de secciones I monosimétricas)","AISC 360-16 F4.2 (Iyc/Iy ≤ 0.23 → J = 0)"]}],"ejemplos":[{"titulo":"Viga con volado: FLB en zona de momento negativo","enunciado":"Viga soldada A36 con luz entre apoyos de 180 in y volado de 60 in, arriostrada cada 60 in (Lb = 60 in). Sección: alas de 6 × 3/16 in, alma con h = 9.13 in y tw = 3/16 in (d ≈ 9.5 in). Verificar flexión y deflexión.","pasos":["Cb por tramo: tramo central 1.3, volado 1.0, tramo con cambio de signo 1.96 (allí está el momento negativo máximo).","Compacidad: λf = 6/(2 × 0.1875) = 16, con λpf = 10.79 y λrf = 0.95√(kc·E/FL) = 24.4 (kc = 4/√48.7 = 0.57) → ala no compacta.","Alma: h/tw ≈ 48.7 < λpw ≈ 106 → alma compacta → caso F3 (revisar LTB y FLB).","Deflexión: Δmáx = 0.54 in ≤ Δlím = 0.60 in → cumple.","LTB: Lb = 60 in < Lp = 65.2 in (Lr ≈ 185 in) → no aplica; Mn = Mp.","FLB: Mn = Mp − (Mp − 0.7FySx)(16 − 10.79)/(24.4 − 10.79) ≈ 442 kip·in.","φMn = 0.9 × 442 ≈ 398 kip·in ≥ Mu(negativo) ≈ 304 kip·in → cumple."],"resultado":"Gobierna el FLB: φMn ≈ 398 kip·in > Mu ≈ 304 kip·in. El perfil funciona."},{"titulo":"Viga simplemente apoyada arriostrada a los tercios con ala no compacta","enunciado":"Viga soldada A36, L = 180 in, arriostres a los tercios (Lb = 60 in), Mu = 275.4 kip·in, Vu ≈ 6.1 kip. Sección: alas de 6 × 3/16 in; alma con h = 15 in y tw = 3/16 in. Verificar corte, deflexión y flexión.","pasos":["Corte: sin atiesadores, kv = 5.34 → 1.10√(5.34 × 29000/36) = 72.15 < h/tw = 80 → Cv1 = 72.15/80 = 0.90.","Vn = 0.6 × 36 × (15 × 0.1875) × 0.90 ≈ 54 kip; φVn = 0.9 × 54 ≈ 49 kip ≥ 6 kip → cumple.","Deflexión: Δ = 5wL⁴/(384EI) ≈ 0.23 in ≤ L/300 = 0.60 in → cumple.","LTB: Lb = 60 in > Lp ≈ 57 in; la ecuación da Mn ≈ 1025 kip·in > Mp → Mn = Mp.","FLB: kc = 4/√80 = 0.447 → λrf = 21.55; 10.79 < 16 < 21.55 → ala no compacta → Mn ≈ 802 kip·in.","Mn = mín(Mp, Mp, 802) = 802 kip·in; φMn = 0.9 × 802 ≈ 722 kip·in ≥ 275.4 kip·in → cumple.","Variantes: con bf = 10.8 in (aún no compacta) Mn baja; con bf = 12 in el ala pasa a esbelta y Mn = 0.9EkcSx/λ² ≈ 452 kip·in."],"resultado":"Gobierna el FLB, con φMn ≈ 722 kip·in. Cumple por corte (49 kip), por deflexión (0.23 in) y por flexión."},{"titulo":"Viga de techo con máquinas reciprocantes (planteamiento F4)","enunciado":"Viga continua del eje B de un techo, acero A572 Gr. 50, luz de 680 in (17 m) con arriostre a mitad (Lb = 340 in). Máquinas reciprocantes de 5 t (impacto 50%) apoyadas entre ejes; carga viva de mantenimiento de 100 kg/m²; plancha de apoyo de 1/2 in. Predimensionar y clasificar la sección.","pasos":["Carga de máquina con impacto: 1.5 × 5 t = 7.5 t ≈ 16.5 kip; el eje B recibe la mitad, 8.25 kip.","Peralte: L = 17 m → d ≈ L/14 ≈ 1.2 m ≈ 48 in; bf ≈ 16 in; tf = tw = 1/2 in; h ≈ 47 in.","Ala: λf = 16/(2 × 0.5) = 16 → no compacta para Gr. 50.","Alma: h/tw = 94; λpw = 3.76 × 24.08 ≈ 90.5 < 94 < λrw = 5.70 × 24.08 ≈ 137 → alma no compacta → caso F4.","kc = 4/√94 ≈ 0.41 (dentro de 0.35–0.76); ho ≈ 47.5 in; J ≈ Σ b·t³/3.","Iyc/Iy > 0.23 → se calculan Sxc, Myc y Rpc (Rpc queda limitado a Mp/Myc).","aw ≈ 2.94; rt ≈ 3.82 in; Lp = 1.1 × 3.82 × 24.08 ≈ 101 in < Lb = 340 in. Lr quedó pendiente."],"resultado":"La sección es no compacta en ala y alma (caso F4). Lp ≈ 101 in. El cálculo de Lr y Mn por LTB quedó para la clase siguiente."}],"conceptos_clave":[{"termino":"Pandeo local del ala comprimida (FLB)","definicion":"Ondulación local del ala comprimida cuando su relación bf/2tf supera el límite compacto. Reduce Mn por debajo de Mp."},{"termino":"kc","definicion":"Coeficiente de pandeo de placa del ala en secciones armadas, igual a 4/√(h/tw) y acotado entre 0.35 y 0.76. Recoge la interacción ala-alma."},{"termino":"FL","definicion":"Esfuerzo nominal de flexión en el ala comprimida al que empieza el pandeo inelástico. Vale 0.7Fy en secciones doblemente simétricas."},{"termino":"Sxc / Sxt","definicion":"Módulos elásticos de la sección referidos a la fibra extrema comprimida y a la traccionada. Son distintos en secciones monosimétricas."},{"termino":"Myc","definicion":"Momento de fluencia del ala comprimida, Fy·Sxc."},{"termino":"Rpc","definicion":"Factor de plastificación del alma (F4). Escala Myc hasta, como máximo, Mp."},{"termino":"aw","definicion":"Relación entre el área del alma comprimida (hc·tw) y el área del ala comprimida (bfc·tfc)."},{"termino":"rt","definicion":"Radio de giro efectivo para LTB en F4 y F5, calculado con el ala comprimida y un sexto del alma comprimida."},{"termino":"Impacto en máquinas reciprocantes","definicion":"Incremento del 50% de la carga viva de la máquina para considerar su efecto dinámico sobre la estructura."}],"preguntas":[{"pregunta":"¿En qué caso del Capítulo F se debe revisar el pandeo local del ala comprimida además del LTB, con alma compacta?","opciones":["F2: ala y alma compactas","F3: alma compacta y ala no compacta o esbelta","F7: secciones HSS","F11: barras rectangulares"],"correcta":1,"explicacion":"La sección F3 corresponde a perfiles I con alma compacta y alas no compactas o esbeltas. Sus estados límite son LTB y FLB."},{"pregunta":"¿Cuál es el rango admisible de kc en secciones armadas?","opciones":["0.35 ≤ kc ≤ 0.76","0.5 ≤ kc ≤ 1.0","1.0 ≤ kc ≤ 4.0","kc ≥ 0.76"],"correcta":0,"explicacion":"La nota de la Tabla B4.1b define kc = 4/√(h/tw) con 0.35 ≤ kc ≤ 0.76."},{"pregunta":"Para un ala esbelta en un perfil soldado (F3), Mn por FLB es:","opciones":["Mp","0.7·Fy·Sx","0.9·E·kc·Sx/λ²","Fy·Zx·Cb"],"correcta":2,"explicacion":"La ecuación F3-2 da la resistencia elástica 0.9·E·kc·Sx/λ²."},{"pregunta":"¿Por qué el FLB puede gobernar en una viga con volado?","opciones":["Porque el volado elimina el corte","Porque el momento negativo sobre el apoyo puede ser el mayor y comprime el ala inferior","Porque en los volados Cb siempre es mayor que 2","Porque la deflexión del volado es cero"],"correcta":1,"explicacion":"El momento negativo invierte la compresión al ala inferior y puede superar al momento positivo."},{"pregunta":"¿Qué Cb debe usarse al verificar un tramo no arriostrado?","opciones":["El mayor Cb de toda la viga","Siempre Cb = 1","El Cb del tramo donde se ubica el momento máximo que se verifica","El promedio de todos los Cb"],"correcta":2,"explicacion":"Cada tramo se verifica con su propio Cb. Usar el mayor Cb de la viga no es correcto."},{"pregunta":"En los volados sin arriostre en el extremo libre, el profesor toma Cb igual a:","opciones":["1.67","1.0","1.3","2.27"],"correcta":1,"explicacion":"En voladizos se toma conservadoramente Cb = 1.0."},{"pregunta":"Una máquina reciprocante de 5 t con 50% de impacto se diseña con:","opciones":["5 t","6 t","7.5 t","10 t"],"correcta":2,"explicacion":"PL = (1 + 0.5) × 5 = 7.5 t."},{"pregunta":"Para A572 Gr. 50, ¿cuánto vale √(E/Fy)?","opciones":["28.38","24.08","20.0","32.5"],"correcta":1,"explicacion":"√(29000/50) = 24.08."},{"pregunta":"Una viga I soldada con h/tw = 94 y Fy = 50 ksi tiene un alma:","opciones":["Compacta, porque 94 < 106.7","Esbelta, porque 94 > 90.5","No compacta, porque 90.5 < 94 < 137","No se puede clasificar"],"correcta":2,"explicacion":"λpw = 3.76 × 24.08 = 90.5 y λrw = 5.70 × 24.08 = 137.3, así que el alma es no compacta y aplica F4."},{"pregunta":"En F4, la fluencia del ala comprimida se calcula como:","opciones":["Mn = Fy·Zx","Mn = Rpc·Fy·Sxc","Mn = Rpg·Fy·Sxc","Mn = Fy·Sxt"],"correcta":1,"explicacion":"La ecuación F4-1 es Mn = Rpc·Myc = Rpc·Fy·Sxc."},{"pregunta":"¿Cuál es la expresión de Lp en la sección F4?","opciones":["1.76·ry·√(E/Fy)","1.1·rt·√(E/Fy)","π·rt·√(E/0.7Fy)","1.95·rts·E/0.7Fy"],"correcta":1,"explicacion":"En F4 (y F5), Lp = 1.1·rt·√(E/Fy)."},{"pregunta":"Si al ensanchar el ala de una viga soldada esta pasa de no compacta a esbelta, ¿qué ocurre con Mn por FLB?","opciones":["Aumenta siempre","No cambia","Disminuye, y se pasa a la fórmula elástica 0.9EkcSx/λ²","Se iguala a Mp"],"correcta":2,"explicacion":"El ejemplo de clase mostró que la resistencia cae (≈ 452) al volverse esbelta el ala."}],"ejercicios_propuestos":["Calcule Mn por FLB de una viga soldada A36 con alas de 10 × 1/4 in y alma de 16 × 3/16 in. Determine kc, λrf y la clasificación del ala.","En una viga de 240 in con volado de 80 in y arriostres cada 80 in, con carga uniforme wu = 0.1 kip/in, calcule el Cb de cada tramo no arriostrado e identifique el tramo crítico.","Rehaga el ejemplo de la viga simplemente apoyada (L = 180 in, Lb = 60 in) con bf = 12 in y tf = 3/16 in, y verifique que el ala resulta esbelta. Calcule φMn.","Para la viga de techo A572 Gr. 50 (d = 48 in, bf = 16 in, tf = tw = 1/2 in), calcule Sxc, Myc, Mp, Rpc, rt, Lp y Lr según F4.","Una máquina reciprocante de 3 t se apoya al centro de una viga simplemente apoyada de 6 m. Calcule la carga de diseño con impacto y el momento último con 1.2D + 1.6L, suponiendo D = 0.3 t/m."],"avisos":["Se usan hojas Excel por problema. El profesor advierte que cada hoja sirve solo para su problema y que hay que armar una nueva para cada caso. Comparte la hoja al final de la clase.","Se mostró un video de ensayo de laboratorio de una viga W8 con pandeo local del ala.","Hubo 11 ausentes ese lunes, día siguiente al Día de la Madre. La próxima clase es el miércoles.","El profesor recuerda considerar los requisitos sísmicos (pórticos ordinarios, intermedios y especiales) en la clasificación de las secciones."],"notas_transcripcion":["'CV' en contexto de flexión se interpretó como Cb. 'LV' como Lb. 'el F' se refiere a distintas secciones del Capítulo F (F2, F3, F4), cuyo número no se capta en el audio.","'MYC' = Myc; 'SXC' = Sxc; 'AB' = aw; 'RT' = rt; 'RPC' = Rpc; 'eje 90°' se interpretó como eje xc (fibra extrema comprimida) y 'XT' como xt.","En el ejemplo de la viga con volado aparecen dos valores de Mp (517 y 459.74) y Lr '1.85 con 12'; se interpretó Lr ≈ 185 in. El profesor dice '398 es menor que 304' cuando quiso decir mayor.","En el ejemplo F4, el audio indica Rpc calculado = 0.57 frente a una 'relación' de 0.43. Esos valores parecen invertidos (Mp/Myc debe ser > 1). Se registró solo la conclusión cualitativa: Rpc queda limitado a Mp/Myc y Mn tiende a Mp.","'16.5' se interpretó como la conversión de 7.5 t a kip (7.5 × 2.2), no como una amplificación por 1.6.","El profesor menciona 'lambda P era 80' para el alma A572 Gr. 50. Por fórmula, λpw = 3.76 × 24.08 = 90.5. Se usó el valor normativo.","Las secciones con alas diferentes se llaman en clase 'vigas híbridas'. En AISC, 'híbrida' significa aceros distintos en alas y alma; para alas diferentes el término correcto es 'monosimétrica'."],"corto":"Pandeo del ala (F3/F4)","video":"https://www.youtube.com/watch?v=ijEAxB2ikWA","duracion_min":106,"estado":"ok"},"14":{"corto":"Fragmento de 44 s","video":"https://www.youtube.com/watch?v=MsRro5VMtgQ","duracion_min":1,"titulo":"Fragmento: inicio de la clase del 12 de mayo (vigas con alas esbeltas)","fecha":"miércoles 12 de mayo de 2021","estado_txt":"Video incompleto","estado_det":"El video solo contiene los primeros 44 segundos de la clase, en los que el profesor anuncia que continuará con vigas de alas esbeltas. Ese contenido se cubre en las clases 13 y 15.","estado":"pendiente","temas":[]},"15":{"titulo":"Vigas monosimétricas (F4) y vigas con alma esbelta (F5); secciones cajón, tubos y campo de tensión","fecha":"lunes 17 de mayo de 2021 (inferida: se menciona la clase del 'miércoles 12 de la semana pasada')","resumen":"El profesor repasa la tabla resumen del Capítulo F. Explica que el tipo de alma es la clave para clasificar: con alma compacta la sección cae en F2 o F3, con alma no compacta en F4, y con alma esbelta en F5, el único caso de alma esbelta. Menciona también los casos de flexión en el eje débil, HSS cuadrados y rectangulares, tubos circulares, ángulos simples y barras. Explica gráficamente cómo Cb > 1 eleva la curva Mn–Lb, con el tope en Mp. Resuelve una sección monosimétrica con alas distintas (15 × 3/8 y 14 × 3/8 in) y alma de 18 × 3/8 in con las ecuaciones de F4. Calcula centroide, hc, Sxc, Sxt, Rpc, rt, Lp y Lr, y revisa los cuatro estados límite: fluencia del ala comprimida, LTB, FLB y fluencia del ala en tracción. Con Lb = 550 in gobierna el LTB elástico. Luego desarrolla F5: el factor de reducción Rpg, el esfuerzo crítico en tres zonas con Lp = 1.1rt√(E/Fy) y Lr = πrt√(E/0.7Fy), el FLB y la fluencia del ala en tracción. Lo aplica en Excel a una viga de alma 45 × 1/4 in (h/tw = 180) con alas iguales y luego distintas. Resume F7 (cajón/HSS) y F8 (tubos). Hace preguntas orales a los alumnos sobre Sx frente a Zx, el significado de Lr y el uso de rts o rt. Cierra con el campo de tensión en almas muy peraltadas, con la anécdota del viaducto de la Línea 1 del Metro de Lima.","objetivos":["Al terminar, el estudiante podrá clasificar una viga en F2, F3, F4 o F5 a partir de la esbeltez de su alma y de sus alas.","Al terminar, el estudiante podrá calcular las propiedades de una sección I monosimétrica (centroide, hc, hp, Sxc, Sxt, Iyc) y aplicar los estados límite de F4.","Al terminar, el estudiante podrá calcular Rpg y el esfuerzo crítico Fcr para LTB y FLB de vigas con alma esbelta según F5.","Al terminar, el estudiante podrá explicar el efecto de Cb > 1 sobre la curva Mn–Lb y el significado de Lp y Lr.","Al terminar, el estudiante podrá reconocer las particularidades de F7 (secciones cajón/HSS) y F8 (tubos), y la condición a/h ≤ 3 del campo de tensión."],"temas":[{"titulo":"Repaso de la tabla del Capítulo F: el alma define el caso","contenido":"Para diseñar una viga se propone una sección y se revisa su relación ancho/espesor con la Tabla B4.1b. Si la viga pertenece a un pórtico especial o moderado, hay que cumplir además los límites sísmicos. Los estados límite posibles en flexión son la fluencia, el pandeo lateral-torsional, el pandeo local del ala comprimida y la fluencia del ala en tracción. Además se verifican corte y deflexión. El corte lo toma el alma y rara vez controla, salvo con cargas puntuales. El profesor da una regla práctica: mirar siempre el alma primero. Con alma compacta la sección es F2 (alas compactas) o F3 (alas no compactas o esbeltas). Con alma no compacta, F4, que también cubre las secciones monosimétricas. Con alma esbelta, F5, el único caso de alma esbelta de toda la tabla. Completan la tabla F6 (perfiles I y canales en el eje débil, sin restricción de alma), F7 (HSS cuadrados y rectangulares, y secciones cajón), F8 (tubos circulares), F10 (ángulos simples, que prácticamente no tienen alma) y F11 (barras cuadradas y redondas, donde solo se revisan fluencia y LTB). Para cualquier perfil no listado se revisan todos los estados límite aplicables (F13). Recuerda también que con losas o placas colaborantes conectadas al ala comprimida, Lb = 0 y el LTB no se revisa.","formulas":[],"referencias_norma":["AISC 360-16 Tabla User Note F1.1","AISC 360-16 Tabla B4.1b","AISC 360-16 F6, F7, F8, F10, F11"]},{"titulo":"Curva Mn–Lb y efecto de Cb > 1","contenido":"La curva base, con Cb = 1, tiene una meseta en Mp hasta Lp (zona 1). Entre Lp y Lr cae linealmente hasta Mr = 0.7·Fy·Sx (zona 2, pandeo inelástico). Después de Lr sigue una curva elástica (zona 3). Con Cb > 1, las ordenadas de las zonas 2 y 3 se multiplican por Cb, lo que da una curva ficticia por encima. Como ningún momento puede superar Mp, la meseta de Mp se prolonga hasta cortar esa curva amplificada, y desde ese punto manda la curva con Cb. En consecuencia, para un mismo Lb > Lp, la resistencia es mayor. Al final de la clase el profesor pregunta a los alumnos cuál es la longitud limitante para tener pandeo inelástico con Lb = 200 in. La respuesta es Lr: es la frontera entre el comportamiento inelástico y el elástico, y para que Lb = 200 in fuera el límite, Lr tendría que valer 200 in. También aclara que Sx es el módulo de sección elástico y Zx el plástico.","formulas":[{"nombre":"Momento límite inelástico","expresion":"Mr = 0.7·Fy·Sx","variables":"Sx: módulo de s
