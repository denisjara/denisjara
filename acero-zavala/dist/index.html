ección elástico"},{"nombre":"Zona 2 con Cb","expresion":"Mn = Cb·[Mp − (Mp − 0.7FySx)·(Lb − Lp)/(Lr − Lp)] ≤ Mp","variables":"Cb ≥ 1: factor de gradiente de momento"}],"referencias_norma":["AISC 360-16 F2.2","AISC 360-16 Comentario F1 (figura de Mn vs Lb con Cb > 1)"]},{"titulo":"Propiedades de secciones I monosimétricas (alas diferentes)","contenido":"En una sección con alas distintas, que en clase se llama sección híbrida, el centroide elástico y el eje neutro plástico no coinciden. Ambos se desplazan hacia el ala mayor. Primero se calculan las áreas y la posición del centroide, y a partir de ahí: hc, el doble de la distancia del centroide a la cara interior del ala comprimida; hp, el doble de la distancia del eje neutro plástico a esa misma cara; Ix, Sxc = Ix/yc y Sxt = Ix/yt. En el eje débil se calcula Iyc (inercia del ala comprimida) y la relación Iyc/Iy, que debe ser mayor que 0.23 para aplicar F4 con J calculado. La compacidad del alma de estas secciones se evalúa con el caso 16 de la Tabla B4.1b, con hc y hp. El profesor hace los cálculos en Excel con el teorema de Steiner. Remarca que la hoja de clase está sujeta a revisión y que los alumnos deben incorporar estas fórmulas en las suyas.","formulas":[{"nombre":"Distancia hc","expresion":"hc = 2·(yc − tfc)","variables":"yc: distancia del centroide a la fibra extrema comprimida; tfc: espesor del ala comprimida"},{"nombre":"Ubicación del ENP (alma en el rango)","expresion":"hp/2 = (A − 2·Afc)/(2·tw) medido desde la cara interior del ala comprimida (si el ENP cae en el alma)","variables":"A: área total; Afc: área del ala comprimida; tw: espesor del alma"},{"nombre":"Límite compacto del alma monosimétrica (caso 16)","expresion":"λpw = (hc/hp)·√(E/Fy) / (0.54·Mp/My − 0.09)² ≤ λrw = 5.70·√(E/Fy)","variables":"My: momento de primera fluencia"},{"nombre":"Módulos elásticos","expresion":"Sxc = Ix/yc;  Sxt = Ix/yt","variables":"yc, yt: distancias del centroide a las fibras extremas comprimida y traccionada"}],"referencias_norma":["AISC 360-16 Tabla B4.1b caso 16","AISC 360-16 F4"]},{"titulo":"Estados límite de F4 aplicados a la sección monosimétrica","contenido":"Ejemplo: ala superior comprimida de 15 × 3/8 in, ala inferior de 14 × 3/8 in y alma de 18 × 3/8 in, todo en A36 y cortado de la misma plancha de 3/8. El alma resulta compacta (48 < λpw ≈ 105.8). Las alas son no compactas (λfc ≈ 20 y λft ≈ 18.7, frente a λpf = 10.79 y λrf ≈ 24). Iyc/Iy = 0.639 > 0.23, de modo que Rpc = Mp/Myc ≈ 1.07, Myc = Fy·Sxc ≈ 4521 kip·in y la fluencia del ala comprimida da Mn = Rpc·Myc ≈ 4851 kip·in. Para el LTB: rt = bfc/√(12(1 + aw/6)) ≈ 4.65 in, FL = 0.7Fy = 25.2 ksi, J ≈ Σbt³/3, Lp ≈ 145.1 in y Lr ≈ 537.5 in. Con Lb = 550 in > Lr se usa Fcr elástico con Cb = 1: Fcr ≈ 24.19 ksi y Mn = Fcr·Sxc ≈ 3037 kip·in. El FLB, con Rpc·Myc, FL·Sxc y las esbelteces del ala, da Mn ≈ 3553 kip·in. Como Sxt/Sxc = 0.92 < 1, aplica la fluencia del ala en tracción, con Mn = Rpt·Myt ≈ 4166 kip·in. Gobierna el LTB, con Mn ≈ 3037 kip·in. El profesor adelanta que en F5 ya no se usan Rpc ni Rpt sino Rpg.","formulas":[{"nombre":"Fluencia del ala comprimida","expresion":"Mn = Rpc·Myc = Rpc·Fy·Sxc","variables":"Rpc: factor de plastificación del alma"},{"nombre":"LTB elástico F4 (Lb > Lr)","expresion":"Fcr = Cb·π²·E/(Lb/rt)² · √[1 + 0.078·(J/(Sxc·ho))·(Lb/rt)²];  Mn = Fcr·Sxc ≤ Rpc·Myc","variables":"rt: radio de giro efectivo; ho: distancia entre centroides de alas"},{"nombre":"FLB F4 ala no compacta","expresion":"Mn = Rpc·Myc − (Rpc·Myc − FL·Sxc)·(λ − λpf)/(λrf − λpf)","variables":"λ = bfc/(2tfc)"},{"nombre":"Fluencia del ala en tracción","expresion":"Mn = Rpt·Myt = Rpt·Fy·Sxt  (aplica solo si Sxt < Sxc)","variables":"Rpt: factor de plastificación para el ala traccionada"}],"referencias_norma":["AISC 360-16 F4.1 a F4.4 (ecuaciones F4-1 a F4-15)"]},{"titulo":"Sección F5: vigas I con alma esbelta (Rpg y Fcr)","contenido":"Cuando h/tw > 5.70√(E/Fy), el alma es esbelta y se aplica F5, con un factor de reducción por flexión del alma esbelta, Rpg ≤ 1, que depende de aw y de hc/tw. Fluencia del ala comprimida: Mn = Rpg·Fy·Sxc. Pandeo lateral-torsional: Mn = Rpg·Fcr·Sxc, con tres zonas. En la zona 1 (Lb ≤ Lp), Fcr = Fy, lo que ya es fluencia, así que el LTB no aplica. En la zona 2, Fcr = Cb[Fy − 0.3Fy(Lb − Lp)/(Lr − Lp)] ≤ Fy. En la zona 3, Fcr = Cb·π²·E/(Lb/rt)² ≤ Fy. El profesor corrige en su diapositiva el cuadrado que faltaba en Lb/rt. Las longitudes límite se simplifican a Lp = 1.1rt√(E/Fy) y Lr = π·rt·√(E/0.7Fy). Pandeo local del ala comprimida: Mn = Rpg·Fcr·Sxc. No aplica si el ala es compacta. Con ala no compacta, Fcr = Fy − 0.3Fy(λ − λpf)/(λrf − λpf). Con ala esbelta, Fcr = 0.9·E·kc/λ², con kc = 4/√(h/tw). Fluencia del ala en tracción: no aplica si Sxt ≥ Sxc, por ejemplo con alas iguales. Si Sxt < Sxc, Mn = Fy·Sxt.","formulas":[{"nombre":"Factor Rpg (F5-6)","expresion":"Rpg = 1 − [aw/(1200 + 300·aw)]·(hc/tw − 5.7·√(E/Fy)) ≤ 1.0","variables":"aw = hc·tw/(bfc·tfc) ≤ 10"},{"nombre":"Fluencia del ala comprimida (F5-1)","expresion":"Mn = Rpg·Fy·Sxc","variables":"Sxc: módulo elástico referido al ala comprimida"},{"nombre":"LTB F5 (F5-2 a F5-4)","expresion":"Mn = Rpg·Fcr·Sxc;  Fcr = Cb·[Fy − 0.3·Fy·(Lb − Lp)/(Lr − Lp)] ≤ Fy (Lp < Lb ≤ Lr);  Fcr = Cb·π²·E/(Lb/rt)² ≤ Fy (Lb > Lr)","variables":"rt: radio de giro efectivo"},{"nombre":"Longitudes límite F5","expresion":"Lp = 1.1·rt·√(E/Fy);  Lr = π·rt·√(E/(0.7·Fy))","variables":"E = 29000 ksi"},{"nombre":"FLB F5","expresion":"Fcr = Fy − 0.3·Fy·(λ − λpf)/(λrf − λpf) (ala no compacta);  Fcr = 0.9·E·kc/λ² (ala esbelta)","variables":"λ = bfc/(2tfc); kc = 4/√(h/tw)"},{"nombre":"Fluencia del ala en tracción (F5-10)","expresion":"Mn = Fy·Sxt (solo si Sxt < Sxc)","variables":"Sxt: módulo elástico referido al ala traccionada"}],"referencias_norma":["AISC 360-16 F5 (ecuaciones F5-1 a F5-10)"]},{"titulo":"Ejemplo F5 en Excel: alma esbelta con alas iguales y distintas","contenido":"Se propone una sección con alma de 45 in × 1/4 in (d = 45.5 in, h/tw = 180 > 5.70√(E/Fy) = 161.8, alma esbelta) y alas de 8 × 1/4 in (λf = 16, con λpf = 10.79 y λrf ≈ 19.1, ala no compacta). Luego se cambia el ala inferior a 6 × 1/4 in para obtener una sección monosimétrica. En la hoja, el profesor ordena el cálculo en bloques. Primero, áreas, brazos al eje xt, centroide (≈ 23.52 in desde la fibra inferior), módulo plástico Z y Mp. Segundo, inercias propias más Steiner para Ix e Iy. Tercero, yc, hc, Sxc, Sxt y My = Fy·Sx (primera fluencia), y aclara que no debe confundirse con Myc. Rpc y Rpt no se usan en F5. Con aw = hc·tw/(bfc·tfc) obtiene Rpg ≈ 0.977. Fluencia del ala comprimida: Mn = Rpg·Fy·Sxc, menor que Mp, así que se acepta. LTB con Lb = 200 in: rt ≈ 2.21 in, Lp ≈ 69 in y Lr ≈ 235 in. Como cae en la zona 2, Fcr ≈ 27.5 ksi y Mn = Rpg·Fcr·Sxc. El FLB, con ala no compacta, da Fcr ≈ 29.2 ksi y una resistencia algo mayor. Como Sxt/Sxc ≈ 0.93, aplica la fluencia del ala en tracción, Mn = Fy·Sxt. En ambas versiones, alas iguales y distintas, gobierna el pandeo lateral-torsional. La demanda debe ser menor que φ veces ese valor.","formulas":[{"nombre":"Momento de primera fluencia","expresion":"My = Fy·Sx","variables":"Distinto de Myc = Fy·Sxc"}],"referencias_norma":["AISC 360-16 F5"]},{"titulo":"Secciones cajón/HSS (F7) y tubos circulares (F8)","contenido":"En secciones cajón o HSS rectangulares, que pueden ser de plancha doblada o soldada y estar 'paradas' o 'echadas', la fluencia es Mn = Mp = Fy·Z respecto al eje de flexión. La relación clave es b/t del ala comprimida. Con el cajón echado, el ala comprimida es la cara mayor; con el cajón parado, la menor. Con alas no compactas, Mn se interpola entre Mp y Fy·S. Con alas esbeltas, se usa un módulo de sección efectivo Se, calculado con el ancho efectivo be del ala comprimida, y el coeficiente es distinto para HSS y para cajones armados. Para el pandeo local del alma: no aplica si es compacta, hay una fórmula de interpolación si es no compacta, y si es esbelta se usan Rpg y un Fcr con kc = 4. El LTB, que solo es relevante en secciones muy alargadas, usa J, el área bruta y ry, con expresiones de Lp y Lr distintas de las de los perfiles I. En tubos circulares (F8) se usa el módulo plástico Z para la fluencia y la relación D/t, con el diámetro exterior, para el pandeo local de paredes delgadas.","formulas":[{"nombre":"Fluencia HSS/cajón (F7-1)","expresion":"Mn = Mp = Fy·Z","variables":"Z: módulo plástico respecto al eje de flexión"},{"nombre":"FLB HSS ala no compacta (F7-2)","expresion":"Mn = Mp − (Mp − Fy·S)·(3.57·(b/t)·√(Fy/E) − 4.0) ≤ Mp","variables":"b/t: relación ancho/espesor del ala comprimida"},{"nombre":"Ala esbelta (F7-3)","expresion":"Mn = Fy·Se;  be = 1.92·t·√(E/Fy)·[1 − (0.38/(b/t))·√(E/Fy)] ≤ b  (HSS)","variables":"Se: módulo de sección efectivo con ancho efectivo be"},{"nombre":"LTB HSS (F7-10 a F7-13)","expresion":"Lp = 0.13·E·ry·√(J·Ag)/Mp;  Lr = 2·E·ry·√(J·Ag)/(0.7·Fy·Sx)","variables":"J: constante torsional; Ag: área bruta"}],"referencias_norma":["AISC 360-16 F7 (HSS cuadrados y rectangulares, secciones cajón)","AISC 360-16 F8 (HSS circulares)"]},{"titulo":"Campo de tensión en almas muy peraltadas (G2.2) y anécdota del viaducto de la Línea 1","contenido":"El profesor retoma lo que quedó pendiente en corte. Hasta ahora se usó solo la resistencia sin acción de campo de tensión (Cv1). En almas muy peraltadas y esbeltas, el alma inevitablemente se pandea bajo carga, pero puede seguir resistiendo mediante un flujo diagonal de tensiones anclado en los atiesadores y las alas: es la acción de campo de tensión, con Cv2. La norma la permite en paneles interiores con a/h ≤ 3, es decir, con atiesadores separados no más de tres veces el peralte del alma. Como ejemplo cita el viaducto de la Línea 1 del Metro de Lima (segunda etapa, hacia San Juan de Lurigancho, pasando Puente Nuevo). Su sección armada, de peralte variable, parece un tubo rectangular, pero son perfiles de borde con planchas como almas de unos 2 m de alto, más que una persona. Esas almas trabajan con un leve ondulado por pandeo que de lejos no se percibe, y su resistencia se basa en el campo de tensión.","formulas":[{"nombre":"Corte con campo de tensión (G2-7/G2-8)","expresion":"Vn = 0.6·Fy·Aw·[Cv2 + (1 − Cv2)/(1.15·√(1 + (a/h)²))]  (si h/tw > 1.10√(kvE/Fy)), válido para a/h ≤ 3","variables":"Cv2: coeficiente de pandeo por corte del alma; a: separación entre atiesadores"}],"referencias_norma":["AISC 360-16 G2.2 (acción de campo de tensión)","AISC 360-16 G2.3 (atiesadores transversales)"]}],"ejemplos":[{"titulo":"Sección monosimétrica con alas no compactas (F4)","enunciado":"Sección soldada A36 (Fy = 36 ksi, E = 29000 ksi): ala comprimida (superior) de 15 × 3/8 in, ala traccionada de 14 × 3/8 in, alma de 18 × 3/8 in. Lb = 550 in y Cb = 1. Determinar Mn.","pasos":["Compacidad del alma: h/tw = 18/0.375 = 48 < λpw ≈ 105.8 → compacta.","Alas: λfc ≈ 15/0.75 = 20, λft = 14/0.75 = 18.7; λpf = 10.79, λrf ≈ 24 → no compactas. Al ser monosimétrica, se aplica F4.","Propiedades: Sxc ≈ 125.6 in³; Iyc/Iy = 0.639 > 0.23; Myc = 36 × Sxc ≈ 4521 kip·in; Rpc = Mp/Myc ≈ 1.07.","Fluencia del ala comprimida: Mn = Rpc·Myc ≈ 4851 kip·in.","LTB: rt ≈ 4.65 in; FL = 25.2 ksi; Lp ≈ 145.1 in; Lr ≈ 537.5 in. Lb = 550 > Lr → Fcr elástico ≈ 24.19 ksi → Mn = Fcr·Sxc ≈ 3037 kip·in.","FLB (ala no compacta): Mn ≈ 3553 kip·in.","Fluencia del ala en tracción: Sxt/Sxc = 0.92 < 1 → aplica → Mn ≈ 4166 kip·in.","Mn = mín(4851, 3037, 3553, 4166) = 3037 kip·in (LTB)."],"resultado":"Mn ≈ 3037 kip·in, gobernado por el pandeo lateral-torsional elástico. φMn ≈ 2733 kip·in."},{"titulo":"Viga con alma esbelta (F5)","enunciado":"Sección soldada A36 con alma de 45 × 1/4 in (d = 45.5 in) y alas de 8 × 1/4 in. Variante: ala inferior de 6 × 1/4 in. Lb = 200 in y Cb = 1. Evaluar los estados límite de F5.","pasos":["Alma: h/tw = 45/0.25 = 180 > 5.70√(E/Fy) = 161.8 → esbelta → F5.","Ala: λ = 8/(2 × 0.25) = 16; λpf = 10.79; kc = 4/√180 = 0.30 → se usa 0.35 → λrf = 0.95√(0.35 × 29000/25.2) ≈ 19.1 → no compacta.","Centroide de la variante con alas distintas ≈ 23.52 in desde la fibra inferior; se obtienen Ix, Sxc, Sxt, hc y aw.","Rpg = 1 − aw/(1200 + 300aw)·(hc/tw − 161.8) ≈ 0.977.","Fluencia del ala comprimida: Mn = Rpg·Fy·Sxc, menor que Mp → aceptado.","LTB: rt ≈ 2.21 in; Lp = 1.1 × 2.21 × 28.38 ≈ 69 in; Lr = π × 2.21 × √(29000/25.2) ≈ 235 in; 69 < 200 < 235 → zona 2.","Fcr = 36 − 0.3 × 36 × (200 − 69)/(235 − 69) ≈ 27.5 ksi → Mn = Rpg·Fcr·Sxc.","FLB: Fcr = 36 − 10.8 × (16 − 10.79)/(19.1 − 10.79) ≈ 29.2 ksi → Mn = Rpg·Fcr·Sxc, mayor que el de LTB.","Fluencia del ala en tracción: Sxt/Sxc ≈ 0.93 < 1 → aplica, Mn = Fy·Sxt, mayor que el de LTB."],"resultado":"Gobierna el LTB, con Fcr ≈ 27.5 ksi y Mn = 0.977 × 27.5 × Sxc. En la hoja da 45.03 frente a 58.88 (fluencia), 47.76 (FLB) y 56.35 (TFY), en las unidades de la hoja."}],"conceptos_clave":[{"termino":"Alma esbelta","definicion":"Alma con h/tw > 5.70√(E/Fy). Lleva la viga a la sección F5, la única de alma esbelta para perfiles I."},{"termino":"Rpg","definicion":"Factor de reducción de resistencia a flexión por alma esbelta (F5), siempre ≤ 1. Considera la pérdida de efectividad del alma comprimida."},{"termino":"Rpc / Rpt","definicion":"Factores de plastificación del alma para el ala comprimida y la traccionada (F4). En F5 no se usan."},{"termino":"Sección monosimétrica (llamada 'híbrida' en clase)","definicion":"Sección I con alas de distinto tamaño. Su centroide y su ENP se desplazan hacia el ala mayor y Sxc ≠ Sxt."},{"termino":"Sx frente a Zx","definicion":"Sx es el módulo de sección elástico, que determina la primera fluencia. Zx es el módulo plástico, que determina Mp."},{"termino":"Lr","definicion":"Longitud no arriostrada que separa el pandeo lateral-torsional inelástico del elástico."},{"termino":"rts frente a rt","definicion":"rts es el radio de giro efectivo de F2 y F3, en secciones doblemente simétricas. rt se usa en F4 y F5, en función del ala comprimida y de aw."},{"termino":"Acción de campo de tensión","definicion":"Resistencia poscrítica al corte de almas pandeadas mediante una banda diagonal de tracción anclada en los atiesadores. Requiere a/h ≤ 3 en paneles interiores."},{"termino":"Sección cajón (box section)","definicion":"Sección cerrada rectangular o cuadrada formada por plancha doblada o soldada. Se diseña con F7."}],"preguntas":[{"pregunta":"Una viga I soldada tiene h/tw = 180 con Fy = 36 ksi. ¿Qué sección del Capítulo F aplica?","opciones":["F2","F3","F4","F5"],"correcta":3,"explicacion":"180 > 5.70√(29000/36) = 161.8, así que el alma es esbelta y aplica F5."},{"pregunta":"¿Qué factor reduce la resistencia por alma esbelta en F5?","opciones":["Rpc","Rpt","Rpg","Rh"],"correcta":2,"explicacion":"En F5 se usa Rpg = 1 − aw/(1200 + 300aw)(hc/tw − 5.7√(E/Fy)) ≤ 1."},{"pregunta":"En F5, ¿cuánto vale Lr?","opciones":["1.1·rt·√(E/Fy)","π·rt·√(E/(0.7Fy))","1.95·rts·E/(0.7Fy)·√(...)","1.76·ry·√(E/Fy)"],"correcta":1,"explicacion":"La sección F5 simplifica Lr a π·rt·√(E/FL), con FL = 0.7Fy."},{"pregunta":"Si Lb ≤ Lp en una viga F5, el LTB:","opciones":["Gobierna siempre","No aplica, porque Fcr = Fy equivale a fluencia del ala comprimida","Se calcula con Fcr elástico","Requiere Cb = 0"],"correcta":1,"explicacion":"En la zona 1 el esfuerzo crítico es Fy, lo que corresponde al estado límite de fluencia."},{"pregunta":"¿Cuándo aplica el estado límite de fluencia del ala en tracción?","opciones":["Siempre","Solo cuando Sxt < Sxc","Solo cuando Sxt > Sxc","Solo en secciones con alas iguales"],"correcta":1,"explicacion":"Si Sxt ≥ Sxc, por ejemplo con alas iguales o con el ala traccionada mayor, el estado límite no aplica."},{"pregunta":"¿Qué efecto tiene Cb > 1 en la curva Mn–Lb?","opciones":["Reduce Mp","Multiplica las zonas inelástica y elástica, con tope en Mp","Desplaza Lp a cero","Elimina la zona elástica"],"correcta":1,"explicacion":"Las ordenadas de las zonas 2 y 3 se multiplican por Cb, pero Mn no puede superar Mp. La meseta se prolonga hasta cortar la curva amplificada."},{"pregunta":"¿Qué representa Zx?","opciones":["El módulo de sección elástico","El radio de giro efectivo","El módulo de sección plástico","La constante de alabeo"],"correcta":2,"explicacion":"Zx es el módulo plástico (Mp = Fy·Zx). Sx es el elástico."},{"pregunta":"En una sección I con alas distintas, el centroide se desplaza:","opciones":["Hacia el ala menor","Hacia el ala mayor","Queda siempre a d/2","Hacia el alma"],"correcta":1,"explicacion":"El área mayor atrae al centroide y al eje neutro plástico."},{"pregunta":"¿Qué condición exige AISC para considerar la acción de campo de tensión en paneles interiores?","opciones":["a/h ≤ 3","a/h ≥ 3","h/tw ≤ 2.24√(E/Fy)","kv = 5.34"],"correcta":0,"explicacion":"La sección G2.2 permite el campo de tensión en paneles interiores con a/h ≤ 3."},{"pregunta":"En una sección cajón 'echada' sometida a flexión, el ala comprimida es:","opciones":["La cara más corta","La cara más larga","Cualquiera de las almas","No hay ala comprimida"],"correcta":1,"explicacion":"Echada, la cara ancha queda horizontal y es la que se comprime. Por eso su b/t controla."},{"pregunta":"En F4 y F5 se usa como radio de giro para el LTB:","opciones":["rts","ry","rt","rx"],"correcta":2,"explicacion":"rt = bfc/√(12(1 + aw/6)). rts es propio de F2 y F3."},{"pregunta":"En el ejemplo F4 con Lb = 550 in y Lr ≈ 537 in, ¿en qué zona del LTB se trabaja?","opciones":["Zona 1 (plástica)","Zona 2 (inelástica)","Zona 3 (elástica)","No aplica el LTB"],"correcta":2,"explicacion":"Lb > Lr implica pandeo lateral-torsional elástico."}],"ejercicios_propuestos":["Calcule Rpg, Lp, Lr y φMn de una viga soldada A36 con alma de 60 × 5/16 in y alas de 14 × 3/4 in, con Lb = 300 in y Cb = 1.","Para una sección monosimétrica A36 con ala superior de 12 × 1/2 in, ala inferior de 8 × 1/2 in y alma de 24 × 1/4 in, ubique el centroide y el ENP y calcule hc, hp, Sxc, Sxt y Iyc/Iy.","Rehaga el ejemplo F5 de clase (alma de 45 × 1/4 in, alas de 8 × 1/4 in) con Lb = 300 in y Cb = 1.14. ¿Qué estado límite gobierna?","Un HSS 12×6×1/4 (b/t de la cara de 12 in igual a 48, Fy = 46 ksi) se flecta 'echado'. Clasifique el ala comprimida y estime Mn según F7.","Determine la separación máxima de atiesadores que permite usar campo de tensión en un alma de 80 in × 3/8 in y calcule kv y Cv2 con a = 2h (Fy = 50 ksi)."],"avisos":["Próxima práctica calificada con materia hasta F5 (en el audio se mencionan el jueves y el miércoles).","Atiesadores en la próxima clase.","Un alumno (Renzo Campos) reportó que la grabación del miércoles 12 de mayo se ve solo 45 segundos aunque marca 1 h 35 min. El profesor lo reportará al centro de cómputo.","Ese día hubo 14 ausentes de 37. El profesor hizo preguntas orales sin respuesta y pidió a los alumnos leer la norma y complementar las clases con lectura.","Hojas Excel: cada problema requiere su propia hoja, y la de clase está sujeta a revisión."],"notas_transcripcion":["Los números de sección se pierden en el audio ('el F'). Según el contexto: F2/F3 con alma compacta, F4 con alma no compacta o monosimétrica, F5 con alma esbelta, F7 cajón/HSS, F8 tubos.","'55º' se interpretó como Lb (longitud no arriostrada) y 'IEC' como Iyc o Sxc según el contexto. 'RPG' = Rpg. 'SELKIAO' es ininteligible y se interpretó como la distancia yc.","El profesor llama 'híbrida' a la sección con alas distintas. En AISC, 'híbrida' se refiere a aceros distintos; el término correcto aquí es 'monosimétrica'.","En el ejemplo F4, λfc se oye como '21' (15/0.75 = 20). Los momentos se oyen como '48.51', '30 con 37', '35.53', '41.66' y se interpretaron como 4851, 3037, 3553 y 4166 kip·in, coherentes con Myc = 4521 y Sxc ≈ 125.6 in³.","En el ejemplo F5, los momentos de la hoja (58.88, 45.03, 47.76, 56.35, 74.29 para Mp) no son coherentes en unidades con Myc ≈ 6028 y Mp ≈ 7004 mencionados antes. Se reportan como valores de la hoja sin unidad confirmada.","El profesor dice que en el caso F5 calculó rt 'con la fórmula antigua' y que la diferencia con la moderna es de unas décimas.","La fecha no se dice explícitamente. Se infirió el lunes 17 de mayo de 2021 porque se menciona la clase del 'miércoles 12 de la semana pasada' (la clase 14, perdida en la grabación).","Al cerrar, el profesor comenta la segunda vuelta electoral de junio de 2021; es un tema no técnico y se omite."],"corto":"Vigas F4, F5, cajón","video":"https://www.youtube.com/watch?v=7KWGpqkpr4s","duracion_min":97,"estado":"ok"},"16":{"titulo":"Resistencia al corte en vigas: atiesadores, platabandas y acción de campo de tensiones (flujo de corte)","fecha":"miércoles 19 de mayo de 2021","resumen":"La clase completa el corte en vigas según el Capítulo G del AISC 360. Se repasa el caso sin flujo de corte, φVn = φ·0.6·Fy·Aw·Cv1, incluido el caso de perfiles laminados con h/tw ≤ 2.24√(E/Fy) (φ = 1, Cv1 = 1). Con una viga soldada A36 (ala de 8 in, alma de 18⅜ × 5/16 in) se muestra que no requiere atiesadores y que colocarlos con a = h no cambia la resistencia (111.6 kips): el atiesador solo confina el panel de corte. Para ganar resistencia se usan platabandas, ilustradas con la anécdota de una fábrica que cambió sus máquinas sin consultar a un ingeniero. Luego se presenta el diseño con flujo de corte (campo de tensiones), en el que la viga trabaja como un reticulado; se dan los límites para Cv2 y las condiciones 2Aw/(Afc+Aft) ≤ 2.5 y h/bf ≤ 6. Finalmente se plantean los requisitos del atiesador intermedio (b/t, Ist ≥ Ist2 + (Ist1 − Ist2)ρw) con una viga de 420 in cuyo primer atiesador no cumple y queda como tarea.","objetivos":["Al terminar, el estudiante podrá calcular la resistencia al corte de vigas laminadas y soldadas sin acción de campo de tensiones, determinando kv, Cv1 y φ.","Al terminar, el estudiante podrá decidir si una viga soldada requiere atiesadores transversales usando el límite h/tw ≤ 2.46√(E/Fy).","Al terminar, el estudiante podrá explicar por qué los atiesadores no incrementan la resistencia al corte cuando Cv = 1 y cuándo conviene usar platabandas.","Al terminar, el estudiante podrá calcular la resistencia al corte con acción de campo de tensiones (Cv2 y las dos expresiones de Vn según las condiciones geométricas).","Al terminar, el estudiante podrá dimensionar un atiesador transversal intermedio verificando la relación ancho/espesor y la inercia mínima Ist."],"temas":[{"titulo":"Repaso: corte en vigas sin flujo de corte (caso estándar)","contenido":"El profesor parte de una viga simplemente apoyada con una carga concentrada de 20 kips al centro. De las tablas de vigas se obtiene que el cortante en los apoyos es P/2 y que el diagrama cambia de signo bajo la carga; el momento máximo es PL/4 (en el ejemplo, unos 2100 kip·in). El objetivo del diseño es que Vu ≤ φVn en todas las secciones críticas, recordando siempre que es el alma la que resiste el corte. En el caso estándar (sin flujo de corte) la resistencia la da solo el alma: Vn = 0.6·Fy·Aw·Cv1. Primero se verifica si se necesitan atiesadores; si no se necesitan, kv = 5.34. Si se colocan, se define su espaciamiento a (usualmente se arranca con a = h, el peralte libre del alma) y kv = 5 + 5/(a/h)²; pero si a/h > 3 el atiesador no tiene efecto en la resistencia, pues kv vuelve a 5.34, como si no existiera. Con kv se evalúa Cv1. Hay un caso especial: en perfiles laminados (rolados) con h/tw ≤ 2.24√(E/Fy) se toma φ = 1.0 y Cv1 = 1, de modo que φVn = 1.0·0.6·Fy·Aw. Este caso solo vale para perfiles laminados; para perfiles soldados se usa la expresión general con φ = 0.90, donde Cv1 = 1 si h/tw ≤ 1.10√(kv·E/Fy) y, si es mayor, Cv1 = 1.10√(kv·E/Fy)/(h/tw). El profesor comenta además el criterio práctico de selección de planchas: se arman los perfiles con los espesores disponibles en el mercado (5/16, 1/2, 3/4 in...), y conviene hacer un estudio de mercado, pues los proveedores a veces ofrecen saldos o mermas de planchas a buen precio.","formulas":[{"nombre":"Resistencia nominal al corte sin campo de tensiones","expresion":"Vn = 0.6·Fy·Aw·Cv1","variables":"Fy: esfuerzo de fluencia del alma (ksi); Aw = d·tw (laminados) o h·tw (soldados, según el curso) en in²; Cv1: coeficiente de corte del alma"},{"nombre":"Caso laminado compacto en corte","expresion":"Si h/tw ≤ 2.24·√(E/Fy): φv = 1.00 y Cv1 = 1.0","variables":"h: peralte libre del alma; tw: espesor del alma; E = 29000 ksi"},{"nombre":"Coeficiente de pandeo por corte","expresion":"kv = 5.34 (sin atiesadores o a/h > 3); kv = 5 + 5/(a/h)² (con atiesadores, a/h ≤ 3)","variables":"a: distancia libre entre atiesadores transversales; h: peralte libre del alma"},{"nombre":"Coeficiente Cv1","expresion":"Cv1 = 1.0 si h/tw ≤ 1.10·√(kv·E/Fy); Cv1 = 1.10·√(kv·E/Fy)/(h/tw) si h/tw > 1.10·√(kv·E/Fy)","variables":"kv adimensional; E y Fy en ksi"},{"nombre":"Límite de necesidad de atiesadores","expresion":"No se requieren atiesadores si h/tw ≤ 2.46·√(E/Fy) (o si Vu ≤ φVn con kv = 5.34)","variables":"Para A36: 2.46·√(29000/36) ≈ 69.8"}],"referencias_norma":["AISC 360-16 Cap. G, Sección G2.1 (ecuaciones G2-1 a G2-4)","AISC 360-16 G2.2 (límite 2.46√(E/Fy) para atiesadores)"]},{"titulo":"Ejemplo: viga soldada sin atiesadores y efecto de colocarlos","contenido":"Se propone una viga soldada de A36 con alas de 8 in y alma de 18⅜ in, con espesor de 5/16 in en ala y alma. La esbeltez del alma es h/tw = 18.375/0.3125 = 58.8. Como es soldada, φ = 0.90 y Cv1 debe calcularse. Primero se compara con 2.46√(E/Fy) = 69.8: como 58.8 < 69.8 no se necesitan atiesadores y kv = 5.34. El límite 1.10√(kv·E/Fy) = 1.10√(5.34·29000/36) ≈ 72.1, mayor que 58.8, por lo que Cv1 = 1. La resistencia de diseño es φVn = 0.9·0.6·36·(18.375·0.3125)·1 ≈ 111.6 kips, muy superior a la demanda (10 kips en apoyos y, según el profesor, 20 kips en el punto de carga). Luego se analiza qué pasaría si, por seguridad, se colocaran atiesadores con a = h: kv = 5 + 5/1² = 10 y el límite sube a 1.10√(10·29000/36) ≈ 98.7. Como h/tw = 58.8 sigue siendo menor, Cv1 sigue siendo 1 y la resistencia no cambia (111.6 kips), porque Aw, Fy y φ no variaron. La conclusión central es que la función del atiesador no es dar resistencia sino confinar el panel de corte (la zona del alma entre atiesadores) para evitar su pandeo local. Si se quiere más resistencia hay que aumentar el área del alma.","formulas":[{"nombre":"Resistencia de diseño (LRFD)","expresion":"φVn = 0.90·0.6·Fy·(h·tw)·Cv1","variables":"φ = 0.90 para perfiles soldados"}],"referencias_norma":["AISC 360-16 G2.1"]},{"titulo":"Platabandas (doubler plates) para incrementar la resistencia al corte","contenido":"Para aumentar la resistencia al corte se adosan al alma planchas paralelas a ella, llamadas platabandas o 'plata bandas' (doubler plates). Equivalen a agregar otra alma a los costados, de modo que crece el área del alma Aw y, con ella, Vn. Pueden coexistir con los atiesadores: en planta se ve el ala, el alma, la platabanda soldada al alma y luego los atiesadores. Ante la pregunta de un alumno sobre si sería más caro que escoger desde el inicio un alma más gruesa, el profesor responde que no necesariamente, porque la platabanda solo se coloca en las zonas del diagrama de cortante donde la demanda supera la resistencia (por ejemplo cerca de los apoyos con carga repartida), y no a todo lo largo. El profesor relató el caso de una fábrica cuyos dueños reemplazaron máquinas antiguas (representadas por una carga de 20) por máquinas nuevas más pesadas (30) sin consultar a un ingeniero; el techo empezó a ceder y tuvieron que apuntalar la viga y luego reforzarla. Lo correcto habría sido llamar al ingeniero antes: se habría diseñado una platabanda e instalado en un fin de semana, evitando parar la fábrica dos o tres semanas. Introduce así el concepto de pérdida por tiempo no trabajado (lucro cesante), que en los negocios suele ser mucho más costoso que el refuerzo. También mencionó que los ingenieros suelen ser llamados cuando el daño ya ocurrió.","formulas":[{"nombre":"Área de alma reforzada","expresion":"Aw,ref = h·(tw + n·tp)","variables":"tp: espesor de cada platabanda; n: número de platabandas (1 o 2)"}],"referencias_norma":[]},{"titulo":"Diseño con flujo de corte (acción de campo de tensiones)","contenido":"En vigas muy peraltadas (por ejemplo las vigas de los puentes del tren en Evitamiento) es casi inevitable que el alma presente un leve pandeo local entre atiesadores. Diseñar con flujo de corte significa aceptar ese pandeo del panel y aprovechar la resistencia post-pandeo: la viga trabaja como un tijeral, donde las alas son las bridas en tracción y compresión, los atiesadores son los montantes y los paneles del alma actúan como diagonales en tracción. El profesor indica que podría aproximarse el área de esa diagonal como una franja del alma (longitud de la diagonal/4 por el espesor) y resolver el reticulado, pero que la norma ofrece una alternativa directa. Para ello se usa el coeficiente Cv2, con dos límites: 1.10√(kv·E/Fy) y 1.37√(kv·E/Fy). Si h/tw es menor que el primero, Cv2 = 1; si está entre ambos, Cv2 = 1.10√(kv·E/Fy)/(h/tw); y si supera el segundo, Cv2 = 1.51·kv·E/((h/tw)²·Fy). Luego, si h/tw ≤ 1.10√(kv·E/Fy), Vn = 0.6·Fy·Aw (factor Z = 1). Si es mayor, hay dos casos: cuando 2Aw/(Afc + Aft) ≤ 2.5 y h/bfc ≤ 6 y h/bft ≤ 6, se usa la expresión con 1.15√(1 + (a/h)²) en el denominador; en cualquier otro caso se usa la expresión con 1.15[a/h + √(1 + (a/h)²)]. Para decidir hay que calcular el área del alma y las áreas de las alas en compresión y en tracción.","formulas":[{"nombre":"Coeficiente Cv2","expresion":"Cv2 = 1.0 si h/tw ≤ 1.10√(kv·E/Fy); Cv2 = 1.10√(kv·E/Fy)/(h/tw) si 1.10√(kv·E/Fy) < h/tw ≤ 1.37√(kv·E/Fy); Cv2 = 1.51·kv·E/((h/tw)²·Fy) si h/tw > 1.37√(kv·E/Fy)","variables":"kv, E, Fy como antes"},{"nombre":"Vn con campo de tensiones (caso geométrico favorable)","expresion":"Vn = 0.6·Fy·Aw·[Cv2 + (1 − Cv2)/(1.15·√(1 + (a/h)²))], si 2Aw/(Afc+Aft) ≤ 2.5, h/bfc ≤ 6 y h/bft ≤ 6","variables":"Afc, Aft: áreas del ala en compresión y tracción (in²); bfc, bft: anchos de ala"},{"nombre":"Vn con campo de tensiones (otros casos)","expresion":"Vn = 0.6·Fy·Aw·[Cv2 + (1 − Cv2)/(1.15·(a/h + √(1 + (a/h)²)))]","variables":"a/h: relación de aspecto del panel"},{"nombre":"Sin reducción","expresion":"Vn = 0.6·Fy·Aw si h/tw ≤ 1.10√(kv·E/Fy)","variables":""}],"referencias_norma":["AISC 360-16 G2.2 (ecuaciones G2-7, G2-8, G2-9)","AISC 360-16 G2.1(b)(2) para Cv2 (ecuaciones G2-9 a G2-11)"]},{"titulo":"Requisitos del atiesador transversal intermedio","contenido":"El atiesador no da resistencia: limita el panel de corte de dimensiones a × h. Para dimensionarlo se hace un corte horizontal (corte Q-Q) y se observa el alma con los atiesadores a uno o ambos lados; el eje de referencia ST pasa por el plano medio del alma. El ancho b del atiesador está limitado por b ≤ bf/2 − tw/2, y es recomendable que su espesor tst sea igual al del alma. Con dos planchas, la inercia respecto al eje del alma es Ist = tst·(2b + tw)³/12 (con una sola plancha la inercia es distinta). Requisitos: (A) la relación ancho-espesor debe cumplir b/tst ≤ 0.56√(E/Fyst). (B) La inercia debe cumplir Ist ≥ Ist2 + (Ist1 − Ist2)·ρw, donde Ist1 es la inercia mínima para desarrollar el campo de tensiones, Ist2 es la inercia mínima para el pandeo del alma sin campo de tensiones, ρst = máx(Fyw/Fyst, 1) y ρw es la máxima relación de cortantes en los paneles a cada lado del atiesador (se toma Vr como el mayor cortante actuante en esos paneles, obtenido del diagrama). Usualmente ρst = 1, porque al perfil de A36 se le sueldan planchas de A36, aunque en obra se pueden usar retazos o ángulos sobrantes como atiesadores; en ese caso el ingeniero de obra debe consultar al proyectista mediante el cuaderno de obra, a través de la supervisión, y el diseñador lo verifica rápidamente con sus hojas de cálculo. Sobre la soldadura, el profesor mencionó la recomendación de la norma ligada a 4tw a 6tw: las soldaduras del atiesador al alma se terminan a una distancia de entre 4 y 6 veces tw del pie de la soldadura alma-ala.","formulas":[{"nombre":"Ancho máximo del atiesador","expresion":"b ≤ bf/2 − tw/2","variables":"bf: ancho del ala; tw: espesor del alma (in)"},{"nombre":"Esbeltez del atiesador","expresion":"(b/t)st ≤ 0.56·√(E/Fyst)","variables":"Fyst: fluencia del atiesador (ksi)"},{"nombre":"Inercia del par de atiesadores","expresion":"Ist = tst·(2b + tw)³/12","variables":"Respecto al eje en el plano medio del alma (in⁴)"},{"nombre":"Inercia requerida","expresion":"Ist ≥ Ist2 + (Ist1 − Ist2)·ρw","variables":"ρw = máx[(Vr − Vc2)/(Vc1 − Vc2)] ≥ 0 en los paneles adyacentes"},{"nombre":"Ist1","expresion":"Ist1 = (h⁴·ρst^1.3/40)·(Fyw/E)^1.5","variables":"ρst = máx(Fyw/Fyst, 1.0)"},{"nombre":"Ist2","expresion":"Ist2 = [2.5/(a/h)² − 2]·bp·tw³ ≥ 0.5·bp·tw³","variables":"bp: el menor entre a y h (en esta clase el profesor lo reemplazó por b; se corrige en la clase 17)"}],"referencias_norma":["AISC 360-16 G2.3 (ecuaciones G2-12 a G2-15)"]},{"titulo":"Ejemplo de viga con flujo de corte y propuesta inicial de atiesador","contenido":"Se analiza una viga soldada A36 con alas de 12 × ¾ in, alma de 33 × 5/16 in y luz de 420 in (unos 10.7 m), con carga uniforme que produce Mu = 11,025 kip·in al centro y Vu = 105 kips en los apoyos (el cortante va disminuyendo hacia el centro). h/tw = 105.6 > 69.8, por lo que necesita atiesadores; se buscó a propósito un alma esbelta para que intervenga el flujo de corte. En flexión la sección es compacta (ala y alma), con Mp = 13,997 kip·in y My = 12,652 kip·in; φMn = 0.9·13,997 = 12,598 > 11,025 kip·in, conforme. En corte: Aw = 10.31 in², con a = h, kv = 10, límite 1 = 98.7 y límite 2 = 123; como h/tw cae entre ambos, Cv2 = 0.935. La resistencia sin campo de tensiones fue 208.25 kips y con campo de tensiones 213.48 kips según la hoja de cálculo (cifra que se corregiría en la clase 18). Se concluyó que la viga cumple el corte (Vu = 105 kips). Para el atiesador se propuso tst = tw = 5/16 in y b = 3 in (bmáx = 6 − 0.156 = 5.84 in). Ist = 0.3125·(6.3125)³/12 = 6.55 in⁴; b/t = 9.6 ≤ 15.89, cumple (A). Con Ist1 = 1.297 in⁴, ρw = 20.66 y Ist2 calculado con b, la inercia requerida resultó 25.33 in⁴ > 6.55 in⁴: no cumple. Se dejó de tarea probar b = 5.75 in (y, si no alcanza, aumentar el espesor a ½ in).","formulas":[{"nombre":"Relación de cortantes","expresion":"ρw = (Vr − Vc2)/(Vc1 − Vc2)","variables":"Vr: cortante actuante en el panel; Vc1, Vc2: resistencias disponibles con y sin campo de tensiones"}],"referencias_norma":["AISC 360-16 G2.2, G2.3","AISC 360-16 F2 (flexión, sección compacta)"]}],"ejemplos":[{"titulo":"Resistencia al corte de viga soldada 8 × 18⅜ × 5/16 in (A36)","enunciado":"Viga simplemente apoyada con P = 20 kips al centro. Sección soldada A36: alas de 8 in, alma h = 18.375 in, tw = tf = 5/16 in. Verificar el corte sin atiesadores y con atiesadores a = h.","pasos":["h/tw = 18.375/0.3125 = 58.8","Límite de atiesadores: 2.46√(29000/36) = 69.8 > 58.8 → no requiere atiesadores, kv = 5.34","1.10√(5.34·29000/36) = 72.1 > 58.8 → Cv1 = 1","Aw = 18.375·0.3125 = 5.74 in²; φVn = 0.9·0.6·36·5.74·1 = 111.6 kips","Demanda: Vu = 10 kips en apoyos (20 kips según el profesor en el punto de carga) < 111.6 kips → conforme","Con atiesadores a = h: kv = 5 + 5/1² = 10; límite = 1.10√(10·29000/36) = 98.7 > 58.8 → Cv1 = 1, φVn sigue siendo 111.6 kips"],"resultado":"φVn = 111.6 kips con o sin atiesadores; los atiesadores no aumentan la resistencia cuando Cv1 = 1."},{"titulo":"Viga 12 × ¾ / 33 × 5/16 in con flujo de corte: flexión, corte y primer tanteo de atiesador","enunciado":"Viga soldada A36, L = 420 in, alas 12 × 0.75 in, alma 33 × 0.3125 in, Mu = 11,025 kip·in, Vu = 105 kips. Verificar flexión y corte y proponer atiesadores intermedios con a = h = 33 in.","pasos":["Flexión: Zx ≈ 388.8 in³, Mp = 36·388.8 = 13,997 kip·in; sección compacta, φMn = 0.9·13,997 = 12,598 kip·in > 11,025 → OK","h/tw = 105.6 > 69.8 → requiere atiesadores; con a = h: kv = 10","Límite 1 = 1.10√(10·29000/36) = 98.7; límite 2 = 1.37√(10·29000/36) = 123 → Cv2 = 98.7/105.6 = 0.935","Aw = 33·0.3125 = 10.31 in²; 0.6·Fy·Aw = 222.7 kips; Vn sin campo de tensiones = 222.7·0.935 = 208.25 kips","2Aw/(Afc+Aft) = 20.62/18 = 1.15 ≤ 2.5 y h/bf = 2.75 ≤ 6 (la hoja de clase daba 4.58 por un error de fórmula y usó la otra expresión: Vn = 213.48 kips)","Atiesador propuesto: 2 PL 3 × 5/16 in; b/t = 9.6 ≤ 0.56√(29000/36) = 15.89 → cumple (A)","Ist = 0.3125·(2·3 + 0.3125)³/12 = 6.55 in⁴","Ist1 = (33⁴/40)·(36/29000)^1.5 = 1.297 in⁴; ρw calculado en clase = (105 − 213.48)/(208.25 − 213.48) = 20.66","Inercia requerida (con bp = b = 3 in) ≈ 25.33 in⁴ > 6.55 in⁴ → no cumple"],"resultado":"La viga cumple en flexión y en corte, pero el atiesador de 3 × 5/16 in no cumple la inercia; queda de tarea probar b = 5.75 in."}],"conceptos_clave":[{"termino":"Panel de corte","definicion":"Porción del alma comprendida entre dos atiesadores transversales consecutivos y las alas, de dimensiones a × h."},{"termino":"Atiesador transversal intermedio","definicion":"Plancha (o ángulo) soldada perpendicularmente al alma que confina el panel de corte para controlar el pandeo local; no incrementa directamente la resistencia al corte."},{"termino":"Platabanda (doubler plate)","definicion":"Plancha adosada paralela al alma que aumenta el área efectiva de corte Aw y, por tanto, la resistencia al corte."},{"termino":"Flujo de corte / campo de tensiones","definicion":"Comportamiento post-pandeo del alma en el que los paneles desarrollan diagonales en tracción y la viga trabaja como un reticulado (alas = bridas, atiesadores = montantes)."},{"termino":"kv","definicion":"Coeficiente de pandeo del alma por corte: 5.34 sin atiesadores (o a/h > 3) y 5 + 5/(a/h)² con atiesadores."},{"termino":"Cv1 / Cv2","definicion":"Coeficientes de corte del alma: Cv1 para la resistencia sin campo de tensiones y Cv2 (pandeo por corte) para la expresión con campo de tensiones."},{"termino":"ρw","definicion":"Relación máxima de cortantes (Vr − Vc2)/(Vc1 − Vc2) en los paneles adyacentes al atiesador, que interpola la inercia requerida entre Ist2 e Ist1."},{"termino":"Estudio de mercado","definicion":"Búsqueda de precios y disponibilidad de planchas y perfiles con proveedores para definir económicamente las secciones armadas."},{"termino":"Tiempo no trabajado","definicion":"Pérdida económica por paralización de un negocio; suele superar con creces el costo de un refuerzo preventivo."}],"preguntas":[{"pregunta":"En una viga soldada de A36 con h/tw = 58.8, ¿qué ocurre con φVn si se agregan atiesadores con a = h?","opciones":["Aumenta porque kv pasa de 5.34 a 10","No cambia, porque Cv1 ya era 1 y Aw no varía","Disminuye por la soldadura","Aumenta al doble porque se forman dos paneles"],"correcta":1,"explicacion":"Con h/tw menor que 1.10√(kvE/Fy) Cv1 = 1 en ambos casos; la resistencia depende de 0.6FyAw, que no cambia."},{"pregunta":"¿Cuál es la manera correcta de incrementar la resistencia al corte de una viga existente en una zona localizada?","opciones":["Colocar más atiesadores transversales","Reducir el espaciamiento a por debajo de h/2","Soldar platabandas paralelas al alma","Aumentar el ancho de las alas"],"correcta":2,"explicacion":"Las platabandas aumentan el área del alma Aw, que es la que resiste el corte."},{"pregunta":"Para perfiles laminados con h/tw ≤ 2.24√(E/Fy), los valores de φv y Cv1 son:","opciones":["φv = 1.00 y Cv1 = 1.0","φv = 0.90 y Cv1 = 1.0","φv = 0.75 y Cv1 = 0.9","φv = 1.00 y Cv1 calculado con kv = 5.34"],"correcta":0,"explicacion":"Es el caso especial de la sección G2.1(a) del AISC 360: φ = 1.00 y Cv1 = 1.0."},{"pregunta":"Si en una viga soldada se colocan atiesadores con a/h = 3.5, el coeficiente kv vale:","opciones":["5 + 5/3.5²","10","1.0","5.34"],"correcta":3,"explicacion":"Para a/h > 3 se toma kv = 5.34, igual que sin atiesadores; el atiesador no aporta a la resistencia."},{"pregunta":"En el modelo de reticulado para el flujo de corte, los atiesadores transversales representan:","opciones":["Las bridas","Las diagonales en tracción","Los montantes","Los apoyos"],"correcta":2,"explicacion":"Las alas son las bridas, los paneles del alma las diagonales y los atiesadores los montantes."},{"pregunta":"Para A36, el límite 2.46√(E/Fy) que define la necesidad de atiesadores vale aproximadamente:","opciones":["58.8","69.8","98.7","123"],"correcta":1,"explicacion":"2.46·√(29000/36) = 2.46·28.38 ≈ 69.8."},{"pregunta":"¿Cuál de las siguientes condiciones NO forma parte de los requisitos para usar la expresión de campo de tensiones con 1.15√(1+(a/h)²)?","opciones":["2Aw/(Afc+Aft) ≤ 2.5","h/bfc ≤ 6","h/bft ≤ 6","a/h ≤ 1.0"],"correcta":3,"explicacion":"Las condiciones son la relación de áreas ≤ 2.5 y h/bf ≤ 6 para ambas alas; a/h ≤ 1 no es requisito."},{"pregunta":"Con h/tw entre 1.10√(kvE/Fy) y 1.37√(kvE/Fy), Cv2 vale:","opciones":["1.10√(kvE/Fy)/(h/tw)","1.0","1.51kvE/((h/tw)²Fy)","0.6"],"correcta":0,"explicacion":"En el rango intermedio de inelasticidad Cv2 = 1.10√(kvE/Fy)/(h/tw)."},{"pregunta":"El límite de esbeltez del atiesador transversal es:","opciones":["b/t ≤ 1.49√(E/Fy)","b/t ≤ 0.56√(E/Fyst)","b/t ≤ 0.38√(E/Fy)","b/t ≤ 2.46√(E/Fy)"],"correcta":1,"explicacion":"AISC 360-16 G2.3 exige (b/t)st ≤ 0.56√(E/Fyst), unos 15.9 para A36."},{"pregunta":"El ancho máximo de cada plancha de atiesador en una viga con bf = 12 in y tw = 5/16 in es aproximadamente:","opciones":["6.00 in","12.0 in","5.84 in","3.00 in"],"correcta":2,"explicacion":"b ≤ bf/2 − tw/2 = 6 − 0.156 = 5.84 in."},{"pregunta":"Según la anécdota del profesor, ¿qué debió hacerse antes de cambiar las máquinas antiguas por otras más pesadas?","opciones":["Colocar un puntal permanente","Agregar atiesadores en toda la viga","Reducir la carga viva del techo","Consultar a un ingeniero para reforzar la viga, por ejemplo con platabandas"],"correcta":3,"explicacion":"Un refuerzo preventivo planificado (platabandas) habría sido mucho más barato que paralizar la fábrica."}],"ejercicios_propuestos":["Repita el diseño del atiesador del ejemplo (viga 12 × ¾ / 33 × 5/16 in, A36, a = h = 33 in, Vr = 105 kips) con b = 5.75 in y tst = 5/16 in; si no cumple, pruebe tst = ½ in.","Calcule φVn de una viga soldada A36 con alma de 24 × ¼ in sin atiesadores; luego con atiesadores a = 24 in y a = 48 in. Comente qué casos cambian la resistencia.","Una viga laminada W18×50 (d = 17.99 in, tw = 0.355 in, A992) tiene Vu = 140 kips. Verifique si cumple el caso φ = 1.0, Cv1 = 1 y calcule φVn.","Para una viga soldada A36 con alas 14 × 1 in y alma 40 × 5/16 in, a = 40 in, calcule Cv2 y Vn con campo de tensiones verificando las condiciones geométricas.","Una viga con φVn = 120 kips debe resistir Vu = 160 kips en los tramos extremos. Dimensione una platabanda de A36 (una a cada lado) sobre un alma de 30 × 5/16 in, con Cv1 = 1."],"avisos":["El profesor trabaja con hojas de cálculo en Excel para corte y atiesadores (hoja de la sección G).","Tarea: rehacer la verificación del atiesador con b = 5.75 in y, si no pasa, con espesor de ½ in.","Asistencia: 13 ausentes de 37; el profesor recomienda cuidarse por la pandemia de COVID-19."],"notas_transcripcion":["'BN', 'BU', 'BC' se interpretaron como Vn, Vu, Vc (cortante); 'CB'/'CV' como Cv; 'KB' como kv; 'TB' como tw; 'FIE' como φ.","'atizadores', 'atesadores' = atiesadores; 'plata banda' = platabanda (doubler plate); 'Sismit' = CISMID.","'224' y '246' se interpretaron como los factores 2.24 y 2.46 de √(E/Fy).","El profesor dice que bajo la carga concentrada Vu = 20 kips; en rigor el cortante a cada lado vale P/2 = 10 kips, aunque el salto en el diagrama es de 20 kips.","La sección dice 'viga 420' y 'eso son metros, más o menos 10 metros': se interpreta L = 420 in (≈ 10.7 m).","El valor 4.58 de la relación 2Aw/(Afc+Aft) y Vc = 213.48 kips provienen de un error de la hoja de Excel que se corrigió en la clase 18 (el valor correcto es ≈ 1.15 y la resistencia con campo de tensiones resulta ≈ 217 kips nominal, ≈ 195 kips de diseño).","En el cálculo de ρw el profesor usó Vc1 = 213.48 (con campo de tensiones) y Vc2 = 208.25 en orden invertido respecto a la definición del AISC 360-16. Según la norma, si Vr < Vc2 entonces ρw = 0 y basta con Ist ≥ Ist2. Se registra el procedimiento de la clase, señalando la diferencia.","La recomendación de 'longitud de soldadura entre 4 y 6 tw' se interpretó como la regla del AISC sobre dónde terminar la soldadura del atiesador al alma (entre 4tw y 6tw del pie de la soldadura alma-ala)."],"corto":"Corte y campo de tensión","video":"https://www.youtube.com/watch?v=pEX5U0ZlLLE","duracion_min":102,"estado":"ok"},"17":{"titulo":"Diseño de atiesadores transversales intermedios (continuación) y estimación aproximada de demandas en vigas continuas","fecha":"lunes 31 de mayo de 2021","resumen":"Se repasa la resistencia al corte sin y con flujo de corte y se continúa el ejemplo de la viga soldada A36 (alas de 12 × ¾ in, alma de 33 × 5/16 in, a = h = 33 in, Vr = 105 kips). El atiesador se rediseña con b = 5.75 in y tst = 5/16 in a ambos lados del alma (Ist = 42.92 in⁴). La pregunta de un alumno lleva a discutir la definición de bp en Ist2: la norma lo define como el menor entre a y h, mientras que el profesor lo había tomado como el ancho del atiesador. Se calculan ambos umbrales (16.88 y 25 in⁴), se adopta el de la norma y se concluye que cumple: 2 PL 5¾ × 5/16 in cada 33 in. Se cita la teoría de placas de Timoshenko. En la segunda parte, en Excel, se estiman las demandas de una viga continua de un pórtico con máquinas reciprocantes (impacto del 50%, coeficientes de momento y tablas de vigas). También se explica cómo el empotramiento sube el diagrama de momentos: PL/4 en la viga simple pasa a PL/8 en el centro y en los extremos.","objetivos":["Al terminar, el estudiante podrá verificar completamente un par de atiesadores transversales intermedios (b/t e Ist) para una viga soldada con flujo de corte.","Al terminar, el estudiante podrá interpretar correctamente el parámetro bp de la ecuación de Ist2 del AISC 360-16 (menor entre a y h).","Al terminar, el estudiante podrá especificar el atiesador en planos (dimensiones, espesor y espaciamiento).","Al terminar, el estudiante podrá estimar momentos de diseño en vigas continuas usando coeficientes, factores de impacto y tablas de vigas.","Al terminar, el estudiante podrá explicar el efecto del empotramiento sobre el diagrama de momentos de una viga con carga concentrada."],"temas":[{"titulo":"Repaso de resistencia al corte sin y con flujo de corte","contenido":"La resistencia al corte se expresa como φVn, con Vn = 0.6·Fy·Aw·Cv. El coeficiente Cv vale 1 en algunos casos y menos de 1 en otros. Primero se decide si se necesitan atiesadores (umbral h/tw ≤ 2.46√(E/Fy)). Sin atiesadores se usa kv = 5.34 directamente; con atiesadores se propone el espaciamiento a y kv depende de a/h (en el ejemplo a = h, con lo que kv = 10 y el límite 1.10√(kvE/Fy) resultó 98.7). Para dar más resistencia se puede aumentar el espesor del alma con platabandas. La alternativa de diseño para vigas de gran peralte es aceptar el flujo de corte: entre atiesadores se permite el pandeo local del panel y la viga se trata como un tijeral. En ese caso, conocido a/h, se obtiene kv, se evalúan los dos límites (1.10 y 1.37 √(kvE/Fy)) y se elige la expresión de Cv2; cuando h/tw supera el límite 1, Vn es el valor básico multiplicado por un factor Z que depende de las condiciones geométricas (relación de áreas y h/bf). Un alumno preguntó si Vc1 y Vc2 deben calcularse con kv = 5.34; el profesor aclaró que kv = 5.34 solo corresponde cuando a/h > 3; si se propone un atiesador con a/h < 3, kv = 5 + 5/(a/h)². Comentó que proponer un espaciamiento muy largo equivale a poner atiesadores 'por las puras', porque kv queda como si no existieran.","formulas":[{"nombre":"Resistencia nominal al corte","expresion":"Vn = 0.6·Fy·Aw·Cv1 (sin campo de tensiones); Vn = 0.6·Fy·Aw·Z (con campo de tensiones)","variables":"Z = 1, o [Cv2 + (1 − Cv2)/(1.15√(1+(a/h)²))], o [Cv2 + (1 − Cv2)/(1.15(a/h + √(1+(a/h)²)))] según el caso"},{"nombre":"kv","expresion":"kv = 5 + 5/(a/h)² si a/h ≤ 3; kv = 5.34 si a/h > 3","variables":"a: espaciamiento libre entre atiesadores; h: peralte libre del alma"}],"referencias_norma":["AISC 360-16 G2.1 y G2.2"]},{"titulo":"Rediseño del atiesador con b = 5.75 in","contenido":"En el ejemplo de la clase anterior el atiesador de 3 × 5/16 in tenía Ist = 6.55 in⁴, insuficiente frente a la inercia requerida de unos 25 in⁴. El ancho máximo era bf/2 − tw/2 = 5.84 in; como 5.84 'no es ingenieril', se adopta 5.75 in (5¾ in), conservando tst = 5/16 in = 0.3125 in y colocando una plancha a cada lado del alma. La nueva inercia respecto al plano medio del alma es Ist = 0.3125·(2·5.75 + 0.3125)³/12 = 0.3125·(11.8125)³/12 ≈ 42.92 in⁴. La relación b/t = 5.75/0.3125 = 18.4 debería verificarse contra 0.56√(E/Fy) = 15.89 (el profesor no la recalculó en clase). Ist1 no cambia porque depende solo de h, ρst y Fyw/E: Ist1 = (33⁴/40)·1^1.3·(36/29000)^1.5 = 1.2967 in⁴ (el profesor confirmó el valor de la clase anterior). Tampoco cambia ρw = 20.66, porque se mantiene a = h y, por ende, los mismos Vc1 y Vc2 (diferencia de 5.23 kips en el denominador y −108.48 kips en el numerador, según la hoja usada en clase). Para Ist2, como a/h = 1, el factor [2.5/(a/h)² − 2] = 0.5, que coincide con el mínimo 0.5·bp·tw³, de modo que Ist2 = 0.5·bp·tw³.","formulas":[{"nombre":"Inercia de par de atiesadores","expresion":"Ist = tst·(2b + tw)³/12","variables":"b = 5.75 in, tst = tw = 0.3125 in → 42.92 in⁴"},{"nombre":"Ist1","expresion":"Ist1 = (h⁴·ρst^1.3/40)·(Fyw/E)^1.5","variables":"h = 33 in, ρst = 1, Fyw = 36 ksi → 1.297 in⁴"}],"referencias_norma":["AISC 360-16 G2.3"]},{"titulo":"Interpretación de bp en Ist2 y verificación final del atiesador","contenido":"Un alumno observó que la norma (final del Capítulo G, sección de atiesadores transversales) define bp como la menor dimensión entre a y h, mientras que el profesor había usado el ancho b del atiesador. El profesor explicó su interpretación: el término bp·tw³ es una inercia de referencia; si se toma bp = a o h se está pensando en el panel del alma que se sale de su plano, mientras que con b se piensa en la plancha del atiesador que podría salirse del plano por efecto del cortante. Calculó ambas versiones. Con b = 5.75 in: Ist2 = 0.5·5.75·0.3125³ ≈ 0.088 in⁴ y el umbral resultaba ≈ 25 in⁴. Con bp = h = 33 in (según la norma): Ist2 = 0.5·33·0.3125³ ≈ 0.504 in⁴. Hubo una corrección de signos sugerida por un alumno: la expresión es Ist2 + (Ist1 − Ist2)·ρw = 0.504 + (1.297 − 0.504)·20.66 ≈ 0.504 + 16.38 ≈ 16.88 in⁴. Como la inercia provista, 42.92 in⁴, supera a 16.88 in⁴ (e incluso a 25 in⁴ con el otro criterio), el atiesador cumple. Insistió en que en diseño hay que respetar las normas y protocolos, y que con la interpretación de la norma el umbral no sale más desfavorable. Para un criterio combinado de ambos modos habría que recurrir a la teoría de placas de Timoshenko (Teoría de la Elasticidad / Estabilidad Elástica, pandeo de planchas y campo de tensiones), de donde salen los coeficientes como kv. La solución final que va al plano es: atiesadores de 5¾ × 5/16 in (a ambos lados del alma) cada 33 in sobre el perfil soldado.","formulas":[{"nombre":"Ist2 (AISC 360-16)","expresion":"Ist2 = [2.5/(a/h)² − 2]·bp·tw³ ≥ 0.5·bp·tw³, con bp = menor(a, h)","variables":"tw: espesor del alma (in)"},{"nombre":"Inercia requerida","expresion":"Ist,req = Ist2 + (Ist1 − Ist2)·ρw","variables":"ρw ≥ 0; resultado del ejemplo ≈ 16.88 in⁴"}],"referencias_norma":["AISC 360-16 G2.3, ecuaciones G2-13 y G2-14 y definición de bp","Timoshenko, teoría de placas (pandeo de planchas)"]},{"titulo":"Viga de pórtico para máquinas reciprocantes: estimación de demandas en Excel","contenido":"En la hoja de Excel de la sección G se plantea un nuevo caso: la misma viga, pero como parte de un pórtico continuo de varios tramos que soporta máquinas reciprocantes, que generan grandes cortantes. Sobre la viga actúan cargas concentradas de las máquinas y la carga repartida del peso propio. Desde el lado conservador se puede tratar la viga como continua y usar coeficientes de momento aproximados (del tipo 1/24 en los apoyos extremos, 1/14 o 1/11 en los tramos y 1/10 en el apoyo interior) aplicados a wL². Por tratarse de máquinas, la carga viva se amplifica por un factor de impacto del 50%: el valor base 5 pasa a 7.5. Las longitudes de los tramos se convierten de metros a pulgadas (1 in = 2.54 cm), con cerca de 518 in por paño. Las cargas se mayoran (1.6 para la carga viva de las máquinas, sumada a la carga muerta mayorada). Como alternativa se buscan casos similares en las tablas de diagramas de vigas que el profesor entregó: vigas continuas de dos tramos con cargas concentradas, teniendo cuidado de que la posición de la carga coincida (por ejemplo, la tabla con cargas en los tercios no sirve si la carga real está solo en un tercio). Se elige una tabla de viga continua con carga concentrada que da el momento positivo bajo la carga y el negativo en el apoyo. El profesor recalca que es una aproximación que no reemplaza el análisis por computadora.","formulas":[{"nombre":"Momento por coeficientes","expresion":"Mu = C·wu·L², con C = 1/24, 1/14, 1/11, 1/10 según la ubicación","variables":"wu: carga uniforme mayorada; L: luz del tramo"},{"nombre":"Carga con impacto","expresion":"L_imp = L·(1 + I), I = 0.50 para la máquina del ejemplo","variables":"I: factor de impacto"}],"referencias_norma":["ASCE 7 / Norma E.020: factores de impacto para maquinaria (valor del 50% supuesto en clase)","Tablas de diagramas de vigas del Manual AISC (Beam Diagrams and Formulas)"]},{"titulo":"Efecto del empotramiento en el diagrama de momentos","contenido":"Para explicar la lógica que usaban los ingenieros 'antiguos' antes de los programas, el profesor toma una viga simplemente apoyada con carga P al centro: el diagrama es triangular con Mmáx = PL/4 al centro. Si la misma viga se empotra en ambos extremos con la misma carga, el diagrama tiene la misma forma, pero 'se sube' (se cuelga) una cantidad constante: aparecen momentos negativos en los empotramientos y el positivo del centro se reduce. De las tablas: en la viga doblemente empotrada con carga central, el momento vale PL/8 en el centro y PL/8 en los empotramientos. Así, el momento central es una fracción α = 1/2 del PL/4 simple, y el momento de empotramiento es igualmente PL/8. Cualquier condición real, como una viga unida a columnas que pueden rotar (efecto viga-columna), queda entre estos dos extremos, de modo que se pueden estimar las demandas con factores α y β aplicados al PL/4 de la viga simple. Con ese principio se puede aproximar el momento de la viga del pórtico de máquinas.","formulas":[{"nombre":"Viga simple, carga central","expresion":"Mmáx = P·L/4","variables":"P: carga concentrada; L: luz"},{"nombre":"Viga doblemente empotrada, carga central","expresion":"M+ = P·L/8 (centro); M− = P·L/8 (empotramientos)","variables":"La suma |M+| + |M−| sigue siendo PL/4"}],"referencias_norma":["Manual AISC, Beam Diagrams and Formulas (casos 7 y 16)"]}],"ejemplos":[{"titulo":"Verificación final del atiesador 5¾ × 5/16 in","enunciado":"Viga soldada A36: alas 12 × ¾ in, alma 33 × 5/16 in, a = h = 33 in, Vr = 105 kips, ρw = 20.66 (de la clase 16). Verificar un par de atiesadores de b = 5.75 in y tst = 5/16 in.","pasos":["Ist provista = 0.3125·(2·5.75 + 0.3125)³/12 = 0.3125·1648.3/12 ≈ 42.92 in⁴","Ist1 = (33⁴/40)·(36/29000)^1.5 = 29,648·4.374×10⁻⁵ ≈ 1.297 in⁴","a/h = 1 → [2.5/1 − 2] = 0.5 → Ist2 = 0.5·bp·tw³","Con bp = h = 33 in (norma): Ist2 = 0.5·33·0.3125³ ≈ 0.504 in⁴","Ist,req = 0.504 + (1.297 − 0.504)·20.66 ≈ 0.504 + 16.38 ≈ 16.88 in⁴","Con bp = b = 5.75 in (criterio inicial del profesor): Ist,req ≈ 25 in⁴","42.92 in⁴ ≥ 16.88 in⁴ (y ≥ 25 in⁴) → cumple"],"resultado":"Usar atiesadores de 5¾ × 5/16 in a ambos lados del alma, espaciados cada 33 in."},{"titulo":"Viga simple vs. doblemente empotrada con carga central","enunciado":"Comparar los momentos de una viga de luz L con carga P al centro, primero simplemente apoyada y luego doblemente empotrada.","pasos":["Simplemente apoyada: Mmáx = PL/4 al centro","Doblemente empotrada: M centro = PL/8 y M empotramiento = −PL/8","El diagrama se 'sube' PL/8: α = 1/2 sobre el momento simple"],"resultado":"El empotramiento reduce el momento positivo de PL/4 a PL/8 y genera PL/8 negativo en los extremos."}],"conceptos_clave":[{"termino":"bp","definicion":"En AISC 360-16 G2.3, la menor dimensión entre a y h usada en Ist2; no es el ancho del atiesador."},{"termino":"Ist1","definicion":"Inercia mínima del atiesador para desarrollar toda la resistencia post-pandeo (campo de tensiones) de los paneles adyacentes."},{"termino":"Ist2","definicion":"Inercia mínima del atiesador para desarrollar la resistencia al pandeo por corte del alma sin campo de tensiones."},{"termino":"Factor de impacto","definicion":"Amplificación de la carga viva de maquinaria para considerar efectos dinámicos (50% en el ejemplo de máquinas reciprocantes)."},{"termino":"Coeficientes de momento","definicion":"Fracciones de wL² (1/24, 1/14, 1/11, 1/10...) que permiten estimar de forma aproximada los momentos en vigas continuas."},{"termino":"Teoría de placas de Timoshenko","definicion":"Base teórica del pandeo de planchas y del campo de tensiones de la que derivan coeficientes como kv."}],"preguntas":[{"pregunta":"Según AISC 360-16, el parámetro bp en la expresión de Ist2 es:","opciones":["El ancho del atiesador b","El ancho del ala bf","La menor dimensión entre a y h","La mayor dimensión entre a y h"],"correcta":2,"explicacion":"La norma define bp como la menor de las dimensiones a y h."},{"pregunta":"Para a/h = 1, el factor [2.5/(a/h)² − 2] de Ist2 vale:","opciones":["0.5","1.0","2.5","−0.5"],"correcta":0,"explicacion":"2.5/1 − 2 = 0.5, que coincide con el mínimo 0.5·bp·tw³."},{"pregunta":"¿Por qué no cambia Ist1 al aumentar el ancho del atiesador de 3 a 5.75 in?","opciones":["Porque depende de b","Porque ρw cambió","Porque a/h cambió","Porque depende solo de h, ρst y Fyw/E"],"correcta":3,"explicacion":"Ist1 = (h⁴ρst^1.3/40)(Fyw/E)^1.5 no depende de las dimensiones del atiesador."},{"pregunta":"La inercia de un par de atiesadores de 5.75 × 5/16 in sobre un alma de 5/16 in es aproximadamente:","opciones":["6.55 in⁴","42.92 in⁴","16.88 in⁴","129.7 in⁴"],"correcta":1,"explicacion":"Ist = 0.3125·(11.8125)³/12 ≈ 42.92 in⁴."},{"pregunta":"Si un atiesador se propone con a/h > 3, ¿qué ocurre?","opciones":["kv = 10","Cv = 0","kv = 5.34, como si no hubiera atiesador","Se duplica la resistencia"],"correcta":2,"explicacion":"Con espaciamientos muy grandes kv = 5.34 y el atiesador no aporta: se pone 'por las puras'."},{"pregunta":"La inercia requerida del atiesador según AISC 360-16 es:","opciones":["Ist2 + (Ist1 − Ist2)·ρw","Ist1 + (Ist2 − Ist1)·ρst","Ist1·Ist2·ρw","0.5·bp·tw³ siempre"],"correcta":0,"explicacion":"Ist ≥ Ist2 + (Ist1 − Ist2)·ρw, interpolando entre Ist2 e Ist1."},{"pregunta":"En una viga doblemente empotrada con carga P al centro, el momento en el centro vale:","opciones":["PL/4","PL/12","PL/16","PL/8"],"correcta":3,"explicacion":"Las tablas dan PL/8 al centro y PL/8 negativo en los empotramientos."},{"pregunta":"Para máquinas reciprocantes, el profesor amplificó la carga viva de 5 a 7.5 porque usó:","opciones":["Un factor de carga 1.5","Un factor de impacto del 50%","La combinación 1.2D + 1.6L","Un coeficiente 1/10"],"correcta":1,"explicacion":"Carga con impacto = 5·(1 + 0.5) = 7.5."},{"pregunta":"¿Qué recomienda el profesor sobre el ancho del atiesador cuando el máximo calculado es 5.84 in?","opciones":["Usar exactamente 5.84 in","Usar 6 in","Usar 5.75 in, una medida práctica","Usar 3 in"],"correcta":2,"explicacion":"5.84 in 'no es ingenieril'; se redondea hacia abajo a una fracción comercial, 5¾ in."},{"pregunta":"Al usar tablas de vigas para aproximar una viga continua con una sola carga en el primer tercio, ¿qué tabla NO conviene usar?","opciones":["Una con carga concentrada en la misma posición","Una viga continua de dos tramos con carga concentrada","Ninguna sirve","Una con cargas iguales en todos los tercios"],"correcta":3,"explicacion":"La tabla con cargas en todos los tercios no representa la posición real de la carga."}],"ejercicios_propuestos":["Repita la verificación del atiesador del ejemplo con una sola plancha de 5.75 × 5/16 in a un lado del alma (inercia respecto a la cara del alma) y comente si cumple.","Para la viga de alas 12 × ¾ in y alma 33 × 5/16 in, cambie el espaciamiento a 50 in, recalcule kv, Cv2, Vc1, Vc2, ρw e Ist requerida y diseñe el atiesador.","Verifique b/t del atiesador de 5.75 × 5/16 in contra 0.56√(E/Fy) para A36 y, si no cumple, proponga un espesor que sí cumpla y recalcule Ist.","Una viga continua de dos tramos de 8 m soporta una máquina de 40 kN en cada centro de tramo (impacto del 50%) y una carga muerta de 5 kN/m. Estime con coeficientes o tablas los momentos positivo y negativo mayorados.","Una viga de 6 m con P = 30 kN al centro: calcule el momento máximo simplemente apoyada y doblemente empotrada, y dibuje ambos diagramas."],"avisos":["Se usa la hoja de Excel 'sección G, clase 15' del curso; un alumno reportó un posible error en la hoja.","Se entregaron tablas de diagramas de vigas (Beam Diagrams) para estimar demandas.","Referencia bibliográfica: Timoshenko, teoría de placas (pandeo de planchas y campo de tensiones).","El profesor corregirá el examen parcial esa tarde; asistencia: 11 ausentes de 37 (31 de mayo, Día de la Prevención ante Desastres Naturales)."],"notas_transcripcion":["'IST', 'IST 1', 'IST 2' se interpretaron como Ist, Ist1 e Ist2; la transcripción no distingue los subíndices y se reconstruyeron por contexto.","'Ro W', 'roe doble' = ρw; 'rost', 'Ro ST' = ρst; 'BP' = bp; 'BC y BC' = Vc1 y Vc2.","'0.46' y '0.50 con 35' corresponden a Ist2 ≈ 0.046 in⁴ (b = 3 in) y ≈ 0.5035 in⁴ (bp = 33 in).","'Transversus Stiffness' = Transverse Stiffeners (AISC 360-16 G2.3).","El factor (Fyw/E)^1.5 aparece una vez como 'a la 1.05' por error de dictado.","Los datos de la viga del pórtico de máquinas (longitudes 12-14 m, 518 in por paño, w = 5) se dictaron de forma confusa mientras se editaba el Excel; se registran como valores aproximados.","El profesor no recalculó b/t para b = 5.75 in; 5.75/0.3125 = 18.4 excede 15.89, observación técnica añadida en las notas.","Según la definición estricta del AISC 360-16, con Vr = 105 kips < Vc2 resulta ρw = 0 y la inercia requerida sería solo Ist2; el ejemplo de clase usa ρw = 20.66 (ver notas de la clase 16)."],"corto":"Atiesadores intermedios","video":"https://www.youtube.com/watch?v=rFuF_ZZ7Z9w","duracion_min":98,"estado":"ok"},"18":{"titulo":"Trabajo escalonado (estación de servicio en acero), aberturas en almas de vigas e introducción a la flexocompresión y al efecto P-Δ","fecha":"miércoles 2 de junio de 2021","resumen":"Se presenta el trabajo escalonado: diseñar en acero una estación de servicio con góndola, tiendas de dos niveles y servicios, en grupos de tres, sobre suelo flexible y con cargas muerta, viva, de sismo y de viento. La modulación parte de una luz L obtenida de los códigos de los alumnos, con secciones soldadas armadas y reticulados en las góndolas, en tres entregas acumulativas más un resumen de seis páginas. Se corrige un error de la hoja de corte (relación 2Aw/(Afc+Aft)), con lo que φVn sube a unos 195 kips. Luego se trata la perforación del alma para tuberías: atiesadores a ambos lados del hueco y platabanda para recuperar (h − d)·tw, o bien colgar las tuberías bajo la viga. Finalmente se introduce la flexocompresión: superposición P/A + M/S, efecto P-Δ, interacción P/Py + M/My ≤ 1, ecuaciones H1-1a/b del AISC, un tutorial de P-Δ en SAP2000 y el método B1-B2 del Apéndice 8.","objetivos":["Al terminar, el estudiante podrá organizar las entregas del trabajo escalonado de una estación de servicio en acero según los requisitos del curso.","Al terminar, el estudiante podrá evaluar el efecto de una perforación en el alma sobre la resistencia al corte y dimensionar una platabanda de refuerzo.","Al terminar, el estudiante podrá explicar el origen de las ecuaciones de interacción de flexocompresión a partir de la superposición de esfuerzos.","Al terminar, el estudiante podrá aplicar las ecuaciones H1-1a y H1-1b del AISC 360 identificando Pr, Mr, Pc y Mc.","Al terminar, el estudiante podrá describir cómo incluir el efecto P-Δ en SAP2000 y el método aproximado B1-B2 del Apéndice 8."],"temas":[{"titulo":"Trabajo escalonado: estación de servicio en acero","contenido":"El trabajo, publicado en el aula virtual, se desarrolla en grupos de tres alumnos que pueden repartirse las estructuras o las partes del trabajo. El proyecto es una estación de servicio (grifo) en acero con: la góndola, donde están los surtidores (puede ser de un piso o de doble altura, recta, curva o en voladizo); tiendas en un edificio de dos niveles; y servicios (lavado, cambio de aceite, llantería), que también pueden tener dos niveles. Se ubica en el distrito más vulnerable sísmicamente de los integrantes (por ejemplo, Chorrillos frente a Rímac o Lince), con uso de estación de servicio y suelo flexible (el peor caso, salvo que vivan en zonas de suelo bueno como el centro de Lima o el Rímac). Se consideran cargas muerta, viva, de sismo y de viento. La distancia mínima entre columnas, L, se obtiene sumando los últimos dígitos de los códigos de los tres integrantes (en el ejemplo 1 + 4 + 3 = 8 m), y toda la modulación debe ser múltiplo β·L (β = 1/2, 1/4, 2, 3...), algo que se exigirá estrictamente y que debe sustentarse ante el profesor de práctica. Las vigas y columnas deben ser secciones soldadas armadas (no perfiles W) y las góndolas se diseñan con reticulados. El área del terreno y la configuración son libres: se puede basar en un grifo existente, pero adaptándolo a la modulación. El profesor mostró ejemplos: el grifo de su barrio (llantería, pizzería, lavandería, tienda y dos góndolas), el grifo Kio de la Panamericana (supermercado, panadería, oficinas de tres pisos y bungalows para camioneros), un antiguo grifo en la avenida Faucett y grifos japoneses en esquina con tijerales cruzados y góndola en voladizo. Los talleres de cambio de aceite pueden tener gata elevadora (doble altura) o zanja.","formulas":[{"nombre":"Modulación","expresion":"Luz = β·L, con L = suma de los últimos dígitos de los códigos (m)","variables":"β: múltiplo o fracción (1/2, 1/4, 1, 2, 3...)"}],"referencias_norma":["Norma E.020 (cargas)","Norma E.030 (diseño sismorresistente)","Norma E.090 (estructuras metálicas)"]},{"titulo":"Entregables del trabajo escalonado","contenido":"Primera entrega (el lunes siguiente; se movió del domingo al lunes por las elecciones): planteamiento de la forma estructural, en un esquema que puede ser a mano alzada, con ejes (A, B, C... y 1, 2, 3...), es decir, el replanteo, más las cargas de gravedad (techo, sobrecarga según la norma de cargas, por ejemplo 100 kg/m² y 200 kg/m² según el uso), de sismo (a partir del peso de cada edificio) y de viento. Se estima que puede hacerse en unas tres horas si no se deja para la última noche. Segunda entrega: modelo estructural en SAP2000 con combinaciones de sismo, gravedad y viento, y diseño de vigas y columnas. Tercera entrega: diseño de las placas colaborantes (losa colaborante), plano en planta, plano en corte, detalles básicos, planilla de perfiles para estimar el peso y evaluación del costo aproximado del casco de acero, más un resumen de seis páginas. Las entregas son acumulativas: cada una incluye las anteriores corregidas, mostrando la evolución del proyecto. No hay exposición: el resumen de seis páginas hace las veces de sustentación, y el profesor descontaría al menos 8 puntos si falta. Las fechas cierran a las 11:59 p. m. del día indicado (se mencionaron el 7/6, el 27/6 y el 10/7).","formulas":[],"referencias_norma":["Norma E.020 (sobrecargas)"]},{"titulo":"Corrección de la hoja de corte (campo de tensiones)","contenido":"Un alumno detectó que en la hoja Excel de la clase 15/16 la celda de la relación 2Aw/(Afc + Aft) estaba mal escrita: al multiplicar por 2, por la precedencia de operadores, se multiplicaba todo el cociente. Como las áreas de ala son iguales, la relación correcta para la viga 12 × ¾ / 33 × 5/16 in es 2·10.31/(9 + 9) ≈ 1.15 < 2.5, de modo que se cumple la condición para usar la expresión de campo de tensiones con 1.15√(1 + (a/h)²), sin el término a/h sumado en el denominador. Con ello la resistencia de diseño sube a unos 195 kips. El profesor agradeció la revisión y explicó que a propósito entrega hojas que pueden tener errores para que el alumno que estudia las revise y no las use a ciegas en la práctica. Relató casos del examen parcial (una entrega casi en blanco, calificada con 0.2, y archivos ilegibles) y pidió usar conversores confiables o fotos claras, pues se dan 15 minutos para armar la entrega.","formulas":[{"nombre":"Relación de áreas","expresion":"2·Aw/(Afc + Aft) ≤ 2.5","variables":"Aw = h·tw; Afc, Aft: áreas de ala en compresión y tracción"},{"nombre":"Vn con campo de tensiones","expresion":"Vn = 0.6·Fy·Aw·[Cv2 + (1 − Cv2)/(1.15·√(1 + (a/h)²))]","variables":"Para el ejemplo: Cv2 = 0.935, a/h = 1 → Vn ≈ 217 kips, φVn ≈ 195 kips"}],"referencias_norma":["AISC 360-16 G2.2, ecuación G2-7"]},{"titulo":"Perforaciones en el alma de vigas para tuberías","contenido":"La viga se diseña para que Vu ≤ φVn en cada sección, con base en el área del alma. En los edificios pasan tuberías de agua, desagüe, ductos de aire acondicionado y redes; los desagües, que trabajan por gravedad, necesitan pendiente mínima y a veces obligan a atravesar las vigas, por lo que el ingeniero sanitario pedirá perforarlas. Ese detalle de perforación debe aparecer en los planos para que el maestro de obra lo ejecute. Reglas: donde haya un agujero se coloca un par de atiesadores a ambos lados ('es de ley'). Si el hueco tiene diámetro d, el alma remanente es (h − d)·tw y hay que verificar si φVn sigue siendo mayor que Vu. Si no lo es, se agrega una platabanda que aumenta el espesor en esa zona (por ejemplo, duplicando tw) para elevar el corte resistente. La perforación puede evitarse: en edificios de oficinas con vigas metálicas suele haber un falso cielo raso suspendido mediante una parrilla, y el espacio entre la viga y el cielo raso permite colgar las tuberías bajo la viga con abrazaderas y ángulos, sin perforarla. La altura libre que se ve no es la altura de análisis: el techo (placa colaborante) está sobre la viga.","formulas":[{"nombre":"Área de alma en la sección perforada","expresion":"Aw,net = (h − d)·tw","variables":"d: diámetro o altura de la perforación"},{"nombre":"Área con platabanda","expresion":"Aw,ref = (h − d)·(tw + tp)","variables":"tp: espesor de platabanda; se verifica φ·0.6·Fy·Aw,ref·Cv ≥ Vu"}],"referencias_norma":["AISC Design Guide 2 (aberturas en almas de vigas), como referencia complementaria"]},{"titulo":"Flexocompresión: superposición de esfuerzos, efecto P-Δ e interacción","contenido":"Todos los elementos trabajan en realidad en flexocompresión o flexotracción; en las vigas predominan los momentos y la carga axial es pequeña, por lo que se diseñan por flexión, pero en las columnas, sobre todo de los primeros pisos, hay mucho momento, cortante y carga axial a la vez, y debe aplicarse el Capítulo H. Se toma como ejemplo un tubo cuadrado B × B × t en voladizo (como el poste de un aviso publicitario) con carga axial P y carga lateral H. El esfuerzo axial es P/A y el de flexión M/S con M = H·L. Pero al desplazarse el extremo una cantidad Δ por la carga lateral, P queda excéntrica y aparece el momento de segundo orden P·Δ, que se suma: el momento requerido Mr debe incluir el efecto P-Δ. Los programas lo calculan solo si se les indica; de lo contrario dan momentos de primer orden. En un punto cualquiera del tubo actúan esfuerzos en las tres direcciones, pero se consideran preponderantes los axiales y de flexión. Si el límite es la fluencia: P/A + M/S ≤ Fy, es decir (P/A)/Fy + (M/S)/Fy ≤ 1; como Fy·A = Py y Fy·S = My, se obtiene la fórmula de interacción P/Py + M/My ≤ 1. Al graficar M/My en abscisas y P/Py en ordenadas, la línea límite separa la zona de diseño (interior) de la de falla (exterior); un valor unitario indica que se está en el límite.","formulas":[{"nombre":"Esfuerzo combinado","expresion":"σ = P/A + Mr/S ≤ Fy, con Mr = H·L + P·Δ","variables":"Δ: desplazamiento lateral del extremo; S: módulo de sección"},{"nombre":"Interacción lineal elemental","expresion":"P/Py + M/My ≤ 1","variables":"Py = Fy·A; My = Fy·S"}],"referencias_norma":["AISC 360-16 Cap. H","AISC 360-16 Cap. C (análisis de segundo orden)"]},{"titulo":"Ecuaciones de interacción del AISC (H1-1a y H1-1b)","contenido":"La norma plantea dos ecuaciones según la relación Pr/Pc. Pr, Mrx y Mry son las resistencias requeridas obtenidas del análisis estructural con efecto P-Δ (análisis de segundo orden). Pc = φPn es la resistencia axial disponible (Capítulo E en compresión o Capítulo D en tracción) y Mcx = φMnx, Mcy = φMny son las resistencias a flexión del Capítulo F, todas ya conocidas por los alumnos. Si Pr/Pc ≥ 0.2 se usa la ecuación con 8/9 multiplicando la suma de las relaciones de flexión; si Pr/Pc < 0.2 se usa la mitad de la relación axial más las relaciones de flexión directas. El resultado es una superficie de interacción bilineal con quiebre en 0.2; los puntos interiores son diseños aceptables, los exteriores fallas y la frontera es el límite. Existen fórmulas de interacción de diversos autores, pero se deben usar las de la norma.","formulas":[{"nombre":"Ecuación H1-1a","expresion":"Si Pr/Pc ≥ 0.2: Pr/Pc + (8/9)·(Mrx/Mcx + Mry/Mcy) ≤ 1.0","variables":"Pc = φc·Pn; Mcx = φb·Mnx; Mcy = φb·Mny"},{"nombre":"Ecuación H1-1b","expresion":"Si Pr/Pc < 0.2: Pr/(2·Pc) + (Mrx/Mcx + Mry/Mcy) ≤ 1.0","variables":"Pr, Mr: resistencias requeridas que incluyen efectos de segundo orden"}],"referencias_norma":["AISC 360-16 H1.1, ecuaciones H1-1a y H1-1b"]},{"titulo":"Efecto P-Δ en SAP2000 y método aproximado del Apéndice 8 (B1-B2)","contenido":"Se proyectó un tutorial de SAP2000 con dos formas de incluir P-Δ: (1) crear un caso de carga estático no lineal con P-Δ para cada combinación (limitado a análisis estáticos); (2) crear un caso inicial P-Δ con las cargas de gravedad esperadas y usar su matriz de rigidez modificada para todos los demás casos lineales, incluidos espectro de respuesta y tiempo-historia. En el ejemplo, una columna con carga muerta de 100 kips y carga lateral de 10 kips en la parte superior: el análisis de primer orden da un momento de unos 1200 kip·in, mientras que con P-Δ el desplazamiento lateral llega a 3.48 in y el momento a 1548 kip·in, por el ablandamiento que produce la compresión. Ambos métodos dan prácticamente lo mismo; el profesor recomienda el segundo. Como alternativa manual, el Apéndice 8 del AISC presenta el método aproximado de segundo orden: se separan, para una combinación como 1.2D ± E + 0.5L + 0.2S, las cargas de gravedad (análisis NT, sin traslación lateral) y las laterales (análisis LT, con traslación lateral), ambos de primer orden. Luego Mr = B1·Mnt + B2·Mlt y Pr = Pnt + B2·Plt. B1 depende de Cm y de la carga crítica del elemento; B2 depende de la carga total del entrepiso y su rigidez lateral. Se calcula primero B2, luego Pr y con Pr se obtiene B1. El profesor deja como lectura este método y cuenta la anécdota de un colega japonés cuya laptop falló por la altura en Puno y dio la charla en pizarra: lo que uno sabe lo lleva consigo, y con lápiz y papel este método se resuelve a mano.","formulas":[{"nombre":"Momento amplificado","expresion":"Mr = B1·Mnt + B2·Mlt","variables":"Mnt: momento del análisis sin traslación lateral; Mlt: momento por traslación lateral"},{"nombre":"Carga axial amplificada","expresion":"Pr = Pnt + B2·Plt","variables":"Pnt, Plt: cargas axiales de los análisis NT y LT"},{"nombre":"Factor B1","expresion":"B1 = Cm/(1 − α·Pr/Pe1) ≥ 1, con Cm = 0.6 − 0.4·(M1/M2)","variables":"α = 1.0 (LRFD) o 1.6 (ASD); Pe1 = π²EI*/(K1·L)²"},{"nombre":"Factor B2","expresion":"B2 = 1/(1 − α·Pstory/Pe,story) ≥ 1","variables":"Pstory: carga vertical total del entrepiso; Pe,story: resistencia crítica al pandeo por desplazamiento lateral del entrepiso"}],"referencias_norma":["AISC 360-16 Apéndice 8 (ecuaciones A-8-1 a A-8-7)","AISC 360-16 Cap. C"]}],"ejemplos":[{"titulo":"Determinación de la luz de modulación del trabajo escalonado","enunciado":"Tres alumnos tienen códigos cuyos últimos dígitos son 1, 4 y 3. Determinar la luz base L y una modulación posible.","pasos":["L = 1 + 4 + 3 = 8 m","Góndola y tienda modulada a 8 m; columnas intermedias a β·L = 4 m (β = 1/2)","Tienda de 12 × 8 m: ejes a 4 m (3 × 4 m) y 8 m"],"resultado":"Luz base L = 8 m; todas las dimensiones deben ser múltiplos β·L."},{"titulo":"Efecto P-Δ en una columna en voladizo (tutorial SAP2000)","enunciado":"Columna en voladizo con carga muerta de 100 kips y carga lateral de 10 kips en el extremo superior. Comparar el análisis de primer orden y el análisis con P-Δ.","pasos":["Análisis lineal (primer orden): M base ≈ 1200 kip·in","Caso estático no lineal con P-Δ (D + lateral, factores 1.0): desplazamiento 3.48 in, M base ≈ 1548 kip·in","Método 2: caso inicial P-Δ con la carga muerta y caso lineal con su rigidez: resultados prácticamente iguales (≈ 1548 kip·in)"],"resultado":"El efecto de segundo orden incrementa el momento ≈ 29% (de 1200 a 1548 kip·in)."},{"titulo":"Corrección de la resistencia al corte con campo de tensiones","enunciado":"Viga A36 con alas 12 × ¾ in, alma 33 × 5/16 in, a = h, Cv2 = 0.935. Recalcular con la relación de áreas corregida.","pasos":["2Aw/(Afc+Aft) = 2·10.31/18 = 1.15 ≤ 2.5; h/bf = 2.75 ≤ 6","Vn = 0.6·36·10.31·[0.935 + 0.065/(1.15·√2)] ≈ 222.7·0.975 ≈ 217 kips","φVn = 0.9·217 ≈ 195 kips > Vu = 105 kips"],"resultado":"φVn ≈ 195 kips (antes 213.48 nominal por el error de la hoja)."}],"conceptos_clave":[{"termino":"Góndola","definicion":"En una estación de servicio, la cubierta bajo la cual se ubican los surtidores de combustible."},{"termino":"Trabajo escalonado","definicion":"Trabajo grupal entregado en etapas acumulativas, donde cada entrega incluye y corrige las anteriores."},{"termino":"Platabanda en perforación","definicion":"Plancha adosada al alma alrededor de un hueco para recuperar el área de corte perdida (h − d)·tw."},{"termino":"Efecto P-Δ","definicion":"Momento adicional de segundo orden P·Δ que aparece cuando la carga axial actúa sobre la configuración desplazada lateralmente."},{"termino":"Diagrama de interacción","definicion":"Representación P/Pc vs M/Mc cuya frontera separa combinaciones de diseño (interiores) de combinaciones de falla (exteriores)."},{"termino":"Análisis NT / LT","definicion":"Análisis de primer orden sin traslación lateral (cargas de gravedad) y con traslación lateral (cargas laterales), usados en el método B1-B2."},{"termino":"B1 y B2","definicion":"Factores de amplificación del Apéndice 8 del AISC: B1 para el efecto P-δ del miembro y B2 para el efecto P-Δ del entrepiso."},{"termino":"Caso inicial P-Δ","definicion":"Caso no lineal con las cargas de gravedad cuya rigidez modificada se usa en los demás casos lineales del modelo en SAP2000."}],"preguntas":[{"pregunta":"En el trabajo escalonado, las vigas y columnas deben diseñarse como:","opciones":["Perfiles W laminados","Secciones soldadas armadas","Perfiles tubulares","Secciones de concreto armado"],"correcta":1,"explicacion":"Se exige usar secciones armadas soldadas; las góndolas se resuelven con reticulados."},{"pregunta":"Si se perfora el alma con un agujero de altura d, el área de corte remanente es:","opciones":["h·tw","(h + d)·tw","d·tw","(h − d)·tw"],"correcta":3,"explicacion":"Se pierde el material del hueco; queda (h − d)·tw."},{"pregunta":"¿Qué alternativa evita perforar las vigas para una tubería de desagüe en un edificio de oficinas?","opciones":["Colocar atiesadores","Reducir la pendiente a cero","Suspender la tubería bajo la viga en el es
