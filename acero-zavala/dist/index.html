":"Componentes y configuración de un galpón (nave industrial)","contenido":"El galpón o nave industrial es una estructura frecuente en minas, iglesias, cines, depósitos y hasta coliseos. Su tamaño se define a partir de la luz que debe cubrir. Se plantean columnas (por ejemplo, columnas de sección cajón) en los puntos A y B de un eje 1, y se repite la misma configuración en los ejes 2, 3, 4... hasta cubrir la longitud en la otra dirección. Sobre las columnas de cada eje se apoya un tijeral metálico. Como un tijeral aislado se volcaría con un simple empuje lateral, los tijerales se unen entre sí mediante viguetas. Se recomienda colocar viguetas dobles en el borde (eje de apoyo), en la cumbrera y en ejes intermedios cada dos o tres paños, y viguetas simples en los ejes restantes; si el número de paños es impar la distribución no resulta perfectamente regular. Los ejes de las viguetas se designan con letras (A, B, C... con la cumbrera en el eje central F) y la separación entre ellos sobre el faldón determina la longitud útil de la cobertura. Además se necesitan arriostres de conjunto, porque sin ellos un viento fuerte o un sismo tumba la estructura, que es muy liviana. Los arriostres de conjunto se colocan en forma de diagonales en el plano de la brida comprimida, entre las líneas de viguetas dobles. Ante la pregunta de un alumno (Lucano), el profesor precisa que bajo cargas de gravedad el tijeral se deforma como una viga: la brida superior queda en compresión y la inferior en tracción, por lo que normalmente se arriostra la superior; pero en otros casos, como un voladizo o una inversión de esfuerzos, la brida comprimida cambia y el arriostre debe ubicarse donde esté la compresión. Los miembros del tijeral son: brida inferior (cordón horizontal), brida superior (cordones inclinados que forman el triángulo), montantes (verticales) y diagonales.","formulas":[],"referencias_norma":[]},{"titulo":"Geometría y predimensionamiento del tijeral","contenido":"En el ejemplo de clase la luz es L = 24 m y la altura de columna 12 m. El peralte total del tijeral en la cumbrera se predimensiona como H = L/11, criterio válido para Lima (clima seco con pendientes pequeñas); para otras ciudades se debe trabajar con el peralte y la pendiente requerida por la cobertura según la lluvia. El tijeral puede tener un peralte en el apoyo (h, por ejemplo con 'ventana' o montante extremo) además de la parte inclinada; un tijeral con peralte en los apoyos resulta más económico porque tiene mejor brazo de palanca que uno que termina en punta (peralte cero en el apoyo, que sale antieconómico). La altura de la cumbrera es la altura de columna más el peralte H. El ángulo de inclinación α del faldón se obtiene del triángulo formado por el peralte y la semiluz: tan α = H/(L/2). Para L = 24 m, H = 24/11 = 2.18 m y α = arctan(2.18/12) ≈ 10°. Para el depósito del Callao (L = 28.6 m) se usa H = 28.6/11 = 2.60 m; con una pendiente mínima de 10 % sobre la semiluz de 14.3 m, la parte inclinada sube unos 1.40 m, de modo que el peralte en el apoyo es h ≈ 2.60 − 1.40 = 1.20 m.","formulas":[{"nombre":"Peralte del tijeral (Lima)","expresion":"H ≈ L / 11","variables":"H: peralte total en la cumbrera (m); L: luz del tijeral (m)"},{"nombre":"Ángulo del faldón","expresion":"α = arctan( H / (L/2) )","variables":"H: altura de la parte inclinada; L/2: semiluz"},{"nombre":"Altura de cumbrera","expresion":"H̄ = Hcol + H","variables":"Hcol: altura de la columna; H: peralte en la cumbrera"}],"referencias_norma":[]},{"titulo":"Cálculo de cargas de viento en un galpón (Piura)","contenido":"Galpón de 24 m de luz, columnas de 12 m y α ≈ 10°, en Piura con velocidad básica V = 120 km/h (mayor que el mínimo de 75 km/h de la norma). La velocidad se corrige con la altura: para las paredes se usa la altura de columna (12 m > 10 m) y para los faldones la altura de la cumbrera (12 + 2.182 = 14.182 m). Los coeficientes se obtienen de la Tabla 4 de la E.020 (presión exterior) y de la Tabla 5 (presión interior, ±0.3 si hay aberturas por donde entra el viento). Superficie A (pared a barlovento): Cpe = +0.8. Superficie B (pared a sotavento): Cpe = −0.6. Superficie C (faldón a barlovento, < 15°): Cpe = +0.3 o −0.7. Superficie D (faldón a sotavento): Cpe = −0.6. Con Cpi = +0.3: A: 0.8 − 0.3 = 0.5; B: −0.6 + 0.3 = −0.3 (según se tomó en clase); C: 0.3 − 0.3 = 0 o −0.7 − 0.3 = −1.0; D: −0.6 + 0.3 = −0.3. Se adoptan los más desfavorables de la clase: A = 0.5, B = −0.3, C = −1.0, D = −0.3. Las presiones resultan ph = 0.005·C·Vh²: A = +39 kg/m² (presión), B = −23.4 kg/m², C = −83.96 kg/m² y D = −25.2 kg/m² (succiones). El profesor señala que se puede trabajar con velocidad variable o con la más desfavorable en todo el elemento, y que en un programa comercial estas posibilidades se ingresan como estados de carga distintos según los lados atacados por el viento. También reprende a quien no encontraba los coeficientes: las tablas 5.4 y 5.5 estaban en las diapositivas de la clase anterior y deben leerse.","formulas":[{"nombre":"Velocidad de diseño","expresion":"Vh = V·(h/10)^0.22","variables":"V: velocidad básica (km/h); h: altura (m)"},{"nombre":"Presión de viento","expresion":"ph = 0.005·C·Vh²","variables":"ph en kg/m²; C = Cpe − Cpi; Vh en km/h"}],"referencias_norma":["Norma E.020, Artículo 12 (viento)","Norma E.020, Tabla 4 (coeficientes de forma) y Tabla 5 (presión interior)"]},{"titulo":"Definición de las dimensiones útiles del galpón a partir del terreno y del cliente","contenido":"El área del terreno no es el área del tijeral. Primero se verifican las dimensiones del lote (largo y ancho) con la ficha registral de Registros Públicos, por razones legales: no se puede invadir el terreno vecino. Además, el lote no siempre es rectangular; si tiene forma irregular, habrá varios tipos de tijerales distintos y no se puede presupuestar replicando uno solo. Luego se descuentan las áreas que exige el cliente, quien es el que paga y define el programa. En el ejemplo, el cliente pide: jardines con árboles (ecoamigable) para el descanso de los trabajadores, 2 m de ancho en los costados y al fondo; circulación interior y exterior de cargadores frontales, unos 3 m según la marca; una rampa de descarga de al menos 6 m; estacionamiento de camiones de 7 m frente a la nave; y un cerco perimétrico de ladrillo en soga (≈ 15 cm) con columnas de al menos 30 × 30 cm, más la puerta (≈ 30 cm). Así, a cada costado se descuentan 2 + 3 + 0.30 = 5.30 m, al fondo 5.30 m y en el frontis 6 + 7 + 0.30 = 13.30 m. En el ejemplo de un depósito en la Av. Argentina (Callao), las dimensiones útiles resultaron 28.60 m de ancho (luz del tijeral) y 109 m de largo, por lo que el terreno debió ser de 28.60 + 2 × 5.30 = 39.20 m de ancho y 109 + 5.30 + 13.30 = 127.60 m de largo. Se recalca que al tamaño del tijeral se llega conversando con el cliente.","formulas":[{"nombre":"Ancho del terreno","expresion":"B_terreno = L_tijeral + 2·(jardín + circulación + cerco)","variables":"L_tijeral: luz útil; descuentos laterales (2 + 3 + 0.30 m en el ejemplo)"},{"nombre":"Largo del terreno","expresion":"S_terreno = S_útil + descuento_fondo + descuento_frontis","variables":"descuento_fondo = 5.30 m; descuento_frontis = 13.30 m (rampa, camiones, puerta)"}],"referencias_norma":[]},{"titulo":"Separación y número de pórticos","contenido":"La separación entre pórticos o armaduras, s, debe estar entre 5 y 7 m; fuera de ese rango la estructura sale cara. El valor óptimo es cercano a 6 m, según un estudio del propio profesor publicado en la Revista del Ingeniero Civil del Colegio de Ingenieros (diciembre de 1990) para condiciones de Lima. Como casi nunca resulta exactamente 6 m, se asume (tantea) un número de pórticos n y se calcula s = longitud/(n − 1), iterando hasta quedar en el rango. En el ejemplo, con una longitud de 109 m y n = 20 armaduras, s = 109/19 = 5.737 m; con 19 o 18 armaduras se obtendrían otros valores. La separación elegida define también la luz de las viguetas y el ancho tributario de cada tijeral: separaciones mayores reducen el número de tijerales y columnas pero obligan a viguetas más peraltadas y pesadas, mientras que separaciones menores multiplican tijerales, columnas, cimentaciones y conexiones; el óptimo económico surge del balance entre ambos efectos. El número de pórticos es la variable de tanteo, y se recomienda resolverlo en una hoja de cálculo.","formulas":[{"nombre":"Separación entre pórticos","expresion":"s = Lnave / (n − 1), con 5 m ≤ s ≤ 7 m (óptimo ≈ 6 m)","variables":"Lnave: longitud útil de la nave (m); n: número de pórticos o armaduras"}],"referencias_norma":[]},{"titulo":"Cobertura: pendiente mínima, traslapes y número de planchas","contenido":"La pendiente del techo la fija el tipo de cobertura y la región, para que el agua escurra; si se empoza, pone en riesgo una estructura tan delgada y liviana. El profesor presenta una tabla de traslapes y pendientes mínimas para planchas de fibrocemento (Eternit) y calamina en costa seca, costa norte, sierra y selva; para otras coberturas (canalón, Precor PTR, etc.) rige lo que recomienda el fabricante. Para Lima (costa seca) se usa una pendiente mínima del 10 % y un traslape de 13 a 16 cm (se toma 13 cm). La longitud inclinada del faldón, Q, se obtiene por Pitágoras con la semiluz entre ejes (14 m) y la subida (1.40 m): Q ≈ 14.07 m. La longitud útil de una plancha es su longitud menos medio traslape a cada lado, es decir, menos un traslape completo cuando la cobertura es modular: una plancha de 6 pies (6 × 12 × 2.54 ≈ 183 cm) tiene 183 − 13 = 170 cm útiles, y una de 7 pies (≈ 213 cm) tiene 200 cm útiles. Combinar planchas es un tanteo que conviene hacer en hoja de cálculo: cantidad de cada tipo, longitud parcial y diferencia con Q. En el ejemplo se eligieron 6 planchas de 6 pies y 2 de 7 pies (6 × 170 + 2 × 200 = 1420 cm), con un exceso de unos 13 cm que se reparte proporcionalmente aumentando los traslapes. En la cumbrera se coloca un accesorio tipo 'sombrero' fijado con tirafones a la vigueta, por lo que se descuentan unos 10 cm de la longitud a cubrir.","formulas":[{"nombre":"Longitud inclinada del faldón","expresion":"Q = √( (L/2)² + Hinc² )","variables":"L/2: semiluz entre ejes de columnas (m); Hinc: subida del faldón (m)"},{"nombre":"Longitud útil de plancha","expresion":"Lútil = Lplancha − t/2 − t/2 = Lplancha − t","variables":"Lplancha: longitud nominal (cm); t: traslape (cm)"},{"nombre":"Condición de cobertura","expresion":"Σ ni·Lútil,i ≥ Q − descuento cumbrera","variables":"ni: número de planchas del tipo i; descuento de cumbrera ≈ 10 cm"}],"referencias_norma":["Recomendaciones del fabricante de coberturas (Eternit, Precor)"]},{"titulo":"Estimación de cargas por pórtico","contenido":"Para el galpón se consideran: peso de las planchas de fibrocemento 15 kg/m² y peso de la estructura metálica 20 kg/m², valor típico para tijerales de 20 a 30 m de luz (a lo más 25 kg/m²). La carga muerta resulta 35 kg/m² y la carga viva de techo 30 kg/m². Si se tomara solo la muerta más 15 kg/m² se estaría por defecto; lo crítico es D + L = 35 + 30 = 65 kg/m². Multiplicando por el ancho tributario de cada pórtico, s = 5.737 m, se obtiene la carga de servicio lineal w = 65 × 5.737 ≈ 372.9 kg/m. Esta carga de servicio no es la carga última, pero siempre hay que conocerla porque con ella se verifican las deflexiones; con ella se pueden empezar los tanteos de diseño del tijeral. Para el diseño, a estas cargas se aplican los factores de la combinación gravitacional (1.2 para la muerta y 1.6 para la viva de techo) y se agregan los estados de viento calculados previamente, que en galpones livianos con grandes succiones pueden controlar el diseño e incluso invertir los esfuerzos en las bridas.","formulas":[{"nombre":"Carga lineal de servicio por pórtico","expresion":"w = (D + Lr)·s","variables":"D: carga muerta (kg/m²); Lr: carga viva de techo (kg/m²); s: separación entre pórticos (m)"},{"nombre":"Carga última (combinación gravitacional)","expresion":"wu = 1.2·D + 1.6·L","variables":"D y L como cargas lineales (kg/m)"}],"referencias_norma":["Norma E.020 (carga viva de techo 30 kg/m² para coberturas livianas)","Norma E.090, Sección 1.4 / AISC 360 B2 (combinaciones)"]},{"titulo":"Prediseño de una vigueta de celosía","contenido":"La vigueta se apoya sobre la brida superior de dos tijerales consecutivos (por ejemplo, los de los ejes 4 y 5). Aunque la separación entre ejes es 5.737 m, para el cálculo se usa una luz de 5.50 m, porque la vigueta no llega a los ejes sino a las caras de apoyo. Se factoriza la carga con 1.2 de la muerta y 1.6 de la viva (en este ejemplo con valores de 40 y 30 kg/m² aproximadamente) y se obtiene wu = 136 kg/m. El peralte de la vigueta se predimensiona como la luz entre 20 (≈ 0.275 m, se usa 0.25 m). La vigueta se modela como una viga simplemente apoyada: el momento máximo es Mu = wu·L²/8 y se descompone en un par de fuerzas, compresión en la brida superior y tracción en la inferior, separadas por un brazo de aproximadamente 0.95 del peralte. Así, Tu = Mu/(0.95·d) = 2165 kg. Para la brida inferior se usa barra lisa de acero A36 (Fy = 36 ksi ≈ 2530 kg/cm²). Por fluencia en el área bruta, Tu ≤ φ·Pn = 0.90·Fy·Ag, con lo que se requiere Ag ≥ 2165/(0.90 × 2530) ≈ 0.95 cm². Como ese valor no es comercial, se elige una barra lisa de 1/2\" (Ag = 1.27 cm²). La brida comprimida y las diagonales se verán con el tema de compresión; la fuerza en una diagonal puede estimarse a mano con la longitud de la diagonal, el peralte y la inclinación, sin necesidad de computadora. De esta forma se obtiene una celosía muy económica con elementos pequeños.","formulas":[{"nombre":"Peralte de vigueta","expresion":"d ≈ L / 20","variables":"L: luz de la vigueta (m)"},{"nombre":"Momento último en viga simplemente apoyada","expresion":"Mu = wu·L² / 8","variables":"wu: carga última lineal (kg/m); L: luz (m)"},{"nombre":"Fuerza en las bridas","expresion":"Tu = Cu = Mu / (0.95·d)","variables":"d: peralte de la vigueta (m); 0.95d: brazo de palanca aproximado"},{"nombre":"Fluencia en área bruta (tracción)","expresion":"Tu ≤ φt·Pn = 0.90·Fy·Ag  →  Ag ≥ Tu / (0.90·Fy)","variables":"Fy: esfuerzo de fluencia (kg/cm²); Ag: área bruta (cm²); φt = 0.90"}],"referencias_norma":["AISC 360-16, Sección D2, ecuación D2-1 (Pn = Fy·Ag, φt = 0.90)"]}],"ejemplos":[{"titulo":"Cargas de viento en un galpón en Piura","enunciado":"Galpón de luz L = 24 m, peralte del tijeral H = L/11, columnas de 12 m, ubicado en Piura con V = 120 km/h. Coeficientes: pared barlovento +0.8, pared sotavento −0.6, faldón barlovento +0.3/−0.7, faldón sotavento −0.6, presión interior ±0.3. Calcular las presiones de diseño en cada superficie.","pasos":["H = 24/11 = 2.182 m; α = arctan(2.182/12) ≈ 10.3° < 15°.","Paredes (h = 12 m): Vh = 120·(12/10)^0.22 = 120 × 1.041 = 124.9 km/h.","Faldones (h = 12 + 2.182 = 14.182 m): Vh = 120·(14.182/10)^0.22 = 120 × 1.080 = 129.58 km/h.","Coeficientes netos adoptados: A = 0.8 − 0.3 = 0.5; B = −0.6 + 0.3 = −0.3; C = −0.7 − 0.3 = −1.0; D = −0.6 + 0.3 = −0.3.","A: ph = 0.005 × 0.5 × 124.9² = 39.0 kg/m² (presión).","B: ph = 0.005 × (−0.3) × 124.9² = −23.4 kg/m² (succión).","C: ph = 0.005 × (−1.0) × 129.58² = −83.96 kg/m² (succión).","D: ph = 0.005 × (−0.3) × 129.58² = −25.2 kg/m² (succión)."],"resultado":"Pared barlovento +39 kg/m²; pared sotavento −23.4 kg/m²; faldón barlovento −84 kg/m²; faldón sotavento −25.2 kg/m²."},{"titulo":"Dimensiones del terreno, número de pórticos y cobertura de un depósito en el Callao","enunciado":"Depósito con dimensiones útiles de 28.60 m (luz) × 109 m (largo). Descuentos: 5.30 m a cada costado y al fondo, 13.30 m en el frontis. Determinar el terreno necesario, la separación entre pórticos con 20 armaduras, la geometría del tijeral con pendiente mínima de 10 % y la combinación de planchas de 6 y 7 pies con traslape de 13 cm.","pasos":["Ancho de terreno: 28.60 + 2 × 5.30 = 39.20 m; largo: 109 + 5.30 + 13.30 = 127.60 m.","Separación: s = 109/(20 − 1) = 5.737 m (dentro de 5 a 7 m).","Peralte: H = 28.6/11 = 2.60 m; subida del faldón con 10 % sobre ≈ 14 m: ≈ 1.40 m; peralte en apoyo h = 2.60 − 1.40 = 1.20 m.","Longitud inclinada: Q = √(14² + 1.40²) = 14.07 m.","Longitud útil: plancha de 6' = 183 − 13 = 170 cm; plancha de 7' = 213 − 13 = 200 cm.","Tanteo: 6 × 170 + 2 × 200 = 1420 cm ≥ 1407 cm; el exceso (≈ 13 cm) se reparte en los traslapes; se considera además ≈ 10 cm de descuento por cumbrera."],"resultado":"Terreno 39.20 × 127.60 m; s = 5.737 m; H = 2.60 m (h = 1.20 m); Q = 14.07 m; 6 planchas de 6' + 2 planchas de 7' por faldón."},{"titulo":"Carga de servicio por pórtico","enunciado":"Cobertura de fibrocemento 15 kg/m², estructura metálica 20 kg/m², carga viva de techo 30 kg/m², separación entre pórticos 5.737 m. Calcular la carga lineal de servicio sobre cada tijeral.","pasos":["D = 15 + 20 = 35 kg/m²; L = 30 kg/m².","D + L = 65 kg/m².","w = 65 × 5.737 = 372.9 kg/m."],"resultado":"w de servicio ≈ 373 kg/m por tijeral (para verificar deflexiones)."},{"titulo":"Predimensionamiento de la brida inferior de una vigueta de celosía","enunciado":"Vigueta de celosía de luz de cálculo 5.50 m, carga última wu = 136 kg/m, peralte 0.25 m, brida inferior de barra lisa A36 (Fy = 2530 kg/cm²). Determinar la barra necesaria.","pasos":["Mu = wu·L²/8 = 136 × 5.50²/8 = 514.3 kg·m.","Brazo: 0.95 × 0.25 = 0.2375 m.","Tu = 514.3/0.2375 = 2165 kg.","Ag ≥ Tu/(0.90·Fy) = 2165/(0.90 × 2530) = 0.95 cm².","Se elige el valor comercial inmediato superior: barra lisa de 1/2\" con Ag = 1.27 cm²."],"resultado":"Brida inferior: barra lisa de 1/2\" de acero A36 (1.27 cm² ≥ 0.95 cm²)."}],"conceptos_clave":[{"termino":"Galpón / nave industrial","definicion":"Estructura de una planta con tijerales sobre columnas que cubre grandes luces; usada en minas, depósitos, iglesias, coliseos."},{"termino":"Tijeral","definicion":"Armadura metálica triangulada que salva la luz del galpón y se apoya en las columnas."},{"termino":"Brida superior e inferior","definicion":"Cordones del tijeral o vigueta; bajo gravedad la superior trabaja en compresión y la inferior en tracción."},{"termino":"Montante","definicion":"Miembro vertical del tijeral."},{"termino":"Diagonal","definicion":"Miembro inclinado del alma del tijeral que conecta las bridas."},{"termino":"Vigueta","definicion":"Elemento (a menudo de celosía) que une los tijerales y soporta la cobertura; puede ser simple o doble."},{"termino":"Arriostre de conjunto","definicion":"Sistema de diagonales en el plano de la brida comprimida, entre viguetas dobles, que estabiliza el conjunto de tijerales ante viento y sismo."},{"termino":"Cumbrera","definicion":"Línea más alta del techo a dos aguas; también el accesorio de cobertura que la sella."},{"termino":"Traslape","definicion":"Superposición entre planchas de cobertura consecutivas para evitar filtraciones; depende de la región y la pendiente."},{"termino":"Longitud útil de plancha","definicion":"Longitud nominal menos el traslape; es la longitud efectiva que cubre cada plancha."},{"termino":"Separación entre pórticos (s)","definicion":"Distancia entre armaduras; recomendada entre 5 y 7 m, óptima cerca de 6 m."},{"termino":"Carga de servicio","definicion":"Carga sin factorizar, usada para verificar deflexiones."}],"preguntas":[{"pregunta":"¿Dónde se colocan los arriostres de conjunto de un galpón?","opciones":["Siempre en la brida inferior","En el plano de la brida comprimida, entre líneas de viguetas dobles","Solo en las columnas extremas","En el alma de cada vigueta"],"correcta":1,"explicacion":"Se ubican en la brida que está en compresión (normalmente la superior), entre viguetas dobles."},{"pregunta":"¿Qué criterio de peralte para tijerales en Lima indicó el profesor?","opciones":["H = L/11","H = L/20","H = L/30","H = L/5"],"correcta":0,"explicacion":"Para Lima el peralte del tijeral se predimensiona como la luz entre 11."},{"pregunta":"La separación recomendable entre pórticos de un galpón es:","opciones":["10 a 12 m","Igual a la luz del tijeral","2 a 3 m","5 a 7 m, óptimo cerca de 6 m"],"correcta":3,"explicacion":"Fuera de 5 a 7 m la estructura resulta antieconómica; el óptimo para Lima es cercano a 6 m."},{"pregunta":"Con V = 120 km/h, ¿cuál es la velocidad de diseño a 12 m de altura según la E.020?","opciones":["≈ 130 km/h","120 km/h","≈ 125 km/h","≈ 144 km/h"],"correcta":2,"explicacion":"Vh = 120·(12/10)^0.22 ≈ 124.9 km/h."},{"pregunta":"Con C = −1.0 y Vh = 129.58 km/h, la presión de viento es:","opciones":["−84 kg/m²","−42 kg/m²","+84 kg/m²","−168 kg/m²"],"correcta":0,"explicacion":"ph = 0.005 × (−1.0) × 129.58² ≈ −83.96 kg/m² (succión)."},{"pregunta":"Una nave de 114 m de longitud útil se resuelve con 20 armaduras. La separación es:","opciones":["6.00 m","5.43 m","6.33 m","5.70 m"],"correcta":0,"explicacion":"s = 114/(20 − 1) = 6.00 m."},{"pregunta":"La longitud útil de una plancha de 7 pies con traslape de 15 cm es aproximadamente:","opciones":["198 cm","183 cm","213 cm","205.5 cm"],"correcta":0,"explicacion":"7 pies ≈ 213 cm; 213 − 15 = 198 cm."},{"pregunta":"¿Por qué se usa una luz de 5.50 m y no 5.737 m para calcular la vigueta?","opciones":["Para incluir el traslape de la cobertura","Por un error de redondeo","Porque la vigueta se apoya en las bridas y no llega hasta los ejes; se usa la luz entre apoyos","Porque la norma lo exige"],"correcta":2,"explicacion":"La longitud de apoyo real es algo menor que la distancia entre ejes."},{"pregunta":"En la analogía de viga para una vigueta de celosía, la fuerza en la brida inferior se estima como:","opciones":["Tu = Mu·d","Tu = Mu/(0.95·d)","Tu = wu·L/2","Tu = 0.9·Fy·Ag"],"correcta":1,"explicacion":"El momento se descompone en un par de fuerzas con brazo ≈ 0.95 del peralte."},{"pregunta":"Si Tu = 3000 kg y Fy = 2530 kg/cm², el área bruta mínima por fluencia (φ = 0.90) es:","opciones":["1.32 cm²","1.07 cm²","2.37 cm²","1.19 cm²"],"correcta":0,"explicacion":"Ag = 3000/(0.90 × 2530) = 1.32 cm²."},{"pregunta":"¿Cuál es el primer paso para definir las dimensiones del galpón según el profesor?","opciones":["Calcular la carga de sismo","Elegir la cobertura","Escoger el perfil de las columnas","Verificar el terreno con la ficha de Registros Públicos y luego descontar lo que requiere el cliente"],"correcta":3,"explicacion":"Se verifica legalmente el terreno y luego se descuentan jardines, circulación, rampa, estacionamiento y cerco."},{"pregunta":"La carga muerta típica considerada para la estructura metálica de un tijeral de 20 a 30 m de luz es:","opciones":["250 kg/m²","5 kg/m²","20 a 25 kg/m²","100 kg/m²"],"correcta":2,"explicacion":"El profesor estimó 20 kg/m² (hasta 25 kg/m²) para este tipo de estructuras."}],"ejercicios_propuestos":["Un galpón en Arequipa tiene 30 m de luz, columnas de 9 m y peralte H = L/11. Con V = 85 km/h y los coeficientes vistos en clase (paredes +0.8/−0.6, faldones +0.3/−0.7 y −0.6, Cpi = ±0.3), calcule las presiones de viento más desfavorables en cada superficie.","Un cliente tiene un terreno de 45 m × 140 m según Registros Públicos y pide jardines de 2 m perimetrales, circulación de cargadores de 3.5 m a los costados, rampa de 6 m y patio de camiones de 8 m en el frontis, y cerco con columnas de 0.30 m. Determine las dimensiones útiles del galpón y el número de pórticos para que s quede entre 5 y 7 m, lo más cercano a 6 m.","Para el galpón del ejercicio anterior en costa seca (pendiente mínima 10 %, traslape 14 cm), calcule la longitud inclinada del faldón y proponga una combinación de planchas de 6, 7 y 8 pies que la cubra con el menor desperdicio, considerando 10 cm de descuento por cumbrera.","Predimensione la brida inferior de barra lisa A36 de una vigueta de celosía de 6.0 m de luz, separadas 1.50 m, con D = 40 kg/m² y Lr = 30 kg/m², usando d = L/20, Tu = Mu/(0.95d) y Ag ≥ Tu/(0.9Fy). Elija el diámetro comercial.","Calcule la carga lineal de servicio y la carga última (1.2D + 1.6Lr) sobre cada tijeral del galpón del ejercicio 2, con cobertura de 15 kg/m², estructura de 22 kg/m² y Lr = 30 kg/m²."],"avisos":["Leer siempre el material subido al aula virtual (las tablas de viento 5.4 y 5.5 estaban en la presentación de la clase anterior).","Se recomienda hacer los tanteos de planchas y separaciones con una hoja de cálculo (Excel).","En programas de cómputo comerciales las distintas hipótesis de viento se ingresan como estados de carga separados.","Repetir en casa el ejemplo del tijeral con los valores de carga indicados.","La compresión (brida superior y diagonales) se verá en la siguiente clase."],"notas_transcripcion":["En el cálculo de viento, la transcripción dice '0,6 0,5 para el lado A'; se interpretó C = 0.5 (0.8 − 0.3). Nótese que con Cpi = −0.3 el caso más desfavorable de presión en A sería 1.1; el profesor solo consideró Cpi = +0.3 para A.","La presión en D se transcribe como '25'; el cálculo da −25.2 kg/m².","El profesor dice 'Q de 1.407'; se interpretó como 14.07 m (o 1407 cm), longitud inclinada del faldón.","Las dimensiones del depósito '28.60% 9' / 's-109' corresponden a 28.60 m × 109 m. El profesor menciona 'L sobre 11, 28 entre 11 que me da 2.54/2.55 ... aproximo a 2.60'.","El terreno se calcula en clase como '119.6' y '127.6'; con los descuentos dichos el ancho sería 28.60 + 2 × 5.30 = 39.20 m (el '119.6' parece corresponder a 109 + 2 × 5.30 y es una confusión de ejes). Se reportó la interpretación coherente.","Para la vigueta, las cargas factorizadas se dictan de forma confusa ('1,2 de 46 de 55... estoy poniendo 40 y 50'); se tomó wu = 136 kg/m tal como se indicó. El ancho tributario no se menciona.","El área requerida se dice 0.92 cm²; con 2165/(0.9 × 2530) resulta 0.95 cm²; la conclusión (barra lisa de 1/2\", 1.27 cm²) no cambia.","El peralte de la vigueta se indica como L/20 pero en el cálculo se usa 0.25 m (L/20 = 0.275 m).","'Plancha de ternit' corresponde a planchas de fibrocemento Eternit; 'dieta doble' = vigueta doble; 'tejeral' = tijeral; 'a fondo' = tirafón."],"corto":"Naves industriales","video":"https://www.youtube.com/watch?v=CAQC3BbHf2c","duracion_min":93,"estado":"ok"},"04":{"titulo":"Diseño de miembros en tracción: áreas bruta, neta y efectiva, estados límite y aplicación a la brida inferior del tijeral","fecha":"miércoles (fecha exacta no mencionada; por la secuencia del curso, probablemente 14 de abril de 2021)","resumen":"La clase cierra el dimensionamiento del tijeral (fuerza en diagonales a partir de la reacción y el ángulo) y entra al primer tema de diseño propiamente dicho: miembros en tracción. El profesor presenta los documentos normativos que se usarán (AISC 360-16 vigente, borrador de AISC 360-22 solo como referencia, Norma E.090 vigente para combinaciones de carga y el proyecto de norma peruana de 2018 con su capítulo sísmico). Luego define las tres áreas que intervienen en el diseño en tracción: área bruta Ag, área neta An (descontando agujeros con diámetro del perno más 1/8 pulg y aplicando la regla s²/4g de Cochrane para cadenas en zigzag) y área neta efectiva Ae = U·An, con el factor de rezago de cortante U de la Tabla D3.1. Explica los estados límite de fluencia en el área bruta (φ = 0.90) y rotura en el área neta efectiva (φ = 0.75), y la recomendación de esbeltez L/r ≤ 300 para evitar vibraciones. Resuelve un ejemplo de unión soldada de dos planchas y finalmente predimensiona la brida inferior del tijeral del ejemplo del Callao (Tu ≈ 50.8 kips) con 2L 2×2×5/16.","objetivos":["Al terminar, el estudiante podrá calcular el área bruta, el área neta y el área neta efectiva de planchas y perfiles conectados con pernos o soldadura.","Al terminar, el estudiante podrá aplicar la regla de Cochrane (s²/4g) para encontrar la línea de falla crítica en agujeros en zigzag.","Al terminar, el estudiante podrá seleccionar el factor de rezago de cortante U según la Tabla D3.1 del AISC 360.","Al terminar, el estudiante podrá evaluar la resistencia de diseño en tracción por fluencia y por rotura y escoger el estado límite que controla.","Al terminar, el estudiante podrá verificar la relación de esbeltez L/r ≤ 300 de un miembro en tracción.","Al terminar, el estudiante podrá predimensionar la brida inferior de un tijeral a partir de la analogía de viga simplemente apoyada."],"temas":[{"titulo":"Cierre del dimensionamiento del tijeral: fuerza en diagonales","contenido":"Retomando la clase anterior, el profesor recuerda que la armadura se puede analizar en forma aproximada como una viga simplemente apoyada con carga repartida wu (obtenida del ancho tributario o modular entre pórticos). Con esa aproximación la reacción en cada apoyo es wu·L/2. Para las diagonales recomienda configurar la armadura buscando que las diagonales queden aproximadamente a 45°, lo que se logra relacionando el peralte H con la separación entre nudos. Conociendo la geometría se obtiene la longitud de la diagonal por Pitágoras (proyección horizontal y peralte H) y de ahí el coseno o seno del ángulo que forma con la vertical u horizontal. La fuerza en la diagonal extrema se obtiene dividiendo la reacción entre la componente trigonométrica correspondiente (equilibrio del nudo de apoyo), y esa fuerza, de compresión o tracción según la orientación, es la que sirve para dimensionar la diagonal. Este procedimiento es solo de predimensionamiento: el análisis definitivo se hará con un modelo de armadura, pero permite tener un primer orden de magnitud de las fuerzas.","formulas":[{"nombre":"Reacción de la armadura (analogía de viga)","expresion":"R = wu·L / 2","variables":"wu: carga repartida factorizada (kg/m o kip/ft); L: luz del tijeral"},{"nombre":"Fuerza aproximada en la diagonal extrema","expresion":"Fd = R / sen(θ) (θ medido respecto a la horizontal)","variables":"R: reacción de apoyo; θ: ángulo de la diagonal; longitud de diagonal Ld = √((s)² + H²) con s la proyección horizontal y H el peralte"}],"referencias_norma":[]},{"titulo":"Documentos normativos del curso y combinaciones de carga","contenido":"El profesor fija el marco normativo del curso. La norma de diseño base es la AISC 360-16 (Specification for Structural Steel Buildings), vigente en Estados Unidos. De la Norma Peruana E.090 vigente se tomarán fundamentalmente las combinaciones de carga (página 5 del PDF). Existe además un proyecto de actualización de la E.090 (versión 2018) que está en el Ministerio sin publicarse; el profesor es miembro del comité por la UNI y es autor del capítulo de diseño sísmico (capítulo 13). En el capítulo 1 del proyecto (página 20) aparecen las cargas y combinaciones, que no difieren de las de la norma vigente. Se aclara que la AISC remite a la ASCE 7 para cargas, pero en el curso no se usará la ASCE 7 sino las combinaciones de la norma peruana. También comparte un borrador (preview) de la AISC 360-22 que saldría el año siguiente, solo para que los alumnos se familiaricen: los cambios son menores (pueden alterar un diseño en orden de un décimo), por ejemplo en la Tabla D3.1 se precisan los casos de HSS circulares y rectangulares. Para el curso se usa la 360-16. Todos los documentos estarán en el Drive del curso.","formulas":[{"nombre":"Combinación 1 (E.090)","expresion":"U = 1.4·D","variables":"D: carga muerta"},{"nombre":"Combinación 2 (E.090)","expresion":"U = 1.2·D + 1.6·L + 0.5·(Lr o S o R)","variables":"L: carga viva; Lr: viva de techo; S: nieve; R: lluvia"}],"referencias_norma":["Norma E.090 vigente, combinaciones de carga (sección 1.4)","Proyecto de Norma E.090 (2018), capítulo 1 (cargas y combinaciones) y capítulo 13 (diseño sísmico)","AISC 360-16","AISC 360-22 (borrador, solo referencia)"]},{"titulo":"Área bruta (geométrica) Ag","contenido":"El área bruta o geométrica Ag es el área de la sección transversal completa, sin descontar perforaciones. Para una plancha de ancho b y espesor t, Ag = b·t. Para un perfil en H formado por planchas soldadas (perfil soldado, a diferencia del perfil laminado o 'rolado' que sale del horno ya con su forma), el área se obtiene sumando las dos alas y el alma: Ag = 2·bf·tf + h·tw. El profesor explica la nomenclatura en inglés: el subíndice f viene de 'flange' (ala) y el subíndice w de 'web' (alma). En los perfiles soldados aparecen filetes de soldadura en las uniones ala-alma, que deben tenerse presentes al identificar cómo se fabricó la pieza, aunque para el área se toma la suma de las planchas. El área bruta es la base del estado límite de fluencia, porque la fluencia se produce a lo largo de todo el miembro, lejos de las conexiones, donde la sección está completa. En perfiles laminados el valor de Ag se lee directamente de las tablas del Manual AISC (primera columna de propiedades); en perfiles soldados se calcula sumando las planchas que lo componen. Para dobles ángulos, Ag es la suma de las áreas de ambos ángulos.","formulas":[{"nombre":"Área bruta de plancha","expresion":"Ag = b·t","variables":"b: ancho (pulg); t: espesor (pulg)"},{"nombre":"Área bruta de perfil H soldado","expresion":"Ag = 2·bf·tf + h·tw","variables":"bf, tf: ancho y espesor del ala; h, tw: altura libre y espesor del alma"}],"referencias_norma":["AISC 360-16 Sección B4.3a"]},{"titulo":"Área neta An y método de Cochrane para agujeros en zigzag","contenido":"El área neta descuenta el material retirado por las perforaciones para pernos. El diámetro del agujero que se descuenta se toma como el diámetro nominal del perno más 1/8 de pulgada: el agujero estándar se perfora 1/16 pulg mayor que el perno (holgura para poder montarlo) y se agrega otro 1/16 pulg para considerar el daño o imperfección del proceso de perforado. El profesor lo explica como una tolerancia de ±1/16 más la holgura; lo importante es que se usa db + 1/8 pulg porque un agujero mayor deja menos área y es la condición más desfavorable. Para una fila recta de agujeros el ancho neto es bn = b − Σd y An = bn·t. Cuando los agujeros están en diagonal o en zigzag se aplica el método empírico de Cochrane: para cada línea de falla posible se calcula bn = b − Σd + Σ s²/(4g), donde s es el espaciamiento longitudinal (paralelo a la carga) entre dos agujeros consecutivos de la cadena y g el espaciamiento transversal (gramil). Deben analizarse todas las líneas posibles (rectas y quebradas) y se adopta la que da el menor ancho neto, que es la línea crítica. Ejemplo conceptual: plancha de ancho b con dos pernos en una misma sección transversal: bn = b − 2·(db + 1/8) y An = bn·t.","formulas":[{"nombre":"Diámetro de cálculo del agujero","expresion":"d = db + 1/8 pulg","variables":"db: diámetro nominal del perno"},{"nombre":"Área neta (fila recta)","expresion":"An = (b − Σd)·t","variables":"b: ancho bruto; Σd: suma de diámetros de agujeros en la sección; t: espesor"},{"nombre":"Regla de Cochrane (cadena en zigzag)","expresion":"An = (b − Σd + Σ s²/(4·g))·t","variables":"s: paso longitudinal entre agujeros consecutivos; g: separación transversal (gramil); se toma la cadena con menor An"}],"referencias_norma":["AISC 360-16 Sección B4.3b (área neta)","AISC 360-16 Sección B4.3b: ancho de agujero = nominal + 1/16 pulg"]},{"titulo":"Área neta efectiva Ae y factor de rezago de cortante U (Tabla D3.1)","contenido":"El área neta efectiva considera que, cuando la fuerza no se transmite a todos los elementos de la sección, los esfuerzos se concentran cerca de la conexión (rezago de cortante o shear lag). Se define Ae = U·An. Caso 1 de la Tabla D3.1: si la tracción se transmite directamente a cada elemento de la sección (alas y alma conectadas) mediante pernos o soldadura, U = 1 y Ae = An. Si la carga se transmite por algunos pero no todos los elementos, U < 1 y se obtiene de la tabla. Un caso general es U = 1 − x̄/l, donde l es la longitud de la conexión en la dirección de la carga y x̄ la excentricidad de la conexión (distancia del centroide del perfil conectado al plano de la conexión), por ejemplo en un ángulo soldado o empernado a una cartela. Para conexión solo con pernos se trabaja con el área neta; con soldadura no hay agujeros y An = Ag. Si la carga se transmite solo por soldaduras transversales, el área es la de los elementos directamente conectados con U = 1. Para planchas con soldaduras longitudinales paralelas a la carga, U depende de la relación entre la longitud de soldadura l y el ancho w de la plancha (1.0, 0.87 o 0.75 en la tabla que muestra el profesor). Antiguamente se usaba directamente U = 0.75 cuando no todos los elementos estaban conectados. Ilustra con dos casos: en una vigueta con barra lisa en zigzag ('gusano') soldada a ambas caras de los ángulos de la brida, todos los elementos reciben carga y U = 1; en cambio, en el tijeral la montante (ángulo) se suelda a la brida por una sola ala y la otra ala queda libre, así que el área efectiva es aproximadamente la del ala conectada (≈ Ag/2). Se trabajan pues tres áreas: Ag, An y Ae.","formulas":[{"nombre":"Área neta efectiva","expresion":"Ae = U·An","variables":"U: factor de rezago de cortante (Tabla D3.1); An: área neta"},{"nombre":"Factor de rezago general","expresion":"U = 1 − x̄ / l","variables":"x̄: excentricidad de la conexión (pulg); l: longitud de la conexión en dirección de la carga (pulg)"},{"nombre":"Planchas con soldadura longitudinal (valores mostrados en clase)","expresion":"l ≥ 2w: U = 1.00; 2w > l ≥ 1.5w: U = 0.87; 1.5w > l ≥ w: U = 0.75","variables":"l: longitud de soldadura; w: ancho de la plancha (distancia entre soldaduras)"}],"referencias_norma":["AISC 360-16 Sección D3","AISC 360-16 Tabla D3.1 (casos 1, 2, 3 y 4)","AISC 360-22 (borrador): cambios en Tabla D3.1 para HSS"]},{"titulo":"Estados límite en tracción: fluencia, rotura y esbeltez","contenido":"El profesor recuerda el ensayo de tracción visto la semana anterior: la probeta tiene un tramo lineal, luego fluye con grandes deformaciones, se endurece, se estrangula y se rompe. Los fabricantes tienen bases de datos con dispersión: el valor de 36 ksi del A36 es un mínimo garantizado, pero los valores reales se distribuyen por encima con cierta varianza; el uso de esos valores esperados para evaluar el colapso es tema de posgrado. En tracción se verifican dos estados límite: fluencia en el área bruta (φt = 0.90, Pn = Fy·Ag), que representa deformación excesiva del miembro, y rotura en el área neta efectiva (φt = 0.75, Pn = Fu·Ae), que ocurre en la sección de la conexión. La resistencia de diseño es el menor de ambos valores; puede ocurrir que el elemento se rompa sin llegar a fluir, típicamente cuando tiene muchos agujeros. Adicionalmente se controla la esbeltez: un elemento en tracción muy esbelto se comporta como una cuerda de guitarra tensada por la clavija y puede vibrar, por lo que se recomienda L/r ≤ 300 (esta limitación no se aplica a varillas ni colgadores en tracción).","formulas":[{"nombre":"Fluencia en área bruta","expresion":"φt·Pn = 0.90·Fy·Ag","variables":"Fy: esfuerzo de fluencia (ksi); Ag: área bruta (pulg²)"},{"nombre":"Rotura en área neta efectiva","expresion":"φt·Pn = 0.75·Fu·Ae","variables":"Fu: resistencia a la tracción (ksi); Ae: área neta efectiva (pulg²)"},{"nombre":"Condición de diseño","expresion":"Tu ≤ min(0.90·Fy·Ag ; 0.75·Fu·Ae)","variables":"Tu: tracción última factorizada"},{"nombre":"Límite de esbeltez recomendado","expresion":"L / r ≤ 300","variables":"L: longitud del miembro; r: radio de giro mínimo = √(I/A)"}],"referencias_norma":["AISC 360-16 Sección D2, ecuaciones D2-1 y D2-2","AISC 360-16 Sección D1 (nota: L/r preferiblemente ≤ 300)"]},{"titulo":"Ejemplo: resistencia de una unión soldada de dos planchas y esbeltez","contenido":"Se analiza una unión soldada entre una plancha de 6×1/2 pulg y otra de 3×1/4 pulg, ambas de acero A36 (Fy = 36 ksi, Fu = 58 ksi). Como la unión es soldada no hay agujeros (An = Ag); como aún no se conoce la longitud del cordón de soldadura, se adopta el valor más desfavorable de la tabla para soldaduras longitudinales, U = 0.75. Para la plancha grande la fluencia da 97.2 kips y la rotura 97.9 kips, controla fluencia. Para la plancha pequeña la fluencia da 24.3 kips y la rotura unos 24.4 kips, controla fluencia. La unión falla con el menor de los valores de ambas planchas: cuando la carga llega a 24.3 kips la plancha chica fluye, se deforma mucho y el nudo deja de funcionar, aunque la grande podría resistir más. Por tanto Pu debe ser menor que 24.3 kips. Luego se verifica la esbeltez con L = 40 (en el cálculo se usó como pulgadas): la plancha grande tiene L/r = 277 en su eje débil (r = t/√12 = 0.144 pulg), menor que 300, y pasa; la plancha chica tiene r = 0.072 pulg y L/r ≈ 555 > 300, de modo que no es recomendable porque vibraría. Una pregunta típica derivada es hallar la longitud máxima de la plancha chica para cumplir L/r ≤ 300.","formulas":[{"nombre":"Radio de giro de una plancha respecto a su eje débil","expresion":"r = √(I/A) = t/√12","variables":"t: espesor de la plancha"}],"referencias_norma":["AISC 360-16 D2, Tabla D3.1 caso 4"]},{"titulo":"Predimensionamiento de la brida inferior del tijeral (ejemplo del Callao)","contenido":"Se retoma el galpón del ejemplo del Callao: 95 m de longitud con 16 pórticos, lo que da un ancho modular de 5.86 m. Cargas: peso propio estimado 30 kg/m², cobertura (Eternit) 15 kg/m², carga muerta total 45 kg/m²; carga viva de techo 30 kg/m² según norma. Multiplicando por 5.86 m: D ≈ 264 kg/m, L ≈ 176 kg/m. Con 1.4D se obtiene ≈ 369 kg/m y con 1.2D + 1.6L ≈ 597.7 kg/m, que controla. La armadura se idealiza como viga simplemente apoyada en las columnas: Mu = wu·L²/8 con L = 28.10 m da ≈ 59,000 kg·m. En el centro de luz el momento es resistido por un par de fuerzas: compresión en la brida superior y tracción en la inferior separadas por el peralte H = 2.55 m, así que Tu = Cu = Mu/H ≈ 23,100 kg ≈ 50.8 kips. Despejando la condición de fluencia, el área bruta mínima es Ag ≥ Tu/(0.9·Fy) ≈ 1.57 pulg². Se buscan dobles ángulos en el Excel de perfiles de la AISC, advirtiendo que en el Perú solo se consiguen alrededor de una docena de W, una docena de C y ángulos de lados iguales hasta 4 pulg. Primer tanteo: 2L 2×2×5/16, Ag = 2.32 pulg². Las tablas de doble ángulo dan tres valores de ry según la separación entre ángulos (0, 3/8 y 3/4 pulg); se elige espalda con espalda, ry ≈ 0.853 pulg. Verificación: fluencia 0.9·36·2.32 ≈ 75.2 kips; rotura, considerando conectada solo un ala (Ae ≈ Ag/2), 0.75·58·1.16 ≈ 50.5 kips, prácticamente igual a la demanda: cumple pero al límite, y lo que da margen es el factor φ. La verificación de esbeltez se deja para el seminario.","formulas":[{"nombre":"Momento en viga simplemente apoyada","expresion":"Mu = wu·L² / 8","variables":"wu: carga factorizada por metro; L: luz"},{"nombre":"Fuerza en bridas (par interno)","expresion":"Tu = Cu = Mu / H","variables":"H: peralte entre ejes de bridas"},{"nombre":"Área bruta requerida","expresion":"Ag,req ≥ Tu / (0.90·Fy)","variables":"Tu en kips, Fy en ksi"},{"nombre":"Conversión","expresion":"1 kip = 1000 lb ≈ 454 kg; kg → kips: ×2.2/1000","variables":""}],"referencias_norma":["Norma E.020 / E.090: carga viva de techo 30 kg/m²","AISC 360-16 D2","Tablas de doble ángulo del AISC Steel Construction Manual"]}],"ejemplos":[{"titulo":"Unión soldada de planchas 6×1/2 y 3×1/4 en A36","enunciado":"Una plancha de 6×1/2 pulg se une mediante soldadura longitudinal a una plancha de 3×1/4 pulg, ambas A36 (Fy = 36 ksi, Fu = 58 ksi). Se desconoce aún la longitud de soldadura. Determinar la carga última máxima que puede transmitir la unión y verificar L/r ≤ 300 con L = 40 pulg.","pasos":["Plancha grande: Ag = 6×0.5 = 3.00 pulg²; soldada → An = Ag = 3.00 pulg²; U = 0.75 (más desfavorable) → Ae = 2.25 pulg².","Fluencia: 0.9×36×3.00 = 97.2 kips. Rotura: 0.75×58×2.25 = 97.9 kips. Controla 97.2 kips.","Plancha chica: Ag = 3×0.25 = 0.75 pulg²; Ae = 0.75×0.75 = 0.5625 pulg².","Fluencia: 0.9×36×0.75 = 24.3 kips. Rotura: 0.75×58×0.5625 = 24.5 kips. Controla 24.3 kips.","La unión falla con el menor: 24.3 kips (fluencia de la plancha chica).","Esbeltez plancha grande: Ix = 6×0.5³/12 = 0.0625 pulg⁴, r = √(0.0625/3) = 0.144 pulg, L/r = 40/0.144 = 277 < 300 OK; eje fuerte Iy = 0.5×6³/12 = 9 pulg⁴, r = 1.73 pulg, L/r = 23.1.","Esbeltez plancha chica: r = 0.25/√12 = 0.072 pulg, L/r = 40/0.072 ≈ 555 > 300 → no recomendable (vibra); en el otro eje r = 0.866 pulg, L/r ≈ 46."],"resultado":"Pu ≤ 24.3 kips (controla la fluencia de la plancha de 3×1/4); la plancha de 3×1/4 no cumple la esbeltez recomendada L/r ≤ 300 para L = 40 pulg."},{"titulo":"Primer tanteo de la brida inferior del tijeral","enunciado":"Tijeral de luz 28.10 m, peralte H = 2.55 m, ancho modular 5.86 m, D = 45 kg/m², Lr = 30 kg/m². Acero A36. Predimensionar la brida inferior con doble ángulo.","pasos":["wD = 45×5.86 = 263.7 kg/m; wL = 30×5.86 = 175.8 kg/m.","1.4D = 369 kg/m; 1.2D + 1.6L = 316.4 + 281.3 = 597.7 kg/m → controla wu ≈ 597.7 kg/m.","Mu = 597.7×28.10²/8 ≈ 59,000 kg·m.","Tu = Mu/H = 59,000/2.55 ≈ 23,100 kg ≈ 50.8 kips.","Ag,req = 50.8/(0.9×36) = 1.57 pulg².","Tanteo 2L 2×2×5/16: Ag = 2.32 pulg², ry (espalda con espalda) = 0.853 pulg.","Fluencia: 0.9×36×2.32 = 75.2 kips ≥ 50.8 OK.","Rotura (solo un ala conectada, Ae ≈ 1.16 pulg²): 0.75×58×1.16 = 50.5 kips ≈ 50.8 kips → al límite."],"resultado":"2L 2×2×5/16 resulta adecuado por fluencia (75.2 kips) y prácticamente al límite por rotura (≈ 50.5 kips frente a Tu ≈ 50.8 kips); falta verificar la esbeltez."}],"conceptos_clave":[{"termino":"Área bruta (Ag)","definicion":"Área total de la sección transversal sin descontar agujeros."},{"termino":"Área neta (An)","definicion":"Área bruta menos el área de los agujeros en la línea de falla crítica, usando d = db + 1/8 pulg."},{"termino":"Área neta efectiva (Ae)","definicion":"Área neta multiplicada por el factor U que considera el rezago de cortante cuando no todos los elementos de la sección están conectados."},{"termino":"Rezago de cortante (shear lag)","definicion":"Distribución no uniforme de esfuerzos en la conexión cuando la carga se transmite solo por algunos elementos del perfil."},{"termino":"Regla de Cochrane (s²/4g)","definicion":"Corrección empírica que suma s²/(4g) por cada tramo diagonal de una cadena de agujeros en zigzag al calcular el ancho neto."},{"termino":"Holgura del agujero","definicion":"Exceso de diámetro del agujero sobre el perno para permitir el montaje (1/16 pulg en agujero estándar), más 1/16 pulg por daño de perforación."},{"termino":"Fluencia en área bruta","definicion":"Estado límite de deformación excesiva del miembro en tracción; φ = 0.90, Pn = Fy·Ag."},{"termino":"Rotura en área neta efectiva","definicion":"Estado límite de fractura en la sección de la conexión; φ = 0.75, Pn = Fu·Ae."},{"termino":"Brida","definicion":"Cuerda superior o inferior de un tijeral; en el ejemplo, formada por dos ángulos espalda con espalda."},{"termino":"Montante","definicion":"Elemento vertical del tijeral que une la brida superior con la inferior."},{"termino":"Perfil soldado vs laminado","definicion":"El laminado ('rolado') se forma en caliente en la siderúrgica; el soldado se arma cortando y soldando planchas con filetes."}],"preguntas":[{"pregunta":"Para calcular el área neta de una plancha con un agujero para un perno de 3/4 pulg, ¿qué diámetro de agujero se descuenta según el criterio usado en clase?","opciones":["3/4 pulg","13/16 pulg","7/8 pulg","1 pulg"],"correcta":2,"explicacion":"Se descuenta db + 1/8 pulg: 1/16 de holgura del agujero estándar más 1/16 por daño de perforación; 3/4 + 1/8 = 7/8 pulg."},{"pregunta":"En la regla de Cochrane, el término que se suma por cada tramo diagonal de la cadena de agujeros es:","opciones":["s/(4g)","s²/(4g)","g²/(4s)","4s²/g"],"correcta":1,"explicacion":"El ancho neto es b − Σd + Σ s²/(4g), con s el paso longitudinal y g el gramil transversal."},{"pregunta":"¿Cuáles son los factores de resistencia φ para fluencia en el área bruta y rotura en el área neta efectiva, respectivamente?","opciones":["0.90 y 0.75","0.75 y 0.90","0.90 y 0.90","0.85 y 0.75"],"correcta":0,"explicacion":"AISC 360 D2: φt = 0.90 para fluencia (Fy·Ag) y φt = 0.75 para rotura (Fu·Ae)."},{"pregunta":"Un perfil H tiene sus dos alas y su alma conectadas directamente mediante pernos a la pieza siguiente. El factor U vale:","opciones":["1.0","0.75","0.87","1 − x̄/l"],"correcta":0,"explicacion":"Caso 1 de la Tabla D3.1: si la carga se transmite directamente a todos los elementos de la sección, U = 1 y Ae = An."},{"pregunta":"Una montante de ángulo se suelda a la brida solo por una de sus alas. ¿Qué área efectiva aproximada propuso el profesor?","opciones":["El área bruta completa","El 87% del área bruta","El área neta menos los agujeros","Aproximadamente la mitad del área bruta (ala conectada)"],"correcta":3,"explicacion":"Solo el ala conectada transmite carga; el ala libre 'mira al aire', por lo que se toma aproximadamente Ag/2."},{"pregunta":"¿Por qué se recomienda limitar L/r ≤ 300 en miembros en tracción?","opciones":["Para evitar el pandeo flexionante","Para evitar vibraciones y excesiva flexibilidad, como una cuerda de guitarra","Porque la rotura depende de L/r","Para garantizar U = 1"],"correcta":1,"explicacion":"La tracción no produce pandeo, pero un miembro muy esbelto vibra y se deforma con facilidad; AISC D1 recomienda L/r ≤ 300."},{"pregunta":"En la unión soldada de las planchas 6×1/2 y 3×1/4 (A36), ¿qué controla la resistencia de la unión?","opciones":["Rotura de la plancha grande, 97.9 kips","Fluencia de la plancha grande, 97.2 kips","Rotura de la soldadura","Fluencia de la plancha chica, 24.3 kips"],"correcta":3,"explicacion":"La unión falla con el menor valor de todas las piezas: la plancha chica fluye a 24.3 kips antes de que la grande alcance su capacidad."},{"pregunta":"Con la analogía de viga simplemente apoyada, la fuerza en la brida inferior al centro de luz se calcula como:","opciones":["Tu = wu·L/2","Tu = wu·L²/8","Tu = wu·H/L","Tu = wu·L²/(8·H)"],"correcta":3,"explicacion":"Mu = wu·L²/8 se resiste con un par de fuerzas separadas por H, de modo que Tu = Mu/H."},{"pregunta":"En la tabla de dobles ángulos aparecen tres valores de ry con separaciones 0, 3/8 y 3/4 pulg. ¿Qué representan?","opciones":["Espesores posibles del ángulo","Diámetros de pernos","La separación entre los ángulos (espesor de la cartela) que modifica ry","Tolerancias de laminación"],"correcta":2,"explicacion":"ry de la sección compuesta aumenta al separar los ángulos; 0 corresponde a espalda con espalda."},{"pregunta":"Si una plancha está unida solo con soldadura (sin pernos), el área neta An es:","opciones":["Igual a Ag","Ag menos un agujero estándar","0.75·Ag siempre","La mitad de Ag"],"correcta":0,"explicacion":"Sin agujeros no hay nada que descontar: An = Ag; el efecto de rezago se toma luego con U."},{"pregunta":"Según el profesor, ¿qué se toma de la Norma E.090 vigente en este curso?","opciones":["Las fórmulas de pandeo","Las tablas de perfiles","Las combinaciones de carga","El factor U"],"correcta":2,"explicacion":"El diseño sigue la AISC 360-16; de la E.090 (y su proyecto) se toman las combinaciones de carga."}],"ejercicios_propuestos":["Una plancha de 10×1/2 pulg (A36) tiene dos filas de pernos de 3/4 pulg con gramil g = 3 pulg y paso alternado s = 2 pulg. Evalúe las líneas de falla recta y en zigzag con la regla de Cochrane y determine An.","Para la plancha anterior, con U = 1.0, calcule φPn por fluencia y por rotura e indique qué estado límite controla.","En la unión de planchas 6×1/2 y 3×1/4 de clase, determine la longitud máxima de la plancha de 3×1/4 para que cumpla L/r ≤ 300.","Repita el predimensionamiento de la brida inferior del tijeral con un peralte H = 2.00 m y verifique si 2L 2×2×5/16 sigue siendo adecuado por fluencia y rotura (Ae = Ag/2).","Un ángulo L 3×3×1/4 se suelda a una cartela por una sola ala con soldaduras longitudinales de 4 pulg. Con x̄ = 0.836 pulg, calcule U = 1 − x̄/l, Ae y φPn por rotura (A36)."],"avisos":["Los documentos del curso (AISC 360-16, Norma E.090 vigente, proyecto de norma E.090 2018 y el borrador de AISC 360-22) se suben al Drive.","Se usa el Excel de perfiles de la AISC (pestañas por tipo de perfil); se advierte que en el Perú solo existe parte de esos perfiles.","El jueves siguiente hay seminario con los jefes de práctica, que continuarán el ejemplo (verificación de esbeltez de la brida inferior).","Existe un programa de prácticas en discusión; el profesor avisará con anticipación las prácticas calificadas."],"notas_transcripcion":["'BW' se interpretó como wu (carga repartida) y 'TU', 'CU' como Tu y Cu.","'Macual' / 'el AC' se interpretaron como el Manual AISC y la ASCE 7, respectivamente.","'un 16 de pulgada' = 1/16 pulg; 'tres octavos' en el ejemplo de dos pernos fue corregido por el propio profesor a 1/8 pulg.","'la del 2022 ... usamos todavía la del 2022' se interpretó como: se usa la AISC 360-16 y la 360-22 solo como referencia.","En el ejemplo de esbeltez la transcripción dice '40 pies', pero los resultados (L/r = 277, 555, 23.1, 46) solo cuadran con L = 40 pulg; se dejó L = 40 pulg.","'24 36' se interpretó como 24.36 kips (rotura de la plancha chica); el cálculo exacto da 24.5 kips; en ambos casos controla la fluencia (24.3 kips).","'6 9' en la combinación 1.4D se interpretó como ≈ 369 kg/m.","Los valores U = 1.0/0.87/0.75 para planchas con soldadura longitudinal provienen de la AISC 360-10; en la 360-16 el caso 4 se expresa con una fórmula, pero se mantuvo lo enseñado.","'Eternity' = cobertura Eternit; 'gusano' = barra lisa doblada en zigzag (celosía) de la vigueta."],"corto":"Miembros en tracción","video":"https://www.youtube.com/watch?v=TCkwFrTs8RY","duracion_min":101,"estado":"ok"},"05":{"titulo":"Miembros en compresión: esbeltez de la brida en tracción, pandeo local (Tabla B4.1a) y pandeo global flexionante de Euler","fecha":"lunes 19 de abril de 2021","resumen":"La clase completa el diseño en tracción de la brida inferior del tijeral verificando L/r con la longitud entre nudos (L/rx = 117 < 300) y pasa al diseño de miembros en compresión. Se presentan los perfiles disponibles (W, M, S, C, T, ángulos, dobles ángulos, HSS) y sus equivalentes soldados de planchas (columna soldada, viga soldada, columna-viga soldada). Se distinguen el pandeo local (de cada placa) y el pandeo global (de todo el miembro). Para el pandeo local se clasifican los elementos en no atiesados (alas, con un borde libre) y atiesados (almas) y se compara la relación ancho-espesor λ = b/t con el límite λr de la Tabla B4.1a; un elemento esbelto vuelve esbelto al perfil. Se muestra un video que ilustra que un ángulo más grande pero más esbelto pandea antes. Luego se deduce la carga crítica de Euler, se introduce el factor de longitud efectiva K (Tabla del Comentario, valores teóricos y recomendados), el criterio de longitudes no arriostradas en el tijeral (Lx entre nudos, Ly entre arriostres) y las fórmulas E3 del AISC para pandeo inelástico y elástico. Se verifica la brida superior con 2L 2×2×5/16, que resiste solo 20 kips frente a Cu ≈ 50.8 kips.","objetivos":["Al terminar, el estudiante podrá determinar la longitud no arriostrada de las bridas de un tijeral para verificar su esbeltez.","Al terminar, el estudiante podrá clasificar los elementos de una sección como atiesados o no atiesados y como esbeltos o no esbeltos usando la Tabla B4.1a.","Al terminar, el estudiante podrá deducir y explicar la carga crítica de Euler y el esfuerzo crítico de Euler.","Al terminar, el estudiante podrá seleccionar el factor de longitud efectiva K según las condiciones de apoyo.","Al terminar, el estudiante podrá calcular el esfuerzo crítico Fcr por pandeo flexionante con las ecuaciones E3-2 y E3-3 del AISC 360-16.","Al terminar, el estudiante podrá verificar la resistencia de diseño a compresión φcPn de un doble ángulo."],"temas":[{"titulo":"Verificación de esbeltez de la brida inferior en tracción","contenido":"Se completa el primer tanteo de la brida inferior (2L 2×2×5/16) revisando la esbeltez. La longitud a considerar es la distancia entre nudos del tijeral, que se definió con la longitud útil de las planchas de cobertura: en el ejemplo, plancha de 6 pies con longitud útil de 1.70 m más 0.10 m de cumbrera, es decir 1.80 m medidos a lo largo de la brida superior inclinada. Para la brida inferior horizontal se toma la proyección: 1.80·cos α. Como la pendiente es muy pequeña (ángulo de unos 0.01 rad), cos α ≈ 0.99 y la longitud resulta 1.79 m ≈ 70 pulg (dividiendo los centímetros entre 2.54). Para decidir qué radio de giro usar, el profesor razona sobre la deformación: las cargas de gravedad hacen bajar la brida dentro del plano del tijeral, girando alrededor del eje X de los dos ángulos (cuya posición se ubica con el valor ȳ de las tablas). Por eso se usa rx: L/rx = 70/0.601 ≈ 117 < 300, cumple. Así el diseño de la brida inferior queda: Tu = 50.8 kips frente a 75 kips de fluencia y L/r = 117. El diseño en tracción, concluye, es sencillo.","formulas":[{"nombre":"Longitud de la brida inferior entre nudos","expresion":"Lx,inf = (Lútil + 0.10 m)·cos α","variables":"Lútil: longitud útil de la plancha de cobertura; α: ángulo de la pendiente del techo"},{"nombre":"Esbeltez en tracción","expresion":"L / rx ≤ 300","variables":"rx: radio de giro del doble ángulo respecto al eje horizontal"}],"referencias_norma":["AISC 360-16 Sección D1"]},{"titulo":"Tipos de perfiles para tracción y compresión y sus equivalentes soldados","contenido":"En tracción y compresión se pueden usar diversas secciones de la serie americana: canales C, tes T, y perfiles en forma de H que se diferencian por su proporción: los W (ala ancha), los S (ala angosta y gran peralte, tipo estándar americano) y los M (intermedios, ni muy peraltados ni muy anchos). También ángulos simples, dobles ángulos (como los del ejemplo) y tubos HSS cuadrados, rectangulares o circulares. Los equivalentes armados con planchas soldadas con filetes, que son los más usados en el Perú por la escasa oferta de perfiles laminados, se denominan: columna soldada (ala ancha, equivalente al W), viga soldada (gran peralte y ala pequeña) y columna-viga soldada (proporción intermedia). La elección depende de la disponibilidad local y del tipo de solicitación: para las bridas y diagonales de tijerales se usan con frecuencia los dobles ángulos, que permiten conectar las piezas a una cartela intermedia; para columnas se prefieren secciones de ala ancha, con radios de giro parecidos en ambos ejes; y para vigas, secciones peraltadas. Los HSS son eficientes en compresión porque su radio de giro es igual o similar en ambas direcciones y no tienen bordes libres. En el Perú, al haber pocos perfiles laminados W y C, el diseñador suele recurrir a perfiles armados con planchas, cuya esbeltez local debe controlarse al escoger el espesor de las planchas.","formulas":[],"referencias_norma":["AISC Steel Construction Manual, Parte 1 (dimensiones y propiedades)"]},{"titulo":"Pandeo local: relación ancho-espesor y elementos atiesados y no atiesados","contenido":"En compresión existen dos posibilidades de pandeo: el local, que ocurre en una placa o elemento de la sección (ala o alma), y el global, que afecta a todo el miembro. La clave para el pandeo local es la relación ancho-espesor λ = b/t de cada elemento. Si se aplica la carga en el centroide de un ángulo 2×2×1/4 (b/t = 8) el elemento se acorta sin que las alas se ondulen; en un ángulo 6×6×1/4 (b/t = 24) las alas se ondulan localmente. Los límites están en la Tabla B4.1a (compresión axial); para flexión hay otra tabla (B4.1b) que se verá después. La tabla separa los elementos no atiesados (casos 1 a 4), que tienen un borde libre, como las alas, de los atiesados (caso 5 en adelante), que tienen ambos bordes restringidos, como las almas. El profesor prefiere el término 'atiesado' (tradicional en la UNI) frente a 'rigidizado', adoptado por comisiones de norma. Si λ ≤ λr el elemento es no esbelto y no hay pandeo local; si λ > λr es esbelto. Basta que un solo elemento sea esbelto para que el perfil se considere esbelto. Para ángulos simples λr = 0.45√(E/Fy) = 12.77 con A36, por lo que el 2×2×1/4 (8) es no esbelto y el 6×6×1/4 (24) es esbelto. Lo recomendable es trabajar con elementos no esbeltos. En perfiles W, el bf de tablas es el ancho total del ala, por lo que para un ala se usa b = bf/2 y λ = bf/(2tf).","formulas":[{"nombre":"Relación ancho-espesor","expresion":"λ = b / t","variables":"b: ancho del elemento (para alas de I, b = bf/2); t: espesor"},{"nombre":"Límite para alas de ángulos simples","expresion":"λr = 0.45·√(E/Fy)","variables":"E = 29,000 ksi; Fy en ksi (A36 → 12.77)"},{"nombre":"Límite para alas de perfiles laminados I y canales","expresion":"λr = 0.56·√(E/Fy)","variables":"A36 → 15.89; A572 Gr50 → 13.49"},{"nombre":"Límite para almas de perfiles I y canales","expresion":"λr = 1.49·√(E/Fy)","variables":"λ = h/tw; A36 → 42.29; Gr50 → 35.88"}],"referencias_norma":["AISC 360-16 Sección B4.1","AISC 360-16 Tabla B4.1a (casos 1, 3 y 5)","AISC 360-16 Tabla B4.1b (flexión, se verá luego)"]},{"titulo":"Video demostrativo: 'más grande no significa más resistente'","contenido":"Se proyecta un video en inglés con dos ángulos sometidos a compresión: uno con alas del doble de ancho que el otro. Intuitivamente se esperaría que el grande resista más, pero por su mayor relación ancho-espesor pandea con una carga menor (en el video se describe como pandeo torsional de las alas). El ángulo pequeño, con la misma carga, no presenta problema y necesita más carga para pandear. La conclusión es que la relación b/t, más que el tamaño, define si hay pandeo local, y que conviene escoger perfiles por debajo del umbral λr. La lección práctica para el diseño es que no basta con aumentar las dimensiones exteriores del perfil para ganar resistencia: si se aumenta el ancho del ala sin aumentar el espesor, la relación b/t crece y el elemento puede pasar de no esbelto a esbelto, perdiendo capacidad por pandeo local. Al proponer un perfil en compresión conviene revisar primero b/t frente a λr y solo después la esbeltez global KL/r. El fenómeno observado en el video también anticipa que los ángulos son sensibles a modos de pandeo torsional, que se tratarán en las Secciones E4 y E5.","formulas":[],"referencias_norma":[]},{"titulo":"Ejemplos de clasificación: canal armado y perfil W; límites sísmicos","contenido":"Se analiza una canal con alas de 6 pulg × 3/16 pulg y alma de 12 pulg × 1/4 pulg en acero A572 Gr50 (Fy = 50 ksi, Fu = 65 ksi). Ala (no atiesada): b/t = 6/(3/16) = 32 > 0.56√(29000/50) = 13.49, esbelta. Alma (atiesada, restringida por las dos alas): h/t = 12/0.25 = 48 > 1.49√(29000/50) = 35.88, esbelta. Ambos elementos son esbeltos y el perfil es esbelto. Cada elemento se evalúa por separado: λf frente a λrf y λw frente a λrw. Para un perfil W de tablas con bf ≈ 15 pulg y tf ≈ 1.07 pulg, λ = bf/(2tf) ≈ 7 < 15.89 (A36), por lo que el ala no pandea localmente. Finalmente, para diseño sismorresistente existen límites más exigentes, porque se requieren elementos de ductilidad moderada o alta capaces de desarrollar grandes deformaciones plásticas: frente al 0.56√(E/Fy) de estructuras ordinarias, se exigen valores del orden de 0.38 (ductilidad moderada) y 0.30 (alta ductilidad). Estas tablas están en el capítulo 13 del proyecto de norma E.090 para perfiles laminados y de planchas soldadas.","formulas":[{"nombre":"Ala de perfil W","expresion":"λf = bf / (2·tf) ≤ 0.56·√(E/Fy)","variables":"bf: ancho total del ala; tf: espesor del ala"},{"nombre":"Alma","expresion":"λw = h / tw ≤ 1.49·√(E/Fy)","variables":"h: altura libre del alma; tw: espesor del alma"}],"referencias_norma":["AISC 360-16 Tabla B4.1a","AISC 341 (límites para miembros de ductilidad moderada y alta)","Proyecto de Norma E.090 (2018), capítulo 13"]},{"titulo":"Pandeo global: deducción de la carga crítica de Euler","contenido":"El pandeo global afecta a todo el miembro. Leonhard Euler (1744) analizó una columna articulada en ambos extremos (pin-pin). Al cargarla, el extremo superior baja y la columna forma una 'panza' lateral. Tomando el diagrama de cuerpo libre a una distancia x con deflexión y, la carga P genera un momento externo −P·y que se equilibra con el momento interno E·I·y''. Resulta la ecuación diferencial E·I·y'' + P·y = 0; con c² = P/(E·I) queda y'' + c²·y = 0, cuya solución es y = A·sen(cx) + B·cos(cx). Aplicando las condiciones de borde: y(0) = 0 implica B = 0; y(L) = 0 exige A·sen(cL) = 0, y para una solución no trivial (A ≠ 0) se requiere sen(cL) = 0, es decir cL = π (primer modo). Elevando al cuadrado y reemplazando c: Pcr = π²·E·I/L². Usando I = r²·A y dividiendo entre el área se obtiene el esfuerzo crítico de Euler Fe = π²·E/(L/r)². Para otras condiciones de borde (empotrado-empotrado, empotrado-articulado, empotrado-libre) la deformada cambia y la fórmula se generaliza reemplazando L por la longitud efectiva K·L.","formulas":[{"nombre":"Ecuación diferencial de la columna","expresion":"E·I·y'' + P·y = 0","variables":"E: módulo de elasticidad; I: momento de inercia; y: deflexión lateral"},{"nombre":"Carga crítica de Euler","expresion":"Pcr = π²·E·I / (K·L)²","variables":"K: factor de longitud efectiva; L: longitud no arriostrada"},{"nombre":"Esfuerzo crítico de Euler","expresion":"Fe = π²·E / (K·L/r)²","variables":"r: radio de giro = √(I/A)"}],"referencias_norma":["AISC 360-16 ecuación E3-4"]},{"titulo":"Factor de longitud efectiva K y método de criterios","contenido":"El factor K depende de las condiciones de apoyo. La tabla del Comentario del AISC da, para cada caso, un valor teórico y un valor recomendado de diseño (propuesto por el Column Research Council, hoy Structural Stability Research Council): empotrado-empotrado 0.5 / 0.65; empotrado-articulado 0.7 / 0.80; articulado-articulado 1.0 / 1.0; empotrado con giro impedido y desplazamiento lateral libre 1.0 / 1.2; empotrado-libre (por ejemplo un panel publicitario en voladizo) 2.0 / 2.1; articulado en la base y giro impedido con desplazamiento libre en la cabeza 2.0 / 2.0. En un edificio, las losas actúan como restricciones en cada nivel; si además la estructura puede desplazarse lateralmente por sismo, el profesor sugiere un K del orden de 1.2. Elegir K según el tipo de apoyo es el llamado método de los criterios. En los tijerales se usa siempre K = 1. Para la brida superior comprimida hay dos longitudes: en el plano del tijeral (eje X) la brida pandea entre nudos, considerados articulados, así que Lx es la distancia entre nudos; fuera del plano (eje Y), ante el viento lateral, la brida se apoya en los arriostres colocados entre las viguetas dobles, de modo que Ly es la distancia entre viguetas dobles arriostradas. Sin arriostres la estructura se caería, porque nada la apuntala en esa dirección.","formulas":[{"nombre":"Esbeltez efectiva","expresion":"K·L/r ≤ 200 (recomendado)","variables":"Se evalúa en ambos ejes: K·Lx/rx y K·Ly/ry; controla el mayor"}],"referencias_norma":["AISC 360-16 Comentario, Apéndice 7, Tabla C-A-7.1","AISC 360-16 Sección E2 (nota: KL/r preferiblemente ≤ 200)"]},{"titulo":"Resistencia a compresión por pandeo flexionante (AISC 360-16 E3) y Tabla E1.1","contenido":"El capítulo E del AISC trata la compresión. La Tabla User Note E1.1 funciona como un recetario: según el tipo de sección y si tiene elementos no esbeltos o esbeltos indica qué secciones y estados límite revisar. Para dobles ángulos no esbeltos: E3 (pandeo flexionante, FB) y E4 (pandeo flexotorsional, FTB); con elementos esbeltos se agrega E7 (pandeo local, LB). Las siglas son FB flexionante, TB torsional, FTB flexotorsional y LB local. Para el pandeo flexionante de secciones no esbeltas se propone un perfil, se calcula KL/r y se compara con el umbral 4.71√(E/Fy) (133.7 para A36). Si KL/r ≤ 4.71√(E/Fy) (o Fy/Fe ≤ 2.25), el pandeo es inelástico: Fcr = 0.658^(Fy/Fe)·Fy. Si es mayor, el pandeo es elástico: Fcr = 0.877·Fe. El diseñador prefiere estar en la zona inelástica, donde la fluencia ocurre antes que el pandeo. Históricamente, Engesser propuso usar el módulo tangente para el rango inelástico, Jasinski objetó y se habló de módulo reducido, y Shanley (años 40) aclaró el problema; la expresión exponencial del AISC recoge indirectamente ese efecto relacionando Fy con Fe. Finalmente Pn = Fcr·Ag, φc = 0.90, y se exige Pu ≤ φc·Pn. (En la gráfica de la clase el esfuerzo en el umbral se rotuló 0.15Fy; en la clase 6 se corrigió a 0.39Fy.)","formulas":[{"nombre":"Umbral elástico-inelástico","expresion":"K·L/r = 4.71·√(E/Fy)","variables":"A36: 133.7"},{"nombre":"Pandeo inelástico (E3-2)","expresion":"Fcr = 0.658^(Fy/Fe) · Fy, si K·L/r ≤ 4.71√(E/Fy)","variables":"Fe: esfuerzo de Euler"},{"nombre":"Pandeo elástico (E3-3)","expresion":"Fcr = 0.877 · Fe, si K·L/r > 4.71√(E/Fy)","variables":"0.877 considera la imperfección inicial (curvatura) del miembro"},{"nombre":"Resistencia nominal y de diseño","expresion":"Pn = Fcr·Ag ; φc·Pn = 0.90·Fcr·Ag ≥ Pu","variables":"Ag: área bruta; Pu: compresión última"}],"referencias_norma":["AISC 360-16 Capítulo E, Tabla User Note E1.1","AISC 360-16 Sección E3, ecuaciones E3-1, E3-2, E3-3, E3-4","AISC 360-16 Secciones E4, E5 y E7"]},{"titulo":"Ejemplo: primer tanteo de la brida superior del tijeral en compresión","contenido":"Se usa el mismo perfil de la brida inferior, 2L 2×2×5/16 (Ag = 2.32 pulg², rx = 0.601 pulg, ry = 0.853 pulg), con E = 29,000 ksi y Fy = 36 ksi. La longitud en el plano es la distancia entre nudos, Lx = 1.70 + 0.10 = 1.80 m = 70.9 pulg. Fuera del plano, con el arreglo de 8 planchas por faldón (6 de 6 pies y 2 de 7 pies), la distancia entre arriostres es Ly ≈ 3.50 m = 137.8 pulg. Con K = 1: K·Lx/rx ≈ 118 y K·Ly/ry ≈ 161, ambos menores que 200; controla 161. Como 161 > 133.7, el pandeo es elástico: Fe = π²·29000/161² ≈ 11 ksi y Fcr = 0.877·Fe ≈ 9.6 ksi. Pn ≈ 22 kips y φcPn ≈ 20 kips, muy por debajo de Cu ≈ 50.8 kips. El perfil no sirve y debe cambiarse; se deja de tarea probar 2L 3×3×3/16 o 2L 3×3×1/4.","formulas":[],"referencias_norma":["AISC 360-16 E3"]}],"ejemplos":[{"titulo":"Esbeltez de la brida inferior en tracción","enunciado":"Brida inferior 2L 2×2×5/16 (rx = 0.601 pulg). Distancia entre nudos sobre la brida superior 1.80 m, pendiente α ≈ 0.01 rad. Verificar L/r ≤ 300.","pasos":["L = 1.80·cos(0.01) ≈ 1.79 m = 179/2.54 ≈ 70.5 pulg.","La brida se deforma en el plano del tijeral (alrededor del eje X) → usar rx.","L/rx = 70.5/0.601 ≈ 117 < 300."],"resultado":"L/r ≈ 117 < 300: cumple. La brida inferior queda con 2L 2×2×5/16 (Tu = 50.8 kips, φPn,fluencia ≈ 75 kips)."},{"titulo":"Clasificación de ángulos 2×2×1/4 y 6×6×1/4 (A36)","enunciado":"Determinar si las alas de ángulos simples 2×2×1/4 y 6×6×1/4 en acero A36 son esbeltas.","pasos":["λr = 0.45·√(29000/36) = 0.45·28.38 = 12.77.","2×2×1/4: λ = 2/0.25 = 8 < 12.77 → no esbelto, sin pandeo local.","6×6×1/4: λ = 6/0.25 = 24 > 12.77 → esbelto, con pandeo local."],"resultado":"El ángulo pequeño es no esbelto; el grande es esbelto (más grande no significa más resistente)."},{"titulo":"Clasificación de una canal en A572 Gr50","enunciado":"Canal con alas de 6×3/16 pulg y alma de 12×1/4 pulg, Fy = 50 ksi, Fu = 65 ksi, E = 29,000 ksi. Clasificar ala y alma.","pasos":["Ala (no atiesada): λf = 6/0.1875 = 32; λr = 0.56·√(29000/50) = 13.49 → 32 > 13.49, esbelta.","Alma (atiesada): λw = 12/0.25 = 48; λr = 1.49·√(29000/50) = 35.88 → 48 > 35.88, esbelta."],"resultado":"Ala y alma esbeltas: el perfil se clasifica como esbelto y requiere la Sección E7."},{"titulo":"Brida superior en compresión con 2L 2×2×5/16","enunciado":"Cu = 50.8 kips; 2L 2×2×5/16 A36: Ag = 2.32 pulg², rx = 0.601 pulg, ry = 0.853 pulg; Lx = 70.9 pulg, Ly = 137.8 pulg, K = 1. Verificar.","pasos":["K·Lx/rx = 70.9/0.601 ≈ 118; K·Ly/ry = 137.8/0.853 ≈ 161.5; ambos < 200; controla 161.5.","4.71·√(29000/36) = 133.7 < 161.5 → pandeo elástico.","Fe = π²·29000/161.5² ≈ 11.0 ksi.","Fcr = 0.877·11.0 ≈ 9.6 ksi.","Pn = 9.6·2.32 ≈ 22.3 kips; φcPn = 0.9·22.3 ≈ 20 kips.","20 kips < Cu = 50.8 kips → no cumple."],"resultado":"φcPn ≈ 20 kips < 50.8 kips: el perfil 2L 2×2×5/16 no sirve como brida superior; se debe aumentar la sección."}],"conceptos_clave":[{"termino":"Pandeo local","definicion":"Inestabilidad de un elemento plano de la sección (ala o alma) que ocurre cuando su relación ancho-espesor supera el límite λr."},{"termino":"Pandeo global","definicion":"Inestabilidad de todo el miembro (flexionante, torsional o flexotorsional)."},{"termino":"Elemento no atiesado","definicion":"Elemento plano con un borde libre paralelo a la carga, por ejemplo las alas."},{"termino":"Elemento atiesado","definicion":"Elemento plano restringido en ambos bordes, por ejemplo el alma entre dos alas."},{"termino":"λr","definicion":"Relación ancho-espesor límite entre elemento no esbelto y esbelto en compresión (Tabla B4.1a)."},{"termino":"Carga crítica de Euler","definicion":"Carga axial a la que una columna ideal elástica pasa a una configuración deformada lateralmente: Pcr = π²EI/(KL)²."},{"termino":"Factor de longitud efectiva K","definicion":"Factor que convierte la longitud real en la longitud equivalente de una columna biarticulada, según los apoyos."},{"termino":"Pandeo inelástico","definicion":"Pandeo que ocurre después de que parte de la sección ha fluido (KL/r ≤ 4.71√(E/Fy)); Fcr = 0.658^(Fy/Fe)·Fy."},{"termino":"Pandeo elástico","definicion":"Pandeo que ocurre antes de la fluencia (KL/r > 4.71√(E/Fy)); Fcr = 0.877·Fe."},{"termino":"Método de los criterios","definicion":"Asignar K a partir de las condiciones de apoyo idealizadas (tabla de valores recomendados), usado en el diseño preliminar."},{"termino":"Columna soldada / viga soldada / columna-viga soldada","definicion":"Perfiles armados con planchas equivalentes, respectivamente, a perfiles de ala ancha, de gran peralte y ala angosta, e intermedios."}],"preguntas":[{"pregunta":"Para el ala de un ángulo simple en compresión axial, el límite λr de la Tabla B4.1a es:","opciones":["0.38√(E/Fy)","0.56√(E/Fy)","1.49√(E/Fy)","0.45√(E/Fy)"],"correcta":3,"explicacion":"Caso 3 de la Tabla B4.1a: alas de ángulos simples, λr = 0.45√(E/Fy) ≈ 12.77 para A36."},{"pregunta":"Un alma restringida por dos alas se clasifica como elemento:","opciones":["No atiesado","Atiesado","Compacto siempre","Esbelto siempre"],"correcta":1,"explicacion":"Los elementos con ambos bordes restringidos (almas) son atiesados; los de borde libre (alas) son no atiesados."},{"pregunta":"En un perfil W con bf = 15 pulg y tf = 1.07 pulg, la relación ancho-espesor del ala es:","opciones":["7.0","14.0","15.89","3.5"],"correcta":0,"explicacion":"Se evalúa una sola ala: b = bf/2, por lo que λ = bf/(2tf) = 15/2.14 ≈ 7.0."},{"pregunta":"Si en una canal el ala es no esbelta pero el alma es esbelta, el perfil se clasifica como:","opciones":["Esbelto","No esbelto","Compacto","Depende de K"],"correcta":0,"explicacion":"Basta que un elemento sea esbelto para que el miembro se considere con elementos esbeltos (Sección E7)."},{"pregunta":"En la deducción de Euler, la condición y(0) = 0 lleva a:","opciones":["A = 0","c = 0","B = 0","sen(cL) = 1"],"correcta":2,"explicacion":"y(0) = A·sen 0 + B·cos 0 = B = 0."},{"pregunta":"Para una columna empotrada en la base y libre en la cabeza (panel publicitario), el valor de K recomendado para diseño es:","opciones":["0.65","1.0","1.2","2.1"],"correcta":3,"explicacion":"El valor teórico es 2.0 y el recomendado por el CRC/SSRC es 2.1."},{"pregunta":"¿Cuál es el umbral de esbeltez entre pandeo inelástico y elástico para acero A36 (E = 29,000 ksi)?","opciones":["≈ 113.4","≈ 200","≈ 300","≈ 133.7"],"correcta":3,"explicacion":"4.71√(29000/36) = 4.71·28.38 ≈ 133.7."},{"pregunta":"Si K·L/r = 161 para un doble ángulo A36, el esfuerzo crítico se calcula con:","opciones":["Fcr = 0.658^(Fy/Fe)·Fy","Fcr = 0.877·Fe","Fcr = Fy","Fcr = 0.39·Fy"],"correcta":1,"explicacion":"161 > 133.7: pandeo elástico, Fcr = 0.877·Fe (ecuación E3-3)."},{"pregunta":"En la brida superior de un tijeral, la longitud no arriostrada fuera del plano (Ly) se define por:","opciones":["La distancia entre nudos","La luz total del tijeral","La distancia entre puntos arriostrados (viguetas dobles con arriostres)","El peralte del tijeral"],"correcta":2,"explicacion":"Fuera del plano, la brida solo está restringida donde llegan los arriostres, ubicados entre las viguetas dobles."},{"pregunta":"¿Qué valor de K se usa para los miembros de armaduras en el curso?","opciones":["0.5","0.65","1.0","2.0"],"correcta":2,"explicacion":"Se idealizan los nudos como articulados: K = 1."},{"pregunta":"Según la Tabla E1.1 del AISC, para un doble ángulo sin elementos esbeltos se deben revisar:","opciones":["Solo E3","E3 (flexionante) y E4 (flexotorsional)","E7 y E3","Solo pandeo local"],"correcta":1,"explicacion":"Para dobles ángulos no esbeltos se revisan FB (E3) y FTB (E4); con elementos esbeltos se añade E7."}],"ejercicios_propuestos":["Verifique la brida superior del tijeral (Cu = 50.8 kips, Lx = 70.9 pulg, Ly = 137.8 pulg, K = 1, A36) con 2L 3×3×3/16 y con 2L 3×3×1/4 usando las propiedades de las tablas AISC.","Clasifique el ala y el alma de una canal C12×20.7 en acero A36 y en A572 Gr50 según la Tabla B4.1a.","Deduzca la carga crítica de una columna biarticulada para el segundo modo de pandeo (cL = 2π) y explique por qué no gobierna en la práctica.","Una columna W8×31 de 4.5 m, empotrada en la base y libre en la cabeza (K = 2.1), en A36: calcule KL/r, determine si el pandeo es elástico o inelástico y obtenga φcPn.","Para un ángulo simple L 4×4×1/4 en A36, determine si sus alas son esbeltas y compárelo con un L 4×4×1/2."],"avisos":["Tarea para casa: rediseñar la brida superior probando 2L 3×3×3/16 o 2L 3×3×1/4 en la hoja Excel.","Los estudiantes deben seguir el desarrollo en su propia hoja Excel del ejemplo del tijeral (ejemplo B).","Se usan la AISC 360-16 (capítulo E, Tabla E1.1, Tabla B4.1a) y el capítulo 13 del proyecto de norma E.090 para límites sísmicos."],"notas_transcripcion":["'tabla BA' / 'tabla BB' = Tablas B4.1a y B4.1b del AISC 360-16; 'sección e' se refiere a las secciones E3, E4, E5 y E7 (la transcripción pierde el número).","'Engeser', 'Jasinski', 'Shangle' = Engesser, Jasinski y Shanley. El profesor presentó a Engesser como sucesor de Euler; en realidad trabajó más de un siglo después (1889). Se mantuvo la idea técnica (módulo tangente/reducido).","La transcripción dice 'quien descubre el pandeo local fue Euler en 1744'; por el contexto es el pandeo global (flexionante).","Se dice que el CRC está 'en Londres'; el Column Research Council es una entidad norteamericana (hoy SSRC). Se omitió la ubicación.","En la tabla de K, el valor 'cero ochenta y cinco' para una columna de primer piso empotrada arriba y abajo se interpretó como el valor recomendado 0.65 (empotrado-empotrado) de la tabla; se indicó 1.2 para el caso con desplazamiento lateral.","'W de 30% 73' se interpretó como un perfil W30 de tablas con bf ≈ 15 pulg; 'TF de 1.7' se interpretó como tf ≈ 1.07 pulg para que bf/2tf ≈ 7.","El Fe de la brida superior se dijo '10 ksi' y Fcr '9 ksi'; el cálculo con KL/r = 161.5 da Fe ≈ 11.0 ksi y Fcr ≈ 9.6 ksi, con φcPn ≈ 20 kips como en clase.","En la gráfica de pandeo el profesor rotuló 0.15Fy en el umbral; en la clase 6 lo corrigió a 0.39Fy (Fcr en KL/r = 4.71√(E/Fy) es 0.658^2.25·Fy ≈ 0.39Fy).","Los límites sísmicos 0.38 y 0.30 se reportan tal como los citó el profesor del proyecto de norma E.090; en AISC 341 los coeficientes varían según el tipo de elemento."],"corto":"Pandeo local y Euler","video":"https://www.youtube.com/watch?v=RJ96InmHBWw","duracion_min":102,"estado":"ok"},"06":{"titulo":"Compresión: K exacto, rediseño de la brida superior, miembros esbeltos (E7, anchos efectivos) y pandeo torsional y flexotorsional (E4)","fecha":"miércoles 21 de abril de 2021","resumen":"La clase repasa el procedimiento para miembros en compresión: clasificar cada elemento con la Tabla B4.1a, entrar a la Tabla E1.1 y revisar los estados límite que correspondan. Se presenta el K 'exacto' mediante los nomogramas (alignment charts) para pórticos arriostrados y no arriostrados con los factores G de rigidez relativa columna-viga, útil en la verificación. Se rediseña la brida
