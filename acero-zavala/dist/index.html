pacio del falso cielo","Aumentar el espesor de las alas"],"correcta":2,"explicacion":"Con abrazaderas colgadas, la tubería pasa bajo la viga sin afectar su alma."},{"pregunta":"La ecuación AISC H1-1a se aplica cuando:","opciones":["Pr/Pc ≥ 0.2","Pr/Pc < 0.2","Mr/Mc ≥ 0.2","Siempre en tracción"],"correcta":0,"explicacion":"Para Pr/Pc ≥ 0.2 se usa Pr/Pc + 8/9(Mrx/Mcx + Mry/Mcy) ≤ 1."},{"pregunta":"Para Pr/Pc < 0.2 la ecuación de interacción es:","opciones":["Pr/Pc + Mr/Mc ≤ 1","Pr/Pc + 8/9·Mr/Mc ≤ 1","Pr/(2Pc) + 8/9·Mr/Mc ≤ 1","Pr/(2Pc) + (Mrx/Mcx + Mry/Mcy) ≤ 1"],"correcta":3,"explicacion":"Es la ecuación H1-1b del AISC 360."},{"pregunta":"En la deducción elemental de la interacción, My representa:","opciones":["El momento plástico Fy·Z","El momento de primera fluencia Fy·S","El momento último del análisis","El momento de segundo orden"],"correcta":1,"explicacion":"Se reemplaza Fy·S por My, el momento de primera fluencia."},{"pregunta":"En el tutorial de SAP2000, el momento pasó de 1200 a 1548 kip·in porque:","opciones":["Se aumentó la carga lateral","Se cambió la sección","Se incluyó el efecto P-Δ por la compresión de la carga muerta","Se usó un factor de carga de 1.6"],"correcta":2,"explicacion":"La carga axial actuando sobre la configuración deformada reduce la rigidez y amplifica los momentos."},{"pregunta":"¿Qué método de SAP2000 recomienda el profesor para incluir P-Δ en todos los análisis (incluido el espectral)?","opciones":["Un caso inicial P-Δ cuya rigidez usan los demás casos","Un caso no lineal por combinación","Ignorar el P-Δ","Amplificar las cargas por 1.5"],"correcta":0,"explicacion":"El caso inicial P-Δ con cargas de gravedad modifica la rigidez para todos los casos lineales."},{"pregunta":"En el método del Apéndice 8, el momento requerido se calcula como:","opciones":["Mr = B2·Mnt + B1·Mlt","Mr = (B1 + B2)·Mnt","Mr = Mnt + Mlt","Mr = B1·Mnt + B2·Mlt"],"correcta":3,"explicacion":"B1 amplifica el análisis sin traslación (NT) y B2 el de traslación lateral (LT)."},{"pregunta":"Según el profesor, ¿qué ocurre si no se entrega el resumen de seis páginas del trabajo escalonado?","opciones":["Nada","Se descuentan al menos 8 puntos","Se desaprueba el curso","Se debe exponer el trabajo"],"correcta":1,"explicacion":"El resumen es la 'sustentación' del trabajo; sin él la nota queda sobre 12."},{"pregunta":"En el ejemplo de modulación, códigos terminados en 1, 4 y 3 dan una luz base de:","opciones":["4 m","6 m","8 m","12 m"],"correcta":2,"explicacion":"1 + 4 + 3 = 8 m."}],"ejercicios_propuestos":["Una viga soldada A36 con alma 30 × 5/16 in (Cv1 = 1) tiene una perforación de 8 in de diámetro donde Vu = 90 kips. Verifique el corte en la sección perforada y, si no cumple, dimensione una platabanda.","Un tubo cuadrado HSS 8×8×3/8 (A500 Gr. B, Fy = 46 ksi; A = 10.4 in², S = 23.9 in³) en voladizo de 15 ft soporta P = 30 kips y H = 2 kips. Calcule P/Py + M/My con y sin un desplazamiento Δ = 2 in (efecto P-Δ).","Una columna tiene Pr = 250 kips, Pc = 600 kips, Mrx = 150 kip·ft, Mcx = 400 kip·ft y Mry = 0. Verifique la interacción con la ecuación AISC correspondiente.","Con Mnt = 80 kip·ft, Mlt = 60 kip·ft, B1 = 1.05 y B2 = 1.20, y Pnt = 300 kips, Plt = 40 kips, calcule Mr y Pr según el Apéndice 8.","Para su grupo, calcule L con sus códigos, proponga la modulación de una góndola y de una tienda de dos niveles en múltiplos β·L y estime la carga sísmica aproximada de la tienda."],"avisos":["Trabajo escalonado en grupos de 3: estación de servicio (grifo) de acero con góndola, tiendas (2 niveles) y servicios; enunciado en el aula virtual.","Primera entrega: el lunes siguiente (estructuración, ejes, cargas de gravedad, sismo y viento). Segunda: modelo en SAP2000, combinaciones y diseño de vigas y columnas. Tercera: placas colaborantes, planos de planta y corte, detalles, planilla de perfiles, costo del casco de acero y resumen de 6 páginas. Fechas mencionadas: 7/6, 27/6 y 10/7, con cierre a las 11:59 p. m.","No habrá exposición; el resumen de 6 páginas es parte de la nota del tercer trabajo (descuento de al menos 8 puntos si falta).","La hoja Excel de corte (clase 15/16) se corregirá en el aula virtual por el error en la relación 2Aw/(Afc+Aft).","En exámenes: usar conversores confiables o fotos claras; hay 15 minutos para armar la entrega.","Lectura: Apéndice 8 del AISC 360 (método aproximado de segundo orden). Software: SAP2000 para el análisis P-Δ.","Asistencia: 9 ausentes de 37."],"notas_transcripcion":["'grifo' = estación de servicio; 'góndala' = góndola; 'Kio/Kyo' = grifo Kio en la Panamericana; 'Fawcett/Fósil' = avenida Faucett.","Las fechas de entrega se dictaron de forma ambigua ('el tercer trabajo es para el 27' y luego 7/6, 27/6 y 10/7); se interpretó como primera entrega el lunes 7/6, segunda el 27/6 y tercera el 10/7.","'BN', 'BU', 'FIBN' = Vn, Vu, φVn; 'H D' = h − d; 'TP' = espesor de platabanda.","'PR, Mr, MRI' = Pr, Mrx, Mry; 'PC, MC, MSY' = Pc, Mcx, Mcy; 'B y B' = B1 y B2; 'apéndice 8' = AISC 360 Appendix 8.","La combinación '145' dictada como '1.2 de la muerta más menos el sismo, 0.5 de la viva y 0.2 de la nieve' corresponde a la combinación 1.2D + 1.0E + L + 0.2S del ASCE 7 (con factor 0.5 para L en ciertos casos).","Las fórmulas detalladas de B1 y B2 no se dictaron en clase (solo se mostraron en pantalla); se completaron con las del AISC 360-16 Apéndice 8.","La sección sobre aberturas no cita una sección de norma específica; la referencia a la AISC Design Guide 2 es complementaria."],"corto":"Flexocompresión y P-Δ","video":"https://www.youtube.com/watch?v=jdAiyGw4XAk","duracion_min":99,"estado":"ok"},"19":{"titulo":"Método aproximado de segundo orden (B1-B2, Apéndice 8) y conceptos de uniones ligados al sistema estructural","fecha":"lunes 7 de junio de 2021","resumen":"La clase cierra el tema de flexocompresión con el método aproximado de análisis de segundo orden del Apéndice 8 del AISC 360 (amplificadores B1 y B2). El profesor explica cómo separar una combinación sísmica (1.2D + 0.5L + 0.2S + E) en un análisis sin traslación (cargas de gravedad, nt) y otro con traslación lateral (sismo o viento, lt), la inversión de esfuerzos por el carácter cíclico del sismo, y el protocolo de cálculo: Cm, Pe1, B1, Pstory, Pmf, RM, Pe,story y B2, hasta obtener Mr y Pr. Luego inicia el tema de uniones: la tabla de sistemas estructurales en acero de la Norma E.030 (R0, Ia, Ip), la evolución histórica de la idealización de uniones (voladizos con capiteles, uniones rígidas, uniones semirrígidas), el concepto de fusible en pórticos resistentes a momento, arriostrados concéntricos y excéntricos (enlace), el diseño de una unión simple con plancha de asiento y su soldadura, y la descomposición de las fuerzas en una unión viga-columna resistente a momento (par de fuerzas M/d, reparto de carga axial, clip de ángulos para el corte, atiesadores diseñados como elementos en compresión). Termina con consultas sobre las cargas de la góndola del trabajo escalonado.","objetivos":["Al terminar, el estudiante podrá separar una combinación de carga en casos sin traslación (nt) y con traslación lateral (lt) para el análisis aproximado de segundo orden.","Al terminar, el estudiante podrá calcular Cm, Pe1, B1, RM, Pe,story y B2 y obtener Mr = B1·Mnt + B2·Mlt y Pr = Pnt + B2·Plt según el Apéndice 8 del AISC 360.","Al terminar, el estudiante podrá identificar los sistemas estructurales de acero de la Norma E.030 y el uso de R = R0·Ia·Ip.","Al terminar, el estudiante podrá distinguir uniones simples, semirrígidas y rígidas y relacionarlas con el sistema estructural y su elemento fusible.","Al terminar, el estudiante podrá dimensionar una plancha de asiento (unión simple) y su soldadura, y descomponer las fuerzas de una unión viga-columna para diseñar planchas, clips y atiesadores."],"temas":[{"titulo":"Separación del análisis en casos sin traslación (nt) y con traslación (lt)","contenido":"El profesor parte de una combinación sísmica del tipo 1.2D + 0.5L + 0.2S + E (muerta, viva, nieve y sismo) y explica que, para aplicar el método aproximado de segundo orden, la combinación debe dividirse (splitting) en dos análisis. El primero agrupa todas las cargas de gravedad (1.2D, 0.5L y 0.2S), que por sí solas no producen desplazamiento lateral del entrepiso; se denomina caso sin traslación o 'no translation' (nt). El segundo contiene la acción lateral (sismo o, en otra combinación, viento), que sí produce traslación del entrepiso; se denomina 'lateral translation' (lt). Los resultados del caso nt se amplifican con B1 y los del caso lt con B2, de modo que los momentos y cargas axiales resultantes incluyan de forma aproximada el efecto P-Delta. Insiste en que el sismo es una acción cíclica: la fuerza F = m·a cambia de signo porque la aceleración proviene del movimiento ondulatorio del suelo. Por ello debe analizarse el sismo hacia la derecha y hacia la izquierda. En el pórtico de ejemplo, bajo gravedad ambas columnas están comprimidas; con sismo hacia la derecha una columna recibe compresión adicional y la otra tracción, y al invertirse el sentido del sismo los papeles se intercambian. A este fenómeno lo llama inversión de esfuerzos: un mismo elemento puede estar comprimido en un instante y traccionado en otro, o con momento positivo y luego negativo. La regla de diseño es tomar siempre la solicitación más desfavorable de todas las combinaciones y sentidos.","formulas":[{"nombre":"Combinación sísmica usada como ejemplo","expresion":"U = 1.2·D + 0.5·L + 0.2·S + 1.0·E","variables":"D carga muerta, L carga viva, S carga de nieve, E sismo"},{"nombre":"Resistencias requeridas de segundo orden","expresion":"Mr = B1·Mnt + B2·Mlt ;  Pr = Pnt + B2·Plt","variables":"Mnt, Pnt: resultados de primer orden del caso sin traslación; Mlt, Plt: resultados del caso con traslación lateral; B1, B2 amplificadores"}],"referencias_norma":["AISC 360-16 Apéndice 8 (análisis de segundo orden aproximado), ecuaciones A-8-1 y A-8-2"]},{"titulo":"Cálculo del amplificador B1 (efecto P-δ del elemento)","contenido":"B1 considera la amplificación por la deformación del propio elemento entre sus extremos (P-δ). Para calcularlo primero se obtiene el coeficiente Cm. Si el elemento no tiene cargas transversales entre apoyos, Cm = 0.6 − 0.4·(M1/M2), donde M1 es el menor y M2 el mayor de los momentos de extremo. El signo del cociente depende de la curvatura: en curvatura simple el cociente es negativo y en curvatura doble es positivo (lo que reduce Cm). Si hay cargas transversales sobre el elemento, el profesor indica que se toma Cm = 1 (de forma conservadora); en la clase su descripción oral mezcla ambos casos, por lo que se registra la regla correcta del AISC. Como ejemplo de carga sobre el elemento menciona una columna que contiene la tierra de un jardín y recibe presión lateral. El coeficiente α vale 1.0 cuando se trabaja con combinaciones LRFD (cargas amplificadas) y 1.6 en ASD (cargas de servicio). La carga crítica de Euler del elemento Pe1 = π²·EI*/(K1·L)² se evalúa en el plano de flexión, con la longitud efectiva usada al diseñar la columna; el profesor recuerda que la rigidez efectiva puede reducirse por comportamiento inelástico (τb) cuando la esbeltez es alta, por lo que el valor de KL/r adoptado es importante. Como B1 depende de Pr, y Pr depende de B2, el orden de cálculo es: primero B2, luego Pr, luego B1 y finalmente Mr. B1 debe ser al menos 1.0.","formulas":[{"nombre":"Coeficiente Cm (sin cargas transversales)","expresion":"Cm = 0.6 − 0.4·(M1/M2)","variables":"M1 momento menor y M2 momento mayor en extremos; M1/M2 negativo en curvatura simple y positivo en curvatura doble"},{"nombre":"Carga de Euler del elemento","expresion":"Pe1 = π²·EI*/(K1·L)²","variables":"EI* rigidez a flexión (0.8·τb·EI en el método directo; EI en otros), K1 = 1 para el caso sin traslación, L longitud del elemento"},{"nombre":"Amplificador B1","expresion":"B1 = Cm / (1 − α·Pr/Pe1) ≥ 1.0","variables":"α = 1.0 (LRFD) o 1.6 (ASD); Pr = Pnt + B2·Plt"}],"referencias_norma":["AISC 360-16 Apéndice 8, sección 8.2.1, ecuaciones A-8-3 a A-8-5"]},{"titulo":"Cálculo del amplificador B2 (efecto P-Δ del entrepiso)","contenido":"B2 se calcula a nivel de entrepiso, no de un elemento aislado: deben conocerse todas las cargas axiales de todas las columnas del piso. Pstory es la suma de las cargas verticales que soporta el entrepiso: en el ejemplo, las cargas de gravedad de ambas columnas más las cargas axiales que aparecen por el caso lateral (compresión C en una y tracción T en la otra). Pmf es la carga vertical total en las columnas que forman parte de los pórticos resistentes a momento en la dirección analizada; el profesor la ilustra con las fuerzas axiales del caso lateral. Con ellas se obtiene RM = 1 − 0.15·(Pmf/Pstory), que varía entre 0.85 (todo el entrepiso es pórtico de momento) y 1.0 (sistemas arriostrados). Luego Pe,story = RM·H·L/ΔH, donde H es el cortante de entrepiso producido por las fuerzas laterales usadas para calcular ΔH, L es la altura del entrepiso y ΔH el desplazamiento relativo de primer orden. Finalmente B2 = 1/(1 − α·Pstory/Pe,story) ≥ 1. Ante preguntas, el profesor aclara que si hubiese cinco pórticos paralelos o más crujías, Pstory crece con todas las columnas, Pmf también crece y cambian H y ΔH; y que si C y T casi se anulan, el término de Pmf tiene poca influencia y RM se acerca a 1. Califica el método de laborioso pero indispensable para poder estimar a mano, sin computadora, la amplificación P-Delta.","formulas":[{"nombre":"Factor RM","expresion":"RM = 1 − 0.15·(Pmf/Pstory)","variables":"Pmf carga vertical en columnas de pórticos de momento; Pstory carga vertical total del entrepiso"},{"nombre":"Carga crítica del entrepiso","expresion":"Pe,story = RM·H·L/ΔH","variables":"H cortante de entrepiso (kips), L altura de entrepiso (in), ΔH deriva de primer orden (in)"},{"nombre":"Amplificador B2","expresion":"B2 = 1 / (1 − α·Pstory/Pe,story) ≥ 1.0","variables":"α = 1.0 en LRFD"}],"referencias_norma":["AISC 360-16 Apéndice 8, sección 8.2.2, ecuaciones A-8-6 a A-8-8"]},{"titulo":"Sistemas estructurales de acero en la Norma E.030 y factor de reducción R","contenido":"Al iniciar el tema de uniones, el profesor muestra una reproducción de la Tabla N° 7 de la Norma E.030 (Diseño Sismorresistente), donde figuran los sistemas estructurales de acero admitidos en el Perú: pórticos especiales, intermedios y ordinarios resistentes a momento; pórticos con arriostres concéntricos especiales y ordinarios; y pórticos con arriostres excéntricos. Cada uno tiene un coeficiente básico de reducción R0. El coeficiente final es R = R0·Ia·Ip, donde Ia (Tabla N° 8) penaliza irregularidades en altura e Ip (Tabla N° 9) irregularidades en planta. La fuerza sísmica se aproxima como una fracción del peso del edificio, V = (Z·U·C·S/R)·P (el profesor la resume como ZU/R por el peso), así que R es determinante: cada sistema conduce a una demanda distinta. Explica luego qué se espera de cada nivel de ductilidad: los sistemas especiales deben poder desarrollar el momento plástico; los intermedios superan la primera fluencia sin necesariamente llegar al plástico; los ordinarios se espera que lleguen a la fluencia y poco más. En los arriostrados especiales se espera que el arriostre alcance su esfuerzo crítico en rango inelástico; en los ordinarios, que falle en el rango elástico. Concluye que el tipo de unión está ligado al sistema estructural: cada sistema exige uniones distintas.","formulas":[{"nombre":"Coeficiente de reducción sísmica","expresion":"R = R0·Ia·Ip","variables":"R0 coeficiente básico (Tabla 7 E.030), Ia factor de irregularidad en altura (Tabla 8), Ip factor de irregularidad en planta (Tabla 9)"},{"nombre":"Fuerza cortante en la base","expresion":"V = (Z·U·C·S / R)·P","variables":"Z factor de zona, U uso, C amplificación sísmica, S suelo, P peso sísmico"}],"referencias_norma":["Norma E.030 Diseño Sismorresistente, Tablas N° 7, 8 y 9","AISC 341 (sistemas SMF, IMF, OMF, SCBF, OCBF, EBF)"]},{"titulo":"Evolución histórica de la idealización de uniones: rígidas, semirrígidas y simples","contenido":"El profesor narra cómo ha cambiado la forma de idealizar uniones. Hacia los años 50 y 60 en Lima, las columnas se calculaban como grandes voladizos y las vigas como simplemente apoyadas sobre capiteles. En los 70, con la computadora digital y las calculadoras programables, se generalizó el análisis de pórticos con uniones rígidas: todo el momento de la viga pasa a la columna y el nudo está en equilibrio. Entre 1985 y 1995 los ensayos de laboratorio mostraron que las uniones reales son semirrígidas: en el nudo hay rotación y disipación de energía, y el momento que llega a la columna es solo entre el 75% y el 95% del de la viga. A la pérdida ΔM contribuyen la falta de control de calidad, de sujeción o soldadura incompleta. Señala que, aun sabiéndolo, los cálculos siguen suponiendo transferencia total, lo que considera un error conceptual. La unión simple (dibujada en verde) prácticamente no tiene capacidad de transmitir momento (a lo más alrededor del 5%), así que se desprecia el momento y se diseña solo para cortante. Las uniones rígidas o semirrígidas se diseñan para transmitir momento y permitir cierta disipación de energía.","formulas":[],"referencias_norma":["AISC 360-16 B3.4 (clasificación de conexiones simples y de momento FR/PR)"]},{"titulo":"Elementos fusibles según el sistema estructural","contenido":"Cada sistema estructural tiene un elemento designado para fallar y disipar energía (fusible), y la unión debe diseñarse de acuerdo con ello. En los pórticos resistentes a momento se espera que fallen las vigas en sus extremos, nunca las columnas, porque si fallan las columnas la estructura colapsa. En los pórticos arriostrados concéntricamente los fusibles son los arriostres: deben diseñarse para fallar y disipar energía, y ser más 'débiles' que el pórtico, porque si no fallaría el pórtico. El profesor advierte que poner arriostres no hace a la estructura 'súper fuerte': es fuerte mientras los arriostres resistan. En los pórticos con arriostres excéntricos, una alternativa que respeta la arquitectura (permite colocar ventanas entre los arriostres, ya que los arquitectos rechazan las cruces en fachada), el tramo de viga entre arriostres se llama enlace (link) y es el fusible principal; puede fluir por corte o por flexión en rango inelástico. En segunda instancia los arriostres pueden actuar como fusibles. Columnas y vigas fuera del enlace deben permanecer sin daño. Lo recomendable es que la falla se concentre en el enlace.","formulas":[],"referencias_norma":["AISC 341-16 Cap. E (pórticos de momento), F2 (SCBF), F3 (EBF, enlaces)"]},{"titulo":"Diseño de una unión simple con plancha de asiento (ménsula)","contenido":"Como ejemplo de unión simple, el profesor muestra una columna con una plancha proyectada (asiento) sobre la que se apoya la viga. La viga solo transmite cortante V: en la viga actúa sobre el alma y en la plancha produce flexión como un voladizo corto. Suponiendo que la viga ya está diseñada, falta diseñar la plancha. En una sección de corte la plancha es un rectángulo b×t con área A = b·t, módulo elástico S = b·t²/6, módulo plástico Z = b·t²/4 e inercia I = b·t³/12. El momento actuante es V por el brazo (V·L, con L la distancia de la carga a la cara de la columna). Se verifica Vu ≤ φVn en cortante y Mu ≤ φMn en flexión. La plancha puede sobresalir de la viga o ser algo más angosta (como máximo en el tamaño del filete de soldadura). Luego se diseña la soldadura de la plancha a la columna, alrededor de la plancha: se calcula φRn por unidad de longitud y se multiplica por la suma de longitudes de cordón efectivas. Los cordones paralelos a la carga trabajan; si no alcanzan, se agregan cordones adicionales hasta que φRn·ΣLw ≥ Vu. El profesor lo presenta como diseño por criterio de ingeniería de un pequeño voladizo.","formulas":[{"nombre":"Propiedades de la plancha","expresion":"A = b·t ; S = b·t²/6 ; Z = b·t²/4 ; I = b·t³/12","variables":"b ancho y t espesor de la plancha (in)"},{"nombre":"Flexión de la plancha","expresion":"Mu = Vu·e ≤ φb·Mn = 0.90·Fy·Z","variables":"e brazo desde la cara de la columna al punto de aplicación de la reacción"},{"nombre":"Soldadura","expresion":"φRn(por unidad de longitud)·ΣLw ≥ Vu","variables":"φRn = 0.75·0.60·FEXX·0.707·w para filete; ΣLw suma de longitudes efectivas"}],"referencias_norma":["AISC 360-16 J2.4 (resistencia de soldaduras)","AISC 360-16 J4 (elementos de conexión)"]},{"titulo":"Unión viga-columna resistente a momento: descomposición de fuerzas","contenido":"El análisis estructural se hace sobre los ejes de los elementos, y el programa entrega momentos, cortantes y axiales en el nudo, pero no diseña la unión: el ingeniero debe interpretarla, crearla y diseñarla pieza por pieza. Las fuerzas que la viga entrega al nudo actúan en sentido contrario sobre la unión (si el corte de la viga va hacia arriba, sobre la unión va hacia abajo; un momento horario en la viga es antihorario en la unión). El momento se descompone en un par de fuerzas en las alas, T = C = M/d, separadas el peralte d de la viga. A esa fuerza se le suma la parte de la carga axial que toma el ala, en proporción Af/A. Así se conocen la compresión en un ala y la tracción en la otra, que sirven para diseñar la plancha de ala y su conexión, y los atiesadores de continuidad de la columna. El ala traccionada puede deformar localmente el ala de la columna, por lo que la tracción suele ser más crítica para la plancha proyectada. El cortante se asigna a un clip de dos ángulos (la mitad a cada ángulo), con el que se diseñan los ángulos y la soldadura o pernos tanto del lado de la viga como del de la columna; en la columna ese corte llega como carga axial. El atiesador se diseña como un elemento en compresión: longitud aproximadamente igual al peralte libre de la columna, sección bst×tst propuesta y carga C; se verifica KL/r ≤ 200 y φPn ≥ C, además de su soldadura. Recalca llevar una memoria o bitácora de cálculo para poder reconstruir el razonamiento.","formulas":[{"nombre":"Par de fuerzas en alas","expresion":"T = C = Mu/d ± Pu·(Af/A)","variables":"Mu momento en la cara, d peralte de la viga, Pu axial de la viga, Af área del ala, A área total"},{"nombre":"Corte en clip de dos ángulos","expresion":"V por ángulo = Vu/2","variables":"Vu cortante de la viga"},{"nombre":"Atiesador como columna","expresion":"K·Lst/rst ≤ 200 ; C ≤ φc·Pn","variables":"Lst longitud del atiesador, rst radio de giro de la sección del atiesador"}],"referencias_norma":["AISC 360-16 J10 (fuerzas concentradas en alas y almas, atiesadores)","AISC 360-16 Cap. E (compresión)"]},{"titulo":"Consulta del trabajo escalonado: cargas de la góndola","contenido":"Al final un alumno pregunta cómo obtener las cargas de gravedad de la góndola del trabajo escalonado. El profesor indica que son el peso propio de la estructura más el de la cubierta que va encima, y que no basta con un peso por metro cuadrado genérico: la góndola tiene planchas de cubierta soportadas por una estructura con tijerales, viguetas y arriostres, como lo enseñado en clase. Las columnas pueden ser armadas en celosía con ángulos o tubulares, y suelen revestirse con plástico, acrílico o drywall, de modo que no se ve la estructura. Todo debe modelarse como armaduras y metrarse de acuerdo con la forma escogida. Agrega que la góndola es, en esencia, un conjunto de armaduras arriba y abajo unidas por viguetas y arriostres, apoyada en columnas que pueden resolverse como secciones armadas en celosía (ángulos en las esquinas unidos por diagonales) o como tubos. La parte superior suele resolverse con un tijeral. La forma concreta depende de la propuesta arquitectónica de cada grupo, así que las cargas deben salir del metrado de esa estructura: pesos de planchas de cubierta, perfiles de tijerales y viguetas, arriostres y recubrimientos. Es una aplicación directa de los temas de armaduras, elementos en tracción, compresión y uniones vistos en el curso.","formulas":[],"referencias_norma":["Norma E.020 Cargas"]}],"ejemplos":[{"titulo":"Protocolo B1-B2 para una columna de pórtico simple con sismo","enunciado":"Pórtico de una crujía con dos columnas, cargas de gravedad que producen axiales P en cada columna y una fuerza sísmica F que genera una deriva Δ, compresión C en una columna y tracción T en la otra. Se pide describir el cálculo de Mr y Pr para la columna comprimida (el ejemplo fue cualitativo, sin valores numéricos).","pasos":["Separar la combinación 1.2D + 0.5L + 0.2S + E en caso nt (gravedad) y caso lt (sismo), en ambos sentidos.","Pstory = suma de las axiales de gravedad de todas las columnas del entrepiso más las del caso lateral (C y −T).","Pmf = axiales en las columnas del pórtico de momento (C y T en el ejemplo); RM = 1 − 0.15·Pmf/Pstory.","Pe,story = RM·H·L/ΔH, con H = F, L = altura del entrepiso y ΔH = Δ.","B2 = 1/(1 − Pstory/Pe,story) ≥ 1; luego Pr = Pnt + B2·Plt.","Cm = 0.6 − 0.4·M1/M2 (o 1.0 con cargas transversales); Pe1 = π²EI*/(K1L)²; B1 = Cm/(1 − Pr/Pe1) ≥ 1.","Mr = B1·Mnt + B2·Mlt; diseñar con la condición más desfavorable entre sismo a la derecha y a la izquierda."],"resultado":"Se obtienen Mr y Pr amplificados que incluyen aproximadamente el efecto P-Delta para usarlos en la ecuación de interacción H1-1."}],"conceptos_clave":[{"termino":"Caso nt (no translation)","definicion":"Análisis con las cargas de gravedad, que no producen traslación lateral del entrepiso; se amplifica con B1."},{"termino":"Caso lt (lateral translation)","definicion":"Análisis con cargas laterales (sismo o viento) que producen deriva; se amplifica con B2."},{"termino":"Inversión de esfuerzos","definicion":"Cambio de signo de las solicitaciones de un elemento (compresión a tracción, momento positivo a negativo) por el carácter cíclico del sismo."},{"termino":"Cm","definicion":"Coeficiente de momento equivalente que considera la forma del diagrama de momentos entre extremos; 0.6 − 0.4·M1/M2 sin cargas transversales."},{"termino":"Pstory","definicion":"Carga vertical total soportada por el entrepiso, incluidas las columnas que no forman parte del sistema lateral."},{"termino":"RM","definicion":"Factor que considera la influencia de P-δ sobre P-Δ: 1 − 0.15·Pmf/Pstory."},{"termino":"Unión semirrígida","definicion":"Unión que transmite solo una fracción del momento (aprox. 75% a 95%) por la rotación y la disipación de energía en el nudo."},{"termino":"Unión simple","definicion":"Unión que solo transmite cortante; su capacidad de momento se desprecia."},{"termino":"Fusible","definicion":"Elemento diseñado para fluir y disipar energía: vigas en pórticos de momento, arriostres en sistemas concéntricos, enlace en sistemas excéntricos."},{"termino":"Enlace (link)","definicion":"Tramo de viga entre las conexiones de los arriostres en un pórtico excéntricamente arriostrado; fluye por corte o flexión."},{"termino":"Par de fuerzas en alas","definicion":"Descomposición del momento de la viga en una tracción y una compresión M/d en las alas para diseñar la unión."}],"preguntas":[{"pregunta":"En el método aproximado del Apéndice 8, ¿qué resultados se amplifican con B2?","opciones":["Los del análisis de cargas de gravedad sin traslación","Los del análisis con traslación lateral (sismo o viento)","Solo las cargas axiales de gravedad","Los momentos debidos a cargas transversales en el tramo"],"correcta":1,"explicacion":"B2 amplifica Mlt y Plt, obtenidos del análisis con traslación lateral del entrepiso (efecto P-Δ)."},{"pregunta":"Para un elemento sin cargas transversales en curvatura doble con M1/M2 = +0.5, Cm vale:","opciones":["0.8","1.0","0.4","0.6"],"correcta":2,"explicacion":"Cm = 0.6 − 0.4·(0.5) = 0.4; en curvatura doble el cociente es positivo."},{"pregunta":"¿Cuál es el orden correcto de cálculo en el protocolo B1-B2?","opciones":["B1, Mr, B2, Pr","B2, Pr, B1, Mr","Pr, Mr, B1, B2","B1, B2, Mr, Pr"],"correcta":1,"explicacion":"B1 depende de Pr = Pnt + B2·Plt, por eso primero se calcula B2, luego Pr, luego B1 y finalmente Mr."},{"pregunta":"En combinaciones LRFD, el coeficiente α de las expresiones de B1 y B2 vale:","opciones":["1.6","0.9","0.75","1.0"],"correcta":3,"explicacion":"α = 1.0 en LRFD y 1.6 en ASD."},{"pregunta":"El factor RM = 1 − 0.15·Pmf/Pstory toma su valor mínimo (0.85) cuando:","opciones":["Todas las columnas del entrepiso pertenecen a pórticos de momento","El sistema es totalmente arriostrado","No existen cargas de gravedad","La deriva es nula"],"correcta":0,"explicacion":"Si Pmf = Pstory, RM = 0.85; en sistemas arriostrados Pmf = 0 y RM = 1."},{"pregunta":"Según la Norma E.030, el coeficiente R que se usa para la fuerza sísmica es:","opciones":["R0 / (Ia·Ip)","R0 + Ia + Ip","R0·Ia·Ip","Solo R0 de la Tabla 7"],"correcta":2,"explicacion":"R = R0·Ia·Ip, donde Ia e Ip reducen R por irregularidades en altura y en planta."},{"pregunta":"Según lo expuesto en clase, los ensayos de 1985-1995 mostraron que en una unión 'rígida' real el momento transmitido a la columna es aproximadamente:","opciones":["El 100% del momento de la viga","Entre el 75% y el 95% del momento de la viga","Menos del 5% del momento de la viga","El doble del momento de la viga"],"correcta":1,"explicacion":"Las uniones son en realidad semirrígidas y parte del momento se pierde en el nudo por rotación y disipación."},{"pregunta":"En un pórtico con arriostres excéntricos, el fusible principal es:","opciones":["La columna","La placa base","El enlace de la viga entre arriostres","La losa"],"correcta":2,"explicacion":"El enlace fluye por corte o flexión y concentra la disipación de energía; vigas fuera del enlace y columnas deben permanecer elásticas."},{"pregunta":"Una viga de peralte d = 18 in transmite Mu = 2700 kip·in sin carga axial. La fuerza de tracción en el ala para diseñar la plancha es:","opciones":["150 kips","48600 kips","75 kips","300 kips"],"correcta":0,"explicacion":"T = Mu/d = 2700/18 = 150 kips."},{"pregunta":"En una unión simple de asiento, la plancha proyectada se diseña principalmente para:","opciones":["Tracción pura","Flexión como voladizo corto y cortante debidos a la reacción de la viga","Torsión","Pandeo lateral torsional"],"correcta":1,"explicacion":"La reacción V aplicada a una distancia de la cara genera momento V·e y cortante en la plancha."},{"pregunta":"¿Por qué debe analizarse el sismo en ambos sentidos?","opciones":["Porque la norma exige duplicar la carga","Porque la fuerza sísmica cambia de signo y genera inversión de esfuerzos en los elementos","Porque el peso cambia con el sentido","Porque B1 depende del sentido"],"correcta":1,"explicacion":"F = m·a cambia de signo; una columna comprimida puede pasar a tracción y viceversa."}],"ejercicios_propuestos":["Un entrepiso de 3.5 m (138 in) de altura tiene Pstory = 1800 kips, Pmf = 900 kips, cortante de entrepiso H = 120 kips y deriva de primer orden ΔH = 0.40 in. Calcule RM, Pe,story y B2 (LRFD).","Una columna W12x65 (A992, Ix = 533 in⁴) de 14 ft, sin cargas transversales, tiene Mnt de extremos 60 y 40 kip·ft en curvatura doble, Pnt = 300 kips, Plt = 40 kips y B2 = 1.15. Calcule Pr, Cm, Pe1 (K1 = 1, EI* = 0.8EI) y B1.","Diseñe una plancha de asiento A36 de b = 6 in para una reacción Vu = 25 kips aplicada a 2.5 in de la cara de la columna: determine el espesor t necesario por flexión plástica (φ = 0.90) y la longitud de filete de 1/4 in E70XX requerida.","Una viga W18x50 (d = 18.0 in, A = 14.7 in², Af = 7.5·0.57 in²) llega a una columna con Mu = 200 kip·ft y Pu = 30 kips. Calcule las fuerzas de tracción y compresión en las alas incluyendo el reparto de la carga axial.","Un atiesador de continuidad de 3.5 in × 3/8 in y 14 in de longitud recibe C = 60 kips. Verifique KL/r ≤ 200 y su resistencia φcPn con K = 0.75 y acero A36."],"avisos":["Se toma asistencia en clase: asistieron 15 de 37 alumnos (lunes 7 de junio).","El profesor denunció un intento de acceso remoto a su computadora durante la clase; bloqueó la sesión y lo comunicó al área de cómputo.","Trabajo escalonado: diseñar la góndola con su cubierta, tijerales, viguetas y arriostres; metrar con la estructura real, no con un peso genérico por m².","La próxima clase es el miércoles."],"notas_transcripcion":["La transcripción dice 'B' para ambos amplificadores; se interpretó como B1 (no traslacional) y B2 (traslacional) según el Apéndice 8 del AISC 360.","'dwd más 0.5 dwl más 0 2 ds' se interpretó como 1.2D + 0.5L + 0.2S + E.","'p story', 'PMF', 'P Euler story' se interpretaron como Pstory, Pmf y Pe,story.","El profesor asocia oralmente la fórmula de Cm al caso con cargas sobre el elemento; según AISC, Cm = 0.6 − 0.4·M1/M2 aplica sin cargas transversales y Cm = 1.0 (conservador) con ellas. Se registró la regla del AISC.","'Tabla número 7 de la norma de sismo ... la 0 30' corresponde a la Norma E.030; 'IA' e 'IP' son Ia e Ip.","'atizador' / 'asesador' = atiesador; 'disquetrizar' = discretizar; 'Fi por Bn' = φVn."],"corto":"B1-B2 y sistemas","video":"https://www.youtube.com/watch?v=d2yjvq66IC0","duracion_min":84,"estado":"ok"},"20":{"titulo":"Uniones empernadas: ajuste, tipos de junta, diseño de un empalme y criterios de detalle; introducción a columnas compuestas","fecha":"miércoles 9 de junio de 2021 (inferida: el profesor alude al partido 'de ayer martes')","resumen":"La clase repasa las uniones empernadas y luego introduce los elementos compuestos. Se describen los pernos estructurales (A325/A490, con marca en alto relieve en la cabeza) frente a los de uso secundario (A307), y los métodos de ajuste de la Tabla J3.1 (pretensión mínima, por ejemplo 28 kips para 3/4 in A325): gata hidráulica con celda de carga, llave calibrada o torquímetro, giro de la tuerca e indicador directo de tensión. Se distinguen las juntas de aplastamiento (pernos presentados) y las de deslizamiento crítico (fricción μ·T), sus modos de falla, la resistencia nominal de la Tabla J3.2 con roscas incluidas o excluidas, los agujeros estándar, agrandados y ranurados (Tabla J3.3), las distancias mínimas a borde (Tabla J3.4) y los espaciamientos mínimo y máximo. Se resuelve un empalme traslapado de una plancha de 6×1/2 in y otra de 3×5/16 in con pernos de 1/2 in. Se comentan el criterio de diseñar las uniones de armaduras para al menos la mitad de la resistencia del elemento, los empalmes de columnas en puntos de momento nulo y la disposición de pernos en uniones viga-columna. Finalmente se introducen las columnas compuestas rellenas y embebidas, con sus límites y requisitos mínimos.","objetivos":["Al terminar, el estudiante podrá describir los métodos de pretensado de pernos y leer la pretensión mínima de la Tabla J3.1.","Al terminar, el estudiante podrá diferenciar juntas de aplastamiento y de deslizamiento crítico, y sus modos de falla.","Al terminar, el estudiante podrá seleccionar Fnv y Fnt de la Tabla J3.2, tamaños de agujero de la Tabla J3.3 y distancias a borde de la Tabla J3.4.","Al terminar, el estudiante podrá diseñar un empalme traslapado empernado verificando fluencia y rotura de cada plancha, número de pernos, espaciamientos y distancias al borde.","Al terminar, el estudiante podrá verificar la compacidad de un tubo HSS relleno y los requisitos mínimos de una columna embebida."],"temas":[{"titulo":"Pernos estructurales y métodos de ajuste","contenido":"Los pernos son piezas roscadas. Los de uso estructural (A325, A490 o sus equivalentes F3125) llevan en la cabeza la designación en alto relieve. El profesor indica que, si no la tienen, se trata de pernos para usos secundarios o de máquinas (A307). Los pernos pueden ajustarse según la Tabla J3.1, que da la pretensión mínima por diámetro y grupo; en el Perú se usa normalmente el grupo A. Por ejemplo, un perno de 3/4 in del grupo A requiere 28 kips. Describe los métodos. (1) Gata hidráulica montada en un pequeño pórtico con celda de carga: se sujeta el perno con un dispositivo de anclaje, se tracciona hasta que el manómetro marca la tensión requerida, se ajusta la tuerca con la llave y luego se libera la gata. (2) Llave calibrada o torquímetro, cuyo indicador digital muestra la tracción equivalente con factores de conversión propios de cada equipo. (3) Giro de la tuerca: primero se lleva la tuerca a la condición de ajuste firme (snug-tight), hasta donde alcanza la fuerza de la mano. Luego se aplica un giro adicional con una extensión de palanca (un tubo), que depende de la relación entre la longitud y el diámetro del perno. Para longitudes entre 4d y 8d (por ejemplo 6d) corresponde 1/2 vuelta adicional. (4) Indicador directo de tensión. Con cualquiera de ellos se obtiene la pretensión necesaria en el perno.","formulas":[{"nombre":"Giro adicional (método del giro de tuerca, RCSC)","expresion":"L ≤ 4d: 1/3 de vuelta ; 4d < L ≤ 8d: 1/2 vuelta ; 8d < L ≤ 12d: 2/3 de vuelta","variables":"L longitud del perno, d diámetro nominal; caras normales al eje del perno"}],"referencias_norma":["AISC 360-16 Tabla J3.1 (pretensión mínima de pernos)","Especificación RCSC, Tabla 8.2 (giro de tuerca)"]},{"titulo":"Juntas de aplastamiento y de deslizamiento crítico; modos de falla","contenido":"Hay dos tipos de junta. En la junta de aplastamiento (contacto) el perno solo está presentado o con ajuste firme, como un pasador. Al traccionar las planchas en sentidos opuestos, el vástago trabaja en corte y se apoya contra las paredes de los agujeros. En la junta de deslizamiento crítico el perno se pretensiona con la tracción T y, al aplicar la carga P, se desarrolla entre las superficies una fricción del orden de μ·T que impide el deslizamiento. Los modos de falla posibles son: corte del perno; aplastamiento o desgarramiento de la plancha cuando el perno está muy cerca del borde; rotura por tracción de la plancha en la sección neta si no hay distancia suficiente; y fluencia del perno en tracción. La Tabla J3.2 da los esfuerzos nominales en tracción (Fnt) y en corte (Fnv) con dos hipótesis: rosca incluida en el plano de corte (N), con menor resistencia, y rosca excluida (X), con mayor resistencia porque el área efectiva es la del vástago completo. Para A325, Fnv = 54 ksi (N) y 68 ksi (X), y Fnt = 90 ksi. La elección de la hipótesis es una decisión del diseñador, que debe garantizarla en obra. También comenta los apoyos: uno fijo, con perno anclado con epóxico en un muro o columna y ajustado, y uno deslizante, con agujeros ranurados (ojos chinos) y pernos solo presentados para permitir el movimiento de la viga.","formulas":[{"nombre":"Resistencia de un perno en corte","expresion":"φRn = φ·Fnv·Ab, φ = 0.75","variables":"Fnv esfuerzo nominal en corte (ksi), Ab área nominal del perno (in²)"},{"nombre":"Resistencia de un perno en tracción","expresion":"φRn = φ·Fnt·Ab, φ = 0.75","variables":"Fnt = 90 ksi para A325"},{"nombre":"Deslizamiento crítico (concepto)","expresion":"Rn ≈ μ·Du·hf·Tb·ns","variables":"μ coeficiente de fricción, Du = 1.13, hf factor de rellenos, Tb pretensión mínima, ns número de planos de deslizamiento"}],"referencias_norma":["AISC 360-16 J3.6 y Tabla J3.2","AISC 360-16 J3.8 (deslizamiento crítico)","AISC 360-16 J3.10 (aplastamiento y desgarramiento)"]},{"titulo":"Agujeros, distancias al borde y espaciamientos","contenido":"El diámetro del agujero considera el diámetro comercial del perno, su tolerancia de fabricación (±1/16 in) y una holgura: en la práctica, el agujero estándar es d + 1/16 in. Para un perno de 1/2 in, la Tabla J3.3 da 9/16 in (estándar), 5/8 in (agrandado), 9/16 × 11/16 in (ranura corta) y 9/16 × 1-1/4 in (ranura larga). Para el cálculo del área neta se resta además 1/16 in, es decir, se usa d + 1/8 in. El espaciamiento entre pernos debe ser de unos 3 diámetros (mínimo 2-2/3 d). Las distancias mínimas al borde están en la Tabla J3.4: 3/4 in para pernos de 1/2 in, 1 in para 3/4 in y 1-1/4 in para 1 in. Para agujeros agrandados o ranurados se suma un incremento C2 (Tabla J3.5). El espaciamiento máximo en elementos pintados o no sujetos a corrosión es 24 veces el espesor de la plancha más delgada, sin exceder 12 in (305 mm). En elementos de acero no pintado sujetos a corrosión atmosférica es 14 veces el espesor, sin exceder 7 in (180 mm). La distancia máxima al borde es 12 veces el espesor, sin exceder 6 in.","formulas":[{"nombre":"Diámetro para área neta","expresion":"dh,neto = d + 1/16 + 1/16 = d + 1/8 in","variables":"d diámetro nominal del perno"},{"nombre":"Espaciamiento","expresion":"s ≥ 2.67·d (preferible 3d) ; s ≤ min(24·tmin, 12 in)","variables":"tmin espesor de la parte más delgada; para acero no pintado expuesto: s ≤ min(14·tmin, 7 in)"}],"referencias_norma":["AISC 360-16 Tabla J3.3 (dimensiones de agujeros)","AISC 360-16 J3.3, J3.4, J3.5, Tablas J3.4 y J3.5"]},{"titulo":"Diseño de un empalme traslapado empernado (planchas 6×1/2 y 3×5/16)","contenido":"El profesor resuelve un empalme traslapado de una plancha de 6 × 1/2 in con otra de 3 × 5/16 in, ambas de acero A36 (Fy = 36 ksi, Fu = 58 ksi), con pernos A325 de 1/2 in. El criterio es determinar primero cuánto resiste cada elemento por separado y diseñar la unión para la resistencia del elemento más débil. Si la plancha chica falla a 30 kips, la carga nunca podrá llegar a los 97 kips de la grande. Para cada plancha se evalúa la fluencia en el área bruta y la rotura en el área neta (descontando un agujero de 1/2 + 1/8 in en la línea de falla). La plancha pequeña gobierna con unos 30.4 kips. Para el perno, se calcula un área conservadora con el diámetro reducido por la tolerancia (7/16 in), Ab ≈ 0.15 in², y con Fnv = 54 ksi (rosca incluida) cada perno resiste unos 6.08 kips en corte simple. Se requieren 30.38/6.075 ≈ 5.0, que se redondean a 6 pernos. Los límites de espaciamiento quedan entre unas 1.375 in como mínimo (según la cifra de clase) y 7.5 in como máximo (24 × 5/16), y se adopta 2 in. La distancia al borde en la plancha de 3 in cumple ampliamente los 3/4 in de la Tabla J3.4. Ante preguntas, aclara el criterio de armaduras: la unión no debe diseñarse para menos de la mitad de la resistencia del elemento. Si el análisis da 24 kips y la resistencia del elemento es 50 kips, se diseña para 25 kips.","formulas":[{"nombre":"Fluencia en área bruta","expresion":"φPn = 0.90·Fy·Ag","variables":"Ag área bruta (in²)"},{"nombre":"Rotura en área neta efectiva","expresion":"φPn = 0.75·Fu·Ae","variables":"Ae = An·U; se tomó Ae = An = (b − dh)·t"},{"nombre":"Número de pernos","expresion":"n ≥ Tu / (φ·Fnv·Ab)","variables":"Tu fuerza a transmitir"}],"referencias_norma":["AISC 360-16 D2 (tracción)","AISC 360-16 J4.1 (elementos de conexión en tracción)","AISC 360-16 Tablas J3.2 y J3.4"]},{"titulo":"Criterios de detalle: empalmes de columna y pernos en uniones viga-columna","contenido":"Las columnas de acero no se cortan en cada piso: suben de forma continua dos o tres pisos y se empalman. El empalme debe ubicarse donde el momento por sismo es casi nulo, entre un tercio y la mitad de la altura del entrepiso, normalmente a media altura. El profesor critica empalmar al ras de la losa, como hacen algunos por costumbre del concreto. En la unión viga-columna con ángulos empernados, la tracción del ala de la viga somete a los pernos del lado de la viga a corte y a los del lado de la columna a tracción. En ese caso se usa Fnt = 90 ksi en lugar de Fnv = 54 ksi. La longitud del ángulo está limitada por el ancho del ala de la columna (≤ bf), y su altura en el clip de corte por el peralte disponible de la viga. Hay que verificar que los pernos quepan con las distancias al borde y el espaciamiento de 3 diámetros, y si no caben se agrega una plancha soldada. Ningún libro da las acciones en cada pieza: el diseñador las identifica a partir de cómo llegan las fuerzas al nudo. Ante la pregunta por vigas que llegan por ambos lados al alma de la columna, explica que los ángulos forman un sándwich con el alma y el mismo perno atraviesa ambos, trabajando en doble corte con el mayor cortante. Las vigas de los pórticos principales y secundarios tienen peraltes distintos, así que sus pernos quedan a diferentes niveles y no interfieren. Recomienda al menos tres ejes resistentes en cada dirección.","formulas":[],"referencias_norma":["AISC 360-16 J1.4 (empalmes)","AISC 360-16 Tabla J3.2"]},{"titulo":"Columnas compuestas: rellenas (filled) y embebidas (encased)","contenido":"Un elemento compuesto combina concreto y acero trabajando en conjunto. La primera opción es rellenar un tubo o una sección cajón (HSS) con concreto. El concreto fresco se comporta como un líquido y genera presión hidrostática, máxima en el fondo, que puede pandear localmente las paredes del tubo. Por eso debe cuidarse el espesor y se recomienda usar un concreto muy fluido (grout) con slump del orden de 20 cm. La otra opción es embeber el perfil en concreto: se coloca una canastilla de acero longitudinal y estribos alrededor del perfil y se vacía concreto con encofrado. Es el 'encamisetado' o encased. El profesor comenta que algunas columnas sorprendentemente delgadas en edificios tienen un perfil de acero dentro, y que el concreto puede multiplicar varias veces la resistencia. Se asume compatibilidad de deformaciones: acero estructural, refuerzo longitudinal y concreto alcanzan la misma deformación unitaria, con 0.003 como deformación máxima del concreto. También menciona las vigas compuestas, con losa sobre placa colaborante o con perfil de acero embebido en una viga de concreto.","formulas":[],"referencias_norma":["AISC 360-16 Cap. I, I1 e I2"]},{"titulo":"Límites de esbeltez para tubos rellenos (Tabla I1.1a) y requisitos de la columna embebida","contenido":"Para secciones rectangulares HSS rellenas de concreto, la Tabla I1.1a establece límites de b/t distintos de los de acero solo. Compacta si b/t ≤ 2.26·√(E/Fy). No compacta si está entre 2.26 y 3.00·√(E/Fy). Esbelta si supera 3.00·√(E/Fy), con un máximo permitido de 5.00·√(E/Fy). Ejemplo: tubo de 5 × 5 × 3/16 in, con b/t tomado como 5/(3/16) = 26.67. Con E = 29000 ksi y Fy = 36 ksi, los límites son 64.13, 85.1 y 141.9, por lo que el tubo es compacto. Se busca que el tubo sea compacto o no compacto para evitar el pandeo local del fondo durante el vaciado. Para columnas embebidas, el área del perfil debe ser al menos el 1% del área bruta (As ≥ 0.01·Ag); si no, la sección no se considera compuesta. La cuantía de refuerzo longitudinal continuo debe ser al menos 0.004 (ρsr = Asr/Ag ≥ 0.004). Los estribos deben ser de 3/8 in (#3) con espaciamiento máximo de 12 in o de 1/2 in (#4) o mayores con máximo de 16 in, y en ningún caso más de 0.5 veces la menor dimensión de la sección. Para tubos rellenos grandes también puede colocarse canastilla; deben cumplirse los requisitos anteriores aplicables y los de la Tabla I1.1a. El diseño sigue el protocolo de la norma (Pno, Pe con EIeff), que se verá la clase siguiente.","formulas":[{"nombre":"Límites b/t HSS rectangular relleno","expresion":"λp = 2.26·√(E/Fy) ; λr = 3.00·√(E/Fy) ; λmax = 5.00·√(E/Fy)","variables":"b ancho plano de la pared, t espesor de diseño"},{"nombre":"Área mínima de acero","expresion":"As ≥ 0.01·Ag","variables":"As área del perfil, Ag área bruta de la sección compuesta"},{"nombre":"Cuantía mínima de refuerzo","expresion":"ρsr = Asr/Ag ≥ 0.004","variables":"Asr área de barras longitudinales continuas"}],"referencias_norma":["AISC 360-16 Tabla I1.1a","AISC 360-16 I2.1a (limitaciones de columnas embebidas)","AISC 360-16 I2.2a"]}],"ejemplos":[{"titulo":"Empalme traslapado de plancha 6×1/2 in con plancha 3×5/16 in","enunciado":"Dos planchas A36 (Fy = 36 ksi, Fu = 58 ksi), una de 6 × 1/2 in y otra de 3 × 5/16 in, se traslapan y unen con pernos A325 de 1/2 in, con la rosca incluida en el plano de corte (Fnv = 54 ksi). Determinar la carga de diseño, el número de pernos, el espaciamiento y verificar la distancia al borde.","pasos":["Plancha grande, fluencia: φPn = 0.9·36·(6·0.5) = 97.2 kips.","Plancha grande, rotura: An = (6 − 0.625)·0.5 = 2.69 in²; φPn = 0.75·58·2.69 = 116.9 kips. Gobierna 97.2 kips.","Plancha chica, fluencia: φPn = 0.9·36·(3·0.3125) = 30.38 kips.","Plancha chica, rotura: An = (3 − 0.625)·0.3125 = 0.742 in²; φPn = 0.75·58·0.742 = 32.3 kips. Gobierna 30.38 kips.","La unión se diseña para Tu = 30.38 kips, porque la plancha chica falla primero.","Perno: d reducido = 1/2 − 1/16 = 7/16 in, Ab = π·0.4375²/4 ≈ 0.150 in²; φRn = 0.75·54·0.15 ≈ 6.08 kips por perno.","n ≥ 30.38/6.075 ≈ 5.0, se adoptan 6 pernos.","Espaciamiento: mínimo ≈ 1.375 in (valor de clase); máximo = min(24·5/16, 12) = 7.5 in; se adopta s = 2 in.","Distancia al borde en la plancha de 3 in: eje a 1.5 in del borde (1.875 in según la cifra de clase), mayor que 3/4 in de la Tabla J3.4: cumple."],"resultado":"6 pernos A325 de 1/2 in en una línea a 2 in, para una carga de diseño de 30.38 kips controlada por la fluencia de la plancha de 3 × 5/16 in."},{"titulo":"Verificación de compacidad de un HSS 5×5×3/16 relleno","enunciado":"Clasificar la pared de un tubo de 5 × 5 × 3/16 in de acero con Fy = 36 ksi que se rellenará de concreto.","pasos":["b/t = 5/(3/16) = 26.67 (simplificación de clase usando el ancho exterior).","λp = 2.26·√(29000/36) = 64.13.","λr = 3.00·√(29000/36) = 85.1; λmax = 5.00·√(29000/36) = 141.9.","26.67 < 64.13, por lo tanto la pared es compacta."],"resultado":"Sección compacta para columna rellena: no hay riesgo de pandeo local de las paredes por la presión del concreto fresco."}],"conceptos_clave":[{"termino":"Pretensión mínima","definicion":"Tracción que debe inducirse en un perno de alta resistencia según la Tabla J3.1 (p. ej. 28 kips para 3/4 in A325)."},{"termino":"Método del giro de la tuerca","definicion":"Ajuste firme seguido de una rotación adicional especificada según la relación L/d del perno."},{"termino":"Junta de aplastamiento","definicion":"Junta en que la carga se transmite por corte del vástago y aplastamiento contra el agujero."},{"termino":"Junta de deslizamiento crítico","definicion":"Junta pretensionada que transmite la carga por fricción entre superficies, sin deslizamiento."},{"termino":"Rosca incluida (N) / excluida (X)","definicion":"Hipótesis sobre si la rosca atraviesa el plano de corte; cambia Fnv (54 vs 68 ksi en A325)."},{"termino":"Agujero ranurado (ojo chino)","definicion":"Agujero alargado que permite movimiento relativo, usado en apoyos deslizantes."},{"termino":"Criterio del 50%","definicion":"Una unión de armadura no debe diseñarse para menos de la mitad de la resistencia del elemento que conecta."},{"termino":"Empalme de columna","definicion":"Unión de tramos de columna ubicada cerca del punto de momento nulo (entre 1/3 y 1/2 de la altura)."},{"termino":"Columna rellena","definicion":"Tubo o cajón de acero lleno de concreto."},{"termino":"Columna embebida (encamisetada)","definicion":"Perfil de acero rodeado de concreto armado con barras longitudinales y estribos."}],"preguntas":[{"pregunta":"Según la Tabla J3.1, la pretensión mínima de un perno A325 de 3/4 in es:","opciones":["12 kips","19 kips","28 kips","39 kips"],"correcta":2,"explicacion":"La Tabla J3.1 da 28 kips para 3/4 in en el grupo A."},{"pregunta":"Por el método del giro de la tuerca, un perno con longitud de 6d requiere después del ajuste firme:","opciones":["1/3 de vuelta","1/2 vuelta","2/3 de vuelta","1 vuelta"],"correcta":1,"explicacion":"Para 4d < L ≤ 8d corresponde media vuelta adicional."},{"pregunta":"Para un perno A325 en corte con rosca incluida en el plano de corte, Fnv es:","opciones":["68 ksi","90 ksi","54 ksi","27 ksi"],"correcta":2,"explicacion":"Fnv = 54 ksi (N); con rosca excluida (X) es 68 ksi."},{"pregunta":"El agujero estándar para un perno de 1/2 in es:","opciones":["1/2 in","9/16 in","5/8 in","11/16 in"],"correcta":1,"explicacion":"Tabla J3.3: estándar 9/16 in; agrandado 5/8 in."},{"pregunta":"La distancia mínima al borde para un perno de 3/4 in según la Tabla J3.4 es:","opciones":["3/4 in","7/8 in","1 in","1-1/4 in"],"correcta":2,"explicacion":"La Tabla J3.4 da 1 in para pernos de 3/4 in."},{"pregunta":"El espaciamiento máximo entre pernos en planchas pintadas de 5/16 in no sujetas a corrosión es:","opciones":["7.5 in","12 in","4.4 in","3.75 in"],"correcta":0,"explicacion":"min(24·0.3125, 12) = 7.5 in."},{"pregunta":"En el empalme de una plancha de 6×1/2 con una de 3×5/16, la unión se diseña para 30.38 kips porque:","opciones":["Es la resistencia de los pernos","Es la rotura de la plancha grande","Es la menor resistencia de los elementos unidos y nunca se alcanzará la de la plancha grande","Es el 50% de 60 kips"],"correcta":2,"explicacion":"La plancha chica fluye a 30.38 kips antes de que la grande llegue a 97.2 kips."},{"pregunta":"¿Dónde conviene ubicar el empalme de una columna de acero en un edificio sísmico?","opciones":["Al ras de la losa","A la altura de la viga","En la zona de momento casi nulo, entre 1/3 y 1/2 de la altura del entrepiso","En la base"],"correcta":2,"explicacion":"El momento por sismo se anula cerca de media altura, por eso el empalme se coloca allí."},{"pregunta":"Para un HSS rectangular relleno de concreto, la pared es compacta si b/t es menor o igual que:","opciones":["1.12·√(E/Fy)","1.40·√(E/Fy)","3.00·√(E/Fy)","2.26·√(E/Fy)"],"correcta":3,"explicacion":"Tabla I1.1a: λp = 2.26·√(E/Fy) para paredes de HSS rectangulares rellenas en compresión."},{"pregunta":"Una columna embebida requiere que el área del perfil de acero sea al menos:","opciones":["0.4% de Ag","1% de Ag","4% de Ag","8% de Ag"],"correcta":1,"explicacion":"AISC I2.1a: As ≥ 0.01·Ag; además ρsr ≥ 0.004."},{"pregunta":"En una junta de deslizamiento crítico, la carga se transmite principalmente por:","opciones":["Aplastamiento del perno contra el agujero","Fricción entre las superficies pretensionadas","Soldadura de tapón","Tracción del perno"],"correcta":1,"explicacion":"La pretensión T genera fricción μ·T que impide el deslizamiento."}],"ejercicios_propuestos":["Diseñe el empalme traslapado de una plancha de 8 × 5/8 in con otra de 4 × 3/8 in, A36, con pernos A325 de 3/4 in (rosca incluida). Determine la carga de diseño, el número de pernos, el espaciamiento entre límites y la distancia al borde.","Una diagonal de armadura tiene φPn = 50 kips y el análisis le asigna 18 kips. ¿Para qué fuerza debe diseñarse su conexión según el criterio del 50%? ¿Cuántos pernos A325 de 5/8 in en corte simple (rosca incluida) requiere?","El ala de una viga transmite T = 90 kips a un ángulo empernado al ala de la columna. Si los pernos del lado de la columna trabajan en tracción, ¿cuántos pernos A325 de 3/4 in se necesitan (φ = 0.75, Fnt = 90 ksi)? Verifique si caben 4 pernos en un ala de columna de bf = 10 in con distancias al borde de la Tabla J3.4.","Verifique la compacidad de un HSS 6×6×1/4 (t de diseño = 0.233 in, b/t = 22.8) relleno de concreto con Fy = 46 ksi según la Tabla I1.1a.","Una columna embebida de 40 × 40 cm contiene un W8x31 (A = 9.12 in²) y 4 barras de 3/4 in. Verifique As ≥ 1%Ag, ρsr ≥ 0.004 y el espaciamiento máximo de estribos de 3/8 in."],"avisos":["Entrega del trabajo escalonado: hoy hasta el mediodía en el aula virtual (a pedido de los delegados).","En próximas clases se verá el diseño de placas colaborantes, que se usará en el trabajo escalonado.","El protocolo de diseño de columnas compuestas (Pn, Pe) se desarrollará el próximo lunes.","Se tomó asistencia: 12 alumnos ausentes."],"notas_transcripcion":["'pernos A' (sin número) se interpretó como A307 (secundarios) y A325/A490 (estructurales).","'tabla J' se interpretó como las Tablas J3.1 a J3.5 según el contexto.","'perro' / 'pérmo' = perno; 'requintar' = ajustar o pretensar; 'ojo chino' = agujero ranurado.","'916 por un cuarto' se interpretó como 9/16 × 1-1/4 in (ranura larga).","'entre 24 veces el espesor mínimo a 30 milímetros' se interpretó como 24t ≤ 12 in (305 mm).","'longitud mínima de traslape ... máxima 12 veces el espesor' se interpretó como la distancia máxima al borde (12t ≤ 6 in).","El espaciamiento mínimo de 1.375 in y la distancia al borde de 1.875 in son las cifras dichas en clase; su origen numérico no es claro (3d con d = 1/2 in daría 1.5 in).","'Fi = 0.9 el acero es 36' y 'rotura que es 58' corresponden a φt = 0.90 en fluencia y Fu = 58 ksi, con φt = 0.75 en rotura.","Sobre los estribos de la columna embebida el profesor dijo 'el mínimo será el menor entre B y T'; el AISC limita el espaciamiento máximo a 0.5 veces la menor dimensión, y en la clase 21 se usa 0.5·b."],"corto":"Empalmes empernados","video":"https://www.youtube.com/watch?v=qAyG2_uwxnE","duracion_min":95,"estado":"ok"},"21":{"titulo":"Columnas compuestas en compresión (embebidas y rellenas), transferencia de carga e introducción a vigas compuestas con placa colaborante","fecha":null,"resumen":"La clase desarrolla el protocolo del AISC 360-16 para columnas compuestas en compresión. Se calculan Pno, la rigidez efectiva EIeff (con C1 en embebidas y C3 en rellenas), la carga de Euler Pe y la resistencia Pn según la relación Pno/Pe frente a 2.25, con φc = 0.75. Se resuelven dos ejemplos en Excel. En el primero, un perfil W4x13 de 10 ft con K = 1.2 resiste solo 41.7 kips como acero aislado; embebido en una sección de 30 × 35 cm con 4 barras de 1/2 in y concreto de 3 ksi alcanza φPn ≈ 350 kips, unas 8.4 veces más. En el segundo, un HSS 4×4×5/16 relleno de concreto prácticamente no mejora (81.4 frente a 81.2 kips), lo que muestra que el relleno es ineficiente en perfiles muy pequeños. Se comentan la resistencia a tracción de compuestos y la transferencia de carga entre acero y concreto (cortante en la interfase V'r y mecanismos de aplastamiento directo, conectores y adherencia). Finalmente se introduce la viga compuesta: ancho efectivo de losa y requisitos geométricos de la placa colaborante y de los conectores de corte, con mención de las investigaciones del CISMID desde 2001.","objetivos":["Al terminar, el estudiante podrá dimensionar una columna embebida (b, h, barras, estribos) y verificar As ≥ 1% Ag, ρsr ≥ 0.004 y el espaciamiento de estribos.","Al terminar, el estudiante podrá calcular Pno, EIeff, Pe y φPn de columnas compuestas embebidas y rellenas según el AISC 360-16.","Al terminar, el estudiante podrá comparar la resistencia del perfil solo con la de la sección compuesta y juzgar la eficiencia del compuesto.","Al terminar, el estudiante podrá calcular la resistencia a tracción de un compuesto y explicar la transferencia de carga en la interfase acero-concreto.","Al terminar, el estudiante podrá determinar el ancho efectivo de una viga compuesta y enumerar los requisitos de la placa colaborante y los conectores de corte."],"temas":[{"titulo":"Protocolo de diseño de columnas compuestas embebidas en compresión","contenido":"Se recuerda que un compuesto puede ser embebido (el perfil rodeado de concreto armado) o relleno (concreto dentro de un tubo o cajón, con o sin canastilla). La resistencia nominal base Pno suma la fluencia del perfil, la del refuerzo longitudinal y la del concreto con 0.85·f'c, cada una con su área. La carga de Euler del compuesto se calcula con una rigidez efectiva EIeff que suma Es·Is del perfil, Es·Isr de las barras y una fracción C1 de Ec·Ic del concreto. C1 depende de la proporción de acero respecto al área bruta y no puede superar 0.7. Con Pe = π²·EIeff/(KL)², si Pno/Pe ≤ 2.25 el pandeo es inelástico y Pn = Pno·0.658^(Pno/Pe); si es mayor, el pandeo es elástico y Pn = 0.877·Pe. La resistencia de diseño es φc·Pn con φc = 0.75. El módulo del concreto en unidades inglesas es Ec = w^1.5·√f'c, con w = 145 lb/ft³ y f'c en ksi, lo que da unos 3024 ksi para f'c = 3 ksi (aproximadamente 210 kg/cm², el mínimo que el profesor recomienda). La inercia del concreto se obtiene por diferencia: inercia bruta menos la del perfil y la de las barras, estas trasladadas con el teorema de Steiner. Se verifica en el eje débil del perfil, que es el que controla el acero solo.","formulas":[{"nombre":"Resistencia nominal base (embebida)","expresion":"Pno = Fy·As + Fysr·Asr + 0.85·f'c·Ac","variables":"As, Asr, Ac áreas de perfil, refuerzo y concreto; Fy, Fysr fluencias (ksi); f'c resistencia del concreto (ksi)"},{"nombre":"Rigidez efectiva (embebida, AISC 360-16)","expresion":"EIeff = Es·Is + Es·Isr + C1·Ec·Ic ; C1 = 0.25 + 3·(As + Asr)/Ag ≤ 0.7","variables":"Is, Isr, Ic inercias de perfil, refuerzo y concreto"},{"nombre":"Módulo del concreto","expresion":"Ec = w^1.5·√f'c","variables":"w peso unitario (lb/ft³), f'c (ksi), Ec (ksi)"},{"nombre":"Carga de Euler","expresion":"Pe = π²·EIeff/(K·L)²","variables":"K·L longitud efectiva (in)"},{"nombre":"Resistencia a compresión","expresion":"Si Pno/Pe ≤ 2.25: Pn = Pno·0.658^(Pno/Pe) ; si no: Pn = 0.877·Pe ; φc = 0.75","variables":""},{"nombre":"Steiner para barras","expresion":"Isr = Σ(I0 + Ab·d²)","variables":"I0 inercia propia de la barra, Ab área, d distancia del centroide de la barra al eje"}],"referencias_norma":["AISC 360-16 I2.1b, ecuaciones I2-2 a I2-6","AISC 360-16 I2.1b, ec. I2-4 (C1)","AISC 360-16 I1.2 (Ec)"]},{"titulo":"Ejemplo 1: perfil W4x13 solo y embebido (encamisetado)","contenido":"Primero se evalúa el W4x13 (A = 3.83 in², d = 4.16 in, bf = 4.06 in, rx = 1.72 in, ry = 1.00 in, Ix = 11.3 in⁴, Iy = 3.86 in⁴) de acero A36 trabajando solo. Las relaciones ancho-espesor de ala y alma son menores que los límites de la Tabla B4.1a (0.56·√(E/Fy) y 1.49·√(E/Fy)), así que la sección es no esbelta y se revisan el pandeo flexional y el torsional. Con L = 120 in y K = 1.2, KL/r = 83.7 en x y 144 en y. Como 144 > 4.71·√(E/Fy) = 133.7, el pandeo es elástico: Fe = π²E/(KL/r)² ≈ 13.8 ksi, Fcr = 0.877·Fe ≈ 12.1 ksi y φPn = 0.9·3.83·12.1 ≈ 41.7 kips. El pandeo torsional da un Fe mayor (unos 135 ksi), por lo que no gobierna: controla el pandeo flexional. Después se diseña la camiseta con 4 barras de 1/2 in (Fysr = 60 ksi), estribos de 3/8 in y recubrimiento de 2 in. Se estima b = bf + 2·(2db + db + dst + rec) = 4.06 + 2·3.875 = 11.81 in (30 cm). Para h se obtiene 11.91 in (30.25 cm) y se redondea a un valor práctico de 35 cm (13.78 in). Entonces Ag ≈ 162.7 in², As/Ag ≈ 2.4% > 1% y ρsr = 4·0.196/162.7 ≈ 0.0048 > 0.004. El espaciamiento de estribos se limita a 0.5·b ≈ 5.91 in o 12 in, y se adopta 6 in. Con Ac ≈ 158.1 in² y f'c = 3 ksi resulta Pno ≈ 588 kips. Luego C1 ≈ 0.335 < 0.7 y la inercia del concreto se obtiene por diferencia. En el eje y, EIeff ≈ 2.26×10⁶ kip·in², Pe ≈ 1076 kips y Pno/Pe ≈ 0.55 < 2.25, así que el pandeo es inelástico: Pn ≈ 467 kips y φPn ≈ 350 kips. La relación 350/41.7 ≈ 8.4 muestra que conviene embeber el perfil.","formulas":[{"nombre":"Estimación del ancho de la camiseta","expresion":"b = bf + 2·(2·db + db + dst + rec)","variables":"db diámetro de la barra, dst diámetro del estribo, rec recubrimiento"},{"nombre":"Ubicación de barras","expresion":"x = b/2 − rec − dst − db/2","variables":"distancia del centroide de la barra al eje"}],"referencias_norma":["AISC 360-16 E3 (pandeo flexional), E4 (pandeo torsional)","AISC 360-16 Tabla B4.1a"]},{"titulo":"Columnas rellenas (filled): Pno según compacidad y rigidez efectiva C3","contenido":"En las secciones rellenas, Pno depende de la clasificación de la pared según la Tabla I1.1a. Para secciones compactas, Pno = Pp = Fy·As + C2·f'c·(Ac + Asr·Es/Ec), con C2 = 0.85 en secciones rectangulares y 0.95 en circulares por el efecto de confinamiento. Para secciones no compactas y esbeltas Pno se reduce con las expresiones de la norma, y en el caso esbelto se usa un esfuerzo crítico de pandeo local para el acero. La rigidez efectiva se calcula como EIeff = Es·Is + Es·Isr + C3·Ec·Ic, con C3 = 0.45 + 3·(As + Asr)/Ag ≤ 0.9. Pe y Pn se obtienen con las mismas expresiones que en las secciones embebidas, con φc = 0.75. El profesor señala que cuando el perfil es muy pequeño apenas cabe refuerzo: en un tubo de 10 × 10 cm no entra una canastilla y solo se pueden colocar bastones o ganchos. En la práctica, la eficiencia de una sección rellena aumenta con el tamaño del tubo: a mayor área interior, mayor contribución del concreto a Pno y a EIeff.","formulas":[{"nombre":"Pno sección rellena compacta","expresion":"Pno = Pp = Fy·As + C2·f'c·(Ac + Asr·Es/Ec) ; C2 = 0.85 rectangular, 0.95 circular","variables":""},{"nombre":"Rigidez efectiva (rellena)","expresion":"EIeff = Es·Is + Es·Isr + C3·Ec·Ic ; C3 = 0.45 + 3·(As + Asr)/Ag ≤ 0.9","variables":""}],"referencias_norma":["AISC 360-16 I2.2b, ecuaciones I2-9 a I2-13"]},{"titulo":"Ejemplo 2: HSS 4×4×5/16 solo y relleno de concreto","contenido":"El tubo HSS 4×4×5/16 (A = 4.10 in², b/t = 10.7, I = 9.14 in⁴, r = 1.49 in, J = 15.3 in⁴) de acero con Fy = 36 ksi es compacto y no esbelto. Con L = 120 in y K = 1.2, KL/r ≈ 96.6 < 133.7, así que el pandeo es inelástico: Fe ≈ 30.7 ksi, Fcr = 0.658^(Fy/Fe)·Fy ≈ 22 ksi y φPn = 0.9·22·4.10 ≈ 81.2 kips. La verificación torsional da una resistencia mayor (unos 132.6 kips), por lo que gobierna el pandeo flexional. Luego se rellena el tubo con concreto de 3 ksi y se colocan dos bastones de 3/8 in (0.11 in² cada uno, 60 ksi), porque no cabe una canastilla: el espacio interior es de unos 6 cm. Con Ag = 16 in², As/Ag ≈ 26% > 1% y ρsr ≈ 0.014 > 0.004. Como la sección es compacta, Pno = Pp ≈ 182 kips con C2 = 0.85. El factor C3 calculado supera 0.9 (señal de poca eficiencia), así que se toma C3 = 0.9. Con EIeff del orden de 3.1×10⁵ kip·in², Pe ≈ 147 kips, Pno/Pe ≈ 1.24 < 2.25 (pandeo inelástico), Pn ≈ 108.6 kips y φPn ≈ 81.4 kips. Frente a los 81.2 kips del tubo vacío, la mejora es prácticamente nula: en perfiles muy pequeños el relleno no es eficiente. Subir f'c a 4 o 5 ksi mejora poco, y solo un concreto de alta resistencia lograría alrededor de un 7% más, lo que no es económico.","formulas":[],"referencias_norma":["AISC 360-16 I2.2","AISC 360-16 E3"]},{"titulo":"Compuestos en tracción","contenido":"Si la sección compuesta trabaja en tracción, el concreto no aporta. En una sección embebida la resistencia nominal es la suma de la fluencia del perfil y la fluencia de las barras longitudinales. En una rellena es igual, el área del perfil por Fy más el refuerzo interior si existe. Los ganchos o bastones aislados aportan muy poco, así que la resistencia es prácticamente la del perfil solo. El profesor lo muestra para contrastar con la compresión: en compresión el concreto multiplica la capacidad, en tracción no la cambia. En los ejemplos de la clase, el gancho de 3/8 in colocado en el tubo de 4 × 4 in casi no modifica la resistencia a tracción respecto del tubo solo. Por eso la sección compuesta no se justifica para elementos que trabajan principalmente en tracción: el concreto aporta peso, protección contra fuego y rigidez, pero no resistencia a tracción. Si hubiera tracción importante, conviene confiar en el perfil y en barras longitudinales continuas debidamente ancladas.","formulas":[{"nombre":"Resistencia a tracción de compuestos","expresion":"Pn = Fy·As + Fysr·Asr ; φt = 0.90","variables":"As área del perfil, Asr área de refuerzo longitudinal"}],"referencias_norma":["AISC 360-16 I2.1c e I2.2c (ecuaciones I2-8 e I2-14)"]},{"titulo":"Transferencia de carga entre acero y concreto","contenido":"Cuando la carga externa se aplica solo a uno de los materiales, aparece un cortante longitudinal en la interfase, V'r, que debe transferirse al otro material. Si la fuerza se aplica al perfil de acero, V'r = Pr·(1 − Fy·As/Pno). Si se aplica al concreto, V'r = Pr·(Fy·As/Pno). Debe cumplirse V'r ≤ φ·Rn, donde Rn proviene de alguno de los mecanismos de la norma: aplastamiento directo del concreto (bearing), con φRn = 0.65·1.7·f'c·A1; conectores de corte soldados al perfil; o adherencia directa, solo en secciones rellenas. El profesor indica que, con las dimensiones ya obtenidas, normalmente estos valores se cumplen, y que el tema cobra más importancia en flexión, donde se calcula con más precisión el cortante horizontal en vigas compuestas. Las dos hipótesis extremas son que toda la carga entre por el concreto o que entre por el acero, y la verificación debe hacerse para el caso que corresponda a la forma real en que llega la carga (por ejemplo, una viga conectada al perfil o una losa apoyada sobre el concreto). La fuerza se transfiere en una longitud de introducción de carga limitada por la norma alrededor del punto de aplicación, y allí deben ubicarse los conectores si se usa ese mecanismo.","formulas":[{"nombre":"Cortante de transferencia (carga aplicada al acero)","expresion":"V'r = Pr·(1 − Fy·As/Pno)","variables":"Pr carga axial requerida"},{"nombre":"Cortante de transferencia (carga aplicada al concreto)","expresion":"V'r = Pr·(Fy·As/Pno)","variables":""},{"nombre":"Aplastamiento directo","expresion":"φB·Rn = 0.65·1.7·f'c·A1","variables":"A1 área de concreto cargada"}],"referencias_norma":["AISC 360-16 I6.2 (asignación de fuerzas)","AISC 360-16 I6.3 (mecanismos: aplastamiento, conectores, adherencia directa)"]},{"titulo":"Introducción a vigas compuestas: ancho efectivo y requisitos de placa colaborante y conectores","contenido":"El caso más usado de compuesto en flexión es la viga de acero con losa sobre placa colaborante (steel deck). El profesor menciona que en el CISMID se han realizado tesis desde 2001 que sirvieron para desarrollar el catálogo técnico de Acero Deck de Aceros Procesados. La losa se une a la viga mediante conectores de corte (studs) y trabaja con ella; primero se define el ancho efectivo. A cada lado de la viga se toma el menor valor entre L/8 (L = luz de la viga), la mitad de la distancia a la viga adyacente y la distancia al borde de la losa, y el ancho total es la suma de ambos lados. Para la placa la norma exige: ancho promedio del valle wr ≥ 2 in; altura nominal del nervio hr ≤ 3 in; conectores que sobresalgan al menos 1.5 in por encima de la cresta y con al menos 1/2 in de recubrimiento sobre su cabeza; espesor de concreto sobre la cresta ≥ 2 in. Se pide recubrimiento mínimo de 1 in al refuerzo de temperatura, diámetro del conector ≤ 2.5·tf del ala (salvo que esté sobre el alma) y ≤ 3/4 in, longitud del conector ≥ 4 diámetros, espaciamiento longitudinal ≥ 6d y ≤ 8 veces el espesor total de la losa, y espaciamiento transversal ≥ 4d. La placa debe perforarse para soldar el conector al ala a través de ella. Cita además rangos de los ensayos que debe cumplir el fabricante (wr/hr entre 1.3 y 3, hs/hr entre 1.5 y 3.4, altura del conector entre 3 y 7 in) y que no deben colocarse más de 3 conectores por valle. El trabajo de la placa según el diagrama de momentos se verá la próxima sesión.","formulas":[{"nombre":"Ancho efectivo por lado","expresion":"be,lado = min(L/8, s/2, distancia al borde) ; b = be,izq + be,der","variables":"L luz de la viga, s separación entre vigas"},{"nombre":"Limitaciones de conectores","expresion":"dsa ≤ 2.5·tf ; dsa ≤ 3/4 in ; Lstud ≥ 4·dsa ; 6·dsa ≤ s_long ≤ min(8·t_losa, 36 in) ; s_trans ≥ 4·dsa","variables":"dsa diámetro del conector, tf espesor del ala"}],"referencias_norma":["AISC 360-16 I3.1a (ancho efectivo)","AISC 360-16 I3.2c (losa con placa colaborante)","AISC 360-16 I8.1 e I8.2d (conectores de corte)"]}],"ejemplos":[{"titulo":"Columna W4x13 embebida en concreto","enunciado":"Perfil W4x13 A36 (A = 3.83 in², d = 4.16, bf = 4.06, Ix = 11.3, Iy = 3.86 in⁴, ry = 1.00 in), L = 120 in, K = 1.2. Se embebe con 4 barras de 1/2 in (Fysr = 60 ksi), estribos de 3/8 in, recubrimiento de 2 in y concreto f'c = 3 ksi. Comparar φPn del perfil solo con el de la sección compuesta.","pasos":["Acero solo: KL/ry = 1.2·120/1.00 = 144 > 133.7 (pandeo elástico); Fe = π²·29000/144² = 13.8 ksi; Fcr = 0.877·13.8 = 12.1 ksi; φPn = 0.9·3.83·12.1 = 41.7 kips.","Dimensiones: b = 4.06 + 2·(1.0 + 0.5 + 0.375 + 2) = 11.81 in; h calculado = 11.91 in, se adopta 35 cm = 13.78 in; Ag = 11.81·13.78 ≈ 162.7 in².","Verificaciones: As/Ag = 3.83/162.7 = 2.35% > 1%; ρsr = 4·0.196/162.7 = 0.0048 > 0.004; estribos: s ≤ min(12 in, 0.5·11.81 = 5.91 in); se adoptó 6 in.","Ac = 162.7 − 3.83 − 0.785 = 158.1 in²; Pno = 36·3.83 + 60·0.785 + 0.85·3·158.1 ≈ 588 kips.","Ec = 145^1.5·√3 = 3024 ksi; C1 = 0.25 + 3·(3.83 + 0.785)/162.7 = 0.335 < 0.7.","Eje y: Ig = 13.78·11.81³/12 ≈ 1891 in⁴; Isr (Steiner, x = 3.28 in) ≈ 8.4 in⁴; Ic ≈ 1891 − 3.86 − 8.4 ≈ 1879 in⁴.","EIeff = 29000·3.86 + 29000·8.4 + 0.335·3024·1879 ≈ 2.26×10⁶ kip·in²; Pe = π²·EIeff/144² ≈ 1076 kips.","Pno/Pe ≈ 0.55 < 2.25: Pn = 588·0.658^0.55 ≈ 467 kips; φPn = 0.75·467 ≈ 350 kips."],"resultado":"φPn compuesto ≈ 350 kips frente a 41.7 kips del perfil solo: unas 8.4 veces más resistencia."},{"titulo":"Tubo HSS 4×4×5/16 relleno de concreto","enunciado":"HSS 4×4×5/16 (A = 4.10 in², I = 9.14 in⁴, r = 1.49 in), Fy = 36 ksi, L = 120 in, K = 1.2, relleno con concreto f'c = 3 ksi y 2 bastones de 3/8 in (60 ksi). Comparar φPn.","pasos":["Tubo solo: KL/r = 144/1.49 ≈ 96.6 < 133.7 (inelástico); Fe ≈ 30.7 ksi; Fcr = 0.658^(36/30.7)·36 ≈ 22.0 ksi; φPn = 0.9·22.0·4.10 ≈ 81.2 kips.","Relleno: Ag = 16 in²; As/Ag = 25.6% > 1%; ρsr = 0.22/16 = 0.014 > 0.004; Ac ≈ 16 − 4.10 − 0.22 = 11.68 in².","Sección compacta: Pno = Pp = 36·4.10 + 0.85·3·(11.68 + 0.22·29000/3024) ≈ 182 kips.","C3 = 0.45 + 3·(As + Asr)/Ag > 0.9, se limita a 0.9.","EIeff ≈ 3.1×10⁵ kip·in²; Pe ≈ 147 kips; Pno/Pe ≈ 1.24 < 2.25.","Pn = 182·0.658^1.24 ≈ 108.6 kips; φPn = 0.75·108.6 ≈ 81.4 kips."],"resultado":"φPn ≈ 81.4 kips frente a 81.2 kips del tubo vacío: el relleno no es eficiente en un perfil tan pequeño."}],"conceptos_clave":[{"termino":"Pno","definicion":"Resistencia nominal a compresión de longitud cero de la sección compuesta (suma de las contribuciones de los materiales)."},{"termino":"EIeff","definicion":"Rigidez efectiva a flexión del compuesto: acero completo más una fracción (C1 o C3) de la rigidez del concreto."},{"termino":"C1 / C3","definicion":"Coeficientes de participación del concreto en la rigidez: C1 ≤ 0.7 (embebidas) y C3 ≤ 0.9 (rellenas)."},{"termino":"C2","definicion":"Factor de resistencia del concreto en secciones rellenas: 0.85 rectangular, 0.95 circular (confinamiento)."},{"termino":"Límite Pno/Pe = 2.25","definicion":"Umbral entre pandeo inelástico (0.658^(Pno/Pe)) y elástico (0.877Pe) para compuestos."},{"termino":"V'r","definicion":"Fuerza longitudinal que debe transferirse entre acero y concreto en la zona de introducción de carga."},{"termino":"Placa colaborante (steel deck)","definicion":"Lámina de acero nervada que sirve de encofrado y de refuerzo positivo de la losa, con muescas que dan adherencia."},{"termino":"Ancho efectivo","definicion":"Ancho de losa que trabaja con la viga: suma por lado del menor entre L/8, s/2 y la distancia al borde."},{"termino":"Conector de corte (stud)","definicion":"Perno con cabeza soldado al ala de la viga que transmite el cortante horizontal entre losa y viga."}],"preguntas":[{"pregunta":"En una columna compuesta, el factor de resistencia φc del AISC 360-16 es:","opciones":["0.90","0.85","0.75","0.65"],"correcta":2,"explicacion":"Para compuestos en compresión φc = 0.75."},{"pregunta":"Si Pno/Pe = 1.5 en una columna compuesta, Pn vale:","opciones":["0.877·Pe","Pno·0.658^1.5","Pno","0.658·Pe"],"correcta":1,"explicacion":"Como 1.5 ≤ 2.25, el pandeo es inelástico y Pn = Pno·0.658^(Pno/Pe)."},{"pregunta":"En una columna embebida (AISC 360-16), el coeficiente C1 de la rigidez efectiva está limitado a:","opciones":["0.3","0.7","0.9","1.0"],"correcta":1,"explicacion":"C1 = 0.25 + 3·(As + Asr)/Ag ≤ 0.7."},{"pregunta":"En una sección rellena rectangular compacta, el coeficiente C2 que multiplica f'c es:","opciones":["0.95","0.70","0.85","1.00"],"correcta":2,"explicacion":"C2 = 0.85 rectangular y 0.95 circular."},{"pregunta":"El módulo de elasticidad de un concreto normal de f'c = 3 ksi (w = 145 pcf) es aproximadamente:","opciones":["3024 ksi","29000 ksi","1800 ksi","4500 ksi"],"correcta":0,"explicacion":"Ec = 145^1.5·√3 ≈ 1746·1.732 ≈ 3024 ksi."},{"pregunta":"En el ejemplo del W4x13 embebido, la resistencia aumentó unas:","opciones":["1.0 vez","2 veces","8.4 veces","20 veces"],"correcta":2,"explicacion":"350/41.7 ≈ 8.4."},{"pregunta":"¿Por qué el HSS 4×4×5/16 relleno casi no ganó resistencia?","opciones":["Porque el concreto se aplastó","Porque el área de concreto es muy pequeña frente al acero y la carga de Euler sigue controlada por el tubo","Porque se usó φ = 0.9","Porque la sección era esbelta"],"correcta":1,"explicacion":"En perfiles muy pequeños la contribución del concreto a Pno y a EIeff es marginal."},{"pregunta":"La resistencia nominal a tracción de una columna embebida es:","opciones":["Fy·As + Fysr·Asr","Fy·As + 0.85·f'c·Ac","0.85·f'c·Ag","Fu·As"],"correcta":0,"explicacion":"El concreto no aporta en tracción."},{"pregunta":"Si la carga externa se aplica directamente al perfil de acero de una columna compuesta, la fuerza a transferir al concreto es:","opciones":["Pr·Fy·As/Pno","Pr","Pr·(1 − Fy·As/Pno)","0"],"correcta":2,"explicacion":"AISC I6.2a: V'r = Pr·(1 − Fy·As/Pno)."},{"pregunta":"Para una viga compuesta interior de 9 m de luz con vigas espaciadas a 3 m, el ancho efectivo total es:","opciones":["2.25 m","3.0 m","1.125 m","1.5 m"],"correcta":0,"explicacion":"Por lado min(9/8 = 1.125, 3/2 = 1.5) = 1.125 m; total 2.25 m."},{"pregunta":"Según el AISC 360, la altura nominal del nervio de la placa colaborante hr no debe exceder:","opciones":["2 in","3 in","4 in","1.5 in"],"correcta":1,"explicacion":"I3.2c: hr ≤ 3 in y wr ≥ 2 in."},{"pregunta":"El diámetro de un conector de corte soldado al ala fuera de la línea del alma no debe exceder:","opciones":["1.5·tf","4·tf","2.5·tf","tf"],"correcta":2,"explicacion":"I8.1: dsa ≤ 2.5·tf, salvo que se ubique sobre el alma."}],"ejercicios_propuestos":["Embeba un W6x20 (A = 5.87 in², Iy = 13.3 in⁴, bf = 6.02 in, d = 6.20 in) de acero A36, con L = 12 ft y K = 1.0, en concreto de 4 ksi con 4 barras de 5/8 in, estribos de 3/8 in y recubrimiento de 1.5 in. Dimensione b y h, verifique los requisitos mínimos y calcule φPn compuesto frente al perfil solo.","Calcule φPn de un HSS 8×8×1/4 (A = 7.10 in², I = 70.7 in⁴, t de diseño = 0.233 in) de Fy = 46 ksi relleno con concreto de 4 ksi, L = 14 ft, K = 1.0. Clasifique primero la pared según la Tabla I1.1a.","Para la columna del ejercicio 1, con Pr = 300 kips aplicada solo al perfil mediante una conexión de viga, calcule la fuerza V'r que debe transferirse al concreto.","Determine el ancho efectivo de una viga compuesta de borde de 7.5 m de luz, con la viga interior adyacente a 2.4 m y un volado de losa de 0.40 m.","Verifique si un conector de 3/4 in puede soldarse fuera del alma de una viga W12x26 (tf = 0.38 in) y cuál es el espaciamiento longitudinal mínimo y máximo para una losa de 6.5 in."],"avisos":["Los ejemplos se resolvieron en hojas de Excel que el profesor muestra en clase.","La próxima sesión continuará con el comportamiento de la placa colaborante según el diagrama de momentos de la viga compuesta.","Se tomó asistencia en clase."],"notas_transcripcion":["No se menciona la fecha; por la secuencia, corresponde al lunes siguiente a la clase 20 (probablemente 14 de junio de 2021).","'4 por 13' es el perfil W4x13; '383' = 3.83 in²; '11 3' = Ix 11.3 in⁴; '3 86' = Iy 3.86 in⁴.","Los valores de pandeo torsional dichos en clase ('118' y '409') son inconsistentes (Fcr no puede superar Fy = 36 ksi); lo relevante es que el pandeo torsional no gobierna.","'25.74' y '18.91' se interpretaron como inercias brutas de 2574 y 1891 in⁴.","El espaciamiento de estribos adoptado (6 in) excede ligeramente el límite 0.5·b = 5.91 in calculado en clase; debería tomarse ≤ 5.9 in.","En el tubo relleno el profesor obtiene C3 = 1.56 (con los datos del ejemplo resulta del orden de 1.26); en ambos casos se limita a 0.9. 'Inercia efectiva 108 con 618' no concuerda con Pe = 146.9 kips; se interpretó EIeff ≈ 3.1×10⁵ kip·in².","El profesor asocia oralmente V'r = Pr·(1 − FyAs/Pn) a la carga aplicada al concreto; según el AISC esa expresión corresponde a la carga aplicada al acero. Se registró la versión del AISC.","'0.65 por 1.7 del f'c por el área' es el aplastamiento directo (bearing), no la adherencia.","'Sysmit/Sismit' = CISMID (UNI); 'acero DEC' = Acero Deck (Aceros Procesados)."],"corto":"Columnas compuestas","video":"https://www.
