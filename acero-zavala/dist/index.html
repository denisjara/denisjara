superior del tijeral con 2L 3×3×3/8 (pandeo inelástico, φcPn ≈ 74 kips frente a 46.9 kips) y se comenta la disponibilidad de ángulos en el catálogo de Aceros Arequipa. Se corrige el esfuerzo en el umbral elástico-inelástico (0.39Fy). Luego se estudia la Sección E7 para miembros con elementos esbeltos: área efectiva a partir de anchos efectivos, esfuerzo de pandeo local elástico Fel y coeficientes c1 y c2 de la Tabla E7.1, con la idea del comportamiento post-pandeo. Se explica la Sección E4 (pandeo torsional y flexotorsional) con Cw, J, r̄o y H, y la importancia de orientar bien los ejes locales en programas comerciales. Se resuelven tres ejemplos: canal C15×40 no esbelta, canal armada con alma esbelta y una columna W6×15 de un panel publicitario (K = 2.1). Se anuncia la primera práctica calificada.","objetivos":["Al terminar, el estudiante podrá calcular K con los nomogramas a partir de los factores G de los nudos.","Al terminar, el estudiante podrá iterar el diseño de una brida comprimida de doble ángulo hasta cumplir φcPn ≥ Pu.","Al terminar, el estudiante podrá calcular el área efectiva de un miembro con elementos esbeltos según la Sección E7 del AISC 360-16.","Al terminar, el estudiante podrá evaluar el esfuerzo de Euler torsional y flexotorsional (E4) para secciones de doble y simple simetría.","Al terminar, el estudiante podrá estimar J y Cw con fórmulas aproximadas cuando no hay tablas.","Al terminar, el estudiante podrá identificar el estado límite que controla la resistencia a compresión de un perfil."],"temas":[{"titulo":"Repaso del procedimiento de compresión y K exacto con nomogramas","contenido":"Se resume el camino de diseño a compresión. Primero se discretiza la sección en sus elementos (alas y alma) y se evalúa la esbeltez local de cada uno con la Tabla B4.1a (para flexión existirá la B4.1b), recordando que en zonas sísmicas hay límites más exigentes para pórticos especiales y de ductilidad moderada. Con esa clasificación se entra a la Tabla E1.1: para secciones sin elementos esbeltos se revisan E3 (pandeo flexionante) y E4 (pandeo torsional o flexotorsional); con elementos esbeltos se va además a E7 (pandeo local). En el ejemplo de dobles ángulos se ha revisado solo el pandeo flexionante y falta el flexotorsional. Sobre el factor K: en armaduras K = 1 y en el diseño preliminar se usa el método de los criterios (valores recomendados de la tabla). El llamado K exacto se obtiene con los nomogramas del AISC, uno para pórticos arriostrados (desplazamiento lateral impedido) y otro para pórticos no arriostrados (con desplazamiento lateral). En cada extremo A y B de la columna se calcula G como la razón entre la suma de rigideces EI/L de las columnas y la de las vigas que llegan al nudo; hay valores especiales para base empotrada o articulada. Con GA y GB se lee K en el ábaco correspondiente. Como requiere conocer las secciones de vigas y columnas, se usa sobre todo en la verificación, no en el predimensionamiento.","formulas":[{"nombre":"Factor de rigidez relativa del nudo","expresion":"G = Σ(Ic/Lc) / Σ(Ig/Lg)","variables":"Ic, Lc: inercia y longitud de columnas que llegan al nudo; Ig, Lg: de las vigas en el plano de pandeo"},{"nombre":"Valores prácticos en apoyos","expresion":"Base empotrada: G ≈ 1.0 ; base articulada: G ≈ 10","variables":"Recomendaciones del Comentario del AISC"}],"referencias_norma":["AISC 360-16 Tabla User Note E1.1","AISC 360-16 Comentario Apéndice 7, Figuras C-A-7.1 y C-A-7.2 (nomogramas)"]},{"titulo":"Rediseño de la brida superior y disponibilidad de perfiles en el Perú","contenido":"En la clase anterior, el 2L 2×2×5/16 resistía solo unos 20 kips. La demanda en compresión se toma ahora como Cu = 46.9 kips (el profesor indica que corresponde a un peralte ajustado respecto del usado antes). Segundo tanteo: 2L 3×3×3/8 con Ag = 4.22 pulg², ry ≈ 1.27 pulg, Lx = 70.9 pulg, Ly = 137.8 pulg y K = 1. La esbeltez que controla es la del eje Y (≈ 108), menor que 200 y menor que el umbral 4.71√(E/Fy) = 133.7, de modo que el pandeo es inelástico. Con Fe ≈ 24.3 ksi se obtiene Fcr = 0.658^(Fy/Fe)·Fy ≈ 19.37 ksi y φcPn ≈ 74 kips, mayor que 46.9 kips: cumple con holgura. El profesor insiste en verificar que el perfil exista comercialmente: en el catálogo de Aceros Arequipa (producto nacional) figuran los ángulos estructurales de lados iguales que se venden en el Perú, y el 3×3×3/8 está disponible; las tablas AISC incluyen muchos perfiles que no se consiguen localmente. Para optimizar se deja de tarea probar el 2L 2½×2½×3/8, que probablemente también cumpla. También corrige la gráfica de pandeo: el esfuerzo crítico en el umbral KL/r = 4.71√(E/Fy) es 0.39Fy (no 0.15Fy como se dijo antes). A la izquierda del umbral el pandeo es inelástico (primero fluye y luego pandea, lo deseable) y a la derecha elástico (pandea de pronto, sin fluir).","formulas":[{"nombre":"Esfuerzo crítico en el umbral","expresion":"Fcr = 0.658^2.25·Fy ≈ 0.39·Fy (para Fy/Fe = 2.25)","variables":"Corresponde a KL/r = 4.71√(E/Fy)"}],"referencias_norma":["AISC 360-16 E3-2 y E3-3","Catálogo de productos de Aceros Arequipa (ángulos estructurales)"]},{"titulo":"Miembros con elementos esbeltos: Sección E7 y anchos efectivos","contenido":"Si algún elemento es esbelto se aplica la Sección E7. La resistencia nominal es el menor valor que resulta de los estados límite de pandeo flexionante, torsional o flexotorsional en interacción con el pandeo local: Pn = Fcr·Ae, donde Fcr se calcula con E3 o E4 (para un ángulo simple, solo con E3) y Ae es el área efectiva, suma de los anchos efectivos multiplicados por sus espesores. La sección E7.1 aplica a todos los miembros excepto HSS circulares (redondos), que tienen su propia sección E7.2. Para un elemento de ancho b: si λ ≤ λr·√(Fy/Fcr), el ancho efectivo es el ancho completo (be = b). Si λ es mayor, be = b·(1 − c1·√(Fel/Fcr))·√(Fel/Fcr), donde Fel = (c2·λr/λ)²·Fy es el esfuerzo de pandeo local elástico. Los coeficientes de ajuste por imperfecciones c1 y c2 están en la Tabla E7.1: para elementos atiesados excepto paredes de HSS cuadrados y rectangulares, c1 = 0.18 y c2 = 1.31; para paredes de HSS rectangulares, c1 = 0.20 y c2 = 1.38; para todos los demás elementos (alas no atiesadas), c1 = 0.22 y c2 = 1.49. El concepto físico es el comportamiento post-pandeo: la parte central del elemento esbelto pandea y deja de tomar carga, mientras que las zonas cercanas a los bordes apoyados siguen trabajando; por eso el área efectiva es siempre menor que la geométrica.","formulas":[{"nombre":"Resistencia nominal con elementos esbeltos","expresion":"Pn = Fcr·Ae","variables":"Fcr: de E3 o E4; Ae: Σ(be·t)"},{"nombre":"Ancho efectivo completo","expresion":"Si λ ≤ λr·√(Fy/Fcr): be = b","variables":"λ = b/t del elemento"},{"nombre":"Ancho efectivo reducido","expresion":"Si λ > λr·√(Fy/Fcr): be = b·(1 − c1·√(Fel/Fcr))·√(Fel/Fcr)","variables":"c1: coeficiente de la Tabla E7.1"},{"nombre":"Esfuerzo de pandeo local elástico","expresion":"Fel = (c2·λr/λ)²·Fy","variables":"c2: coeficiente de la Tabla E7.1"}],"referencias_norma":["AISC 360-16 Sección E7, ecuaciones E7-1, E7-2, E7-3, E7-4","AISC 360-16 Tabla E7.1","AISC 360-16 Sección E7.2 (HSS circulares)"]},{"titulo":"Pandeo torsional y flexotorsional (Sección E4)","contenido":"La Sección E4 aplica a miembros sin elementos esbeltos de simple simetría, asimétricos y algunos de doble simetría (por ejemplo, en cruz o armados) cuando la longitud no arriostrada torsional supera la lateral. La resistencia es Pn = Fcr·Ag, con Fcr de las mismas ecuaciones E3-2 o E3-3, pero usando el esfuerzo de Euler torsional o flexotorsional en lugar de π²E/(KL/r)². Para ángulos simples se exige b/t > 0.71√(E/Fy) para que aplique (en el Perú solo se venden ángulos de lados iguales). Hay tres expresiones: (a) doble simetría, pandeo torsional; (b) simple simetría, pandeo flexotorsional combinando Fey y Fez con el factor H (caso de la canal o el doble ángulo, con Y como eje de simetría); (c) secciones asimétricas, donde Fe es la menor raíz de una ecuación cúbica que se resuelve por tanteo. Intervienen la constante de alabeo Cw, la constante torsional J (ambas en las tablas), el módulo de corte G = 11,200 ksi, el radio polar de giro respecto al centro de corte r̄o (también en tablas o calculado con las coordenadas xo, yo del centro de corte) y la constante flexional H. Cuando no hay tablas, J se aproxima con Σ(b·t³)/3 y, para secciones I, Cw con Iy·ho²/4, donde ho es la distancia entre centroides de las alas.","formulas":[{"nombre":"Doble simetría (E4-2)","expresion":"Fe = [π²·E·Cw/(Kz·L)² + G·J] · 1/(Ix + Iy)","variables":"Cw: constante de alabeo (pulg⁶); J: constante torsional (pulg⁴); G = 11,200 ksi; Kz·L: longitud efectiva torsional"},{"nombre":"Simple simetría, eje Y de simetría (E4-3)","expresion":"Fe = (Fey + Fez)/(2H) · [1 − √(1 − 4·Fey·Fez·H/(Fey + Fez)²)]","variables":"Fey = π²E/(KyLy/ry)²; H = 1 − (xo² + yo²)/r̄o²"},{"nombre":"Esfuerzo torsional","expresion":"Fez = [π²·E·Cw/(Kz·L)² + G·J] / (Ag·r̄o²)","variables":"r̄o² = xo² + yo² + (Ix + Iy)/Ag"},{"nombre":"Constante torsional aproximada","expresion":"J ≈ Σ(b·t³)/3","variables":"b, t: ancho y espesor de cada elemento"},{"nombre":"Constante de alabeo aproximada (sección I)","expresion":"Cw ≈ Iy·ho²/4","variables":"ho: distancia entre centroides de las alas"}],"referencias_norma":["AISC 360-16 Sección E4, ecuaciones E4-1 a E4-11","AISC 360-16 Sección E5 (ángulos simples)"]},{"titulo":"Ejes locales en programas comerciales y longitudes no arriostradas","contenido":"En los programas comerciales de análisis (SAP2000, ETABS y similares) cada elemento tiene ejes locales con origen en el centroide: los ejes X e Y en el plano de la sección y el eje Z a lo largo del miembro. El profesor dibuja un perfil H en el espacio y una canal y muestra cómo la orientación con que se coloca el perfil define cuál es la dirección fuerte (giro alrededor de X) y cuál la débil (alrededor de Y). Si el perfil se rota, el sistema de arriostres puede quedar restringiendo una u otra dirección, y por tanto cambia qué longitud corresponde a Lx, Ly y Lz. Para la longitud torsional Lz conviene tomar la más desfavorable (la más larga, por ejemplo Lz = Lx) aunque el eje débil tenga una longitud menor. Si no se considera correctamente la orientación, los resultados del programa pueden ser cualquier cosa. En la práctica, al asignar en el programa las longitudes no arriostradas o los factores de longitud efectiva, deben corresponder a los ejes locales del elemento y no a los ejes globales del modelo.","formulas":[],"referencias_norma":[]},{"titulo":"Ejemplo: canal C15×40 no esbelta usada como brida (pandeo flexionante)","contenido":"Se clasifica una canal C15×40 de acero A36: d = 15 pulg, tf = 0.65 pulg, tw = 0.52 pulg, bf = 3.52 pulg. La altura del alma se obtiene quitando los dos espesores de ala: h ≈ 15 − 2·0.65 = 13.7 pulg, por lo que h/tw = 26.3 < 1.49√(E/Fy) = 42.29, alma no esbelta. Ala: b/t = 3.52/0.65 = 5.42 < 0.56√(E/Fy) = 15.89, no esbelta. La Tabla E1.1 indica revisar E3 y E4. Se supone que la canal se usa como brida de 236 pulg con arriostres a tercios fuera del plano y, como condición extrema, comportamiento en voladizo (K = 2). En el plano K·L/rx ≈ 86; fuera del plano K·(L/3)/ry ≈ 178 < 200, que controla. Como 178 > 133.7, el pandeo es elástico: Fe ≈ 9.0 ksi, Fcr = 0.877·9.0 ≈ 7.9 ksi; con Ag = 11.8 pulg², φcPn = 0.9·7.9·11.8 ≈ 83 kips. La demanda debe ser menor que 83 kips.","formulas":[],"referencias_norma":["AISC 360-16 Tabla B4.1a, E3"]},{"titulo":"Ejemplo: canal armada con alma esbelta (E3, E4 y E7)","contenido":"Canal armada con alas de 3×1/2 pulg y alma de 12×0.2 pulg (A36), Ag = 2·3·0.5 + 12·0.2 = 5.4 pulg². Ala: b/t = 6 < 15.89, no esbelta; alma: h/t = 60 > 42.29, esbelta, así que el perfil es esbelto. Se calculan las propiedades dividiendo la sección en tres rectángulos: centroide con Σ(A·x)/ΣA, inercias propias y transporte con Steiner, radios de giro. Con L = 80 pulg y K = 1 la esbeltez que reporta la hoja es muy baja (≈ 17), por lo que Fe es muy alto (≈ 990 ksi) y Fcr ≈ 35.45 ksi (pandeo inelástico, casi Fy). Para el pandeo flexotorsional (simple simetría) se estiman J ≈ Σ(b·t³)/3, ho = 12.5 pulg (distancia entre centroides de alas), Cw ≈ Iy·ho²/4, r̄o y H, y se obtiene un Fe ≈ 987 ksi con Fcr ≈ 35.45 ksi, prácticamente igual. Luego se aplica E7: el ala conserva su ancho (be = 3 pulg); el alma, con c1 = 0.18 y c2 = 1.31, tiene Fel = (1.31·42.29/60)²·36 ≈ 30.7 ksi y un ancho efectivo be ≈ 9.3 pulg en vez de 12 pulg. El área efectiva baja de 5.4 a 4.86 pulg²: una franja del alma pandea y deja de colaborar (post-pandeo). El profesor obtuvo φcPn ≈ 134 kips usando el esfuerzo de pandeo local (≈ 30.7 ksi) como esfuerzo crítico. Según E7-1 la resistencia debería calcularse con el Fcr de E3/E4: φcPn = 0.9·35.45·4.86 ≈ 155 kips. Se menciona que este perfil no debería obtenerse doblando una plancha, sino como canal soldada.","formulas":[{"nombre":"Centroide de sección compuesta","expresion":"x̄ = Σ(Ai·xi) / ΣAi","variables":"Ai: área de cada rectángulo; xi: posición de su centroide"},{"nombre":"Teorema de Steiner","expresion":"I = Σ(Ii + Ai·di²)","variables":"Ii: inercia propia; di: distancia del centroide parcial al centroide total"}],"referencias_norma":["AISC 360-16 E3, E4 (E4-3) y E7","AISC 360-16 Tabla E7.1"]},{"titulo":"Ejemplo: columna W6×15 de un panel publicitario","contenido":"Columna en voladizo de 120 pulg con carga axial en el centroide: peso del panel D = 0.5 kips, carga viva 0.1 kips y viento 0.25 kips (solo se considera en las combinaciones, sin efecto lateral en este ejemplo). Combinaciones: 1.4D = 0.70; 1.2D + 1.6L = 0.76; 1.2D + 0.5L + 1.3W = 0.98 kips, que controla. Se propone W6×15: bf/2tf = 11.5 < 15.89 y h/tw ≈ 21.6 < 42.29, sección no esbelta. Al ser un panel empotrado en la base y libre arriba, K = 2.1. Esbeltez que controla en el eje débil: K·L/ry ≈ 173 < 200, pandeo elástico; Fe ≈ 9.5 ksi, Fcr = 0.877·Fe ≈ 8.3 ksi y φcPn = 0.9·8.3·4.43 ≈ 33 kips, muy superior a 0.98 kips. Para el pandeo torsional (doble simetría, E4-2) se toman de tablas Ix, Iy, Cw y J, con G = 11,200 ksi, y se obtiene Fe ≈ 70 ksi. El profesor obtuvo 245 kips; la aplicación correcta de E3-2 con Fe = 70 ksi (Fy/Fe = 0.51, inelástico) da Fcr ≈ 29 ksi y φcPn ≈ 116 kips. En cualquier caso controla el pandeo flexionante con 33 kips.","formulas":[{"nombre":"Combinaciones usadas","expresion":"1.4D ; 1.2D + 1.6L ; 1.2D + 0.5L + 1.3W","variables":"Combinaciones de la Norma E.090"}],"referencias_norma":["Norma E.090, combinaciones de carga","AISC 360-16 E3 y E4-2","AISC 360-16 Comentario Apéndice 7 (K = 2.1 empotrado-libre)"]}],"ejemplos":[{"titulo":"Brida superior con 2L 3×3×3/8","enunciado":"Cu = 46.9 kips; 2L 3×3×3/8 A36: Ag = 4.22 pulg², ry = 1.27 pulg; Lx = 70.9 pulg, Ly = 137.8 pulg, K = 1. Verificar por pandeo flexionante.","pasos":["K·Ly/ry = 137.8/1.27 ≈ 108.5 (controla; menor que 200).","4.71·√(29000/36) = 133.7 > 108.5 → pandeo inelástico.","Fe = π²·29000/108.5² ≈ 24.3 ksi.","Fcr = 0.658^(36/24.3)·36 = 0.538·36 ≈ 19.37 ksi.","φcPn = 0.9·19.37·4.22 ≈ 73.6 kips."],"resultado":"φcPn ≈ 74 kips ≥ 46.9 kips: cumple (falta verificar E4 flexotorsional)."},{"titulo":"Canal C15×40 no esbelta (A36)","enunciado":"C15×40: d = 15, tf = 0.65, tw = 0.52, bf = 3.52 pulg, Ag = 11.8 pulg². L = 236 pulg, K = 2, arriostres a tercios fuera del plano. Calcular φcPn por pandeo flexionante.","pasos":["h = 15 − 2·0.65 = 13.7 pulg; h/tw = 26.3 < 42.29 → alma no esbelta.","b/t = 3.52/0.65 = 5.42 < 15.89 → ala no esbelta.","K·Lx/rx ≈ 2·236/5.43 ≈ 86; K·(L/3)/ry ≈ 2·78.7/0.883 ≈ 178 (controla).","178 > 133.7 → elástico: Fe = π²·29000/178.2² ≈ 9.0 ksi.","Fcr = 0.877·9.0 ≈ 7.9 ksi; φcPn = 0.9·7.9·11.8 ≈ 83 kips."],"resultado":"φcPn ≈ 83 kips."},{"titulo":"Canal armada con alma esbelta","enunciado":"Alas 3×1/2 pulg, alma 12×0.2 pulg, A36, Ag = 5.4 pulg², L = 80 pulg, K = 1. Determinar el área efectiva y la resistencia.","pasos":["Ala: 3/0.5 = 6 < 15.89 (no esbelta). Alma: 12/0.2 = 60 > 42.29 (esbelta).","E3 y E4: Fe muy alto (≈ 990 ksi) → Fcr ≈ 35.45 ksi.","Alma: λr·√(Fy/Fcr) = 42.29·√(36/35.45) ≈ 42.6 < 60 → se reduce.","Fel = (1.31·42.29/60)²·36 ≈ 30.7 ksi; √(Fel/Fcr) ≈ 0.930.","be = 12·(1 − 0.18·0.930)·0.930 ≈ 9.3 pulg.","Ae = 2·3·0.5 + 9.3·0.2 ≈ 4.86 pulg².","Clase: φcPn ≈ 0.9·30.7·4.86 ≈ 134 kips; con E7-1 (Fcr de E3/E4): 0.9·35.45·4.86 ≈ 155 kips."],"resultado":"Ae ≈ 4.86 pulg² (vs Ag = 5.4); φcPn ≈ 134 kips según la clase (≈ 155 kips aplicando estrictamente Pn = Fcr·Ae)."},{"titulo":"Columna W6×15 de panel publicitario","enunciado":"Altura 120 pulg, empotrada en la base y libre arriba (K = 2.1), D = 0.5, L = 0.1, W = 0.25 kips, A36. W6×15: A = 4.43 pulg², ry = 1.46 pulg.","pasos":["Pu = máx(0.70; 0.76; 1.2·0.5 + 0.5·0.1 + 1.3·0.25 = 0.975) ≈ 0.98 kips.","bf/2tf = 11.5 < 15.89; h/tw ≈ 21.6 < 42.29 → no esbelta.","K·L/ry = 2.1·120/1.46 ≈ 173 > 133.7 → elástico.","Fe ≈ 9.5 ksi; Fcr = 0.877·9.5 ≈ 8.3 ksi; φcPn = 0.9·8.3·4.43 ≈ 33 kips.","Torsional (E4-2): Fe ≈ 70 ksi → Fcr = 0.658^(36/70)·36 ≈ 29 ksi → φcPn ≈ 116 kips (en clase se reportó 245 kips).","Controla el pandeo flexionante."],"resultado":"φcPn ≈ 33 kips (pandeo flexionante) ≫ Pu = 0.98 kips."}],"conceptos_clave":[{"termino":"K exacto (nomogramas)","definicion":"Factor de longitud efectiva obtenido de los ábacos de alineamiento con GA y GB, para pórticos arriostrados o no arriostrados."},{"termino":"Factor G","definicion":"Relación entre la suma de rigideces I/L de las columnas y la de las vigas que llegan a un nudo."},{"termino":"Área efectiva (Ae) en compresión","definicion":"Suma de anchos efectivos por espesores; descuenta la porción de elementos esbeltos que pandea localmente."},{"termino":"Ancho efectivo (be)","definicion":"Ancho reducido de un elemento esbelto que sigue colaborando después del pandeo local."},{"termino":"Comportamiento post-pandeo","definicion":"Capacidad de una placa esbelta de seguir tomando carga tras el pandeo local, concentrando esfuerzos cerca de sus bordes apoyados."},{"termino":"Fel","definicion":"Esfuerzo de pandeo local elástico del elemento: (c2·λr/λ)²·Fy."},{"termino":"Constante de alabeo Cw","definicion":"Propiedad que mide la rigidez de la sección al alabeo en torsión no uniforme (pulg⁶)."},{"termino":"Constante torsional J","definicion":"Rigidez a torsión de St. Venant; para secciones abiertas de paredes delgadas ≈ Σ(b·t³)/3."},{"termino":"Pandeo flexotorsional","definicion":"Pandeo global que combina flexión y torsión, típico de secciones de simple simetría o asimétricas (canales, ángulos, T)."},{"termino":"r̄o","definicion":"Radio polar de giro respecto al centro de corte: r̄o² = xo² + yo² + (Ix + Iy)/Ag."},{"termino":"Constante flexional H","definicion":"H = 1 − (xo² + yo²)/r̄o², interviene en el pandeo flexotorsional de secciones de simple simetría."}],"preguntas":[{"pregunta":"El esfuerzo crítico en el límite entre pandeo inelástico y elástico (KL/r = 4.71√(E/Fy)) es aproximadamente:","opciones":["0.15·Fy","0.658·Fy","0.877·Fy","0.39·Fy"],"correcta":3,"explicacion":"En ese punto Fy/Fe = 2.25 y Fcr = 0.658^2.25·Fy ≈ 0.39Fy (corrección hecha en clase)."},{"pregunta":"¿Por qué el K de los nomogramas se usa principalmente en la verificación y no en el predimensionamiento?","opciones":["Porque siempre da K = 1","Porque requiere conocer las inercias de vigas y columnas ya diseñadas","Porque solo aplica a armaduras","Porque la norma lo prohíbe"],"correcta":1,"explicacion":"G depende de las rigideces I/L de columnas y vigas, que solo se conocen tras dimensionarlas."},{"pregunta":"Para un miembro con elementos esbeltos (E7), la resistencia nominal es:","opciones":["Pn = Fy·Ag","Pn = Fcr·Ag","Pn = Fcr·Ae","Pn = Fel·Ag"],"correcta":2,"explicacion":"E7-1: Pn = Fcr·Ae, con Fcr de E3 o E4 y Ae a partir de los anchos efectivos."},{"pregunta":"Para el alma de una canal (elemento atiesado, no pared de HSS), los coeficientes de la Tabla E7.1 son:","opciones":["c1 = 0.18, c2 = 1.31","c1 = 0.22, c2 = 1.49","c1 = 0.20, c2 = 1.38","c1 = 0.45, c2 = 0.56"],"correcta":0,"explicacion":"Caso (a) de la Tabla E7.1: elementos atiesados excepto paredes de HSS rectangulares, c1 = 0.18 y c2 = 1.31."},{"pregunta":"¿Qué significa físicamente que el área efectiva de la canal armada baje de 5.4 a 4.86 pulg²?","opciones":["Que el ala fluyó","Que una franja central del alma pandeó localmente y deja de colaborar","Que hay agujeros en el alma","Que el perfil es compacto"],"correcta":1,"explicacion":"Es el comportamiento post-pandeo: el alma esbelta pandea en su zona central y solo las franjas cercanas a las alas siguen trabajando."},{"pregunta":"La aproximación J ≈ Σ(b·t³)/3 sirve para:","opciones":["El momento de inercia del eje débil","La constante de alabeo","La constante torsional de secciones abiertas de paredes delgadas","El radio polar de giro"],"correcta":2,"explicacion":"Es la constante de torsión de St. Venant para secciones abiertas formadas por rectángulos delgados."},{"pregunta":"En la fórmula aproximada Cw ≈ Iy·ho²/4, ho es:","opciones":["El peralte total d","La altura libre del alma h","El espesor del alma","La distancia entre centroides de las alas"],"correcta":3,"explicacion":"ho = d − tf; en la canal armada ho = 12 + 0.25 + 0.25 = 12.5 pulg."},{"pregunta":"¿Qué sección del AISC 360 trata el pandeo flexotorsional de una canal no esbelta?","opciones":["E3","E5","E7","E4"],"correcta":3,"explicacion":"E4 trata el pandeo torsional y flexotorsional de miembros sin elementos esbeltos; E5 trata los ángulos simples."},{"pregunta":"Para la columna W6×15 del panel publicitario se usó K = 2.1 porque:","opciones":["Está empotrada en la base y libre en la cabeza (valor recomendado)","Es una armadura","Está articulada en ambos extremos","Es un pórtico arriostrado"],"correcta":0,"explicacion":"Empotrado-libre: valor teórico 2.0 y recomendado 2.1."},{"pregunta":"Al modelar en SAP2000/ETABS, ¿por qué es crítico orientar bien los ejes locales del perfil?","opciones":["Porque define cuál es la dirección fuerte y débil y qué arriostres restringen cada eje","Porque cambia el peso propio","Porque cambia el módulo E","No tiene importancia"],"correcta":0,"explicacion":"Una orientación errónea asigna mal las longitudes Lx, Ly, Lz y las inercias, y los resultados no tienen sentido."},{"pregunta":"Si el pandeo flexionante da 33 kips y el torsional 116 kips, la resistencia de diseño es:","opciones":["116 kips","33 kips","74.5 kips","149 kips"],"correcta":1,"explicacion":"Se toma el menor de los estados límite aplicables: controla el pandeo flexionante."}],"ejercicios_propuestos":["Verifique la brida superior del tijeral (Cu = 46.9 kips, Lx = 70.9 pulg, Ly = 137.8 pulg, K = 1, A36) con 2L 2½×2½×3/8 por pandeo flexionante usando las tablas AISC.","Para la canal armada de clase (alas 3×1/2, alma 12×0.2, A36), recalcule el área efectiva y φcPn si el espesor del alma se aumenta a 0.25 pulg.","Calcule J ≈ Σ(b·t³)/3 y Cw ≈ Iy·ho²/4 para un perfil soldado con alas de 8×1/2 pulg y alma de 12×5/16 pulg y compárelos con un W de propiedades similares.","Una columna de un pórtico no arriostrado tiene GA = 1.0 (base empotrada) y GB = 2.0. Obtenga K del nomograma y calcule φcPn de una W8×31 de 4 m en A36.","Repita el ejemplo del panel publicitario con una altura de 180 pulg y determine si la W6×15 cumple KL/r ≤ 200; si no cumple, proponga otro perfil."],"avisos":["Primera práctica calificada al día siguiente (jueves) a las 2 de la tarde, sobre todo lo visto: dimensionamiento, planchas, tracción y compresión.","Tarea: verificar la brida superior con 2L 2½×2½×3/8.","Se recomienda revisar el catálogo de Aceros Arequipa para confirmar que los perfiles propuestos se venden en el Perú.","Se usan hojas Excel para todos los cálculos y se comenta el uso de programas comerciales (SAP2000, ETABS) y la orientación de ejes locales."],"notas_transcripcion":["'sección e', 'e y e' se refieren a las secciones E3, E4 y E7 del AISC 360-16 (los números se pierden en la transcripción).","'1 por 3 octavos' se interpretó como 2L 3×3×3/8 (Ag = 4.22 pulg²), confirmado más adelante como '3 por 3 por 3 octavos'.","La demanda pasa de 50.8 kips (clase 5) a 46.9 kips; el profesor la atribuye a un peralte ajustado ('el 0.85 del peralte actual'). Se respetó 46.9 kips.","'longitud de 120 kips' en el ejemplo del panel se interpretó como 120 pulg.","En la canal armada la transcripción dice 'kl entre r 1701'; se interpretó como 17.01. Ese valor implica un miembro muy corto o un radio de giro alto; se reporta tal como en clase.","En la canal armada el profesor usó el esfuerzo de pandeo local (≈ 30.7 ksi, transcrito como '39 KSI') como esfuerzo crítico y obtuvo 134 kips; se indica también el valor según E7-1 (≈ 155 kips).","En la W6×15 el profesor reportó Fcr = 61.45 ksi y φcPn = 245 kips para el pandeo torsional; ese Fcr supera Fy, lo que no es posible. Con E3-2 se obtiene ≈ 29 ksi y ≈ 116 kips. La conclusión (controla el flexionante, 33 kips) no cambia.","'G considero como el 40%' se interpretó como el módulo de corte G = 11,200 ksi (≈ 0.39E).","Para la clasificación del alma de la canal se escuchó '0.56 ... 42.29'; el límite correcto para almas es 1.49√(E/Fy) = 42.29.","El inicio y la toma de lista incluyen comentarios personales del profesor sobre su salud (neumonía); se omitieron."],"corto":"K, E7 y pandeo torsional","video":"https://www.youtube.com/watch?v=DH0DMt94MdI","duracion_min":96,"estado":"ok"},"07":{"titulo":"Cierre de compresión (perfil H armado) e introducción a uniones: clasificación, demandas y soldadura de filete","fecha":"lunes 26 de abril de 2021","resumen":"La clase empieza cerrando el tema de compresión con una hoja de cálculo para un perfil H armado (alas y alma de planchas): clasificación de esbeltez local con la Tabla B4.1a, cálculo de propiedades por partes (área, centroides, Steiner, Z, S, J) y obtención de la resistencia φPn por pandeo inelástico. Luego empieza el capítulo de uniones. El profesor repasa cómo ha cambiado la idealización de las conexiones: simples en los años 50, rígidas en los 60-70 con el cómputo, y semirrígidas desde los 80, cuando los ensayos de laboratorio y los sismos de Northridge (1994) y Kobe mostraron que las uniones 'rígidas' no transmitían todo el momento supuesto. Relaciona el tipo de unión con los sistemas estructurales de la Tabla 7 de la E.030. Explica cómo imaginar la demanda en una unión (efectos locales, corte, par de fuerzas por flexión, carga axial), las reglas de resistencia mínima de conexiones (45 kN y 50 % de la resistencia de los miembros en armaduras) y los fundamentos de la soldadura: planos de falla del filete, garganta efectiva, agujeros de acceso, longitudes mínimas y máximas, soldaduras de tapón y de ranura, y la Tabla J2.5.","objetivos":["Al terminar, el estudiante podrá clasificar las alas y el alma de un perfil H armado en compresión usando la Tabla B4.1a, incluido el cálculo y los límites de kc.","Al terminar, el estudiante podrá calcular por partes las propiedades geométricas (A, I, r, S, Z, J) de una sección armada y obtener φPn de una columna.","Al terminar, el estudiante podrá distinguir uniones simples, rígidas y semirrígidas y relacionarlas con los sistemas estructurales de acero (SMF, IMF, OMF, arriostrados).","Al terminar, el estudiante podrá identificar el tipo de demanda (local, corte, flexión, axial) que actúa sobre una unión y proponer el mecanismo resistente.","Al terminar, el estudiante podrá aplicar las reglas de resistencia mínima de conexiones y las reglas geométricas básicas de la soldadura de filete, de tapón y de ranura.","Al terminar, el estudiante podrá describir los planos de falla de un filete y la resistencia de la soldadura como el menor valor entre el metal de aporte y el metal base."],"temas":[{"titulo":"Hoja de cálculo para columna con perfil H armado (cierre de compresión)","contenido":"Para cerrar el capítulo de compresión, el profesor presenta una hoja Excel que trata un perfil H formado por planchas soldadas. La sección se descompone en dos alas iguales y un alma partida en dos 'medias almas', lo que facilita sumar momentos de área y aplicar Steiner. Si las alas fueran distintas, basta modificar las filas de cada ala. En el caso mostrado cada ala mide 6 in de ancho total y el alma 6 in de altura libre, todas de 1/2 in de espesor. La esbeltez del ala es b/tf con b igual a la mitad del ancho (3/0.5 = 6) y la del alma es h/tw (6/0.5 = 12). Los límites salen de la Tabla B4.1a. Para el ala de un perfil armado (caso 2) el límite es λr = 0.64·√(kc·E/Fy), con kc = 4/√(h/tw), y kc debe quedar entre 0.35 y 0.76. En el ejemplo kc da 1.15, fuera del rango, así que se usa el tope de 0.76. Para el alma (caso 5 de la Tabla B4.1a) el límite es λr = 1.49·√(E/Fy) ≈ 42 para Fy = 36 ksi. Como 6 < λr del ala y 12 < 42, ningún elemento es esbelto y no hace falta usar áreas efectivas. La hoja también calcula J = Σ b·t³/3, la distancia entre centroides de alas (ho), el módulo plástico Z como suma de momentos de área (con el que luego se obtiene Mp = Z·Fy), el módulo elástico S = I/c (para My = S·Fy) y las inercias en ambos ejes. Los radios de giro salen como r = √(I/A). Con K = 1 y L = 120 in, la esbeltez que controla es la mayor de las dos, en este caso alrededor del eje débil. Con ella se calcula el esfuerzo de Euler Fe y se ve si el pandeo es elástico o inelástico comparando KL/r con 4.71·√(E/Fy) ≈ 133. Como 84 < 133, el pandeo es inelástico, Fcr = 0.658^(Fy/Fe)·Fy y φPn = 0.90·Fcr·Ag ≈ 199 kips, de modo que la columna resiste una carga de 80 o 100 kips pero no 200 o 300. Ante la pregunta de un alumno, el profesor aclara que en las secciones con elementos esbeltos la diferencia es que se trabaja con un área efectiva (anchos efectivos be) y, si el esfuerzo de pandeo local resulta menor que el Fcr global, se reemplaza Fcr por ese valor. La misma hoja deja listos parámetros que se usarán en flexión (Z, S, J, ho).","formulas":[{"nombre":"Coeficiente kc para alas de perfiles armados","expresion":"kc = 4/√(h/tw), con 0.35 ≤ kc ≤ 0.76","variables":"h: altura libre del alma (in); tw: espesor del alma (in)"},{"nombre":"Límite λr del ala no rigidizada de perfil armado en compresión","expresion":"λr = 0.64·√(kc·E/Fy)","variables":"E = 29000 ksi; Fy: fluencia (ksi); se compara con b/t, b = bf/2"},{"nombre":"Límite λr del alma en compresión","expresion":"λr = 1.49·√(E/Fy)","variables":"se compara con h/tw"},{"nombre":"Constante torsional aproximada","expresion":"J = Σ (b·t³)/3","variables":"b, t: ancho y espesor de cada plancha (in)"},{"nombre":"Teorema de Steiner","expresion":"I = Σ (Ii + Ai·di²)","variables":"Ii: inercia propia de cada parte; Ai: área; di: distancia de su centroide al eje"},{"nombre":"Radio de giro","expresion":"r = √(I/A)","variables":"I: inercia (in⁴); A: área (in²)"},{"nombre":"Esfuerzo crítico inelástico","expresion":"Fcr = 0.658^(Fy/Fe)·Fy, si KL/r ≤ 4.71·√(E/Fy); Fe = π²E/(KL/r)²","variables":"Fe: esfuerzo de Euler (ksi)"},{"nombre":"Resistencia de diseño a compresión","expresion":"φPn = 0.90·Fcr·Ag","variables":"Ag: área bruta (in²)"}],"referencias_norma":["AISC 360-16 Tabla B4.1a (casos 2 y 5)","AISC 360-16 Cap. E, ecuaciones E3-2 a E3-4","AISC 360-16 Sección E7 (miembros con elementos esbeltos)"]},{"titulo":"Evolución histórica de la idealización de las uniones: simples, rígidas y semirrígidas","contenido":"El profesor explica que el diseño de una unión depende de cómo se idealizó el modelo estructural, y lo cuenta históricamente. En los años 50, con pocas computadoras, un pórtico se resolvía con 'ingenio': las vigas se suponían simplemente apoyadas, su reacción se aplicaba a las columnas y estas se diseñaban como empotradas en la base y libres arriba con desplazamiento (K = 2). La unión real era una plancha o ménsula proyectada desde la columna sobre la que se apoyaba la viga: una unión simple. En los 60 y 70 aparecieron las computadoras (el profesor recuerda programar con tarjetas perforadas en la UNI y luego en terminales con pantalla), se pudo calcular el momento que la viga transmite a la columna y nació la unión rígida, donde viga y columna se suponen unidas en la intersección de sus ejes y se transmiten momento, corte y carga axial. En los 80, los laboratorios universitarios mostraron que la suma de momentos en el nudo no era cero: había disipación de energía en la junta, es decir, la unión era en realidad semirrígida. Los sismos de Northridge (EE. UU., 1994) y Kobe (Japón, 1995; el profesor dice 'el 96') provocaron fallas en viaductos y en uniones viga-columna de edificios de acero. A raíz de ello FEMA produjo gran cantidad de documentos y procedimientos. En la Universidad de Tokio, el profesor Kuwamura reprodujo en laboratorio las temperaturas bajo cero del día del sismo de Kobe y encontró que las uniones diseñadas como rígidas solo alcanzaban del orden del 80 % de la capacidad supuesta (unos 20 % menos). De ahí la recomendación práctica: si se diseña una unión como rígida, conviene dejar una holgura adicional, aparte del factor φ. La unión simple, en el mejor caso, transmite apenas un 5 % del momento de la sección. Así, las uniones se clasifican en simples, rígidas y semirrígidas, y las semirrígidas buscan más capacidad sabiendo que hay que darles holgura.","formulas":[],"referencias_norma":["AISC 360-16 Sección B3.4 (clasificación de conexiones simples y de momento: FR y PR)","FEMA-350/351 (documentos post-Northridge)"]},{"titulo":"Tipo de unión y sistema estructural (Tabla 7 de la E.030)","contenido":"El tipo de unión se relaciona con el tipo de estructura. Además de los pórticos resistentes a momento existen los pórticos con arriostres concéntricos y con arriostres excéntricos. La Tabla N.° 7 de la Norma E.030 (Diseño Sismorresistente) lista los sistemas estructurales de acero. En los pórticos especiales (SMF), de alta ductilidad, las secciones llegan a su capacidad máxima, el momento plástico. Los intermedios (IMF) tienen una ductilidad o deformación inelástica moderada. Los ordinarios (OMF) son los que se tratan en el curso. También hay sistemas compuestos acero-concreto, poco usados en el Perú y fuera de la normativa obligatoria, aunque el profesor ha construido algunos edificios compuestos hace 10-15 años. Si se quiere un sistema de alta ductilidad, al diseño hay que sumarle las disposiciones sísmicas del Capítulo 13 de la propuesta de norma E.090 que se compartió en el aula virtual. En resumen, hay que tener presentes dos clasificaciones: la de las uniones (simples, semirrígidas, rígidas) y la de los pórticos según su ductilidad (ordinarios, intermedios, especiales), además de los arriostrados.","formulas":[],"referencias_norma":["Norma E.030 Tabla N.° 7 (sistemas estructurales y coeficiente R)","Propuesta de Norma E.090, Capítulo 13 (disposiciones sísmicas)","AISC 341 (Seismic Provisions)"]},{"titulo":"Identificación de la demanda en una unión y ejemplos conceptuales","contenido":"Para diseñar una unión hay que imaginar primero qué demanda tiene. Si una carga de compresión se aplica sobre un elemento, alrededor del punto de aplicación aparecen efectos locales y posible pandeo local: en una unión simple la reacción R de la viga actúa sobre la viga y, en sentido opuesto, sobre la columna, así que hay que revisar los efectos locales en ambas. El corte funciona como una tijera, con dos fuerzas opuestas sobre un área de corte, y en la base de una columna empotrada se combina con el momento y con la reacción del apoyo. La flexión se puede ver como un par de fuerzas: si un elemento con bordes fijos se jala con T, cada borde reacciona con T/2, y en general un momento M equivale a dos fuerzas M/d separadas el peralte d. Ejemplo de unión simple: plancha proyectada desde la columna, con sección b×t, inercia b·t³/12, módulo elástico b·t²/6, momento de primera fluencia Sx·Fy y momento plástico Zx·Fy. La viga se apoya cerca del centro del voladizo, a una distancia L de la cara de la columna, y si se toma la columna como empotramiento de la plancha, el momento R·L debe ser menor que el momento resistente (se puede usar el plástico) para dimensionar el espesor. La misma sección crítica sirve para diseñar la soldadura de la plancha a la columna (φRn por unidad de longitud por la longitud soldada). Ejemplo de unión rígida o semirrígida: se proyectan dos planchas, una para cada ala, que toman el par de fuerzas del momento, y dos ángulos (clips) soldados al alma que toman el corte. Cada ángulo recibe la mitad del cortante, V/2, que debe ser menor que lo que resiste. El profesor insiste en que el éxito del diseño depende de imaginar bien la condición crítica.","formulas":[{"nombre":"Propiedades de una plancha rectangular","expresion":"I = b·t³/12 ; S = b·t²/6 ; Z = b·t²/4","variables":"b: ancho de la plancha; t: espesor (peralte en flexión)"},{"nombre":"Momentos de fluencia y plástico","expresion":"My = Sx·Fy ; Mp = Zx·Fy","variables":"Sx, Zx: módulos elástico y plástico; Fy: fluencia"},{"nombre":"Verificación de plancha proyectada (ménsula)","expresion":"Ru·L ≤ φ·Mp = 0.90·Zx·Fy","variables":"Ru: reacción de la viga; L: brazo desde la cara de la columna al punto de apoyo"},{"nombre":"Par de fuerzas equivalente a un momento","expresion":"F = M/d","variables":"M: momento en la unión; d: peralte (separación entre las fuerzas del par)"}],"referencias_norma":["AISC 360-16 Cap. J (diseño de conexiones)","AISC 360-16 Sección J10 (alas y almas con cargas concentradas)"]},{"titulo":"Uniones soldadas versus empernadas y requisitos mínimos de las conexiones","contenido":"Según el profesor, en el Perú alrededor del 90 % de las conexiones son soldadas, es decir, fijas y permanentes. Las empernadas se usan cuando la estructura va a desarmarse o trasladarse. Cuenta el caso de un supermercado que diseñó: el negocio no funcionó y la empresa lo desarmó sin problemas porque todo estaba empernado. Muchas transnacionales prefieren uniones empernadas para poder 'levantar la carpa' si la inversión no resulta, y con un ejemplo de emprendimiento (el 'alumno Pérez' y sus viviendas) ilustra que soldar significa permanencia y empernar significa ensamblar y desensamblar. Regla general: las cargas del análisis estructural deben ser menores que la resistencia de las uniones. Las conexiones simples se usan sobre todo en armaduras, y las de momento (rígidas o semirrígidas) en uniones viga-columna permanentes. Ninguna conexión debe diseñarse para menos de 45 kN (unas 4.5 t), aunque el Pu del análisis sea menor. En las armaduras, además, la conexión debe resistir al menos el 50 % de la resistencia de los miembros que une, aunque estos tengan poca carga. El profesor menciona además los casos en que deben usarse pernos de alta resistencia o soldadura: empalmes de columnas en edificios altos, intermedios y bajos, conexiones viga-columna (arriostradas o no), estructuras con grúas de más de 45 kN y soportes de maquinaria que produce impacto o vibraciones.","formulas":[{"nombre":"Resistencia mínima de una conexión","expresion":"φRn ≥ máx(Ru ; 45 kN)","variables":"Ru: demanda de la combinación de cargas"},{"nombre":"Conexiones en armaduras","expresion":"φRn ≥ máx(Ru ; 45 kN ; 0.5·φRn,miembro)","variables":"φRn,miembro: resistencia de diseño de los miembros conectados"}],"referencias_norma":["Norma E.090 Capítulo J (requisitos generales de conexiones, resistencia mínima)","AISC 360-16 Sección J1.10 (pernos de alta resistencia en combinación / dónde se requieren)"]},{"titulo":"Soldadura de filete: planos de falla, garganta efectiva y reglas geométricas","contenido":"Con apoyo de un video, el profesor explica la geometría del filete. Los dos catetos miden SW (tamaño de la soldadura) y el plano inclinado que pasa por la raíz es la garganta efectiva, de espesor te = 0.707·SW en un filete de lados iguales. Cuando las planchas se jalan en sentidos opuestos, la soldadura trabaja a corte. Hay dos superficies de falla posibles: el plano del cateto, de área SW·LW, sobre el metal base, y el plano de la garganta, de área te·LW, sobre el metal de aporte. Por comodidad se calcula todo por pulgada de soldadura (LW = 1 in). En una unión en T jalada perpendicularmente, cada cordón toma T/2. Agujeros de acceso: en las uniones viga-columna hay que recortar el alma de la viga para que pase el electrodo. Tras el sismo de Kobe, los ensayos del profesor Kuwamura, que el profesor vio mientras hacía su tesis en la Universidad de Tokio, mostraron que el agujero debe tener una longitud mínima de 1.5·tw; si es menor, la unión falla porque no hay espacio para depositar bien el cordón en la zona del alma. Longitudes, según el profesor: mínima de 2·SW, máxima de 70·SW, y en juntas traslapadas con carga paralela al cordón, mínima de 4·SW. Los cordones perpendiculares a la carga (frontales) no se diseñan y se les pone el tamaño mínimo. En un corte transversal de la junta traslapada se ven los dos planos de falla del triángulo de soldadura. Soldadura de tapón: se perforan agujeros como para pernos y se llenan con soldadura, que trabaja por contacto. La separación centro a centro mínima es de 4 diámetros, y el espesor de soldadura es igual a t si t ≤ 16 mm (5/8 in) o al menos t/2 si t > 16 mm. Soldadura de ranura: en lugar de agujeros circulares se hacen ranuras alargadas ('ojo chino'), de ancho entre unos 8 mm más el espesor y 2.25 veces el espesor de la soldadura, y largo máximo de 10 veces ese espesor.","formulas":[{"nombre":"Garganta efectiva de filete","expresion":"te = 0.707·SW","variables":"SW: tamaño (cateto) del filete"},{"nombre":"Áreas de falla por unidad de longitud","expresion":"A_cateto = SW·1 in ; A_garganta = 0.707·SW·1 in","variables":"por pulgada de cordón"},{"nombre":"Agujero de acceso","expresion":"L_acceso ≥ 1.5·tw","variables":"tw: espesor del alma de la viga"},{"nombre":"Longitudes de filete (según el profesor)","expresion":"LW,mín = 2·SW (general) ; LW,mín = 4·SW (traslape, carga paralela) ; LW,máx = 70·SW","variables":"SW: tamaño del filete"}],"referencias_norma":["AISC 360-16 Sección J2.2 (soldaduras de filete: área efectiva, tamaños y longitudes)","AISC 360-16 Sección J1.6 (agujeros de acceso)","AISC 360-16 Sección J2.3 (soldaduras de tapón y de ranura)"]},{"titulo":"Resistencia de la soldadura: Tabla J2.5 y compatibilidad de electrodos","contenido":"La resistencia de diseño se obtiene de la Tabla J2.5 del Capítulo J, que en la propuesta de norma peruana tiene su equivalente. Para filetes con carga de corte hay que revisar dos cosas. En el metal base, la resistencia la da la Sección J4 (fluencia o rotura por corte). En el metal de aporte se usa φ = 0.75, Fnw = 0.60·FEXX (FEXX es la resistencia del electrodo) y el área efectiva de la garganta. La resistencia del cordón es la menor de las dos. La tabla aclara que la tracción o compresión paralela al eje de la soldadura no se considera en el diseño, por eso los filetes se diseñan casi siempre a corte. El profesor recomienda leer con cuidado la Sección J4, porque ahí se definen las áreas del metal base afectadas por la soldadura. Por último muestra las tablas de metales base y electrodos compatibles, tanto en la norma vigente como en la propuesta, junto con los electrodos que se venden en el Perú (por ejemplo, E70XX para acero A36).","formulas":[{"nombre":"Resistencia del metal de aporte (filete a corte)","expresion":"φRn = φ·Fnw·Awe = 0.75·(0.60·FEXX)·(0.707·SW·LW)","variables":"FEXX: resistencia del electrodo (70 ksi para E70XX); Awe: área efectiva de garganta"},{"nombre":"Resistencia del metal base","expresion":"φRn = mín(1.00·0.60·Fy·Agv ; 0.75·0.60·Fu·Anv)","variables":"Agv, Anv: áreas bruta y neta a corte del metal base"},{"nombre":"Resistencia de la soldadura","expresion":"φRn = mín(φRn,aporte ; φRn,base)","variables":"se toma el menor"}],"referencias_norma":["AISC 360-16 Tabla J2.5","AISC 360-16 Sección J4 (elementos afectados de miembros y elementos de conexión)","AISC 360-16 Tabla J2.6 / Norma E.090 tabla de metales de aporte compatibles"]}],"ejemplos":[{"titulo":"Columna con perfil H armado de planchas de 1/2 in","enunciado":"Perfil H armado con dos alas de 6 in × 1/2 in y alma de 6 in (altura libre) × 1/2 in, acero Fy = 36 ksi, E = 29000 ksi. Longitud L = 120 in y K = 1. Verificar la esbeltez local y calcular φPn. Comparar con Pu = 80 kips.","pasos":["Esbeltez del ala: b/tf = 3/0.5 = 6. Esbeltez del alma: h/tw = 6/0.5 = 12.","kc = 4/√12 = 1.15 > 0.76, entonces kc = 0.76. λr,ala = 0.64·√(0.76·29000/36) ≈ 15.8 (la hoja del profesor muestra ≈ 18.9). En cualquier caso 6 < λr: ala no esbelta.","λr,alma = 1.49·√(29000/36) ≈ 42.3 > 12: alma no esbelta.","Ag = 2(6·0.5) + 6·0.5 = 9.0 in².","Iy ≈ 2(0.5·6³/12) + 6·0.5³/12 ≈ 18.06 in⁴, ry = √(18.06/9) ≈ 1.42 in. Ix es mayor, así que controla el eje y.","KL/r = 120/1.42 ≈ 84.7 < 4.71·√(E/Fy) ≈ 133.7, pandeo inelástico.","Fe = π²·29000/84.7² ≈ 39.9 ksi. Fcr = 0.658^(36/39.9)·36 ≈ 24.7 ksi.","φPn = 0.90·24.7·9.0 ≈ 200 kips (la hoja da 199 kips)."],"resultado":"φPn ≈ 199 kips > Pu = 80 kips: el perfil cumple. No cumpliría con 200 o 300 kips."},{"titulo":"Planteamiento de una plancha proyectada (unión simple)","enunciado":"Una viga se apoya sobre una plancha proyectada desde la columna, con la reacción Ru aplicada a una distancia L de la cara de la columna. Plantear cómo se dimensiona el espesor de la plancha (ejemplo conceptual de clase, sin datos numéricos).","pasos":["Se toma la columna como empotramiento de la plancha en voladizo.","Momento de demanda en la cara: Mu = Ru·L.","Resistencia: φMn = 0.90·Z·Fy, con Z = b·t²/4 para una plancha de ancho b y espesor t.","Se impone Ru·L ≤ 0.90·Fy·b·t²/4 y se despeja t.","En la misma sección se diseña la soldadura plancha-columna: φRn (por pulgada) × longitud ≥ demanda."],"resultado":"t ≥ √(4·Ru·L/(0.90·Fy·b)). Además hay que revisar la soldadura y los efectos locales en viga y columna."}],"conceptos_clave":[{"termino":"Unión simple","definicion":"Conexión que transmite corte y prácticamente nada de momento (según el profesor, como máximo un 5 % de la capacidad de la sección). Ejemplos: plancha proyectada o ménsula de apoyo."},{"termino":"Unión rígida","definicion":"Conexión que se supone capaz de transmitir el momento, el corte y la carga axial de la viga a la columna, manteniendo el ángulo entre ambas."},{"termino":"Unión semirrígida","definicion":"Conexión con capacidad parcial de transmitir momento, en la que hay rotación relativa y disipación de energía en la junta. Se diseña dejando holgura."},{"termino":"OMF / IMF / SMF","definicion":"Pórticos resistentes a momento ordinarios, intermedios y especiales, de ductilidad baja, media y alta. Están listados en la Tabla 7 de la E.030."},{"termino":"Coeficiente kc","definicion":"Factor de interacción ala-alma en perfiles armados, kc = 4/√(h/tw), limitado entre 0.35 y 0.76."},{"termino":"Garganta efectiva","definicion":"Distancia mínima de la raíz a la cara del filete. En filetes de lados iguales vale 0.707·SW y define el área de falla del metal de aporte."},{"termino":"SW","definicion":"Tamaño (cateto) del filete de soldadura, parámetro del que dependen las áreas y las longitudes mínimas y máximas."},{"termino":"Agujero de acceso","definicion":"Recorte en el alma de la viga, junto al ala, que permite pasar el electrodo. Longitud mínima de 1.5·tw."},{"termino":"Soldadura de tapón","definicion":"Agujero circular en una de las planchas que se llena de soldadura. Separación mínima de 4 diámetros entre centros."},{"termino":"Soldadura de ranura","definicion":"Ranura alargada ('ojo chino') llena de soldadura, con largo máximo de 10 veces el espesor de soldadura."},{"termino":"Resistencia mínima de conexión","definicion":"Ninguna conexión se diseña para menos de 45 kN. En armaduras debe resistir además el 50 % de la resistencia de los miembros que une."}],"preguntas":[{"pregunta":"En un perfil H armado en compresión, kc = 4/√(h/tw) resulta 1.15. ¿Qué valor de kc se usa para calcular λr del ala?","opciones":["1.15","0.35","0.76","1.00"],"correcta":2,"explicacion":"kc debe estar entre 0.35 y 0.76. Si el cálculo da más, se usa el tope de 0.76."},{"pregunta":"Una columna tiene KL/r = 84 y acero A36. ¿Qué tipo de pandeo controla?","opciones":["Elástico, porque KL/r > 25","Inelástico, porque KL/r < 4.71√(E/Fy) ≈ 133","Elástico, porque KL/r < 133","Fluencia pura sin pandeo"],"correcta":1,"explicacion":"Si KL/r ≤ 4.71√(E/Fy), el pandeo es inelástico y Fcr = 0.658^(Fy/Fe)·Fy."},{"pregunta":"¿Qué evento sísmico motivó la creación de numerosos documentos FEMA sobre uniones de acero?","opciones":["Lima 1974","Northridge 1994","Chile 2010","San Francisco 1906"],"correcta":1,"explicacion":"Tras Northridge (1994) fallaron muchas uniones viga-columna y FEMA publicó abundante guía técnica."},{"pregunta":"Según los ensayos del profesor Kuwamura tras el sismo de Kobe, las uniones diseñadas como rígidas alcanzaban aproximadamente:","opciones":["El 100 % de la capacidad supuesta","El 120 % de la capacidad supuesta","El 80 % de la capacidad supuesta","El 5 % de la capacidad supuesta"],"correcta":2,"explicacion":"Encontró una reducción de alrededor del 20 % (solo un 80 % de capacidad), de ahí la recomendación de dejar holgura adicional."},{"pregunta":"¿Cuál es la resistencia mínima con la que debe diseñarse cualquier conexión según lo visto en clase?","opciones":["10 kN","45 kN","100 kN","La mitad del Pu del análisis"],"correcta":1,"explicacion":"Ninguna conexión debe diseñarse para menos de 45 kN (unas 4.5 t)."},{"pregunta":"En una armadura, una diagonal tiene φPn = 120 kN y Pu = 30 kN. ¿Para qué fuerza mínima debe diseñarse su conexión?","opciones":["30 kN","45 kN","60 kN","120 kN"],"correcta":2,"explicacion":"La conexión debe resistir el mayor entre Pu, 45 kN y el 50 % de la resistencia del miembro: máx(30; 45; 60) = 60 kN."},{"pregunta":"La garganta efectiva de un filete de lados iguales de 1/4 in es aproximadamente:","opciones":["0.250 in","0.354 in","0.125 in","0.177 in"],"correcta":3,"explicacion":"te = 0.707·0.25 ≈ 0.177 in."},{"pregunta":"¿Qué longitud mínima debe tener el agujero de acceso para soldadura en el alma de una viga, según la clase?","opciones":["0.5·tw","1.0·tw","1.5·tw","3.0·tw"],"correcta":2,"explicacion":"El profesor indica 1.5·tw, criterio reforzado tras los ensayos posteriores a Kobe."},{"pregunta":"Según la Tabla J2.5, la tracción o compresión paralela al eje de un filete:","opciones":["Se diseña con φ = 0.90","No necesita considerarse en el diseño de la soldadura","Se suma al corte vectorialmente","Se diseña con 0.60·FEXX"],"correcta":1,"explicacion":"La norma permite despreciarla, por eso los filetes se diseñan a corte."},{"pregunta":"¿Por qué en el Perú la mayoría de las conexiones son soldadas?","opciones":["Porque los pernos están prohibidos","Porque la soldadura da uniones permanentes y la mayoría de las obras lo son; los pernos se reservan para estructuras desmontables","Porque la soldadura siempre es más barata que los pernos","Porque la E.090 no tiene requisitos para pernos"],"correcta":1,"explicacion":"Soldar significa permanencia; empernar permite ensamblar y desensamblar, algo útil para inversiones temporales."},{"pregunta":"En una unión rígida con dos ángulos (clips) en el alma, si el cortante de la viga es V, ¿qué corte se usa para diseñar cada ángulo?","opciones":["V","2V","V/2","V/4"],"correcta":2,"explicacion":"Los dos ángulos se reparten el corte por igual, V/2 cada uno."},{"pregunta":"En una soldadura de tapón, la separación mínima centro a centro entre agujeros es:","opciones":["2 diámetros","3 diámetros","4 diámetros","10 diámetros"],"correcta":2,"explicacion":"Se exige una separación mínima de 4 veces el diámetro del agujero."}],"ejercicios_propuestos":["Repita el ejemplo del perfil H armado con alas de 8 in × 3/8 in, alma de 10 in × 5/16 in, Fy = 36 ksi, L = 150 in y K = 1. Clasifique los elementos (Tabla B4.1a, con kc) y obtenga φPn.","Una plancha proyectada de 6 in de ancho, de acero A36, recibe la reacción Ru = 12 kips de una viga a 3 in de la cara de la columna. Calcule el espesor mínimo con Mu ≤ 0.90·Z·Fy y elija un espesor comercial.","Una diagonal de armadura tiene Pu = 20 kN y φPn = 150 kN. Determine la fuerza mínima de diseño de su conexión aplicando las reglas de 45 kN y del 50 %.","Para un filete de 5/16 in con electrodo E70XX, calcule el área de garganta por pulgada y la resistencia φRn por pulgada del metal de aporte.","En una unión viga-columna con Vu = 40 kips y dos ángulos de alma, determine el corte de diseño por ángulo y explique qué estados límite revisaría en el ángulo y en su soldadura."],"avisos":["Se usó una hoja Excel para compresión de perfiles H armados. El profesor recomienda que cada alumno haga la suya.","La propuesta de norma E.090 (con el Capítulo 13 de disposiciones sísmicas) está en el aula virtual.","Se pasó lista durante la clase (seis ausentes).","Se recomienda buscar documentación FEMA (sitio de FEMA) sobre uniones post-Northridge.","Se mostró un video sobre la geometría y los planos de falla de la soldadura de filete."],"notas_transcripcion":["'Tb' se interpretó como tw y 'kase/casé' como kc.","En la hoja, λr del ala aparece como 18.90. Recalculado con kc = 0.76 y Fy = 36 ksi da ≈ 15.8. La conclusión (no esbelto) no cambia.","'Nordridge/Norwich' es Northridge (1994) y 'CO' es Kobe. El profesor dice 1996, pero el sismo de Kobe fue en enero de 1995.","'profesor Kuamura/Kubamura' se interpretó como el profesor Kuwamura (Universidad de Tokio).","Longitudes de filete: el profesor dice mínima 2·SW, mínima 4·SW en traslapes y máxima 70·SW. El AISC 360-16 exige una longitud mínima de 4 veces el tamaño y reduce la longitud efectiva (factor β) cuando L > 100·w. Se registra lo dicho en clase.","La resistencia de 45 kN y la regla del 50 % para armaduras vienen de la E.090 (y de versiones antiguas del AISC). El AISC 360-16 ya no tiene la regla del 50 %.","La parte del video sobre soldadura se transcribió solo parcialmente (comienza a mitad de una explicación)."],"corto":"Columna armada · uniones","video":"https://www.youtube.com/watch?v=sM0zYKSU0QQ","duracion_min":70,"estado":"ok"},"08":{"titulo":"Diseño de uniones soldadas (filete, soldadura balanceada, simbología) y uniones empernadas","fecha":null,"resumen":"Se continúa con las uniones. Primero se resuelve un ejemplo completo de soldadura de filete: un ángulo L2½×2×5/16 soldado a una plancha que debe transmitir 170 kips. Se eligen los tamaños mínimo y máximo con la Tabla J2.4 y la Sección J2.2b, se calcula la resistencia por pulgada del metal de aporte (Tabla J2.5) y del metal base (Sección J4: fluencia y rotura por corte), se toma la menor y se obtiene la longitud de cordones iguales. Luego se plantea la soldadura balanceada, que reparte las longitudes según la posición del centroide del ángulo, y se explica la simbología normalizada de soldadura junto con los tipos de junta y la soldadura de penetración precalificada. Se describe cómo una unión viga-columna en cajón (pórtico OMF) transmite el corte por ángulos en el alma y el momento como un par de fuerzas en planchas de ala. En la segunda parte se tratan los pernos: tipos, partes, pretensión mínima y métodos de ajuste, juntas de aplastamiento y de deslizamiento crítico, modos de falla, resistencias nominales con rosca incluida o excluida, dimensiones de agujeros, espaciamientos y distancias a bordes. Cierra con un ejemplo de unión empernada a tracción.","objetivos":["Al terminar, el estudiante podrá determinar los tamaños mínimo y máximo de un filete según el espesor de las partes conectadas.","Al terminar, el estudiante podrá calcular la resistencia por unidad de longitud de un filete como el menor valor entre el metal de aporte y el metal base.","Al terminar, el estudiante podrá dimensionar longitudes de cordones iguales y de cordones balanceados por equilibrio de fuerzas y momentos.","Al terminar, el estudiante podrá leer e indicar soldaduras en planos con la simbología normalizada.","Al terminar, el estudiante podrá distinguir juntas de aplastamiento y de deslizamiento crítico, los métodos de pretensión y los modos de falla de uniones empernadas.","Al terminar, el estudiante podrá calcular la resistencia a corte de un perno y el número de pernos necesario, verificando espaciamientos y distancias al borde."],"temas":[{"titulo":"Tamaño de filete y resistencia por pulgada: metal de aporte frente a metal base","contenido":"Se repasa que la resistencia de la soldadura es el menor valor entre el metal de aporte y el metal base (Tabla J2.5, equivalente a la tabla 10.2.5 de la propuesta de norma), y que la tabla de electrodos compatibles adapta las recomendaciones del AISC a la norma peruana. Ejemplo: un ángulo L2½×2×5/16 montado sobre una plancha de 3/8 in, soldado solo con cordones laterales, porque un único lado del ángulo está en contacto con la plancha. La carga es de 170 kips. Tamaño mínimo: se entra a la Tabla J2.4 con el espesor de la parte más delgada, 5/16 in. Como está entre 1/4 y 1/2 in, el mínimo es 3/16 in. Tamaño máximo en bordes: si t < 1/4 in, el máximo es t; si t ≥ 1/4 in, es t − 1/16 in. Con 5/16 in se obtiene 1/4 in. El diseñador elige dentro de ese rango, en este caso SW = 1/4 in, con garganta te = 0.707·0.25 = 0.177 in. La carga debe pasar del centroide de un elemento al del otro. Metal de aporte (E70XX): φ = 0.75 y Fnw = 0.60·70 = 42 ksi. Sobre la garganta, por pulgada, φRn = 0.75·0.60·70·0.177 ≈ 5.57 kips/in. Si se usara el cateto, saldría 7.87 kips/in, pero controla la garganta. Metal base (A36, Fy = 36 ksi, Fu = 58 ksi), Sección J4.2. Fluencia por corte: φ = 1.00, 0.60·36·(0.25·1) = 5.40 kips/in. Rotura por corte: φ = 0.75, 0.60·58·(0.25·1) = 6.52 kips/in. Controla el metal base, con 5.40 kips/in. Como resistencia de diseño del cordón se toma 5.40 kips/in. El profesor también repasa la Sección J4: tracción en elementos de conexión (fluencia φ = 0.90·Fy·Ag, rotura φ = 0.75·Fu·Ae), corte (fluencia φ = 1.00·0.60·Fy·Agv, rotura φ = 0.75·0.60·Fu·Anv), bloque de corte (sobre todo con pernos: un plano en tracción y otros en corte, descontando agujeros) y compresión en elementos de conexión (si KL/r ≤ 25, φ = 0.90·Fy·Ag; si no, se aplica el Capítulo E). Los cordones transversales, con tracción respecto a su eje, pueden despreciarse y se les pone el tamaño mínimo.","formulas":[{"nombre":"Tamaño mínimo de filete (Tabla J2.4)","expresion":"t ≤ 1/4 in → 1/8 in ; 1/4 < t ≤ 1/2 → 3/16 in ; 1/2 < t ≤ 3/4 → 1/4 in ; t > 3/4 → 5/16 in","variables":"t: espesor de la parte más delgada"},{"nombre":"Tamaño máximo de filete en bordes","expresion":"SWmáx = t si t < 1/4 in ; SWmáx = t − 1/16 in si t ≥ 1/4 in","variables":"t: espesor del borde del material"},{"nombre":"Metal de aporte por pulgada","expresion":"φRn = 0.75·0.60·FEXX·(0.707·SW)","variables":"FEXX = 70 ksi (E70XX); SW en in; resultado en kips/in"},{"nombre":"Metal base: fluencia por corte","expresion":"φRn = 1.00·0.60·Fy·Agv","variables":"Agv: área bruta en corte (SW·1 in por pulgada)"},{"nombre":"Metal base: rotura por corte","expresion":"φRn = 0.75·0.60·Fu·Anv","variables":"Anv: área neta en corte (igual a la efectiva en soldadura)"},{"nombre":"Elementos de conexión en tracción","expresion":"φRn = 0.90·Fy·Ag ; φRn = 0.75·Fu·Ae","variables":"Ae: área neta efectiva"},{"nombre":"Elementos de conexión en compresión","expresion":"Si KL/r ≤ 25: φPn = 0.90·Fy·Ag ; si KL/r > 25: Capítulo E","variables":"KL/r: esbeltez del elemento de conexión"}],"referencias_norma":["AISC 360-16 Tabla J2.4","AISC 360-16 Sección J2.2b","AISC 360-16 Tabla J2.5","AISC 360-16 Sección J4.1, J4.2, J4.3 (bloque de corte), J4.4","Propuesta E.090 tabla 10.2.5"]},{"titulo":"Longitud de cordones iguales y soldadura balanceada","contenido":"Con φRn = 5.40 kips/in, el caso más simple supone dos cordones laterales de igual longitud LW. Por equilibrio, Pu = 2·φRn·LW, así que LW = 170/(2·5.4) = 15.74 in. Ese número 'no es ingenieril' (nadie suelda 15.74), por lo que se redondea a 16 in. En los extremos transversales basta un cordón de tamaño mínimo y longitud constructiva (el profesor pone 2·SW = 1/2 in). Soldadura balanceada: si se quiere que las longitudes sean distintas, de modo que la resultante de los cordones coincida con la línea de acción de la carga (el centroide del ángulo), se necesita la posición del centroide, que sale de la tabla de perfiles, en la pestaña de ángulos simples (x̄, ȳ). Para el L2½×2×5/16 el centroide está a unos 0.55 in del borde de referencia, medido en el ancho de 2½ in. El ángulo también debe ubicarse de modo que su centroide coincida con el eje de la plancha (8 in de ancho). Se plantean dos ecuaciones. Suma de fuerzas: φRn·L1 + φRn·L2 = Pu = 170. Momentos respecto de uno de los cordones: φRn·L2·2.5 = Pu·0.555, de donde L2 ≈ 6.99 ≈ 7 in. Reemplazando en la primera, L1 ≈ 24.5 in. La suma (31.5 in) es la misma que con cordones iguales; lo que cambia es el reparto, que hace coincidir la resultante con el centroide y evita excentricidades. En obra se pueden redondear hacia arriba (8 in y 24½ o 25 in). El profesor subraya que la ubicación del ángulo depende de su centroide. Al final hace preguntas para evaluar la participación: la longitud máxima se obtiene con el tamaño máximo, que depende del espesor menor de las partes; y la forma más simple de hallar la longitud con dos planchas traslapadas es el equilibrio con longitudes iguales.","formulas":[{"nombre":"Cordones iguales","expresion":"Pu = 2·φRn·LW → LW = Pu/(2·φRn)","variables":"φRn: resistencia por pulgada (kips/in); LW: longitud de cada cordón (in)"},{"nombre":"Soldadura balanceada: fuerzas","expresion":"φRn·L1 + φRn·L2 = Pu","variables":"L1, L2: longitudes de los cordones de cada borde"},{"nombre":"Soldadura balanceada: momentos respecto al cordón 1","expresion":"φRn·L2·b = Pu·ȳ","variables":"b: ancho del ala conectada (distancia entre cordones); ȳ: distancia del centroide del ángulo al cordón 1"}],"referencias_norma":["AISC 360-16 Sección J1.7 (equilibrio de centroides en conexiones de miembros cargados axialmente)","AISC Manual, Parte 1 (propiedades de ángulos: x̄, ȳ)"]},{"titulo":"Simbología de soldadura, tipos de junta y soldadura precalificada","contenido":"En los planos no se dibuja el cordón 'chorreado': se usa el símbolo normalizado. El símbolo es una línea de referencia horizontal con una flecha. Lo que va debajo de la línea se refiere al lado de la flecha y lo que va encima, al otro lado. Sobre la línea se dibuja la geometría de la soldadura (un triángulo para filete), a la izquierda del símbolo se escribe el tamaño y a la derecha la longitud. Si la soldadura es intermitente, después de la longitud se pone un guion y la separación (paso). Una bandera indica soldadura de campo u obra; sin bandera se entiende que es de taller. Un círculo en el quiebre indica soldadura todo alrededor, y entonces no hace falta especificar longitudes. En la cola de la flecha se anota información especial, como el electrodo o un procedimiento, por ejemplo cuando la soldadura la hacen buzos bajo el agua en un muelle. Para el ejemplo del ángulo se indica un filete de 1/4 in a ambos lados de la flecha con longitudes de 16 in (o, en la versión balanceada, 8 in y 24½ in), y filetes mínimos de 1/4 in × 1/2 in en los extremos. Si el mismo tamaño va en los dos lados, puede omitirse uno de los valores. Tipos de junta: traslapada, a tope (con bisel preparado para soldadura de canal o penetración), en T, de esquina y de borde. Las soldaduras de penetración, completa (CJP) o parcial (PJP), tienen detalles de junta precalificados en las normas de soldadura: tablas en las que, con los espesores de las partes, se obtiene la preparación del bisel y la soldadura.","formulas":[],"referencias_norma":["AWS A2.4 (símbolos de soldadura)","AWS D1.1 (juntas precalificadas CJP/PJP)","AISC 360-16 Sección J2.1 (soldaduras de ranura)"]},{"titulo":"Unión viga-columna en cajón para pórtico OMF: corte y par de fuerzas","contenido":"Se muestra el detalle de unión de una viga H con una columna en cajón rectangular, en un pórtico ordinario (OMF) de varios pisos. En el análisis los elementos son líneas (ejes), pero el detalle se dibuja con las dimensiones reales de las secciones. Como hacer rigidizadores internos en un cajón es difícil, se suele dar continuidad externa: una plancha que engrosa la pared de la columna a la altura de las alas, para que la compresión de la viga no la abolle localmente. Supuestos de demanda del análisis: Vu = 30 kips y Mu = 1200 kip·in. El corte lo toma el alma de la viga y se transfiere a la columna mediante ángulos (clips) soldados al alma, cada uno con su φRn por su longitud. El momento se convierte en un par de fuerzas: con un peralte de 20 in, F = 1200/20 = 60 kips en cada ala, tracción en una y compresión en la otra. La plancha proyectada desde la columna se suelda al ala de la viga con dos cordones longitudinales y un cordón transversal en el extremo, que en este caso sí se considera. El cordón transversal solo puede hacerse por arriba, porque abajo está el perfil. Esos tres cordones deben resistir más de 60 kips. El profesor anuncia que el tema se desarrollará con más detalle en el capítulo de pórticos.","formulas":[{"nombre":"Fuerza en las alas por momento","expresion":"Ff = Mu/d","variables":"Mu: momento en la unión (kip·in); d: peralte de la viga (in)"}],"referencias_norma":["AISC 360-16 Sección J10 (cargas concentradas en alas y almas)","Norma E.030 Tabla 7 (OMF)"]},{"titulo":"Pernos: tipos, pretensión mínima y métodos de ajuste","contenido":"Al usar pernos se perforan los elementos y se reduce su área, lo que lleva a las líneas de falla vistas en tracción. Los pernos estructurales de alta resistencia son ASTM A325 y A490 y llevan su designación en relieve en la cabeza. Se usan en los elementos estructurales principales. El perno A307 (perno de máquina o común, el que se consigue en cualquier ferretería) no lleva marca y se reserva para elementos secundarios o no estructurales cuya falla no compromete la estructura. Partes: cabeza, vástago con una zona lisa y otra roscada, tuerca y arandela ('guacha'). La zona roscada importa porque el área resistente cambia según el plano de corte pase o no por la rosca. Pretensión: la Tabla J3.1 da la tracción mínima para considerar un perno ajustado. Por ejemplo, con acabado de superficie clase A, un perno de 3/4 in necesita 28 kips y uno de 5/8 in, 19 kips. Métodos de ajuste: llave calibrada o torquímetro (pantalla digital que indica la tensión o el torque aplicado; se ajusta hasta leer el valor de tabla o más), giro de tuerca (se aprieta a mano hasta que la llave ya no avanza, condición de ajuste firme, y luego se da una fracción de vuelta adicional con un tubo de extensión, según la longitud del perno en diámetros; el profesor menciona media vuelta para longitudes de unos 4-5 diámetros) e indicador directo de tensión. Al ajustar se produce un alargamiento axial del perno, es decir, una tracción que genera presión de contacto entre las planchas.","formulas":[],"referencias_norma":["AISC 360-16 Sección J3.1 y Tabla J3.1 (pretensión mínima)","RCSC Specification (giro de tuerca, Tabla 8.2)","ASTM F3125 (A325/A490), ASTM A307"]},{"titulo":"Juntas de aplastamiento y de deslizamiento crítico; modos de falla","contenido":"En una junta de aplastamiento (contacto) los pernos no van pretensados ('requintados'). Las planchas pueden deslizar hasta apoyarse en el vástago, que queda sometido a corte (fuerzas P y −P en los planos de corte), mientras las paredes del agujero se aplastan. Es el caso de armaduras empernadas o de uniones tipo pasador. En una junta de deslizamiento crítico los pernos se ajustan con la pretensión de la Tabla J3.1, y la fuerza se transmite por fricción entre las superficies, que dependen de su clase de acabado (A o B; en general se usa la clase A). Modos de falla que se quieren evitar: (1) desgarramiento o falla 'ojal' ('tear-out'), cuando el perno está demasiado cerca del borde, lo que se evita respetando la distancia mínima al borde; (2) aplastamiento de la plancha, también por cercanía al borde; (3) rotura por tracción en la sección neta, cuando el elemento es muy angosto o las distancias laterales son pequeñas; (4) falla del perno por corte; (5) falla del perno por tracción.","formulas":[],"referencias_norma":["AISC 360-16 Sección J3.6 a J3.10 (resistencia a tracción, corte, aplastamiento y desgarramiento)","AISC 360-16 Sección J3.8 (conexiones de deslizamiento crítico)"]},{"titulo":"Resistencia nominal de pernos (rosca incluida o excluida), agujeros, espaciamientos y bordes","contenido":"La Tabla J3.2 da la resistencia nominal a tracción Fnt y a corte Fnv. Para A325, Fnt = 90 ksi. En corte, Fnv = 54 ksi si la rosca no está excluida del plano de corte (condición N, el plano pasa por la zona roscada) y Fnv = 68 ksi si está excluida (condición X, el plano pasa por el vástago liso). En ambos casos se usa el área nominal del vástago, π·d²/4. El profesor lo explica dibujando el vástago con su zona roscada y dos secciones: una por la zona lisa (mayor) y otra por la raíz de la rosca (menor). Agujeros (Tabla J3.3): estándar, sobredimensionado, ranura corta y ranura larga. Para un perno de 5/8 in, el agujero estándar es de 11/16 in y el sobredimensionado de 13/16 in. Para pernos chicos el estándar es d + 1/16 in (de ahí 9/16 in para 1/2 in), y las ranuras tienen dimensiones tabuladas. Separación entre centros de agujeros: al menos 3 diámetros (la norma pide un mínimo de 2⅔·d y prefiere 3·d). Distancia mínima al borde: Tabla J3.4, por ejemplo 3/4 in para un perno de 1/2 in. Separación máxima en uniones traslapadas: 24 veces el espesor de la plancha más delgada o 30 cm (12 in) si no hay corrosión; en ambientes corrosivos, como muelles o puertos frente al mar, 14 veces el espesor o 18 cm (7 in).","formulas":[{"nombre":"Resistencia a corte de un perno","expresion":"φRn = 0.75·Fnv·Ab ; Ab = π·d²/4","variables":"Fnv: 54 ksi (A325-N) o 68 ksi (A325-X); d: diámetro nominal"},{"nombre":"Resistencia a tracción de un perno","expresion":"φRn = 0.75·Fnt·Ab","variables":"Fnt = 90 ksi (A325)"},{"nombre":"Número de pernos","expresion":"n = Pu/(φRn por perno), redondeado hacia arriba según la disposición","variables":"Pu: carga de diseño"},{"nombre":"Espaciamiento y bordes","expresion":"s ≥ 3·d ; Le ≥ Le,mín (Tabla J3.4) ; smáx = mín(24·t ; 12 in) o mín(14·t ; 7 in) en ambiente corrosivo","variables":"t: espesor de la plancha más delgada"}],"referencias_norma":["AISC 360-16 Tabla J3.2","AISC 360-16 Tabla J3.3","AISC 360-16 Sección J3.3 y Tabla J3.4","AISC 360-16 Sección J3.5 (espaciamiento y distancia al borde máximos)"]},{"titulo":"Ejemplo de unión empernada a tracción: chequeo geométrico y número de pernos","contenido":"Dos planchas traslapadas, una de 6 in × 1/2 in y otra de 8 in × 1/4 in, se jalan en sentidos opuestos con Pu = 25 kips. Se propone una línea transversal de dos pernos de 1/2 in con agujeros estándar de 9/16 in. Antes de calcular, el profesor 'chequea primero' que la disposición entre en la plancha más angosta. Suma dos distancias al borde de 3/4 in (1.50 in), dos diámetros de agujero (2·9/16 = 1.125 in; con eso van 2.625 in) y la separación de 3 diámetros de agujero (3·9/16 = 1.6875 in), lo que da un ancho mínimo de unos 4.31 in, menor que 6 in. La disposición cabe. Resistencia de un perno a corte simple, con Fnv = 68 ksi y Ab = π·0.5²/4 = 0.196 in²: φRn = 0.75·68·0.196 ≈ 10.0 kips. Número de pernos: 25/10 ≈ 2.5. Como no hay medios pernos y la disposición es por pares, se colocan 4 pernos en 2 líneas de 2. El profesor concluye que diseñar con pernos es sencillo. Lo importante es la distribución, el número de líneas y, sobre todo, las áreas.","formulas":[{"nombre":"Ancho mínimo para una fila de n pernos (criterio de clase)","expresion":"b,mín ≈ 2·Le + n·dh + (n − 1)·3·dh","variables":"Le: distancia al borde; dh: diámetro del agujero"}],"referencias_norma":["AISC 360-16 Tablas J3.2, J3.3 y J3.4"]}],"ejemplos":[{"titulo":"Filete de un ángulo L2½×2×5/16 sobre plancha, con cordones iguales","enunciado":"Un ángulo L2½×2×5/16 (A36) se suelda con filetes laterales a una plancha de 3/8 in (A36) y transmite Pu = 170 kips. Electrodo E70XX. Determinar el tamaño de soldadura, la resistencia por pulgada y la longitud de dos cordones iguales.","pasos":["Parte más delgada: 5/16 in. Tabla J2.4: SWmín = 3/16 in. SWmáx = 5/16 − 1/16 = 1/4 in. Se elige SW = 1/4 in.","Garganta: te = 0.707·0.25 = 0.177 in.","Metal de aporte: φRn = 0.75·0.60·70·0.177 = 5.57 kips/in.","Metal base, fluencia por corte: φRn = 1.00·0.60·36·0.25 = 5.40 kips/in.","Metal base, rotura por corte: φRn = 0.75·0.60·58·0.25 = 6.52 kips/in.","Controla φRn = 5.40 kips/in.","LW = 170/(2·5.40) = 15.74 in, que se redondea a 16 in por cordón. En los extremos, filetes mínimos de 1/4 in × 1/2 in."],"resultado":"Filete de 1/4 in, dos cordones de 16 in (φRn total ≈ 2·5.4·16 = 173 kips ≥ 170 kips)."},{"titulo":"Soldadura balanceada del mismo ángulo","enunciado":"Para el mismo ángulo y la misma carga (Pu = 170 kips, φRn = 5.40 kips/in), con el centroide del ángulo a ȳ ≈ 0.555 in del cordón 1 y una distancia entre cordones de 2.5 in, determinar longitudes L1 y L2 que equilibren la resultante con el centroide.","pasos":["Momentos respecto del cordón 1: 5.40·L2·2.5 = 170·0.555, así que L2 ≈ 6.99 ≈ 7 in.","Fuerzas: 5.40·L1 + 5.40·7 = 170, así que L1 ≈ 24.5 in.","Redondeo constructivo: L2 = 8 in y L1 = 24½ in (o 25 in).","En el plano: filete de 1/4 in con longitudes de 8 in y 24½ in, más filetes mínimos de 1/4 in × 1/2 in en los extremos."],"resultado":"L1 ≈ 24.5 in (cordón cercano al centroide) y L2 ≈ 7 in. La longitud total, ≈ 31.5 in, es igual a la de cordones iguales."},{"titulo":"Fuerzas en una unión viga-columna en cajón (OMF)","enunciado":"Una viga de 20 in de peralte llega a una columna en cajón con Vu = 30 kips y Mu = 1200 kip·in. Obtener las fuerzas de diseño de la conexión.","pasos":["Corte: lo toman los ángulos del alma, Vu = 30 kips (15 kips por ángulo si hay dos).","Par de fuerzas: Ff = 1200/20 = 60 kips en cada ala.","Las planchas de ala y sus soldaduras (dos longitudinales y una transversal superior) deben resistir más de 60 kips."],"resultado":"Ángulos de alma para 30 kips. Planchas de ala y soldaduras para 60 kips de tracción o compresión."},{"titulo":"Unión traslapada empernada con pernos de 1/2 in","enunciado":"Dos planchas traslapadas (6 in × 1/2 in y 8 in × 1/4 in) transmiten Pu = 25 kips. Pernos A325 de 1/2 in en agujeros estándar de 9/16 in, corte simple, Fnv = 68 ksi. Verificar que una fila de 2 pernos cabe y hallar el número de pernos.","pasos":["Ancho mínimo: 2·(3/4) + 2·(9/16) + 3·(9/16) = 1.5 + 1.125 + 1.6875 ≈ 4.31 in, menor que 6 in: cabe.","Ab = π·0.5²/4 = 0.196 in².","φRn = 0.75·68·0.196 ≈ 10.0 kips por perno.","n = 25/10.0 = 2.5 pernos, que se redondea según la disposición."],"resultado":"4 pernos de 1/2 in en 2 líneas de 2 pernos."}],"conceptos_clave":[{"termino":"Tamaño mínimo de filete","definicion":"Valor de la Tabla J2.4 según el espesor de la parte más delgada, para asegurar fusión y evitar enfriamiento rápido."},{"termino":"Tamaño máximo de filete","definicion":"En bordes: t si t < 1/4 in, o t − 1/16 in si t ≥ 1/4 in."},{"termino":"Soldadura balanceada","definicion":"Reparto de longitudes de cordones para que la resultante de la soldadura coincida con el centroide del miembro y no haya excentricidad."},{"termino":"Símbolo de soldadura","definicion":"Línea de referencia con flecha. Debajo, el lado de la flecha; encima, el otro lado. Incluye tamaño, tipo, longitud, paso, bandera de campo, círculo de todo alrededor y cola."},{"termino":"Junta de aplastamiento","definicion":"Unión empernada sin pretensión, donde la carga pasa por corte del perno y aplastamiento de las paredes del agujero."},{"termino":"Junta de deslizamiento crítico","definicion":"Unión con pernos pretensados según la Tabla J3.1, donde la carga pasa por fricción entre superficies de clase A o B."},{"termino":"Rosca incluida / excluida (N / X)","definicion":"Indica si el plano de corte atraviesa la rosca (N, Fnv = 54 ksi en A325) o el vástago liso (X, Fnv = 68 ksi)."},{"termino":"Giro de tuerca","definicion":"Método de pretensión: tras el ajuste firme se gira la tuerca una fracción de vuelta que depende de la longitud del perno."},{"termino":"Falla 'ojal' (desgarramiento)","definicion":"Rotura del material entre el agujero y el borde cuando la distancia al borde es insuficiente."},{"termino":"Bloque de corte","definicion":"Estado límite en que un bloque de material se desprende con un plano en tracción y otro en corte, descontando agujeros."}],"preguntas":[{"pregunta":"Se unen una plancha de 3/8 in y un ángulo de 5/16 in con filete. ¿Cuál es el tamaño mínimo según la Tabla J2.4?","opciones":["1/8 in","3/16 in","1/4 in","5/16 in"],"correcta":1,"explicacion":"Se entra con la parte más delgada (5/16 in), que está entre 1/4 y 1/2 in, y el mínimo es 3/16 in."},{"pregunta":"Tamaño máximo de un filete en el borde de un material de 5/16 in:","opciones":["5/16 in","3/16 in","1/4 in","3/8 in"],"correcta":2,"explicacion":"Como t ≥ 1/4 in, el máximo es t − 1/16 = 1/4 in."},{"pregunta":"φRn por pulgada del metal de aporte de un filete de 1/4 in con E70XX:","opciones":["5.57 kips/in","7.87 kips/in","5.40 kips/in","6.52 kips/in"],"correcta":0,"explicacion":"0.75·0.60·70·0.707·0.25 ≈ 5.57 kips/in."},{"pregunta":"En el ejemplo de clase, ¿qué controló la resistencia del cordón de 1/4 in sobre acero A36?","opciones":["La rotura del metal de aporte","La fluencia por corte del metal base (5.40 kips/in)","La rotura por corte del metal base","El bloque de corte"],"correcta":1,"explicacion":"1.00·0.60·36·0.25 = 5.40 kips/in, menor que 5.57 (aporte) y que 6.52 (rotura del metal base)."},{"pregunta":"Dos cordones iguales con φRn = 5.4 kips/in deben transmitir 170 kips. ¿Qué longitud por cordón se especifica?","opciones":["15.74 in","31.5 in","16 in","8 in"],"correcta":2,"explicacion":"LW = 170/(2·5.4) = 15.74 in, que se redondea a un valor constructivo de 16 in."},{"pregunta":"El objetivo de la soldadura balanceada es:","opciones":["Reducir la longitud total de soldadura","Que la resultante de los cordones coincida con el centroide del miembro y no haya excentricidad","Usar dos tamaños de filete distintos","Evitar el uso de cordones transversales"],"correcta":1,"explicacion":"Las longitudes se reparten por equilibrio de momentos respecto del centroide. El total es el mismo."},{"pregunta":"En un símbolo de soldadura, una bandera en el quiebre de la línea de referencia indica:","opciones":["Soldadura todo alrededor","Soldadura de campo (en obra)","Soldadura intermitente","Soldadura en el otro lado"],"correcta":1,"explicacion":"La bandera indica soldadura en obra. Sin bandera se entiende que es de taller, y el círculo significa todo alrededor."},{"pregunta":"Un momento de 1200 kip·in llega a una viga de 20 in de peralte. ¿Qué fuerza actúa en cada plancha de ala?","opciones":["24 kips","60 kips","120 kips","600 kips"],"correcta":1,"explicacion":"Ff = M/d = 1200/20 = 60 kips."},{"pregunta":"¿Qué perno es adecuado solo para elementos secundarios o no estructurales?","opciones":["A325","A490","A307","F1852"],"correcta":2,"explicacion":"El A307 es un perno común de máquina, sin marca de alta resistencia en la cabeza."},{"pregunta":"Pretensión mínima de un perno A325 de 3/4 in según la Tabla J3.1:","opciones":["19 kips","28 kips","39 kips","12 kips"],"correcta":1,"explicacion":"La Tabla J3.1 da 28 kips para pernos A325 de 3/4 in (19 kips para 5/8 in)."},{"pregunta":"Resistencia nominal a corte Fnv de un perno A325 con la rosca excluida del plano de corte:","opciones":["54 ksi","90 ksi","68 ksi","48 ksi"],"correcta":2,"explicacion":"Condición X: Fnv = 68 ksi. Con la rosca incluida (N), Fnv = 54 ksi."},{"pregunta":"Separación máxima entre pernos en una unión traslapada en ambiente marino:","opciones":["24·t o 30 cm","14·t o 18 cm","3·d","12·t o 15 cm"],"correcta":1,"explicacion":"En ambientes corrosivos se limita a 14 veces el espesor menor o unos 18 cm (7 in)."}],"ejercicios_propuestos":["Un
